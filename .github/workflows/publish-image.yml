name: Publish the Guide image

# Called from the release after the tag's deployment. It serves the exact verified release artifact — the
# digest-checked `guide-site-<sha>.tar.gz` — as a container, signed and attested; nothing is rebuilt here beyond
# the thin image around the artifact. The image always carries the release tag; `latest` moves to the newest approved
# release and `stable` to the newest approved non-prerelease, never back (decision 30). The base image is
# Digest-pinned and Dependabot keeps it current.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag (with the leading v).
        type: string
        required: true
      commit:
        description: The full SHA the release artifact was built from.
        type: string
        required: true
      artifact-run-id:
        description: The run that holds the `guide-site-<sha>` release artifact.
        type: string
        required: true
      latest:
        description: Move `latest` to this release while it is the newest approved release.
        type: boolean
        required: true
      stable:
        description: Move `stable` to this release (non-prereleases only) while it is the newest approved one.
        type: boolean
        required: true
    outputs:
      digest:
        description: The published image's manifest digest.
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  actions: read

env:
  IMAGE: ghcr.io/dsw-nrp/eosc-fair-guide

jobs:
  image:
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the verified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site-${{ inputs.commit }}
          path: .cache/release
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}
      - name: Verify and prepare the exact artifact
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          python scripts/image_release.py prepare --artifact .cache/release --output .cache/image --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" > identity.json
          for key in version commit status date; do echo "$key=$(jq -r ".$key" identity.json)" >> "$GITHUB_OUTPUT"; done
          echo "publication_url=$(cat .cache/image/publication-url.txt)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u -d "$(jq -r .date identity.json)" +%s)" >> "$GITHUB_OUTPUT"
      - name: Compose an isolated candidate tag
        id: tags
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: echo "tags=$IMAGE:candidate-$RELEASE_COMMIT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .cache/image
          file: .cache/image/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_COMMIT=${{ steps.identity.outputs.commit }}
            BUILD_STATUS=${{ steps.identity.outputs.status }}
            BUILD_CREATED=${{ steps.identity.outputs.date }}T00:00:00Z
            BUILD_PAGE_URL=${{ steps.identity.outputs.publication_url }}
            SOURCE_DATE_EPOCH=${{ steps.identity.outputs.epoch }}
      - name: Keep the immutable build digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Run the candidate image and check its identity
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          trap 'docker rm -f guide >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name guide -p 8080:8080 "$IMAGE@$DIGEST"
          HEALTH=""
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health.json -o health.json; then HEALTH=1; break; fi
            sleep 2
          done
          test -n "$HEALTH"
          curl -fsS http://127.0.0.1:8080/assets/data/ui.js -o image-ui.js
          python scripts/image_release.py verify --health health.json --identity .cache/image/identity.json --config image-ui.js --commit "$RELEASE_COMMIT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Generate an SBOM
        id: sbom
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output: sbom.json
      - name: Attest the SBOM
        if: steps.sbom.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-path: sbom.json
          predicate-type: https://spdx.dev/Document
          push-to-registry: true
      - name: Scan the image
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: sarif
          output: trivy.sarif
      - name: Upload the scan to code scanning
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      # A newer release approved meanwhile keeps the moving aliases; this release still gets its own tag and draft.
      - name: Recheck production eligibility before promotion
        id: promotion
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          MOVE_LATEST: ${{ inputs.latest }}
          MOVE_STABLE: ${{ inputs.stable }}
        with:
          script: |
            const { promotion, refContext } = require('./.github/scripts/release-artifact.cjs');
            const { RELEASE_TAG, RELEASE_COMMIT, MOVE_LATEST, MOVE_STABLE } = process.env;
            const result = await promotion({ github, context: refContext(context, 'refs/tags/' + RELEASE_TAG, RELEASE_COMMIT) },
              { latest: MOVE_LATEST === 'true', stable: MOVE_STABLE === 'true' });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, String(value));
      - name: Promote the audited digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          MOVE_LATEST: ${{ steps.promotion.outputs.latest }}
          MOVE_STABLE: ${{ steps.promotion.outputs.stable }}
        run: |
          digest_of() {
            docker buildx imagetools inspect --raw "$1" | sha256sum | cut -d' ' -f1
          }
          # The release tag must point at the audited index before any moving alias is touched.
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$IMAGE@$DIGEST"
          test "$(digest_of "$IMAGE:$RELEASE_TAG")" = "${DIGEST#sha256:}"
          args=()
          if [ "$MOVE_LATEST" = true ]; then args+=(--tag "$IMAGE:latest"); fi
          if [ "$MOVE_STABLE" = true ]; then args+=(--tag "$IMAGE:stable"); fi
          if [ "${#args[@]}" -gt 0 ]; then
            docker buildx imagetools create "${args[@]}" "$IMAGE:$RELEASE_TAG"
            for tag in latest stable; do
              if [ "$tag" = latest ] && [ "$MOVE_LATEST" != true ]; then continue; fi
              if [ "$tag" = stable ] && [ "$MOVE_STABLE" != true ]; then continue; fi
              test "$(digest_of "$IMAGE:$tag")" = "${DIGEST#sha256:}"
            done
          fi
      - name: Report the image
        env:
          KEPT: ${{ steps.promotion.outputs.kept }}
        run: |
          {
            echo "### Guide image"
            echo ""
            echo '```'
            echo "$IMAGE@${{ steps.digest.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tags: \`${{ steps.tags.outputs.tags }}\`"
            echo ""
            if [ -n "$KEPT" ]; then echo "$KEPT"; echo ""; fi
            echo "- **Next:** Release creates the draft release, which names this digest."
            echo "- **If blocked:** re-run the Release run's failed jobs; the digest above stays the release's image."
            echo "- **Done when:** the draft release names this digest."
          } >> "$GITHUB_STEP_SUMMARY"
