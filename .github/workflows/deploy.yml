name: Deploy the verified site

# A tag checks and packages production once, and waits for approval when those bytes are new. A default-branch push
# builds the staging site and reuses the merge queue's result for the same commit, or runs the partitioned checks.
# One serialized publication then deploys the newest checked staging site beside the newest approved release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Per ref: a newer default-branch push cancels older preparation, and no branch run ever cancels a release tag.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.sources.outputs.kind }}
      staging: ${{ steps.sources.outputs.staging }}
      production: ${{ steps.sources.outputs.production }}
      tag: ${{ steps.sources.outputs.tag }}
      build: ${{ steps.sources.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: sources
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { sources } = require('./.github/scripts/release-artifact.cjs');
            for (const [key, value] of Object.entries(await sources({ github, context }))) core.setOutput(key, value);

  production:
    needs: sources
    if: needs.sources.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      FAIR_GUIDE_CHECK_REVISION: ${{ needs.sources.outputs.production }}
      PRODUCTION_SHA: ${{ needs.sources.outputs.production }}
      PRODUCTION_TAG: ${{ needs.sources.outputs.tag }}
      FAIR_GUIDE_BUILD_CHANNEL: production
      FAIR_GUIDE_RELEASE_TAG: ${{ needs.sources.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sources.outputs.build == 'true' && needs.sources.outputs.production || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - if: needs.sources.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - if: needs.sources.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: needs.sources.outputs.build == 'true'
        name: Install release check tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - if: needs.sources.outputs.build == 'true'
        name: Check and package the tagged source once
        run: |
          python -u scripts/check_all.py --jobs 4 --report-dir .cache/health
          python scripts/package_site.py --commit "$PRODUCTION_SHA" --output .cache/release
      - id: reuse
        if: needs.sources.outputs.build != 'true'
        name: Reuse the release assets or their approved deployment artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { reuse, refContext } = require('./.github/scripts/release-artifact.cjs');
            const selected = refContext(context, 'refs/tags/' + process.env.PRODUCTION_TAG, process.env.PRODUCTION_SHA);
            core.setOutput('run', (await reuse({ github, context: selected })).run);
      - if: steps.reuse.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site-${{ needs.sources.outputs.production }}
          path: .cache/release/
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ github.token }}
      - name: Keep the exact release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-site-${{ needs.sources.outputs.production }}
          path: .cache/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # Production bytes that no earlier run verified wait here for a maintainer; preparation and staging go on.
  approve-production:
    needs: [sources, production]
    if: needs.sources.outputs.kind == 'tag' && needs.sources.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: production
    steps:
      - name: Record the approved production bytes
        env:
          PRODUCTION_TAG: ${{ needs.sources.outputs.tag }}
          PRODUCTION_SHA: ${{ needs.sources.outputs.production }}
        run: echo "Approved the production bytes of $PRODUCTION_TAG at \`$PRODUCTION_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # The staging site of the pushed commit: a fresh build carrying the health snapshot of the merge-queue run that
  # checked the same commit and build inputs, when one exists. Otherwise the partitioned checks below run.
  stage:
    needs: sources
    if: needs.sources.outputs.kind == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FAIR_GUIDE_BUILD_CHANNEL: preview
    outputs:
      reused: ${{ steps.adopt.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sources.outputs.staging }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Build the staging site
        run: python scripts/check_ci.py build
      - id: queue
        name: Find the merge-queue result of this commit
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STAGING_SHA: ${{ needs.sources.outputs.staging }}
        with:
          script: |
            const { refContext } = require('./.github/scripts/release-artifact.cjs');
            const { queueResult } = require('./.github/scripts/deployment.cjs');
            const selected = refContext(context, context.ref, process.env.STAGING_SHA);
            for (const [key, value] of Object.entries(await queueResult({ github, context: selected }))) core.setOutput(key, value);
      - if: steps.queue.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: health-${{ steps.queue.outputs.run }}-${{ steps.queue.outputs.attempt }}
          path: .cache/queue-result/
          run-id: ${{ steps.queue.outputs.run }}
          github-token: ${{ github.token }}
      - id: adopt
        name: Reuse the merge-queue result or name the reason for the full checks
        env:
          QUEUE_RUN: ${{ steps.queue.outputs.url }}
          QUEUE_REASON: ${{ steps.queue.outputs.reason || 'the merge-queue lookup failed; see its step' }}
        run: |
          if [ -n "$QUEUE_RUN" ] && python -u scripts/check_ci.py adopt --incoming .cache/queue-result --source "$QUEUE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            [ -n "$QUEUE_RUN" ] || echo "Full checks: $QUEUE_REASON." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.adopt.outputs.reused == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  fallback-checks:
    needs: [sources, stage]
    if: ${{ !cancelled() && needs.sources.result == 'success' && needs.sources.outputs.kind == 'branch' && needs.stage.outputs.reused != 'true' }}
    uses: ./.github/workflows/partitioned-checks.yml
    with:
      channel: preview
      staging: true

  # One publication at a time. It resolves the identities to publish when it starts, so an older run never moves a
  # channel back; approval waits happen before it, in approve-production.
  publish:
    needs: [sources, production, approve-production, stage, fallback-checks]
    if: >-
      ${{ !cancelled() && needs.sources.result == 'success' && (
      (needs.sources.outputs.kind == 'tag' && needs.production.result == 'success' &&
      (needs.approve-production.result == 'success' || needs.sources.outputs.build != 'true')) ||
      (needs.sources.outputs.kind == 'branch' && needs.production.result != 'failure' &&
      (needs.stage.outputs.reused == 'true' || needs.fallback-checks.result == 'success'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: resolve
        name: Resolve the newest checked staging site and approved release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publication } = require('./.github/scripts/deployment.cjs');
            const result = await publication({ github, context });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            const production = result.tag
              ? ` and production ${result.tag} (\`${result.production}\`, ${result.production_run ? `run ${result.production_run}` : 'release assets'})`
              : ' with no release yet';
            await core.summary.addRaw(result.publish === 'true'
              ? `Publishing staging \`${result.staging}\` (run ${result.staging_run})${production}.\n`
              : `Published nothing: ${result.reason}.${result.successor ? ` [The newer run](${result.successor}) publishes the newest checked site.` : ''}\n`).write();
      - if: steps.resolve.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-site
          path: .cache/staging/
          run-id: ${{ steps.resolve.outputs.staging_run }}
          github-token: ${{ github.token }}
      - if: steps.resolve.outputs.publish == 'true' && steps.resolve.outputs.production_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site-${{ steps.resolve.outputs.production }}
          path: .cache/release/
          run-id: ${{ steps.resolve.outputs.production_run }}
          github-token: ${{ github.token }}
      - if: steps.resolve.outputs.publish == 'true'
        name: Assemble without rebuilding either site
        env:
          STAGING_SHA: ${{ steps.resolve.outputs.staging }}
          PRODUCTION_SHA: ${{ steps.resolve.outputs.production }}
          PRODUCTION_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          args=(--staging .cache/staging --staging-commit "$STAGING_SHA" --out .cache/pages)
          if [ -n "$PRODUCTION_TAG" ]; then
            args+=(--production .cache/release --production-tag "$PRODUCTION_TAG" --production-commit "$PRODUCTION_SHA")
          fi
          python scripts/assemble_pages.py "${args[@]}"
      - if: steps.resolve.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/pages/
      - id: deployment
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  superseded:
    needs: [sources, production, approve-production, stage, fallback-checks, publish]
    if: cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Name the run that supersedes this one
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { superseded } = require('./.github/scripts/deployment.cjs');
            await core.summary.addRaw((await superseded({ github, context })) + '\n').write();
