name: Deploy the verified site

# Builds and checks the default branch once, then deploys exactly that _site/ (with the health results the checks
# published into it) to GitHub Pages and keeps the same files as a commit-labelled artifact for the release workflow.
# Nothing is rebuilt after the checks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install check tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and check once
        run: python -u scripts/check_all.py --jobs 4 --report-dir .cache/health
      - name: Package the verified site
        run: python scripts/package_site.py --commit "$GITHUB_SHA" --output .cache/release
      - name: Keep the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guide-site-${{ github.sha }}
          path: .cache/release/
          if-no-files-found: error
          retention-days: 90
      - name: Hand the same site to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
