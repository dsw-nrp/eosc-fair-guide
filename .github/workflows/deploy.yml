name: Deploy the verified site

# Prepares what Pages may publish. A tag checks and packages production once, and waits for approval when those bytes
# are new. A default-branch push builds the staging site and reuses the merge queue's result for the same commit, or
# runs the partitioned checks. Publication runs afterwards in publish.yml, where cancelling a run cannot reach it.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Per ref: a newer default-branch push cancels the older run, which only prepares; no branch run cancels a release tag.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.sources.outputs.kind }}
      staging: ${{ steps.sources.outputs.staging }}
      production: ${{ steps.sources.outputs.production }}
      tag: ${{ steps.sources.outputs.tag }}
      build: ${{ steps.sources.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: sources
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { sources } = require('./.github/scripts/release-artifact.cjs');
            for (const [key, value] of Object.entries(await sources({ github, context }))) core.setOutput(key, value);

  production:
    needs: sources
    if: needs.sources.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      FAIR_GUIDE_CHECK_REVISION: ${{ needs.sources.outputs.production }}
      PRODUCTION_SHA: ${{ needs.sources.outputs.production }}
      PRODUCTION_TAG: ${{ needs.sources.outputs.tag }}
      FAIR_GUIDE_BUILD_CHANNEL: production
      FAIR_GUIDE_RELEASE_TAG: ${{ needs.sources.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sources.outputs.build == 'true' && needs.sources.outputs.production || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - if: needs.sources.outputs.build == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: needs.sources.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: needs.sources.outputs.build == 'true'
        name: Install release check tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - if: needs.sources.outputs.build == 'true'
        name: Check and package the tagged source once
        run: |
          python -u scripts/check_all.py --jobs 4 --report-dir .cache/health
          python scripts/package_site.py --commit "$PRODUCTION_SHA" --output .cache/release
      - id: reuse
        if: needs.sources.outputs.build != 'true'
        name: Reuse the release assets or their approved deployment artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { reuse, refContext } = require('./.github/scripts/release-artifact.cjs');
            const selected = refContext(context, 'refs/tags/' + process.env.PRODUCTION_TAG, process.env.PRODUCTION_SHA);
            core.setOutput('run', (await reuse({ github, context: selected })).run);
      - if: steps.reuse.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site-${{ needs.sources.outputs.production }}
          path: .cache/release/
          run-id: ${{ steps.reuse.outputs.run }}
          github-token: ${{ github.token }}
      - name: Keep the exact release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-site-${{ needs.sources.outputs.production }}
          path: .cache/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # Production bytes that no earlier run verified wait here for a maintainer; preparation and staging go on.
  approve-production:
    needs: [sources, production]
    if: needs.sources.outputs.kind == 'tag' && needs.sources.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # The approval gate only: publication records production once the release is live.
    environment:
      name: production
      deployment: false
    steps:
      - name: Record the approved production bytes
        env:
          PRODUCTION_TAG: ${{ needs.sources.outputs.tag }}
          PRODUCTION_SHA: ${{ needs.sources.outputs.production }}
        run: echo "Approved the production bytes of $PRODUCTION_TAG at \`$PRODUCTION_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # The staging site of the pushed commit: a fresh build carrying the health snapshot of the merge-queue run that
  # checked the same commit and build inputs, when one exists. Otherwise the partitioned checks below run.
  stage:
    needs: sources
    if: needs.sources.outputs.kind == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FAIR_GUIDE_BUILD_CHANNEL: preview
    outputs:
      reused: ${{ steps.adopt.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sources.outputs.staging }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      # A failed build or lookup only means no reuse: the partitioned checks then build and report it.
      - id: build
        name: Build the staging site
        continue-on-error: true
        run: python scripts/check_ci.py build
      - id: queue
        name: Find the merge-queue result of this commit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STAGING_SHA: ${{ needs.sources.outputs.staging }}
        with:
          script: |
            const { refContext } = require('./.github/scripts/release-artifact.cjs');
            const { queueResult } = require('./.github/scripts/deployment.cjs');
            const selected = refContext(context, context.ref, process.env.STAGING_SHA);
            for (const [key, value] of Object.entries(await queueResult({ github, context: selected }))) core.setOutput(key, value);
      - if: steps.queue.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: health-${{ steps.queue.outputs.run }}-${{ steps.queue.outputs.attempt }}
          path: .cache/queue-result/
          run-id: ${{ steps.queue.outputs.run }}
          github-token: ${{ github.token }}
      - id: adopt
        name: Reuse the merge-queue result or name the reason for the full checks
        env:
          QUEUE_RUN: ${{ steps.queue.outputs.url }}
          QUEUE_REASON: ${{ steps.build.outcome != 'success' && 'the staging build failed here' || steps.queue.outputs.reason || 'the merge-queue lookup failed; see its step' }}
        run: |
          # The default shell has no pipefail, so without it the condition would test `tee`, not the adoption.
          set -o pipefail
          if [ -n "$QUEUE_RUN" ] && python -u scripts/check_ci.py adopt --incoming .cache/queue-result --source "$QUEUE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            [ -n "$QUEUE_RUN" ] || echo "Full checks: $QUEUE_REASON." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.adopt.outputs.reused == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  fallback-checks:
    needs: [sources, stage]
    if: ${{ !cancelled() && needs.sources.result == 'success' && needs.sources.outputs.kind == 'branch' && needs.stage.outputs.reused != 'true' }}
    uses: ./.github/workflows/partitioned-checks.yml
    with:
      channel: preview
      staging: true

  superseded:
    needs: [sources, production, approve-production, stage, fallback-checks]
    if: cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Name the run that supersedes this one
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { superseded } = require('./.github/scripts/deployment.cjs');
            await core.summary.addRaw((await superseded({ github, context })) + '\n').write();
