name: Publish the verified site

# Runs trusted default-branch code after every completed deployment run, so cancelling a superseded deployment never
# interrupts a Pages deployment. Each publication resolves the newest checked staging site and the newest approved
# release when it starts, so no publication moves either channel back.
on:
  workflow_run:
    workflows: [Deploy the verified site]
    types: [completed]

permissions:
  contents: read

# One publication at a time, deciding and deploying together. Only a run that follows a successful deployment, the
# condition of the resolve job below, enters the shared group; any other run gets a group of its own, so a run that
# does nothing never replaces a waiting publication. Every publication resolves the newest state, so a newer waiting
# one that replaces an older one loses nothing.
concurrency:
  group: >-
    ${{ github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
    'pages-publish' || format('pages-publish-idle-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Decides without an environment, so a publication that deploys nothing leaves no github-pages deployment record,
  # which the tag ruleset and Tag release read.
  resolve:
    # Only a successful deployment of this repository's own pushes or manual runs leads to publication.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      staging: ${{ steps.resolve.outputs.staging }}
      staging_run: ${{ steps.resolve.outputs.staging_run }}
      tag: ${{ steps.resolve.outputs.tag }}
      production: ${{ steps.resolve.outputs.production }}
      production_run: ${{ steps.resolve.outputs.production_run }}
      publication_url: ${{ steps.resolve.outputs.publication_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The Pages deployment is recorded against this run's commit, the default-branch head when it started, so only
      # that commit's staging site is published.
      - id: resolve
        name: Resolve the newest checked staging site and approved release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { completedDeployment, publication } = require('./.github/scripts/deployment.cjs');
            const { handoff } = require('./.github/scripts/handoff.cjs');
            const deployed = await completedDeployment({ github, context });
            const result = await publication({ github, context: deployed, recorded: context.sha });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            const production = result.tag
              ? ` and production ${result.tag} (\`${result.production}\`, ${result.production_run ? `run ${result.production_run}` : 'release assets'})`
              : ' with no release yet';
            await core.summary.addRaw(result.publish === 'true'
              ? `Publishing staging \`${result.staging}\` (run ${result.staging_run})${production}, after deployment run ${deployed.runId}.\n`
              : `Published nothing after deployment run ${deployed.runId}: ${result.reason}.${result.successor ? ` [That run](${result.successor}) leads to the newest site.` : ''}\n\n` +
                handoff({ next: result.successor ? 'nothing: the linked run leads to the newest site.' : 'nothing, unless the site should change: then run Deploy the verified site.',
                  blocked: "a maintainer compares the deployment run with the live site's footer.",
                  done: "the live site's footer names the expected commit or release." }) + '\n').write();

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      STAGING_SHA: ${{ needs.resolve.outputs.staging }}
      PRODUCTION_SHA: ${{ needs.resolve.outputs.production }}
      PRODUCTION_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-site
          path: .cache/staging/
          run-id: ${{ needs.resolve.outputs.staging_run }}
          github-token: ${{ github.token }}
      - id: production
        if: env.PRODUCTION_TAG != ''
        name: Fetch the release assets or name the approved run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { reuse, refContext } = require('./.github/scripts/release-artifact.cjs');
            const selected = refContext(context, 'refs/tags/' + process.env.PRODUCTION_TAG, process.env.PRODUCTION_SHA);
            core.setOutput('run', (await reuse({ github, context: selected })).run);
      - if: steps.production.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site-${{ needs.resolve.outputs.production }}
          path: .cache/release/
          run-id: ${{ steps.production.outputs.run }}
          github-token: ${{ github.token }}
      - name: Assemble without rebuilding either site
        run: |
          args=(--staging .cache/staging --staging-commit "$STAGING_SHA" --out .cache/pages)
          if [ -n "$PRODUCTION_TAG" ]; then
            args+=(--production .cache/release --production-tag "$PRODUCTION_TAG" --production-commit "$PRODUCTION_SHA")
          fi
          python scripts/assemble_pages.py "${args[@]}" --notes .cache/assembly-notes.md
          # Notices such as a preview namespace that production does not carry yet (decision 28).
          if [ -s .cache/assembly-notes.md ]; then
            { echo ""; cat .cache/assembly-notes.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/pages/
      - name: Recheck the actual publication root
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLICATION_URL: ${{ needs.resolve.outputs.publication_url }}
        with:
          script: |
            const { assertPublication } = require('./.github/scripts/publication-location.cjs');
            await assertPublication({ github, context }, { publicationUrl: process.env.PUBLICATION_URL });
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Each channel's environment records what is live at its address, only now that it is; release tags require the
      # staging record. github-pages remains the record of the Pages deployment itself.
      - name: Record the live channels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const { recordChannels } = require('./.github/scripts/deployment.cjs');
            const { handoff } = require('./.github/scripts/handoff.cjs');
            const { STAGING_SHA, PRODUCTION_TAG, PRODUCTION_SHA, PAGE_URL } = process.env;
            const recorded = await recordChannels({ github, context, core },
              { staging: STAGING_SHA, tag: PRODUCTION_TAG, production: PRODUCTION_SHA, pageUrl: PAGE_URL });
            await core.summary.addRaw((recorded.length
              ? `Recorded live: ${recorded.join(' and ')}.\n`
              : 'Both channels were already recorded live.\n') + '\n' + handoff(PRODUCTION_TAG
              ? { next: `Release drafts the release ${PRODUCTION_TAG}; a maintainer then reviews and publishes it.`,
                blocked: 'when no Release run starts, re-run this run; a record never moves a channel back.',
                done: `the draft release of ${PRODUCTION_TAG} exists.` }
              : { next: 'nothing: the preview is live under /next/.',
                blocked: 'when the preview looks stale, re-run this run; a record never moves a channel back.',
                done: `the preview footer names \`${STAGING_SHA}\`.` }) + '\n').write();
      # Release drafting reads what this publication deployed; the record exists only after a Pages deployment.
      - name: Record what was published
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STAGING_RUN: ${{ needs.resolve.outputs.staging_run }}
          PRODUCTION_RUN: ${{ steps.production.outputs.run }}
        with:
          script: |
            const { mkdirSync, writeFileSync } = require('node:fs');
            const { dirname } = require('node:path');
            const { PUBLISHED } = require('./.github/scripts/release-artifact.cjs');
            const { STAGING_SHA, STAGING_RUN, PRODUCTION_TAG, PRODUCTION_SHA, PRODUCTION_RUN } = process.env;
            mkdirSync(dirname(PUBLISHED), { recursive: true });
            writeFileSync(PUBLISHED, JSON.stringify({ formatVersion: 1, staging: STAGING_SHA, staging_run: STAGING_RUN,
              tag: PRODUCTION_TAG || '', production: PRODUCTION_SHA || '', production_run: PRODUCTION_RUN || '' }) + '\n');
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-identity
          path: .cache/published/identity.json
          if-no-files-found: error
          retention-days: 30
