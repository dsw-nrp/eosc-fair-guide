name: Tag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed release version without the leading v
        required: true
        type: string
      release_status:
        description: Intended use of this release (production requires maintainer approval)
        required: true
        default: testing
        type: choice
        options: [testing, production]

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate committed release and citation metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/release_versions.py check --version "$RELEASE_VERSION"
          python scripts/check_citation_metadata.py
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_REFRESH_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Tag the validated current default-branch commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/prepare-release.cjs').tag({github, context, core});
