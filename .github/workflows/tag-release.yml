name: Tag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Committed release version without the leading v
        required: true
        type: string
      release_status:
        description: Intended use of this release (production requires maintainer approval)
        required: true
        default: testing
        type: choice
        options: [testing, production]

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The tag ruleset rejects an undeployed commit; this names the deployment run to wait for instead.
      - name: Require a successful deployment of the current commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/prepare-release.cjs').deployed({github, context, core});
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate committed release and citation metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/release_versions.py check --version "$RELEASE_VERSION"
          python scripts/check_citation_metadata.py
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_REFRESH_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Tag the validated current default-branch commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/prepare-release.cjs').tag({github, context, core});
