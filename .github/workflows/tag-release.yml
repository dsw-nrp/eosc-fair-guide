name: Tag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Merged release version without the leading v
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check the merged metadata
        run: python scripts/release_versions.py check
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SOURCE_REFRESH_APP_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Tag the merged release pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/prepare-release.cjs').tag({github, context, core});
