name: Guide checks and health report

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  # Each merge group has a ref of its own, so queue runs never cancel one another.
  group: guide-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Early feedback beside the build. Not required: the `checks` result runs the same checks with every other one.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # Beyond the standard library the quick checks use Ruff, PyYAML (the CI catalogue) and OpenSpec, each at its
      # pinned version. A workflow test derives this list from the checks' own imports.
      - name: Install the quick-check tools
        run: |
          python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)" "$(grep -E '^PyYAML==' requirements-dev.txt)"
          npm ci
      - name: Run the cheap offline checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -u scripts/check_ci.py quick --base "$BASE_SHA"
      - name: Publish the quick summary
        if: always()
        run: |
          if [ -f .cache/quick/summary.md ]; then
            cat .cache/quick/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Quick result unavailable: setup did not reach the check runner. See the failed job step.' '' \
              '- **Next:** wait for the required `checks` result, which runs the same checks; re-run this job for early feedback.' \
              '- **If blocked:** a maintainer reads the failed setup step, which names what was missing.' \
              '- **Done when:** this job publishes the quick summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

  partitioned:
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/partitioned-checks.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      # The queue checks the bytes staging deploys, so a deployment of the same commit can reuse its result.
      channel: ${{ github.event_name == 'merge_group' && 'preview' || 'local' }}
      review: ${{ github.event_name == 'pull_request' }}
      cache: true

  # The required status check. A check run is named after its job, so this job keeps the name `checks` while the
  # work runs in the reusable workflow.
  checks:
    if: always()
    needs: partitioned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete partitioned result
        env:
          RESULT: ${{ needs.partitioned.result }}
        run: |
          if [ "$RESULT" = success ]; then
            printf '%s\n' 'Every partitioned check passed. The `partitioned / collect` job holds the health report.' '' \
              '- **Next:** a pull request waits for review and then the merge queue; a merge group merges on its own.' \
              '- **If blocked:** ask a maintainer for a review.' \
              '- **Done when:** the pull request is merged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The partitioned checks ended with $RESULT. The \`partitioned / collect\` job names every failure." | tee -a "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '' \
              '- **Next:** fix each failure that the `partitioned / collect` summary names, with the local command it gives.' \
              '- **If blocked:** re-run the failed jobs when a lane failed without a check failure; otherwise ask a maintainer.' \
              '- **Done when:** this `checks` result passes.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
