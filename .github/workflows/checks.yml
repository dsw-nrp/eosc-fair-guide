name: Guide checks and health report

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guide-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Build and record source, site and coverage identities
        run: python scripts/check_ci.py build
      - name: Share the checked build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-build
          path: |
            _site/
            .cache/ci-build/manifest.json
          include-hidden-files: true
          retention-days: 2

  lanes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [cpu, browser-a, browser-b]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install check tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Install browser only in browser lanes
        if: matrix.lane != 'cpu'
        run: npm run browsers -- --with-deps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-build
          path: .
      - name: Verify the build and run the assigned checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECK_LANE: ${{ matrix.lane }}
        run: python -u scripts/check_ci.py lane --name "$CHECK_LANE" --base "$BASE_SHA"
      - name: Save lane evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-lane-${{ matrix.lane }}
          path: .cache/health/
          if-no-files-found: warn
          retention-days: 30
      - name: Save lane visuals
        if: always() && matrix.lane != 'cpu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-visuals-${{ matrix.lane }}
          path: .cache/screenshots/
          if-no-files-found: warn
          retention-days: 14

  checks:
    if: always()
    needs: [build, lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-build
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: check-lane-*
          path: .cache/ci-results/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: check-visuals-*
          path: .cache/screenshots/
          merge-multiple: true
      - name: Reconcile complete coverage and publish one verified health result
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -u scripts/check_ci.py collect --base "$BASE_SHA"
      - name: Publish the run summary
        if: always()
        run: |
          if [ -f .cache/health/summary.md ]; then
            cat .cache/health/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Health report unavailable: setup did not reach the check runner. See the failed job step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the health dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/health/
          if-no-files-found: warn
          retention-days: 30
      - name: Save preview and visual checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guide-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _site/
            .cache/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare bilingual review data
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/pr_summary.py --base "$BASE_SHA" --head "$HEAD_SHA" --output .cache/pr-review/summary.json
      - name: Suggest contributor and attribution patches
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/contributors.py --base "$BASE_SHA" --output .cache/pr-review/contributors.json
          cat .cache/pr-review/contributors.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save review data for the trusted comment workflow
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guide-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/pr-review/summary.json
            .cache/pr-review/changes.json
            .cache/pr-review/contributors.json
          if-no-files-found: warn
          retention-days: 14
