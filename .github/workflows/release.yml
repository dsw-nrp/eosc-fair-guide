name: Release

# An authorized tag push names a commit the deployment workflow already verified. The release attaches that run's
# commit-labelled site artifact after checking its digest and version; it builds nothing. The release is created as
# a draft, so publication stays the maintainer's explicit act.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: run
        name: Find the verified deployment of the tagged commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { verifiedRun } = require('./.github/scripts/release-artifact.cjs');
            core.setOutput('id', String(await verifiedRun({ github, context })));
      - name: Download its site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guide-site-${{ github.sha }}
          path: .cache/release
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Create the draft release with the same artifact
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { draftRelease } = require('./.github/scripts/release-artifact.cjs');
            await draftRelease({ github, context, core });
