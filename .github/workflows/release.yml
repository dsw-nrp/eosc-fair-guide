name: Release

# Wait for the tag's deployment to finish; use trusted default-branch code and its exact checked artifact.
# The image is published from that same artifact before the draft release is created.
on:
  workflow_run:
    workflows: ['Deploy the verified site']
    types: [completed]

concurrency:
  group: guide-release-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bind:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: source
        name: Bind the completed deployment to its current release tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { completedTag } = require('./.github/scripts/release-artifact.cjs');
            for (const [key, value] of Object.entries(await completedTag({ github, context }))) core.setOutput(key, value);

  publish:
    needs: bind
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.bind.outputs.tag }}
      commit: ${{ needs.bind.outputs.sha }}
      artifact-run-id: ${{ needs.bind.outputs.run }}
      latest: true
      stable: ${{ !contains(needs.bind.outputs.tag, '-') }}

  release:
    needs: [bind, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download that run's release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guide-site-${{ needs.bind.outputs.sha }}
          path: .cache/release
          run-id: ${{ needs.bind.outputs.run }}
          github-token: ${{ github.token }}
      - name: Create the draft release with the same artifact
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ needs.bind.outputs.tag }}
          RELEASE_SHA: ${{ needs.bind.outputs.sha }}
          RELEASE_IMAGE: ghcr.io/dsw-nrp/eosc-fair-guide@${{ needs.publish.outputs.digest }}
        with:
          script: |
            const { draftRelease, refContext } = require('./.github/scripts/release-artifact.cjs');
            const selected = refContext(context, 'refs/tags/' + process.env.RELEASE_TAG, process.env.RELEASE_SHA);
            await draftRelease({ github, context: selected, core });
