name: Release

# Wait until a publication has deployed a release to Pages; use trusted default-branch code and the release's exact
# approved artifact. The image is published from that same artifact before the draft release is created.
on:
  workflow_run:
    workflows: ['Publish the verified site']
    types: [completed]

concurrency:
  group: guide-release-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bind:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Present only when that publication deployed Pages; the binding below checks which.
      - name: Download the publication record
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-identity
          path: .cache/published/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: source
        name: Bind the published release to its current tag and approved artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishedRelease } = require('./.github/scripts/release-artifact.cjs');
            for (const [key, value] of Object.entries(await publishedRelease({ github, context }))) core.setOutput(key, value);

  publish:
    needs: bind
    if: needs.bind.outputs.tag != ''
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.bind.outputs.tag }}
      commit: ${{ needs.bind.outputs.sha }}
      artifact-run-id: ${{ needs.bind.outputs.run }}
      latest: true
      stable: ${{ !contains(needs.bind.outputs.tag, '-') }}

  release:
    needs: [bind, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download that run's release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site-${{ needs.bind.outputs.sha }}
          path: .cache/release
          run-id: ${{ needs.bind.outputs.run }}
          github-token: ${{ github.token }}
      - name: Create the draft release with the same artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.bind.outputs.tag }}
          RELEASE_SHA: ${{ needs.bind.outputs.sha }}
          RELEASE_IMAGE: ghcr.io/dsw-nrp/eosc-fair-guide@${{ needs.publish.outputs.digest }}
        with:
          script: |
            const { draftRelease, refContext } = require('./.github/scripts/release-artifact.cjs');
            const selected = refContext(context, 'refs/tags/' + process.env.RELEASE_TAG, process.env.RELEASE_SHA);
            await draftRelease({ github, context: selected, core });
