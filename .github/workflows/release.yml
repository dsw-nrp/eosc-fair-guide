name: Release

# Wait for the tag's deployment to finish; use trusted default-branch code and its exact checked artifact.
on:
  workflow_run:
    workflows: ['Deploy the verified site']
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: source
        name: Bind the completed deployment to its current release tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { completedTag } = require('./.github/scripts/release-artifact.cjs');
            for (const [key, value] of Object.entries(await completedTag({ github, context }))) core.setOutput(key, value);
      - name: Download that run's release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: guide-site-${{ steps.source.outputs.sha }}
          path: .cache/release
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Create the draft release with the same artifact
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const { draftRelease } = require('./.github/scripts/release-artifact.cjs');
            const selected = { ...context, ref: 'refs/tags/' + process.env.RELEASE_TAG, sha: process.env.RELEASE_SHA };
            await draftRelease({ github, context: selected, core });
