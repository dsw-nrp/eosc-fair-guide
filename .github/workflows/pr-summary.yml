name: Guide review comment

on:
  workflow_run:
    workflows: [Guide checks and health report]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: guide-review-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-review-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .cache/pr-review-incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { comment } = require('./.github/scripts/comment-summary.cjs');
            await comment({ github, context, core });
      # Labels come from the API's file list and the reviewed rules, so they do not depend on the review artifact.
      - name: Add area labels from the changed paths
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { label } = require('./.github/scripts/labels.cjs');
            await label({ github, context, core });
