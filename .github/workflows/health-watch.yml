name: Live health and source watch

# Trusted default-branch code on a schedule, separate from the deterministic pull-request checks. Weekly: links,
# connector availability, stale dated statuses and the EOSC CZ pages the guide depends on. In the first weekly run of
# each month, or on request: FAIR Champion remeasurement of the core and the reviewed candidates with the existing
# bounded probe. The watch job observes with a read-only token; the publish job rebuilds the one maintenance digest
# from that observation, the audit's section and the maintainers' keyed tasks, then saves the state the next run
# continues. Nothing is committed or pushed.

on:
  schedule:
    # Sunday evening, last of the weekly jobs after source refresh and Dependabot: even six hours late and at its full
    # timeout it finishes before Monday 06:00 UTC, 08:00 in Prague or earlier.
    - cron: "41 22 * * 0"
  workflow_dispatch:
    inputs:
      parts:
        description: What to run (the audit alone opens, edits and closes no issue)
        type: choice
        options: [both, audit, watch]
        default: both
      champion:
        description: Also remeasure FAIR Champion tests (watch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: health-watch
  cancel-in-progress: false

jobs:
  # Observation only: its token can read the previous run's state artifact and nothing else.
  watch:
    if: github.event_name == 'schedule' || inputs.parts != 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      artifact: health-watch-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The first weekly run of a month remeasures the Champion tests. Its Sunday is the run's date eight hours earlier,
      # which stays right when GitHub starts the run late, after midnight.
      - id: scope
        name: Decide whether to remeasure the FAIR Champion tests
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.champion }}
        run: |
          if [ "$REQUESTED" = true ] || { [ "$EVENT" = schedule ] && [ "$(date -u -d '8 hours ago' +%-d)" -le 7 ]; }; then
            echo "champion=true" >> "$GITHUB_OUTPUT"
          else
            echo "champion=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.champion == 'true'
        with:
          node-version: '22'
      - name: Remeasure FAIR Champion tests
        if: steps.scope.outputs.champion == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python scripts/build_site.py
          node scripts/probe_champion.mjs --jobs 4 --output .cache/watch/champion.json || true
      # State comes only from this workflow's own default-branch runs; a branch or fork run cannot supply it.
      - id: previous
        name: Find the previous watch state
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { previousState } = require('./.github/scripts/health-digest.cjs');
            await previousState({ github, context, core });
      - name: Download the previous watch state
        if: steps.previous.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: health-watch-state
          path: .cache/watch-state
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
      # Until the first state artifact exists, the version 1 state kept in the Actions cache is migrated once.
      - name: Restore the version 1 watch state
        if: steps.previous.outputs.run == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/watch-state
          key: health-watch-state-${{ github.run_id }}
          restore-keys: health-watch-state-
      - name: Observe links, services, pages and statuses
        run: |
          python scripts/watch_sources.py observe --state .cache/watch-state/state.json --output .cache/watch \
            --champion .cache/watch/champion.json
          cat .cache/watch/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/watch/
          if-no-files-found: warn
          retention-days: 90

  # The read-only settings and Project audit, on its own so that it can neither stop nor be stopped by the watch.
  # The job's token reads the repository (environments need Actions read, Project completeness Issues read); the
  # App token may only read Projects and is used for nothing else. Without it, Project #1 is reported unavailable with
  # the owner's step. This repository's logs and artifacts are public and the Project is not, so the job publishes
  # only the digest's redacted "Project and settings" section: the full report never reaches the log or an artifact.
  # Nothing here writes to the repository.
  audit:
    if: github.event_name == 'schedule' || inputs.parts != 'watch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      section: settings-audit-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_REFRESH_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: read
      - name: Audit the settings and Project #1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROJECT_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Exit status 1 means findings, which the section reports; only a missing section is an error. The full
          # report goes nowhere: it names Project-only values.
          python scripts/audit_repository.py --digest .cache/audit/project-and-settings.md > /dev/null \
            || echo "The audit reported findings (exit $?)."
          test -s .cache/audit/project-and-settings.md || { echo "::error::The audit wrote no digest section."; exit 1; }
          cat .cache/audit/project-and-settings.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the digest section
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/audit/project-and-settings.md
          if-no-files-found: warn
          retention-days: 90

  # The only writer. It runs after a successful watch whether or not the audit succeeded; a digest without the audit
  # says so. A refused or failed publication keeps the observed state but not what it would have reported, so the next
  # run still comments on the change.
  publish:
    needs: [watch, audit]
    if: always() && needs.watch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.watch.outputs.artifact }}
          path: .cache/watch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.audit.result == 'success'
        with:
          name: ${{ needs.audit.outputs.section }}
          path: .cache/audit
      - id: prepare
        name: Find the predecessor and the maintainers' tasks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { prepare } = require('./.github/scripts/health-digest.cjs');
            await prepare({ github, context, core });
      - name: Render the digest
        env:
          PREDECESSOR: ${{ steps.prepare.outputs.predecessor }}
        run: |
          python scripts/watch_sources.py render --watch .cache/watch --tasks .cache/digest/tasks.json \
            --audit .cache/audit/project-and-settings.md ${PREDECESSOR:+--predecessor "$PREDECESSOR"} \
            --output .cache/digest
      - id: publish
        name: Rebuild the digest, comment on change and attach tasks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publish } = require('./.github/scripts/health-digest.cjs');
            await publish({ github, context, core });
      - name: Choose the state the next run continues
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          mkdir -p .cache/watch-state
          if [ "$PUBLISHED" = true ]; then source=.cache/digest/state.json; else source=.cache/watch/state.json; fi
          cp "$source" .cache/watch-state/state.json
      - name: Save the watch state for the next run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-watch-state
          path: .cache/watch-state/state.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
