name: Live health and source watch

# Trusted default-branch code on a schedule, separate from the deterministic pull-request checks. Weekly: links,
# connector availability, stale dated statuses and the EOSC CZ pages the guide depends on. Monthly, or on request:
# FAIR Champion remeasurement of the core and the reviewed candidates with the existing bounded probe. Findings
# become issues keyed for deduplication after a persistence threshold; nothing is committed or pushed.

on:
  schedule:
    - cron: "41 4 * * 2"
    - cron: "23 3 3 * *"
  workflow_dispatch:
    inputs:
      champion:
        description: Also remeasure FAIR Champion tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: health-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      CHAMPION: ${{ github.event.schedule == '23 3 3 * *' || inputs.champion == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CHAMPION == 'true'
        with:
          node-version: '22'
      - name: Remeasure FAIR Champion tests
        if: env.CHAMPION == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python scripts/build_site.py
          node scripts/probe_champion.mjs --jobs 4 --output .cache/watch/champion.json || true
      - name: Restore the previous watch state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/watch-state
          key: health-watch-state-${{ github.run_id }}
          restore-keys: health-watch-state-
      - name: Observe links, services, pages and statuses
        run: |
          python scripts/watch_sources.py --state .cache/watch-state/state.json --output .cache/watch \
            --champion .cache/watch/champion.json
          mkdir -p .cache/watch-state && cp .cache/watch/state.json .cache/watch-state/state.json
          cat .cache/watch/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the watch state for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/watch-state
          key: health-watch-state-${{ github.run_id }}
      - name: Save the observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/watch/
          if-no-files-found: warn
          retention-days: 90
      - name: Open, update or close keyed issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { apply } = require('./.github/scripts/health-issues.cjs');
            await apply({ github, context, core });

  # The read-only settings and Project audit, on its own so that it can neither stop nor be stopped by the watch.
  # The job's token reads the repository (environments need Actions read, Project completeness Issues read); the
  # App token may only read Projects and is used for nothing else. Without it, Project #1 is reported unavailable with
  # the owner's step. The digest's "Project and settings" section is kept in the artifact; nothing here writes.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_REFRESH_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-projects: read
      - name: Audit the settings and Project #1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROJECT_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Exit status 1 means findings, which the section reports; only a missing section is an error.
          python scripts/audit_repository.py --json .cache/audit/audit.json \
            --digest .cache/audit/project-and-settings.md || echo "The audit reported findings (exit $?)."
          test -s .cache/audit/project-and-settings.md || { echo "::error::The audit wrote no digest section."; exit 1; }
          cat .cache/audit/project-and-settings.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the audit for the digest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/audit/
          if-no-files-found: warn
          retention-days: 90
