name: Partitioned checks

# One build, disjoint lanes and one collector that reconciles their evidence into the verified health result. Pull
# requests, merge groups and the deployment fallback call this workflow, so all three apply the same inventory and
# evidence rules.
on:
  workflow_call:
    inputs:
      base:
        description: The base commit for the content checks' paradata comparison (empty for the default branch)
        type: string
        default: ''
      head:
        description: The checked head commit, for the duplicate suggestions' identity
        type: string
        default: ''
      channel:
        description: The build channel, `local` for pull requests or `preview` for the bytes staging deploys
        type: string
        default: local
      review:
        description: Also prepare the pull request's review data for the trusted comment workflow
        type: boolean
        default: false
      cache:
        description: Restore and save dependency caches; trusted callers restore none
        type: boolean
        default: false
      staging:
        description: Also keep the checked site as the `staging-site` artifact when every check passed
        type: boolean
        default: false

permissions:
  contents: read

env:
  FAIR_GUIDE_BUILD_CHANNEL: ${{ inputs.channel }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ inputs.cache && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build and record source, site and coverage identities
        run: python scripts/check_ci.py build
      - name: Share the checked build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-build
          path: |
            _site/
            .cache/ci-build/manifest.json
          include-hidden-files: true
          retention-days: 2

  lanes:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lanes of scripts/check_ci.py, which assigns their checks.
        lane: [cpu, unit, browser-a, browser-b, browser-c, browser-d]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          # Only the CPU and unit lanes install Python packages, the same set, so only they use the pip cache.
          cache: ${{ inputs.cache && (matrix.lane == 'cpu' || matrix.lane == 'unit') && 'pip' || '' }}
          cache-dependency-path: requirements-dev.txt
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ inputs.cache && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      # Browser lanes import only the standard library from Python (verified import graph), so they skip the
      # validators, linters and their dependencies.
      - name: Install the Python check tools in the CPU and unit lanes
        if: matrix.lane == 'cpu' || matrix.lane == 'unit'
        run: python -m pip install -r requirements-dev.txt
      - name: Install the Node check tools
        run: npm ci
      - name: Install browser only in browser lanes
        if: startsWith(matrix.lane, 'browser-')
        run: npm run browsers -- --with-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-build
          path: .
      - name: Verify the build and run the assigned checks
        env:
          BASE_SHA: ${{ inputs.base }}
          CHECK_LANE: ${{ matrix.lane }}
          CHECK_CACHE_PIP: ${{ steps.python.outputs.cache-hit }}
          CHECK_CACHE_NPM: ${{ steps.node.outputs.cache-hit }}
        run: python -u scripts/check_ci.py lane --name "$CHECK_LANE" ${BASE_SHA:+--base "$BASE_SHA"}
      - name: Save lane evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-lane-${{ matrix.lane }}
          path: .cache/health/
          if-no-files-found: warn
          retention-days: 30
      - name: Save lane visuals
        if: always() && startsWith(matrix.lane, 'browser-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-visuals-${{ matrix.lane }}
          path: .cache/screenshots/
          if-no-files-found: warn
          retention-days: 14

  collect:
    if: always()
    needs: [build, lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: ${{ inputs.cache && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-build
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-lane-*
          path: .cache/ci-results/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: check-visuals-*
          path: .cache/screenshots/
          merge-multiple: true
      - name: Reconcile complete coverage and publish one verified health result
        id: collect
        if: always()
        env:
          BASE_SHA: ${{ inputs.base }}
          PR_HEAD_SHA: ${{ inputs.head }}
        run: python -u scripts/check_ci.py collect ${BASE_SHA:+--base "$BASE_SHA"}
      - name: Publish the run summary
        if: always()
        run: |
          if [ -f .cache/health/summary.md ]; then
            cat .cache/health/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Health report unavailable: setup did not reach the check runner. See the failed job step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the health dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/health/
          if-no-files-found: warn
          retention-days: 30
      - name: Save preview and visual checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _site/
            .cache/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the checked site for staging
        if: inputs.staging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - name: Prepare bilingual review data
        if: always() && inputs.review
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        run: python scripts/pr_summary.py --base "$BASE_SHA" --head "$HEAD_SHA" --output .cache/pr-review/summary.json
      - name: Suggest contributor and attribution patches
        if: always() && inputs.review
        env:
          BASE_SHA: ${{ inputs.base }}
        run: |
          python scripts/contributors.py --base "$BASE_SHA" --output .cache/pr-review/contributors.json
          cat .cache/pr-review/contributors.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save review data for the trusted comment workflow
        if: always() && inputs.review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/pr-review/summary.json
            .cache/pr-review/changes.json
            .cache/pr-review/contributors.json
            ${{ steps.collect.outputs.suggestions_path }}
          if-no-files-found: warn
          retention-days: 14
