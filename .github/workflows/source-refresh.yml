name: Source refresh

# Trusted default-branch code only: scheduled, manually dispatched, or called by the comment-command workflow for a
# issue or pull-request comment "/refresh <source>" from an account with current write access. It refreshes from the default
# branch, validates each response (scripts/refresh_snapshots.py) and publishes changes as one bot-owned pull request
# per source through the repository-scoped GitHub App. It never pushes to the default branch and never merges.
# Refreshes share one queue because sources depend on each other's snapshots; waiting requests are kept, not replaced.

on:
  schedule:
    # Sunday evening, first of the weekly jobs, so its pull requests are checked by Monday morning in Prague.
    - cron: "17 19 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: Source to refresh
        type: choice
        options: [all, heslar, re3data, fip-dashboard, nkr, knav-tools, fairsharing, datacite]
        default: all
  workflow_call:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sources: ${{ steps.select.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { select } = require('./.github/scripts/source-publisher.cjs');
            core.setOutput('sources', await select({ github, context, core }));

  refresh:
    needs: select
    if: needs.select.outputs.sources != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: source-refresh
      queue: max
    outputs:
      results: ${{ steps.publish.outputs.results }}
      code: ${{ steps.refresh.outputs.code }}
      publication: ${{ steps.publish.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: refresh
        name: Refresh and validate the snapshots
        env:
          SOURCES: ${{ needs.select.outputs.sources }}
        run: |
          [[ "$SOURCES" =~ ^[a-z0-9\ -]+$ ]] || { echo "unexpected source list"; exit 1; }
          read -ra keys <<< "$SOURCES"
          set +e
          python scripts/refresh_snapshots.py "${keys[@]}" --report .cache/refresh/report.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Save the refresh report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/refresh/report.json
          if-no-files-found: warn
          retention-days: 30
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_REFRESH_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: publish
        name: Publish changed sources as pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { publish } = require('./.github/scripts/source-publisher.cjs');
            core.setOutput('results', JSON.stringify(await publish({ github, context, core })));
      # The run fails only when a maintainer must act; a source the next scheduled run retries is a warning, and the
      # summary names each source's outcome and the next step (decision 29).
      - name: Summarize each source and who acts next
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ steps.publish.outputs.results }}
          PUBLICATION: ${{ steps.publish.outcome }}
        with:
          script: |
            const { existsSync, readFileSync } = require('node:fs');
            const { summarize } = require('./.github/scripts/source-publisher.cjs');
            let report = { outcomes: [] };
            try {
              if (existsSync('.cache/refresh/report.json')) report = JSON.parse(readFileSync('.cache/refresh/report.json', 'utf8'));
            } catch { /* An unreadable report leaves only the publication's results. */ }
            await summarize({ core }, { results: process.env.RESULTS, publication: process.env.PUBLICATION, report });

  # The App keeps only snapshot/PR permissions; the repository token replies to ordinary issues too.
  reply:
    needs: [select, refresh]
    if: always() && github.event_name == 'issue_comment' && needs.select.outputs.sources != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reply to the refresh command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ needs.refresh.outputs.results }}
          REFRESH_CODE: ${{ needs.refresh.outputs.code }}
          PUBLICATION: ${{ needs.refresh.outputs.publication }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { reply } = require('./.github/scripts/source-publisher.cjs');
            await reply({ github, context }, process.env.RESULTS, process.env.REFRESH_CODE, process.env.PUBLICATION);
