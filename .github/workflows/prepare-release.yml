name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version, for example 1.0.0-alpha.4 (a leading v is accepted)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate citation metadata and export the exact source history
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/check_citation_metadata.py
          python scripts/release_versions.py history --output .cache/release/history.json
      - name: Collect release changes
        id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/prepare-release.cjs').collect({github, context, core});
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the locally built API documentation
        run: npm ci
      - name: Prepare the release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TIMESTAMP: ${{ steps.collect.outputs.timestamp }}
          RELEASE_DATE: ${{ steps.collect.outputs.date }}
        run: |
          python scripts/release_versions.py prepare --version "$RELEASE_VERSION" --date "$RELEASE_DATE" --timestamp "$RELEASE_TIMESTAMP" --prs .cache/release/prs.json --associations .cache/release/associations.json --actor "$RELEASE_ACTOR" --manifest .cache/release/prepared.json
          python scripts/check_citation_metadata.py
          python scripts/build_crate.py --out .cache/release-site
          python scripts/release_versions.py check --site .cache/release-site
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SOURCE_REFRESH_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the release pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./.github/scripts/prepare-release.cjs').propose({github, context, core});
