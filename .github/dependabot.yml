version: 2
# Patch and minor version updates of each ecosystem arrive as one grouped pull request; a major update stays a pull
# request of its own. Security updates are not grouped. Every ecosystem runs on Sunday evening, between source refresh
# and health watch, so the week's pull requests are checked by Monday morning in Prague.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 30
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
