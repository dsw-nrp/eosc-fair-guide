version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    groups:
      patch-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    groups:
      patch-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    groups:
      patch-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    groups:
      patch-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
