# Reviewed human entries for the workflow catalogue in docs/ci.md. `python scripts/ci_catalogue.py` joins them with
# what the workflow files declare (triggers, permissions, concurrency, artifacts and retention); `--check` fails on a
# workflow, uploaded artifact or write permission without its entry, on an entry nothing uses, and on a stale page.
#
# Per workflow: `purpose` (what it is for), `entry` (how a person starts it or meets it), `next` (who acts on its
# result, and how), `rerun` (how to run it again) and `writes` (why each job may write, keyed `job.permission`).
# Per artifact, keyed by its name with `<…>` for the parts the run fills in: `purpose`.

[workflow."checks.yml"]
purpose = "The required `checks` result for every pull request and merge group: one quick job beside the partitioned build, lanes and evidence collector."
entry = "Opening or updating a pull request, and adding it to the merge queue."
next = "The author fixes a failure from the run summary, which names the check and its local command; a green result goes to review or the queue."
rerun = "Push a commit, or use **Re-run failed jobs** on the run page."

[workflow."commands.yml"]
purpose = "Reads `/help`, `/fix-duplicates` and `/refresh <source>` from issue and pull-request comments and runs the workflow that owns each."
entry = "A comment that starts with a command; anything else ends at the first job's filter."
next = "The commenter reads the reaction or reply; an accepted repair or refresh continues in its own workflow."
rerun = "Comment the command again."

[workflow."commands.yml".writes]
"help.issues" = "Replies to `/help` on an issue."
"help.pull-requests" = "Replies to `/help` on a pull request."
"acknowledge.issues" = "Reacts to an accepted command on an issue, or explains a refusal."
"acknowledge.pull-requests" = "Reacts to an accepted command on a pull request, or explains a refusal."
"outcome.issues" = "Reports the outcome of an accepted command on an issue."
"outcome.pull-requests" = "Reports the outcome of an accepted command on a pull request."

[workflow."copilot-setup-steps.yml"]
purpose = "Generated by OpenSpec: prepares the runner the GitHub Copilot coding agent works in."
entry = "The Copilot coding agent starting a session; a change to this file runs it once to validate it."
next = "Nobody, unless it fails: then regenerate it with the OpenSpec CLI rather than editing it."
rerun = "**Run workflow** on its Actions page."

[workflow."deploy.yml"]
purpose = "Prepares what Pages may publish: the checked staging site of a default-branch push, and a release tag's production artifact."
entry = "A merge to `main`, or Tag release pushing a tag."
next = "Publish the verified site follows automatically; a new release tag waits for a maintainer's approval of the `production` environment."
rerun = "**Re-run failed jobs**; a newer push replaces a staging run."

[workflow."fix-duplicates.yml"]
purpose = "Applies the duplicate check's safe link suggestions to a pull request on a maintainer's `/fix-duplicates`."
entry = "Only from Comment commands, after it accepts the maintainer's command."
next = "The pull request's checks run again on the repair commit, and its author reviews the diff."
rerun = "Comment `/fix-duplicates` again."

[workflow."fix-duplicates.yml".writes]
"fix.contents" = "Commits the repair to the pull request's branch through the repository's App."
"fix.pull-requests" = "Comments the repair or the reason none was made."

[workflow."health-watch.yml"]
purpose = "Weekly live watch of links, services, watched pages and stale statuses, with the read-only settings and Project audit, published as one maintenance digest."
entry = "Sunday evening's schedule, or **Run workflow** with the parts to run."
next = "A maintainer triages the digest issue and promotes findings to tasks."
rerun = "**Run workflow**, choosing `watch`, `audit` or `both`."

[workflow."health-watch.yml".writes]
"publish.issues" = "Rebuilds the maintenance digest, comments on change and attaches maintainers' tasks."

[workflow."partitioned-checks.yml"]
purpose = "One build, disjoint check lanes and a collector that turns their evidence into the verified health result."
entry = "Called by Guide checks, and by Deploy the verified site when no merge-queue result can be reused."
next = "Its caller reports the result."
rerun = "Re-run the calling run's failed jobs."

[workflow."pr-summary.yml"]
purpose = "Posts the bilingual review comment with hints and adds area labels after a pull request's checks."
entry = "A completed Guide checks run of a pull request."
next = "The author reads the comment; a maintainer may apply a suggested fix with `/fix-duplicates`."
rerun = "Re-run the pull request's checks."

[workflow."pr-summary.yml".writes]
"comment.pull-requests" = "Creates or updates its own review comment and adds area labels."

[workflow."prepare-release.yml"]
purpose = "Proposes a release: the version, the changelog section and its lineage as one pull request."
entry = "**Run workflow** with the version, or Tag release completing a changelog that misses changes."
next = "A maintainer reviews and merges the release pull request through the queue, then runs Tag release."
rerun = "**Run workflow** again with the same version."

[workflow."prepare-release.yml".writes]
"prepare.contents" = "Pushes the release branch through the repository's App."
"prepare.pull-requests" = "Opens or replaces the release pull request."

[workflow."publish-image.yml"]
purpose = "Publishes the release's exact verified artifact as a signed, attested container image."
entry = "Called by Release."
next = "Nobody; Release continues with the draft release."
rerun = "Re-run the Release run's failed jobs."

[workflow."publish-image.yml".writes]
"image.attestations" = "Attests the image's provenance."
"image.id-token" = "Signs the image without a stored key."
"image.packages" = "Pushes the image to the GitHub container registry."
"image.security-events" = "Uploads the image's vulnerability scan."

[workflow."publish.yml"]
purpose = "Deploys the newest checked staging site and the newest approved release to Pages together, and records each live channel."
entry = "A completed Deploy the verified site run."
next = "Nobody for staging; after a release tag, Release follows."
rerun = "Re-run the deployment run, or this run's failed jobs."

[workflow."publish.yml".writes]
"publish.deployments" = "Records the `staging` and `production` channels once each is live."
"publish.id-token" = "Proves the Pages deployment's origin."
"publish.pages" = "Deploys the site to Pages."

[workflow."release.yml"]
purpose = "After a release tag is live on Pages, publishes its image and creates the draft GitHub release from the same artifact."
entry = "A completed Publish the verified site run that deployed a release."
next = "A maintainer reviews the draft release notes and publishes the release."
rerun = "Re-run its failed jobs."

[workflow."release.yml".writes]
"publish.attestations" = "Attests the image's provenance."
"publish.id-token" = "Signs the image without a stored key."
"publish.packages" = "Pushes the image to the GitHub container registry."
"publish.security-events" = "Uploads the image's vulnerability scan."
"release.contents" = "Creates the draft release with its verified files."

[workflow."source-refresh.yml"]
purpose = "Refreshes source snapshots from the default branch and proposes each changed source as its own pull request."
entry = "Sunday's schedule, **Run workflow**, or `/refresh <source>` on a pull request."
next = "A maintainer reviews and merges each refresh pull request."
rerun = "**Run workflow**, or comment `/refresh <source>` again."

[workflow."source-refresh.yml".writes]
"refresh.contents" = "Pushes the refresh branch through the repository's App."
"refresh.pull-requests" = "Opens or updates the refresh pull request."

[workflow."tag-release.yml"]
purpose = "Tags the merged release once its changelog lists every change since the previous tag; otherwise re-prepares it."
entry = "**Run workflow** with the version, after the release pull request is merged."
next = "Approve the `production` deployment, then review the draft release; after a refusal, merge the new release pull request and run Tag release again."
rerun = "**Run workflow** again with the same version."

[workflow."tag-release.yml".writes]
"tag.contents" = "Creates the release tag through the repository's App, which the tag ruleset allows."

[artifact."guide-site-<needs.sources.outputs.production>"]
purpose = "The release's checked production site, which Publish, Release and the image reuse byte for byte."

[artifact."staging-site"]
purpose = "The checked default-branch site that Publish deploys under `/next/`."

[artifact."health-watch-<run_id>-<run_attempt>"]
purpose = "The watch's observations, plan, state and summary for this run."

[artifact."settings-audit-<run_id>-<run_attempt>"]
purpose = "The audit's redacted Project and settings section of the digest."

[artifact."health-watch-state"]
purpose = "The state the next watch continues, read only from this workflow's default-branch runs."

[artifact."checked-build"]
purpose = "The one build every check lane tests."

[artifact."check-lane-<matrix.lane>"]
purpose = "One lane's check results and evidence for the collector."

[artifact."check-visuals-<matrix.lane>"]
purpose = "One browser lane's screenshots for review."

[artifact."health-<run_id>-<run_attempt>"]
purpose = "The collected health report, which deployment reuses for the same commit."

[artifact."guide-preview-<run_id>-<run_attempt>"]
purpose = "The checked site and screenshots, to preview a pull request locally."

[artifact."guide-review-<run_id>-<run_attempt>"]
purpose = "The review data the Guide review comment reads as untrusted input."

[artifact."pages-identity"]
purpose = "Which staging commit and release tag this publication deployed, which Release reads to bind the release it publishes."

[artifact."source-refresh-<run_id>-<run_attempt>"]
purpose = "The refresh report: what each selected source returned and whether it validated."
