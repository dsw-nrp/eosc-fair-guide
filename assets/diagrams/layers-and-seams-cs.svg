  <title id="figure-title">Vrstvy a návaznosti FAIR implementace</title>
  <desc id="figure-description">Šest funkčních vrstev, předávání informací a zpětná vazba. Čísla označují vrstvy; pořadí není časový postup ani stupnice zralosti. Od záměru k praxi · Pověření · zdroje · očekávání · Oborové požadavky · metadatové profily · Dostupné možnosti · požadavky repozitáře · Zamýšlený postup · Uložené a spravované záznamy · Zpětná vazba: zjištění a opakované problémy · 1 · Principy, politika a řízení · Strategie · pověření · odpovědnosti · financování · Přístup a licence · pravidla vykazování · Proč a podle jakých · pravidel? · 2 · Rozhodování a implementace v komunitě · Metadatové profily · slovníky · formáty · licence · Pracovní skupiny · profily FAIR implementace · Úrovně: národní jádro · oborové profily · modely metod · Co data potřebují pro · porozumění v oboru? · 3 · Infrastruktura · Repozitáře · úložiště · identifikátory · autentizace · Agregace · registry · API · uchování · Úrovně: e-infrastruktura → platforma → repozitář · Jaké prostředky · to umožňují? · 4 · Plánování výzkumu · Plány správy dat · strojově zpracovatelné DMP · Výběr repozitáře · zaznamenané volby · Jak to uplatní · konkrétní projekt? · 5 · Provozní podpora · Data stewardi · kurátorství · zapojení repozitářů · Školení · dokumentace · podpora uživatelů · Kdo pomáhá · v každodenní práci? · 6 · Hodnocení · Sebehodnocení · modely zralosti · certifikace · Automatické nástroje · oborové posouzení · Jaký je skutečný · výsledek? · Návaznost: příjemce potřebuje informace v podobě, kterou dokáže použít · Zpětná vazba. Čísla označují vrstvy; pořadí není časový postup ani stupnice zralosti</desc>
