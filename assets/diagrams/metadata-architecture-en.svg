  <title id="figure-title">Domain description, shared metadata and their transfer</title>
  <desc id="figure-description">Domain descriptions and files stay in the repository. Shared metadata map to CCMM and flow to NMA for discovery and reporting. The catalogue describes repositories; its reuse in planning is planned. Solid arrows mark exchanges implemented for at least one repository, dashed arrows planned exchanges. As of October 2026. mapping · register · Repository · domain · institutional · LRI · general · Dataset · Deposited files · Full domain description · under repository and · community control · Czech Core · Metadata Model · Shared descriptive core · operational · National Metadata · Directory · OAI-PMH · CCMM-XML · no research data stored · operational · Discovery · across · repositories · RIV result · type T · record URL · operational · National Catalogue · of Repositories · scope · conditions · schemas · vocabularies · pilot · Planning and · validation · reuse of repository · descriptions · planned · National Centre for Persistent Identifiers: DOI · ORCID · ISSN · ROR · RAiD · Resolvable identifiers are a precondition for aggregation, citation and reporting. · Exchange implemented for at least one repository · Foreseen by the architecture, not yet operational</desc>
