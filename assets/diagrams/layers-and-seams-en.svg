  <title id="figure-title">Layers and seams of FAIR implementation</title>
  <desc id="figure-description">Six functional layers, information transfers and feedback. Numbers identify layers; the order is neither a timeline nor a maturity scale. From purpose to practice · Mandates · resources · expectations · Domain requirements · metadata profiles · Available options · repository requirements · Intended practice · Deposited and curated records · Feedback: findings and recurrent problems · 1 · Principles, policy and governance · Strategy · mandates · responsibilities · funding · Access and licensing expectations · reporting rules · Why, and under which · obligations? · 2 · Community decision and implementation · Metadata profiles · vocabularies · formats · licences · Working groups · FAIR Implementation Profiles · Scales: national core · domain profiles · method-specific models · What must data carry to · be meaningful in a field? · 3 · Infrastructure · Repositories · storage · identifiers · authentication · Aggregation · registries · APIs · preservation · Nested: e-infrastructure → platform → repository · With which means is · it realised? · 4 · Research planning · Data management plans · machine-actionable DMPs · Repository selection · declared choices · How does one project · apply it? · 5 · Operational support · Data stewards · curation · repository onboarding · Training · documentation · service desk · Who helps, day · to day? · 6 · Evaluation · Self-assessment · maturity models · certification · Automated tools · domain review · What actually · resulted? · Seam: information that must reach the next actor in a form it can act on · Feedback. Layer numbers are identifiers; the order is not a sequence in time or a maturity scale</desc>
