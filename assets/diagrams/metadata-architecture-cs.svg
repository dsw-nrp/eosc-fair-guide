  <title id="figure-title">Oborový popis, společná metadata a jejich přenos</title>
  <desc id="figure-description">Oborový popis a soubory zůstávají v repozitáři. Společná metadata se mapují do CCMM a přenášejí do NMA pro vyhledávání a vykazování. Katalog popisuje repozitáře; jeho využití v plánování je plánované. Plné šipky označují výměnu zavedenou alespoň pro jeden repozitář, přerušované plánovanou výměnu. Stav k říjnu 2026. mapování · registrace · Repozitář · oborový · institucionální · VVI · obecný · Datová sada · Uložené soubory · Úplný oborový popis · ve správě repozitáře · a komunity · Český základní · metadatový model · Společné popisné jádro · v provozu · Národní metadatový · adresář · OAI-PMH · CCMM-XML · bez výzkumných dat · v provozu · Vyhledávání · napříč · repozitáři · Výsledek RIV · typu T · URL záznamu · v provozu · Národní katalog · repozitářů · zaměření · podmínky · schémata · slovníky · pilotní · Plánování · a validace · využití popisů · repozitářů · plánováno · Národní centrum pro PID: DOI · ORCID · ISSN · ROR · RAiD · Funkční identifikátory jsou předpokladem agregace, citování a vykazování. · Výměna zavedená alespoň pro jeden repozitář · V architektuře plánováno, dosud není v provozu</desc>
