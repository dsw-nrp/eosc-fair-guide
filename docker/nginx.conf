# Serve the published Guide as a plain static site. The page is a single HTML file with hash routes, so no
# rewriting is needed; the only additions to nginx's defaults are the RO-Crate media type and not caching the
# health snapshot inside the image.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/mime.types;
    types {
        application/ld+json jsonld;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The health snapshot names the built revision; it is immutable within an image, so it may be cached, but a
    # reader checking it should not be served a stale copy by an intermediate cache the container does not own.
    location = /api/health.json {
        add_header Cache-Control "no-store";
    }
}
