[project]
name = "eosc-cz-fair-guide"
version = "1.0.0-alpha.2"
description = "Scripts for the EOSC CZ FAIR Data Guide: crate generator and content checks."
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-class-docstring", "missing-function-docstring", "wrong-import-position", "invalid-name", "import-outside-toplevel"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PL"]
ignore = ["PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603"]
