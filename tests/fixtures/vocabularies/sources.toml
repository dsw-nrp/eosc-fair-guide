# XML Schema datatypes have no RDF vocabulary document; RDF 1.1 Concepts lists the ones RDF uses, and these are the
# terms of that list.
[[vocabulary]]
name = "XML Schema datatypes"
namespaces = ["http://www.w3.org/2001/XMLSchema#"]
source = "https://www.w3.org/TR/rdf11-concepts/#xsd-datatypes"
retrieved = 2026-11-07
licence = "https://www.w3.org/copyright/document-license-2023/"
terms = [
  "string", "boolean", "decimal", "integer", "double", "float", "date", "time", "dateTime", "dateTimeStamp",
  "gYear", "gMonth", "gDay", "gYearMonth", "gMonthDay", "duration", "yearMonthDuration", "dayTimeDuration", "byte",
  "short", "int", "long", "unsignedByte", "unsignedShort", "unsignedInt", "unsignedLong", "positiveInteger",
  "nonNegativeInteger", "negativeInteger", "nonPositiveInteger", "hexBinary", "base64Binary", "anyURI", "language",
  "normalizedString", "token", "NMTOKEN", "Name", "NCName",
]
