# Pinned copies of the vocabularies the Guide's graph, vocabulary, profile and API refer to. The vocabulary checks
# read these files only, never the network, so a check gives the same answer on every machine. Each copy is the
# document its source served on the retrieval date, unchanged except that the repository stores line endings as LF;
# REUSE.toml records its copyright and licence.
#
# Refreshing a copy is a reviewed update: fetch the source again, replace the file, update `retrieved` and `version`,
# and rerun the checks, which then name any term the new copy no longer defines.
#
# `namespaces` lists the IRI prefixes whose terms the copy defines; a term is defined when the copy states something
# about its IRI. A namespace with no vocabulary document of its own lists its terms instead (`terms`).

[[vocabulary]]
name = "schema.org"
namespaces = ["http://schema.org/"]
file = "schema.ttl"
format = "turtle"
source = "https://schema.org/version/latest/schemaorg-current-http.ttl"
version = "30.1"
retrieved = 2026-11-07
licence = "https://creativecommons.org/licenses/by-sa/3.0/"

