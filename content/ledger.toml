guidance = "Aktivita 1 musí být realizována prostřednictvím povinné pracovní pozice Specialista v oblasti správy výzkumných dat (data steward, Expert 7), případně s pomocí dalších pozic vybraných z Katalogu typových pozic (viz kap. 8.2.1).\n\nPro realizaci Aktivity 2 je nutno využít povinnou pozici Specialista v oblasti správy výzkumných dat (data steward, Expert 7)."
