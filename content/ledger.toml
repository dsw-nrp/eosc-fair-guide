principles = ["F1", "F4", "R1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup minizáměru musí mít volně dostupná metadata a splňovat FAIR principy, mít mezinárodně uznávaný perzistentní identifikátor (například DOI) a kompletní záznam v NMA; dokládá se funkčním odkazem na dataset v repozitáři s přiděleným PID.", en = "A dataset output of a mini-project must have freely available metadata and meet the FAIR principles, have an internationally recognised persistent identifier (such as a DOI) and a complete NMA record; it is evidenced by a working link to the dataset in a repository with its PID." }

# The European Commission's living guidelines on the responsible use of generative AI in research (third version).

[[clause]]
id = "EC-GENAI-GUIDELINES.01"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumník zůstává za výstup plně odpovědný: výstupy generativní AI posuzuje kriticky s vědomím jejích omezení, jako jsou zkreslení a vymyšlené informace. AI není autorem ani spoluautorem.", en = "Researchers remain ultimately responsible for scientific output: they take a critical approach to the output of generative AI, aware of its limitations such as bias and hallucinations. AI systems are neither authors nor co-authors." }
locator = "Recommendations for researchers, 1; printed p. 7"
guidanceLanguage = "en"
guidance = "1. Remain ultimately responsible for scientific output.\n\n- Researchers are accountable for the integrity of the content¹⁸ they produce generated by or with the support of AI tools.\n- Researchers maintain a critical approach to using the output produced by generative AI and are aware of the tools’ limitations, such as bias¹⁹, hallucinations²⁰ and inaccuracies.\n- AI systems are neither authors nor co-authors. Authorship implies agency and responsibility, so it lies with human researchers.\n\n¹⁸ Content should not be fabricated, falsified or plagiarised. For example, researchers do not use generative AI to falsify, alter or manipulate original research data. More details in Section 3.1 of The European Code of Conduct for Research Integrity, ALLEA 2023.\n\n²⁰ \"hallucination\" refers to the generation of false, nonsensical, or inaccurate information by large language models (LLMs) or other generative AI systems."


[[clause]]
id = "EC-GENAI-GUIDELINES.02"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Generativní AI umí vytvořit věrohodně vypadající, ale nesprávné citace a shrnutí; výzkumník odpovídá za kontrolu všech odkazů a jejich obsahu.", en = "Generative AI can produce plausible but incorrect citations and summaries; researchers are responsible for checking all references and their content." }
locator = "Recommendations for researchers, limitations: Invented Citations and Incorrect Summaries; printed pp. 7–8"
guidanceLanguage = "en"
guidance = "Invented Citations and Incorrect Summaries: Generative AI models may generate plausible sounding but incorrect citations, which can mislead users who rely on those sources for research or verification. Even when the citations are correct (the paper exists, has the proper title...), the AI-generated summary of those papers may be incorrect. Therefore, researchers are responsible for checking all the references and content of the citations and the summaries."


[[clause]]
id = "EC-GENAI-GUIDELINES.03"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumník používá generativní AI transparentně: uvádí, které nástroje podstatně použil a jak, a kde je to vhodné, zpřístupní zadání a výstupy v souladu s otevřenou vědou a principy FAIR.", en = "Researchers use generative AI transparently: they state which tools they used substantially and how, and where relevant make the prompts and the output available in line with open science and the FAIR principles." }
locator = "Recommendations for researchers, 2, including notes 21–22; printed p. 8"
guidanceLanguage = "en"
guidance = "2. Use generative AI transparently.\n\n- Researchers, to be transparent, detail which generative AI tools have been used substantially²¹ in their research processes. When generative AI meaningfully shapes results, researchers transparently note its use according to the guidelines of their journal or standards in their discipline in the methods section (or equivalent) responsibly evaluating the extent of the contribution²². This transparency principle also applies to the use of AI to detect or screen bad practices (i.e. detect hallucinations or plagiarism) while keeping human supervision.\n- Researchers take into account the stochastic (random) nature of generative AI tools, which is the tendency to produce different output from the same input. Researchers aim for reproducibility and robustness in their results and conclusions. They disclose or discuss the limitations of generative AI tools used, including possible biases in the generated content, as well as possible mitigation measures.\n\n²¹ In this case, for example, using generative AI as a basic editorial support tool is not a substantial use. However, using it as a method or source, interpreting data analysis, carrying out a literature review, identifying research gaps, formulating research aims, developing hypotheses, etc. could have a substantial impact.\n\n²² References to the tool could include the name, version, date, etc. and how it was used and affected the research process. If relevant, researchers make the input (prompts) and output available, in line with open science principles. Specifically, wherever possible, final output shall follow the FAIR principles (Findable, Accessible, Interoperable, Reusable) and be itself machine actionable."


[[clause]]
id = "EC-GENAI-GUIDELINES.04"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Nepublikovanou nebo citlivou práci výzkumník nevkládá do externího systému AI, pokud nemá záruku, že data nebudou dále využita, například k učení modelů. Při zpracování osobních údajů třetích osob zajišťuje soulad s pravidly ochrany osobních údajů, jasný účel a odpovídající právní základ, například souhlas. Ověřuje, kdo nástroj spravuje a kde běží.", en = "Researchers do not upload unpublished or sensitive work into an external AI system unless there are assurances that the data will not be re-used, for example to train models. When processing third parties' personal data, they ensure compliance with data protection rules, a clear purpose and an appropriate lawful basis, such as consent. They check who manages the tool and where it runs." }
locator = "Recommendations for researchers, 3, including note 24; printed pp. 8–9"
guidanceLanguage = "en"
guidance = "3. Pay particular attention to issues related to privacy, confidentiality and intellectual property rights when sharing sensitive or protected information with AI tools.\n\n- Researchers remain mindful that generated or uploaded input (text, data, prompts, images, etc.) could be used for other purposes, such as the training of AI models. Therefore, they protect unpublished or sensitive work (such as their own or others’ unpublished work) by taking care not to upload it into an external AI system unless there are assurances that the data will not be re-used, e.g., to train future language models or to the untraceable and unverifiable reuse of data.\n- Researchers take care not to provide third parties’ personal data to external generative AI systems unless the data subject (individual) has given them their consent and researchers have a clear goal for which the personal data are to be used so compliance with EU data protection rules²³ is ensured²⁴.\n- Researchers understand the technical, ethical and security implications regarding privacy, confidentiality and intellectual property rights. They check, for example, their institutional guidelines, the privacy options of the tools, who is managing the tool (public or private institutions, companies, etc.), where the tool is running and implications for any information uploaded. This could range from closed environments, hosting on a third-party infrastructure with guaranteed privacy, to open internet-accessible platforms.\n\n²⁴ Apart from personal consent there could be other lawful basis that could justify the processing of personal data."


[[clause]]
id = "EC-GENAI-GUIDELINES.05"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumné organizace mají tam, kde je to možné, zavádět nástroje generativní AI hostované lokálně nebo spravované důvěryhodnou stranou, aby do nich zaměstnanci mohli vkládat vědecká data se zajištěnou ochranou dat a důvěrností.", en = "Where possible, research organisations implement generative AI tools hosted locally or governed by trusted parties, so that staff can feed scientific data into a tool that ensures data protection and confidentiality." }

# Sources behind the gate's infrastructure questions (AAI, security, logging, support).
locator = "Recommendations for research organisations, 4, including note 31; printed p. 10"
guidanceLanguage = "en"
guidance = "4. Whenever possible and necessary, implement locally hosted or cloud-based generative AI tools that they govern themselves³¹. This enables their employees to feed their scientific data into a tool that ensures data protection and confidentiality.\n\n- Organisations ensure the appropriate level of cybersecurity of these systems, especially those connected to the internet.\n\n³¹ Or governed by trustworthy third parties e.g. partner research organizations, the EU or trusted countries."


[[clause]]
id = "AAI-NRP.01"
