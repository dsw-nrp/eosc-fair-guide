# CoreTrustSeal Requirements 2026-2028 (v01.00, CC BY 4.0), each requirement in full: the statement in English as
# published and in the guide's Czech translation, the guidance in English as published. R0 is the context an
# application gives; R01-R16 are the requirements a repository is assessed against.

[[clause]]
id = "CTS.R0"
source = "cts-2026"
principles = []
actor = "repository"
kind = "statement"
locator = "Background Information & Context, R0"
title = { cs = "Základní informace a kontext", en = "Background Information & Context" }
text = { cs = "Tato část poskytuje informace, které recenzenti potřebují k úplnému posouzení odpovědí žadatele.", en = "This section provides the information necessary for reviewers to fully assess the applicants response statements." }
guidance = '''
(1) Re3data Identifier.

(2) Repository type. Select a repository type:

- Generalist repository
- Specialist repository

Specialist repositories are asked to provide their domain(s) and/or discipline(s).

(3) Overview. Provide a short overview of key characteristics of the repository, reflecting the repository type selected. This should include information about the scope and size of data collections, data types and formats. Further contextual information may also be added.

(4) Designated Community. A clear definition of the Designated Community demonstrates that the applicant understands the scope, knowledge base, and methodologies—including preferred software/formats—of the group(s) of users at whom the curation and preservation measures are primarily targeted. The definition should be specific so that reviewers can assess whether that community is being served in the responses to other requirements.

(5) Levels of Curation and Preservation.

Select all relevant types from:

- Z. Level Zero. Content distributed as deposited. Unattended deposit-storage-access.
- D. Deposit Compliance
- C. Initial Curation
- A. Active preservation

A repository must demonstrate that it assures long-term accessibility and understandability of data as the needs of the Designated Community change. Applying the appropriate levels of care to digital objects maximises the return on investment in data assets over time. Successful curation and long-term preservation activities depend on a repository having the rights and taking the responsibility to provide an effective organisational infrastructure, digital object management and technical/security environment

If curation can be understood as the actions that deliver an immediate benefit to digital objects, then preservation includes these, and other steps to ensure data and metadata remain accessible, usable and understandable into the future. Preservation takes account of ongoing changes to the landscape, e.g. the knowledge base of the user community, the surrounding technical context, and the ethical and legal environment. Long-term does not have to mean ‘forever’. Objects may be reappraised over time and their level of curation or preservation may change. Long-term preservation means that organizational measures, infrastructure, and policies are in place to actively preserve digital assets for as long as necessary. Minimum periods of retention are important and should be clear, but these do not equate to active preservation.

Z. Level Zero. Content distributed as deposited. Unattended deposit-storage-access.

Data content and supporting metadata are stored for a given time period, or indefinitely. This may include multiple copies and monitoring of bitstreams for integrity. Data content and supporting metadata are distributed to users exactly as they are provided by depositors. Beyond these measures, there are no checks of deposit compliance, no initial curation or active long-term preservation.

D. Deposit Compliance

Data content and supporting metadata deposited are checked for compliance with defined criteria, e.g. data formats, metadata elements, and compliance with legal and ethical norms. Digital objects that do not meet these criteria may be rejected, or moved forwards to initial curation if provided by the repository.

C. Initial Curation

The digital objects are curated by the repository to meet defined criteria, which may exceed those defined for Deposit Compliance. This initial curation for access and use may include, e.g., the correction or enhancement of metadata and/or data content, or the creation of dissemination formats.

A. Active preservation

In addition to D and/or C above the repository takes long-term responsibility for ensuring that the data and metadata can be understood and rendered as required by the designated community for reuse. The preservation actions can be aimed at logical-technical, semantic, or quality aspects of the (meta)data, for example, in response to the threat of technological obsolescence, to accommodate changing needs of the Designated Community, or in response to other considerations such as security or legal concerns.

Logical-technical measures include updating hard- and software environments, archival and dissemination formats of digital objects, and metadata.

Semantic measures include updating the content of metadata elements and other semantic artefacts such as controlled vocabularies and ontologies if necessary. It may include responsibility for editing the structure and content of deposited data.

It is recognised that a repository may offer different levels of curation to different digital objects. It is important that this is clear to depositors, users, and to CoreTrustSeal Reviewers. The levels may be cumulative as they progress from Deposit Compliance (D), through Initial Curation (C), to Active Preservation (A). A repository may offer different levels of curation and preservation for different digital objects depending on the type of data and curation and preservation terms agreed with the depositor. For each level selected add some concise information on how the respective levels are reached e.g. automatic checks of metadata, intellectual checks and editing of documentation, file format identification, transformation to preservation file formats, etc. To qualify for the CoreTrustSeal a repository must deliver Active Preservation to at least some of their holdings. Common approaches to active preservation can include transformations to new data formats and metadata schemas, and updates to (meta)data content so that digital objects remain understandable and technically usable by the community.

When a repository performs care at more than one level, further information should be added on the proportion of the data in the collection handled according to the respective levels. In this case, applicants should take care that responses to the Requirements state any relevant differences in workflows or employed measures for each selected curation level of curation and preservation.

The designated community’s needs and preferences must be considered when determining the curation and preservation actions to be applied. This depends on monitoring the knowledge base and technology needs of the community, and an understanding of wider technical risks as well as technical, ethical, legal and other developments that may impact how digital objects can be used. For digital objects with specialist characteristics and users (e.g. disciplinary) the active preservation of (meta)data can be more challenging and require additional expertise. A more generalist approach may not preserve those characteristics or meet those specialist needs.

All levels of curation and preservation assume (1) initial deposits are retained unchanged and that edits are only made on copies of those originals, (2) metadata that enables the Designated Community to understand and use the data independently (i.e., without having to consult the original creator) is present at deposit or added by the repository, and (3) ongoing measures for active preservation are in place for the greater part of the collection(s).

Annotations/edits must fall within the terms of the license agreed with the data depositor and be clearly within the skillset of those undertaking the curation. Thus, the repository will be expected to demonstrate that any such annotations/edits are undertaken and documented by appropriate experts and that the integrity of all original copies is maintained.

More context for the levels of curation and preservation can be found in the position paper by the CoreTrustSeal Board.

(6) Cooperation and outsourcing to third parties, partners and host organisations.

If the applicant is entirely responsible for all decisions and takes all relevant actions related to meeting each of the 16 Requirements then this section can be left blank. If for one or more requirements the applicant is supported by another organization in making decisions or taking actions, that organisation, the role it plays, and its relationship with the applicant should be listed here.

It is understood that repositories may be structured in different ways. It is important that repository certification is associated with a clearly defined organisation. The structure of the applicant organisation is addressed under Governance & Resources (R05).

If a repository function and/or supporting evidence that is covered by the CoreTrustSeal is not under the direct control of the applicant, then the relevant host organisation, partner or other third party should be listed here. Describe the function or service they provide, the nature of the relationship or agreement (contractual, Service Level Agreement, Memorandum of Understanding, etc.) and whether they have any relevant certifications. Appropriate qualifications or certifications, including but not limited to the CoreTrustSeal, are preferred but not required. Explaining what types of agreement are in place, or why these may not be practical, helps ensure transparency. It is not expected that applicants share commercial or otherwise sensitive details of relationships (see: Internal Information, Sensitive Information & Confidentiality).

Such relationships may include, but are not limited to: cooperation or federation with other repositories, any services provided by an institution the applicant is part of, storage provided by others as part of multi-copy redundancy, or organisations that may undertake some responsibility for data, metadata and services in a service continuity or succession situation.

The listed organisations should then be clearly referenced under each relevant Requirement.

Because outsourced functions will usually still have some level of shared responsibility the applicant must provide appropriate evidence for Requirements that are not outsourced, and for the parts of the data lifecycle that they control.

Though a wide range of services and functions may be outsourced, a CoreTrustSeal applicant must retain responsibility for the preservation planning and actions undertaken to data and metadata to ensure they remain usable by their Designated Community for the long term.

In the CoreTrustSeal framework, responsibility refers to the applicant’s ultimate accountability for meeting the requirements of certification. While specific tasks or services (e.g. storage, curation, access systems) may be outsourced or delegated to third parties, the applicant remains responsible for ensuring that: the outsourced functions are carried out as agreed; roles and responsibilities are clearly defined and documented; evidence of compliance can be provided to reviewers; and the Designated Community can rely on the repository to preserve data and metadata for the long term. Outsourcing does not transfer responsibility; it only shifts operational duties.

This can be a complex area to define and describe, but such details are essential to ensure a comprehensive review process.

(7) Applicants renewing their CoreTrustSeal certification: summary of significant changes since last application. CoreTrustSeal certification has an expectation of continuous improvement over time. Repositories undergoing recertification should summarise key changes since their last application, including any changes to their technical systems, Designated Community or governance/funding, as well as progress on Requirements. This summary should specify the area of change, provide a brief description, indicate the timing, and outline the impact on the repository.
'''

[[clause]]
id = "CTS.R01"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Organisational Infrastructure, R01"
title = { cs = "Poslání a rozsah", en = "Mission & Scope" }
text = { cs = "Repozitář má výslovné poslání zpřístupňovat digitální objekty a aktivně je uchovávat.", en = "The repository has an explicit mission to provide access to and actively preserve digital objects." }
guidance = '''
Repositories take responsibility for the curation of digital objects, and for ensuring that materials are held in the appropriate environment for appropriate periods of time. For Trustworthy Repositories it must be clear to depositors and users that active preservation of and continued access to the digital objects is an explicit role of the repository.

The response statement and evidence should include references to the following items:

- The mission to actively preserve and provide access to digital objects
- The level of approval that the mission has received.

Evidence for this Requirement could include an approved public mission statement, roles mandated by funders, or a policy statement signed off by a governing board.
'''

[[clause]]
id = "CTS.R02"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Organisational Infrastructure, R02"
title = { cs = "Správa práv", en = "Rights Management" }
text = { cs = "Repozitář spravuje všechna příslušná práva a sleduje jejich dodržování.", en = "The repository maintains all applicable rights and monitors compliance." }
guidance = '''
The repository manages, and communicates to relevant stakeholders, all rights (permissions, prohibitions, obligations) covering data and metadata deposit, storage, preservation, access, and use.

This requirement relates to the system, methods and artefacts (e.g. licenses, agreements, terms and conditions, and related policies and procedures) in place for rights management. The repository must obtain all necessary rights from the depositor, and demonstrate that there are sufficient controls in place to ensure they are applied and monitored.

The response statement and evidence should include references to the following items:

- The overall rights management approach to deposited files, data and metadata.
- The rights to copy, transform, and store digital objects for preservation, as well as provide access to them
- Conditions of use (e.g. intellectual property rights, distribution, intended use, protection of sensitive data, etc.).
- Deposit and access agreements or licenses.
- How rights metadata is managed for humans (e.g. license documents/files) or machines.
- Monitoring of compliance at deposit, during curation/preservation, and during access and reuse. Describe any circumstances where compliance monitoring is not possible.
- Measures in place if non-compliance is detected.

Data and metadata, including ‘open data’, will usually have some rights attached even if there is no signed license artefact or formal agreement in place. This could include obligations such as citation and attribution of data and metadata used, or making secondary analysis openly available. If all data and metadata are made available without any conditions of access or use then this should be made clear in the response statement.

Rights negotiations and transfer should be described under Deposit & Appraisal (R08). Any ethical codes of conduct, privacy measures, or legislation that influence rights management should be described under Legal & Ethical (R04).
'''

[[clause]]
id = "CTS.R03"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Organisational Infrastructure, R03"
title = { cs = "Kontinuita služby", en = "Continuity of Service" }
text = { cs = "Repozitář má plán, který zajišťuje trvalý přístup k jeho datům a metadatům a jejich uchování.", en = "The Repository has a plan to ensure ongoing access to and preservation of its data and metadata." }
guidance = '''
The repository must have measures in place to address the risks inherent in changing circumstances, including in mission and/or scope. This Requirement covers the stable management of repository services over time (business continuity) and the response when services have problems (disaster recovery). It also includes preparations for handover of digital objects and services to another repository (succession planning). The deposit, storage, preservation, and access services offered by the repository to depositors and users are all in scope.

The response statement and evidence should include references to the following items:

- The functions and services offered by the repository to depositors and users.
- The approach to rapid changes of circumstance and long-term planning.
- The options for relocation or transition of the activity to another repository. For example, the case of cessation of funding due to an unexpected withdrawal of funding, or a shift of host institution interests. Such options should also include the levels of service that will be continued at relocation or transition (e.g. data retention only, or including other services).
- The repository approach to managing policies, procedures and other business information over time.

Even though succession agreements may be hard to achieve it is important to acknowledge the possibility that a repository will cease to function or exist. Applications can be certified and recertified with compliance level “In Progress: the repository is in the implementation phase”. If there is no formal, written agreement between the repository and a successor then the compliance level cannot be higher than “In Progress: the repository is in the implementation phase”. Such an agreement can be with another repository to take over holdings, but is not limited to this and may also concern a software or services provider. Any technical aspects of business continuity, and disaster and succession planning should be covered in R15 (Technical infrastructure).
'''

[[clause]]
id = "CTS.R04"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Organisational Infrastructure, R04"
title = { cs = "Právní a etické normy", en = "Legal & Ethical" }
text = { cs = "Repozitář v možném rozsahu zajišťuje, aby data a metadata vznikala, byla kurátorsky zpracována, uchovávána, zpřístupňována a používána v souladu s právními a etickými normami.", en = "The repository ensures to the extent possible that data and metadata are created, curated, preserved, accessed and used in compliance with legal and ethical norms." }
guidance = '''
This requirement relates to repository awareness and processes around legal and ethical issues, including privacy and confidentiality, that impact the creation, curation, and use of digital objects.

To maintain the trust of those who agree to have their digital objects held by the repository, evidence should demonstrate practices that reflect the legal status and sensitivity of digital objects, including guidance for depositors and users.

The response statement and evidence should include references to the following items:

- How the repository identifies and manages relevant legal and ethical standards that impact operations.
- Compliance with specific legal and/or ethical discipline or domain standards.
- Information requested from depositors to confirm that data collection or creation was carried out in accordance with legal and ethical criteria in the relevant geographical location or discipline (e.g. Ethical Review Committee/Institutional Review Board or Data Protection legislation).
- Any data or metadata with disclosure risk e.g. depositor/user information, personal, cultural, or environmental information For applicants that hold data or metadata with disclosure risk include references to the following items:
- Special procedures applied to manage disclosure risk
- Conditions of distribution, access protection and use
- Processes to review disclosure risk and to take the necessary steps to either anonymize files or to provide access in a secure way
- Staff training in the management of digital objects with disclosure risk.
- Guidance provided on the responsible deposit, download, and use of disclosive or potentially disclosive data and metadata.

The management of related rights and compliance checks should be covered under Rights (R02). Measures to protect digital objects should be addressed under Security (R16).
'''

[[clause]]
id = "CTS.R05"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Organisational Infrastructure, R05"
title = { cs = "Řízení a zdroje", en = "Governance & Resources" }
text = { cs = "Repozitář má odpovídající financování a dostatek pracovníků řízených jasným systémem správy, aby mohl účinně naplňovat své poslání.", en = "The repository has adequate funding and sufficient numbers of staff managed through a clear system of governance to effectively carry out the mission." }
guidance = '''
This Requirement reflects a need for transparency of financing, governance, responsibilities, and decision making. Evidence should demonstrate that the repository has a clear system of governance and sufficient human and financial resources to carry out its mission.

The response statement and evidence should include references to the following items:

- Up-to-date organizational chart and description outlining the governance structure, key bodies, and reporting lines; it is important to show the hierarchy, roles, and relationships between management, operational teams, etc.
- Timescales for provision and renewal of funding for operational costs and recruitment; it is understood that permanent, ongoing funding cannot be perfectly quantified or guaranteed.
- Evidence that the repository is, or is hosted by, a recognized institution (supporting long-term stability and sustainability) appropriate to its Designated Community.
- Demonstrate that the repository can meet its obligations, including sufficient funding, staff resources, IT resources, and a budget for external engagement when necessary. The availability of appropriate expertise is covered under Expertise (R06) below.
'''

[[clause]]
id = "CTS.R06"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Organisational Infrastructure, R06"
title = { cs = "Odbornost a poradenství", en = "Expertise & Guidance" }
text = { cs = "Repozitář zavádí mechanismy, které mu průběžně zajišťují odbornost, poradenství a zpětnou vazbu, ať interně, nebo externě.", en = "The repository adopts mechanisms to secure ongoing expertise, guidance and feedback-either in-house, or external." }
guidance = '''
A repository must identify the skills necessary to deliver the services it offers, and source and maintain those skills either as internal resources or through external engagement. An effective repository strives to accommodate evolutions in data types, data volumes, and data rates, as well as to adopt the most effective new technologies in order to remain valuable to its Designated Community.

The response statement and evidence should include references to the following items:

- That guidance and expertise reflects the scientific scope of the repository, if relevant.
- The repository aligns internal recruitment and external engagement with the services it offers.
- The repository ensures that its staff have access to ongoing training and professional development.
- The range and depth of expertise of both the organisation and its staff, including any relevant affiliations (e.g. national or international bodies), is appropriate to the mission.
- In-house advisers, or external advisory committees that include technical, curation, data science, data security, and disciplinary experts.
- How the repository communicates with experts for advice.
'''

[[clause]]
id = "CTS.R07"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R07"
title = { cs = "Provenience a autenticita", en = "Provenance and authenticity" }
text = { cs = "Repozitář zaručuje autenticitu digitálních objektů a poskytuje informace o jejich provenienci.", en = "The repository guarantees the authenticity of the digital objects and provides provenance information." }
guidance = '''
The repository should provide evidence to show that it operates a data and metadata management system that maintains provenance information to ensure authenticity from deposit, and through curation and preservation to the point of access.

Any intentional changes to data and metadata should be documented, including the rationale and originator of the change. Authenticity covers reliability and provenance, including the relationship between the deposited digital objects and those provided at the point of access.

The response statement and evidence should include references to the following items:

- The repository approach to changing and versioning data and metadata. How the approach and records of changes are communicated to data depositors and users.
- The provenance information and audit trails recorded for data and metadata processing and versioning.
- How the repository compares the essential properties of different versions of the same file.
- Identification checks for depositors.
'''

[[clause]]
id = "CTS.R08"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R08"
title = { cs = "Ukládání, hodnocení a přístupnost", en = "Deposit, Appraisal & Accessibility" }
text = { cs = "Repozitář přijímá data a metadata podle stanovených kritérií, aby byla relevantní a přístupná uživatelům.", en = "The repository accepts data and metadata based on defined criteria to ensure relevance and accessibility for users." }
guidance = '''
The appraisal function during deposit is critical to evaluate whether digital objects meet all criteria for selection and to ensure appropriate management for their preservation. Appraisal ensures that deposited digital objects are relevant and are, or can become, accessible to the Designated Community. Accessible means that users should easily be able to find, retrieve, and use the data and metadata.

The response statement and evidence should include references to the following items:

- Any documented deposit process that includes steps to ensure that data and metadata are sufficient for long-term preservation.
- A collection development policy or procedures to guide the selection of digital objects.
- Criteria for prioritisation and any different curation-levels or preservation levels defined during appraisal.
- The approach to digital objects that do not fall within the mission/collection profile.
- Procedures to determine that the metadata required to interpret and use the digital objects are provided.
- Any automated assessment of metadata adherence to relevant schemas.
- The repository approach if metadata provided is insufficient for long-term preservation.
- A list of preferred formats.
- Checks in place to ensure that depositors adhere to the preferred formats.
- The approach towards digital objects that are deposited in non-preferred formats.
- The transfer of custody and responsibility during the handover from the depositor to the repository.

This Requirement covers the selection criteria applied at the point of deposit. Data Quality (R11) should be used to address steps taken by the repository during the curation process.
'''

[[clause]]
id = "CTS.R09"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R09"
title = { cs = "Plán uchování", en = "Preservation plan" }
text = { cs = "Repozitář přebírá odpovědnost za dlouhodobé uchování a řídí tuto funkci plánovaně a zdokumentovaně.", en = "The repository assumes responsibility for long-term preservation and manages this function in a planned and documented way." }
guidance = '''
The repository, depositors, and Designated Community need to understand the level of responsibility undertaken for the long-term preservation of data and metadata. This exceeds bit level integrity alone and covers plans to respond to potential future changes which may impact the understandability and reusability of data and metadata over time. Procedures must be documented and their completion assured.

The response statement and evidence should include references to the following items:

- The documented approach to preservation, including whether this involves format migration, emulation, etc. Ensuring bit level integrity is vital but not sufficient for preservation.
- File formats and metadata schemas for long term preservation.
- How the level of responsibility for the preservation of each item is defined.
- Plans related to future migrations or similar measures to address the threat of obsolescence.
- Actions relevant to preservation specified in documentation, including custody transfer, submission information criteria, and preservation information metadata.
- Measures to ensure these actions are taken.
- Any minimum stated retention and/or preservation periods.
- How often the digital objects are re-appraised and the possible outcomes of reappraisal.
- The repository approach to deleting/removing data and metadata from collection/holdings including the impact on persistent identifiers as well as the availability and curation of tombstone records.

The rights of the repository, including the right to preserve, are covered under Rights Management (R02). Bit level integrity is covered under Storage and Integrity (R14). Acceptable file formats at deposit should be covered under Deposit and Appraisal (R08). Measures to ensure that file formats, schemas and content are appropriate to the Designated Community should be covered under Reuse (R13).
'''

[[clause]]
id = "CTS.R10"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R10"
title = { cs = "Zajištění kvality", en = "Quality Assurance" }
text = { cs = "Repozitář dbá na technickou kvalitu a soulad se standardy a zajišťuje, aby koncoví uživatelé měli dost informací k posouzení kvality.", en = "The repository addresses technical quality and standards compliance, and ensures that sufficient information is available for end users to make quality-related evaluations." }
guidance = '''
Different repositories undertake different levels of curation on data, metadata and documentation depending on the needs and expectations of their depositors and Designated Community. Quality assurance by the repository ensures that digital objects comply with a range of standard criteria including acceptable formats, metadata schema, metadata content and links to other digital objects. This relates to ‘technical quality’ rather than the ‘scientific quality’ of the original digital objects creation or collection prior to deposit, though the repository must ensure there is sufficient information about the digital objects for the Designated Community to assess their fitness for use. Data, or associated metadata, may have quality issues relevant to their research value, but this does not preclude their use if a user can make a well-informed decision on their suitability through provided documentation.

The response statement and evidence should include references to the following items:

- The approach to data and metadata quality taken by the repository including variations for different curation-levels.
- The standards that data, metadata and documentation must comply with to be acceptable for preservation and access. Whether these are general external standards, internally developed standards or specific to a community of practice.
- The quality control checks in place ensure the completeness and understandability of data and metadata.
- The approach to resolving issues e.g. whether the digital objects are returned to the depositor for rectification, fixed by the repository, noted by quality flags, and/or included in the accompanying metadata.
- The approach to managing changes to expected standards (e.g. new or updated data formats of metadata schemas) in response to changes in the technical environment or to changes in the needs of the Designated Community.
- Any links provided to other digital objects’ data and metadata e.g. related digital objects, publications, or the use of controlled vocabularies and ontologies.

This Requirement refers to data and metadata quality standards and assurance during curation. Selection criteria are covered during Deposit and Appraisal (R08). Measures to ensure that digital objects remain fit for purpose over time are covered under Preservation Plan (R09).
'''

[[clause]]
id = "CTS.R11"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R11"
title = { cs = "Pracovní postupy", en = "Workflows" }
text = { cs = "Správa digitálních objektů probíhá podle stanovených pracovních postupů od uložení po zpřístupnění.", en = "Digital object management takes place according to defined workflows from deposit to access." }
guidance = '''
For Quality Assurance (R10) to be achieved, it is necessary to avoid ad hoc actions and to deliver consistency of practice for all digital objects and across repository functions. This requires that workflows be defined, documented, and change-managed. Workflows may be specified in a mixture of standard operating procedures, business process descriptions and diagrams that guide normal practice and provide mechanisms for handling exceptions.

The response statement and evidence should include references to the following items:

- Workflows/business process descriptions covering the curation levels performed.
- How workflows are adjusted for different types of data and metadata.
- Decision handling within the workflows.
- Change management of workflows.
- Ability to track workflow execution, with mechanisms to handle exceptions.

This Requirement confirms that all workflows are documented. A diagram can be included to illustrate this. It should be noted if there are different workflows for different levels of security mentioned in the Legal and Ethical (R04) response statement. Workflows may include qualitative and quantitative checking of outputs, but any detail on checks and compliance should be addressed under Quality Assurance (R10).
'''

[[clause]]
id = "CTS.R12"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R12"
title = { cs = "Vyhledávání a identifikace", en = "Discovery and Identification" }
text = { cs = "Repozitář umožňuje uživatelům digitální objekty vyhledat a trvale na ně odkazovat řádnou citací.", en = "The repository enables users to discover the digital objects and refer to them in a persistent way through proper citation." }
guidance = '''
Effective data and metadata sharing discovery is key to resource discovery. Once discovered, digital objects should be referenceable through full citations, including persistent identifiers (PIDs) to help ensure that they can be retrieved into the future.

The response statement and evidence should include references to the following items:

- The search facilities offered by the repository.
- The standards that a searchable metadata catalogue complies with.
- The approach to ensuring that identifiers are unique and persistent.
- Machine harvesting of the metadata.
- Repository, or repository data and metadata, inclusion in disciplinary or generic registries of resources.
- Recommended data citations.

Applicants should describe their use of a third party persistent identifier system, or document their own approach to ensuring that identifiers remain globally unique and persistent. The use of a third party to support PID creation and resolution is not sufficient; applicants should describe how they ensure that identifiers continue to resolve to the correct data or metadata over time, including the version rules that guide when a new identifier is created for a digital object. Applicants that do not have a persistent identifier solution cannot achieve “Implemented: the requirement has been fully implemented by the repository” for this requirement.
'''

[[clause]]
id = "CTS.R13"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Digital Object Management, R13"
title = { cs = "Opětovné použití", en = "Reuse" }
text = { cs = "Repozitář umožňuje opětovné použití digitálních objektů v čase a zajišťuje, aby byly k dispozici informace potřebné k jejich pochopení a použití.", en = "The repository enables reuse of the digital objects over time, ensuring that appropriate information is available to support understanding and use." }
guidance = '''
Repositories must ensure that data and metadata continue to be understood and used effectively into the future despite changes in technology and the Designated Community’s knowledge base. This Requirement evaluates the measures taken to ensure that data and metadata are reusable.

The response statement and evidence should include references to the following items:

- The ways in which the repository engages with their Designated Community of users to identify their needs.
- The data formats, metadata schemas, controlled vocabularies and ontologies used to support reuse, and how these meet the community needs.
- The metadata and documentation provided at the point of access to support understandability and reuse appropriate to the Designated Community. This may include information specific to data type, e.g. manuals, calibration records, photos, protocols.
- Measures to ensure that data and metadata remain understandable.
- Management of changes to data, metadata, documentation or other information that supports reuse.

Responses to this Requirement should focus on engagement with the Designated Community, identification of their needs and specifying how their needs are met.
'''

[[clause]]
id = "CTS.R14"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Information Technology & Security, R14"
title = { cs = "Ukládání a integrita", en = "Storage & Integrity" }
text = { cs = "Repozitář uplatňuje zdokumentované postupy, které zajišťují uložení a integritu dat a metadat.", en = "The repository applies documented processes to ensure data and metadata storage and integrity." }
guidance = '''
In addition to maintaining ‘archival’ copies of digital objects, repositories need to store data and metadata from the point of deposit, for curation and preservation, and for access by users. For each storage location, measures should be in place to ensure that unintentional or unauthorised changes can be detected and correct versions of data and metadata recovered.

The response statement and evidence should include references to the following items:

- Processes and documents to ensure that the repository staff have a clear understanding of all storage locations and how they are managed.
- The repository’s strategy for multiple copies.
- The risk management techniques used to inform the strategy.
- Procedures for handling and monitoring deterioration of storage media.
- Procedures to ensure that data and metadata are only deleted as part of an approved and documented process.
- Any checks (i.e. fixity checks) used to verify that a digital object has not been altered or corrupted from deposit to use.

Storage and integrity measures should be covered here (R14) and not as part of Technical Infrastructure (R15) or Security (R16) responses. Details of how intentional changes to the data and metadata are logged should be covered under Provenance & Authenticity (R07).
'''

[[clause]]
id = "CTS.R15"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Information Technology & Security, R15"
title = { cs = "Technická infrastruktura", en = "Technical Infrastructure" }
text = { cs = "Repozitář je provozován na dobře podporovaných operačních systémech a dalším základním infrastrukturním softwaru a hardwaru, které odpovídají službám, jež poskytuje své určené komunitě.", en = "The repository is managed on well-supported operating systems and other core infrastructural software and hardware appropriate to the services it provides to its Designated Community." }
guidance = '''
Repositories must operate on reliable and stable core infrastructure that maximises service availability. The details of technical infrastructure will vary widely across repositories. Responses and evidence should focus on demonstrating that the repository solution, including hardware and software is well managed and appropriate to the needs of the repository functions and the Designated Community of users.

The response statement and evidence should include references to the following items:

- The repository software used for deposit, curation, preservation and access management. Whether it is community supported, open source, or locally developed.
- Any IT service management approach followed and the functions this approach specifies (e.g. systems documentation, software inventories, code repositories, infrastructure development planning).
- Any international, community or other technical infrastructure standards in place and how compliance is monitored.
- The version control systems used for repository generated software.
- Measures taken to ensure that availability, bandwidth, and connectivity are sufficient to meet the needs of the Designated Community.
- Processes in place to monitor and manage the need for technical change, including in response to the changing needs of Preservation (R10), and Reuse (R13) by the Designated Community.

Technical aspects of business continuity, disaster recovery and succession planning are relevant here, but their management should be covered under Continuity of Service (R03). This requirement excludes Security (R16) measures and Storage & Integrity (R14). File formats and metadata schema information should be referenced under Deposit & Appraisal (R08) and Reuse (R13). Standards that are not technical or security focussed should be referenced under Quality Assurance (R10).
'''

[[clause]]
id = "CTS.R16"
source = "cts-2026"
principles = []
actor = "repository"
kind = "requirement"
locator = "Information Technology & Security, R16"
title = { cs = "Bezpečnost", en = "Security" }
text = { cs = "Repozitář chrání své prostory i svá data, metadata, produkty, služby a uživatele.", en = "The repository protects the facility and its data, metadata, products, services, and users." }
guidance = '''
The repository should analyze potential threats, assess risks, and create a consistent security system. It should consider damage scenarios based on malicious actions, human error, or technical failure that pose a threat to the repository and its data, metadata, products, services, and users. It should measure the likelihood and impact of such scenarios, decide which risk levels are acceptable, and determine which measures should be taken to counter the threats to the repository and its Designated Community. This should be an ongoing process.

The response statement and evidence should include references to the following items:

- The levels of security required for different data and metadata and environments, and how these are supported.
- The IT security system, employees with roles related to security (e.g. security officers), and any risk analysis approach in use.
- Measures in place to protect the facility. How the premises where digital objects are held are secured.
- Any security-specific standards the repository references or complies with.
- Any authentication and authorization procedures employed to securely manage access to systems in use.

Responses should not cover Storage and Integrity (R14) measures or the wider Technical Infrastructure (R15).
'''

# CDIF 1.1 (CC BY 4.0): the content requirements of the basic discovery metadata content model, numbered in the
# book's order by section (REQ required, CON conditional, REC recommended, MET metadata management), and the
# profiles of version 1.1. Title and short definition in English as published and in the guide's Czech; the
# full text in English as published, as guidance.

[[clause]]
id = "CDIF.REQ1"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Required"
title = { cs = "Identifikátor zdroje", en = "Resource identifier" }
text = { cs = "Globálně jedinečný a rozřešitelný identifikátor zdroje, který metadatový záznam popisuje.", en = "A globally unique, resolvable identifier for the resource described by the metadata record." }
guidance = '''
Resource identifier (1 entry): A globally unique, resolvable identifier for the resource described by the metadata record.
'''

[[clause]]
id = "CDIF.REQ2"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Required"
title = { cs = "Název", en = "Title" }
text = { cs = "Stručný název zdroje (nejlépe do 250 znaků), podle kterého ho člověk jednoznačně pozná.", en = "Succinct (preferably <250 characters) name of the resource; should be sufficient to uniquely identify the resource for a human user." }
guidance = '''
Title (1 entry): Succinct (preferably <250 characters) name of the resource; should be sufficient to uniquely identify the resource for a human user.
'''

[[clause]]
id = "CDIF.REQ3"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Required"
title = { cs = "Distribuce", en = "Distribution" }
text = { cs = "Je-li zdroj digitální objekt dostupný online, uveďte URL, odkud jej lze získat.", en = "If the resource is a digital object accessible online, provide a URL that will retrieve the resource." }
guidance = '''
Distribution: URL, Distribution object, or Access Instructions (1 entry): If the resource is a digital object accessible online, provide a URL that will retrieve the resource. If the resource has multiple representations, provide a Distribution Object documenting the various options with a URL and representation profile for each. Metadata for distributions through an API that allows query, filter, or processing as part of a data access request are described in the Queryable Distribution Interfaces (API) section, below. If the resource is not accessible online, provide a URL to a landing page used to access the resource, or minimally, provide a text description explaining how to access the resource in the metadata (Access Instructions).
'''

[[clause]]
id = "CDIF.REQ4"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Required"
title = { cs = "Práva", en = "Rights" }
text = { cs = "Informace o potřebných přístupových oprávněních, licencích, smluvních požadavcích, omezeních použití a bezpečnostních omezeních.", en = "Information about required access permissions, licences, contractual requirements, use constraints, and security constraints." }
guidance = '''
Rights (1 to many entry): Information about required access permissions, licences, contractual requirements, use constraints, and security constraints. Might be described in text or through links to external documents. (See 6.4. Data Access for providing machine-actionable rights descriptions.)
'''

[[clause]]
id = "CDIF.REQ5"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Required"
title = { cs = "Identifikátor metadatového profilu", en = "Metadata profile identifier" }
text = { cs = "Identifikátor specifikace metadat (profilu), podle které záznam vznikl.", en = "Identifier for metadata specification (profile) used to create this metadata record." }
guidance = '''
Metadata profile identifier (1 to many): Identifier for metadata specification (profile) used to create this metadata record. Generally this will be populated automatically if the metadata is created using CDIF aware tools.
'''

[[clause]]
id = "CDIF.REQ6"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Required"
title = { cs = "Typ zdroje", en = "Resource type" }
text = { cs = "Označení s uvedeným klasifikačním schématem, které určuje, jaký druh zdroje metadata popisují.", en = "A scoped name (label with classification scheme) that specifies the kind of resource described by the metadata." }
guidance = '''
Resource type (1 to many): A scoped name (label with classification scheme) that specifies the kind of resource described by the metadata. The resource type might be used to determine validation requirements specific to descriptions for that kind of resource.
'''

[[clause]]
id = "CDIF.CON1"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Conditional elements"
title = { cs = "Proměnné", en = "Variable" }
text = { cs = "Povinné u datových sad: metadata datové sady mají uvádět seznam proměnných, které obsahuje.", en = "Required for datasets. The metadata about a dataset should include a list of variables that the dataset contains." }
guidance = '''
Variable (0 to many entries): Required for datasets. The metadata about a dataset should include a list of variables that the dataset contains. Variable metadata should minimally specify the name of the variable as it appears in the dataset. That name should be, ideally, qualified by a controlled vocabulary or other semantic resource (e.g. represented by a resolvable URI), or minimally some descriptive text. Variable metadata should include as much content as needed for users to understand the type of the variable (e.g. measured, statistically derived, or simulated), its units, and any relevant reference systems for its values (see Universals ). Details of data structure and schema more closely related to interoperability, data integration, and usage than to data discovery are discussed in Data Description for Integration.
'''

[[clause]]
id = "CDIF.CON2"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Conditional elements"
title = { cs = "Časové pokrytí", en = "Temporal Coverage" }
text = { cs = "Povinné, pokud se obsah zdroje týká určitého časového intervalu: interval, který zdroj zachycuje nebo o kterém pojednává.", en = "Required if resource content is specific to some time interval. The time interval represented by or the subject of the described resource." }
guidance = '''
Temporal Coverage (0..1 entry) Required if resource content is specific to some time interval. The time interval represented by or the subject of the described resource. This could be the time interval when data were collected, or an archaeological or geological time interval that is the subject of the resource. Need to account for clock time, calendar time (Gregorian, Julian, Hebrew, Islamic, Chinese, Mayan...), cyclical time (summer, first quarter, mating season, new moon, pay day) and for named time ordinal eras (Jurassic, Younger Dryas, Early Minoan I, Late Stone Age). See OWL Time (https://www.w3.org/TR/owl-time/).
'''

[[clause]]
id = "CDIF.CON3"
source = "cdif"
principles = []
actor = "repository"
kind = "requirement"
locator = "Basic discovery metadata content model, Conditional elements"
title = { cs = "Geografický rozsah", en = "Geographic Extent" }
text = { cs = "Povinné, má-li předmět zdroje geografický rozsah: pojmenované místo, ohraničující obdélník, liniová trasa nebo bod.", en = "Required if resource has a geographic extent for its subject, either a named location, bounding rectangle, linear trace, or point." }
guidance = '''
Geographic Extent - (0..many)  Required if resource has a geographic extent for its subject, either a named location, bounding rectangle, linear trace, or point. To support cross-domain searches based on geospatial location, location coordinates must be given in decimal degrees using the WGS 8486 datum. There are various other systems for describing location (see Space ); these can be provided as alternate location descriptions, recognizing that they might be meaningful to some metadata harvesting agents. Some resources may not be usefully described by a WGS 84 extent, in which case indicate nil:notapplicable; this would include extraterrestrial resources.

- Bounding Rectangle: North Bounding Latitude, South Bounding Latitude, East Bounding Longitude, West Bounding Longitude. The minimum rectangle that completely contains the coverage extent for the resource content. Coordinate order and syntax are determined by the serialisation profile.
- Linear trace: a linear trace e.g. of a ship's track, aircraft flight path, or surface traverse, represented as a series of points. Coordinate order and syntax are determined by the serialisation profile.
- Point: Latitude, Longitude. A centroid point for the coverage extent of the resource, or the location of the resource content if a point location is appropriate. Coordinate order and syntax are determined by the serialisation profile.
- Named location: Place name referenced to some gazetteer. Use scoped name pattern {label, authority, optional identifier}.
'''

[[clause]]
id = "CDIF.REC1"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Popis", en = "Description" }
text = { cs = "Informuje čtenáře o obsahu, kontextu a původu zdroje a o všem dalším, co se může hodit pro budoucí mezioborové použití.", en = "Inform the reader about the resource's content, context, provenance, and any other information deemed useful for future cross-domain usage." }
guidance = '''
Description (0..1 entry): Inform the reader about the resource's content, context, provenance, and any other information deemed useful for future cross-domain usage. SHACL validation will throw warning if not present.
'''

[[clause]]
id = "CDIF.REC2"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Původci", en = "Originators" }
text = { cs = "Jedna či více stran (osoba nebo organizace), které mají roli spojenou se vznikem zdroje, například autor nebo editor.", en = "One or more parties (person or organisation) that have a role related to the origin of the resource, e.g., author or editor." }
guidance = '''
Originators (0 to many entries): One or more parties (person or organisation) that have a role related to the origin of the resource, e.g., author or editor. Each party has a name (label), identifier, and optional contact information. SHACL validation will throw warning if not present.
'''

[[clause]]
id = "CDIF.REC3"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Datum změny", en = "Modified Date" }
text = { cs = "Datum (nikoli časový rozsah), kdy byly dokončeny poslední změny zdroje.", en = "Date (not temporal extent) when the most recent changes to the resource were completed." }
guidance = '''
Modified Date (0..1 entry): Date (not temporal extent) when the most recent changes to the resource were completed. Use a "year" or ISO 8601 date and time (https://en.wikipedia.org/wiki/ISO_8601) format. Alternative date formatting must be machine-readable and consistent across all datasets. SHACL validation will throw warning if not present.
'''

[[clause]]
id = "CDIF.REC4"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Kontakt pro přístup", en = "Distribution Agent" }
text = { cs = "Strana (osoba nebo organizace), na kterou se obrátit kvůli přístupu ke zdroji.", en = "The party (person or organisation) to contact about accessing the resource." }
guidance = '''
Distribution Agent (0..1 entry):The party (person or organisation) to contact about accessing the resource. Each party has a name (label), identifier, and optional contact information. If there are multiple distribution options with different contact points, the Distribution Agent should be specified as part of the Distribution Object.
'''

[[clause]]
id = "CDIF.REC5"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Kontrolní součet", en = "Checksum" }
text = { cs = "Řetězec vypočtený z obsahu digitálního objektu, podle kterého lze ověřit, že se obsah nezměnil.", en = "A string value calculated from the content of a digital object that allows verification that the content of the object has not been modified." }
guidance = '''
Checksum. (0 or 1): A string value calculated from the content of a digital object that allows verification that the content of the object has not been modified. Even insignificant changes to the content of the file will change its checksum. The algorithm used to calculate the checksum must be documented. See also RFC-6920 'Naming things with hashes' (https://www.rfc-editor.org/rfc/rfc6920.html) that establishes ways to identify checksum algorithms and to represent checksum values as a URI. Note that checksums apply to specific digital objects, typically a unique resource representation. Non-digital resources do not have checksums; their representations can have checksums. See implementation notes in Appendix 1.
'''

[[clause]]
id = "CDIF.REC6"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Financování", en = "Funding" }
text = { cs = "Uveďte zdroje financování (granty, smlouvy…).", en = "Cite funding sources (Grants, contracts...)." }
guidance = '''
Funding. (0 to many entries): Cite funding sources (Grants, contracts...). Each source has a grant or contract identifier, source organisation, and label.
'''

[[clause]]
id = "CDIF.REC7"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Klíčová slova", en = "Keyword" }
text = { cs = "Rozlišujte volné štítky a termíny z řízených slovníků.", en = "Distinguish 'tags' and 'controlled terms'." }
guidance = '''
Keyword (0 to many entries): Distinguish 'tags' and 'controlled terms'. Tags are simply words that a metadata creator thinks will be useful for users to identify resources of interest. Controlled terms are words defined in a vocabulary that minimally include the word (a fixed string to identify the term for humans) and a definition. Each term represents some concept. More semantically rich vocabularies would include resolvable identifiers, source information, and links to related terms (see Cox et al., 2021 (https://doi.org/10.1371/journal.pcbi.1009041) ). One common set of relationships in a vocabulary is a kind-of hierarchy linking broader to narrower concepts. Controlled terms should minimally be represented with a label and scheme name that identifies the source vocabulary; ideally a term URI and scheme URI could be included for more accurate identification and data integration.
'''

[[clause]]
id = "CDIF.REC8"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Zásady", en = "Policies" }
text = { cs = "Zásady správy popsaného zdroje: zda se obsah smí měnit, plánované aktualizace, očekávaná doba dostupnosti, plán údržby, verzování a dokumentace změn a žádostí o změny.", en = "Policies used in management of the described resource, including whether the content may be changed (mutable or immutable), any scheduled updates, what is the expected lifetime for resource availability, what (if any) is the maintenance schedule, versioning, documentation for changes and change requests." }
guidance = '''
Policies (0 to many entries): Policies used in management of the described resource, including whether the content may be changed (mutable or immutable), any scheduled updates, what is the expected lifetime for resource availability, what (if any) is the maintenance schedule, versioning, documentation for changes and change requests. Explicit support for specific policy frameworks can be included (e.g., CARE).
'''

[[clause]]
id = "CDIF.REC9"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Datum zveřejnění", en = "Publication Date" }
text = { cs = "Datum (nikoli časový rozsah), kdy byl zdroj zpřístupněn.", en = "Date (not temporal extent) when the resource was made accessible." }
guidance = '''
Publication Date (0 or 1): Date (not temporal extent) when the resource was made accessible. Use a ‘year’ or ISO 8601 date and time format. Alternative date formatting must be machine-readable and consistent across all datasets. If no publication date is known, estimate the publication date range, enter the oldest year as the publication date, and include the estimated date range in the Description field.
'''

[[clause]]
id = "CDIF.REC10"
source = "cdif"
principles = []
actor = "repository"
kind = "recommendation"
locator = "Basic discovery metadata content model, Recommended"
title = { cs = "Další zúčastněné strany", en = "Other related agents" }
text = { cs = "Uznání pro ty, kdo přispěli ke vzniku zdroje, ale nejsou uvedeni jako autoři či tvůrci.", en = "Recognition for others who have contributed to the production of the resource but are not recognized as authors/creators." }
guidance = '''
Other related agents (0 to many entries): Recognition for others who have contributed to the production of the resource but are not recognized as authors/creators. Includes a variety of roles like maintainer, publisher, point of contact, copyright holder, contributor (see e.g. DataCite contributor types (https://datacite-metadata-schema.readthedocs.io/en/4.5_draft/properties/recommended_optional/property_contributor.html#a-contributortype), ISO19115-1 role code (https://wiki.esipfed.org/ISO_19115_and_19115-2_CodeList_Dictionaries#CI_RoleCode) )
'''

