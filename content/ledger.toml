[[clause]]
id = "MBDB-2026.01"
source = "mbdb-2026"
principles = ["R1.3", "I1"]
actor = "other"
kind = "statement"
text = { cs = "Databáze MBDB ukazuje, jak zpřístupnit surová měření z přístrojů: originální formáty uchovat a harmonizovat jejich popis.", en = "The MBDB database shows how to make raw instrument measurements findable and reusable: keep the original formats and harmonise their description." }
locator = "Concept of Molecular Biophysics Database"
guidanceLanguage = "en"
guidance = "Consequently, the MBDB takes the approach of standardising the metadata, and preserving the raw data in its original (non-standard) format, which is sufficient to make the data concerning specific biological systems findable, accessible, and reusable in principle.\n\nStandardisation of raw measurement data in molecular biophysics is not an achievable goal in the near-term. The diversity of file formats used across different methods, even within individual methods, multiple instrument manufacturers and software versions create very many format and content variations. Current data storage and transport formats in molecular biophysics include flavours of XML, HDF-5, SQLite, XLSX, variations of TSV/CSV, and proprietary formats."


