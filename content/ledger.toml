guidance = "Požadavky na Pro účely interoperability je třeba zajistit komplementární vývoj bohatých metadatových schémat pro jednotlivé vědní obory – využití řízených slovníků, standarPožadavky na dizovaných ontologií, tezaurů a taxonomií všude, kde to bude možné. Vhodné je repozitáře proto požadovat po repozitářích vzniklých v rámci NRP rozšíření metadat nezbytných pro vyhledávání a citování o oborově specifická, bohatá metadata, která Požadavky na budou lépe sloužit potřebám odlišných výzkumných komunit. Rozsah metadat škáluje s přínosem pro discovery/reuse; repozitář nemá vyžadovat oborová metadata, která nevyužije (ponechat na FIP/komunitě)."
guidanceLanguage = "cs"

[[clause]]
