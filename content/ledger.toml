principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí pokrývat lidské zdroje pro správu výzkumných dat: odpovědnosti jednotlivých aktérů (výzkumníci, datoví správci, IT podpora, vedení), vizi dlouhodobého rozvoje lidských zdrojů a kompetencí pro FAIR data a využívání NDI a ukotvení pracovních pozic pro správu FAIR dat v organizační struktuře.", en = "The strategy must cover human resources for research data management: the responsibilities of each actor (researchers, data stewards, IT support, management), a vision for developing people and competences for FAIR data and the use of the NDI over the long term, and the anchoring of FAIR data positions in the organisational structure." }
guidance = "Minimální požadavky na Strategii pro nakládání s výzkumnými daty: Strategie musí věcně pokrývat tyto oblasti:\n\n3. lidské zdroje pro správu výzkumných dat: vymezení odpovědností jednotlivých aktérů (např. výzkumníci, datoví správci, IT podpora, vedení instituce) - kdo bude mít jakou roli v celém systému správy dat na dané instituci, jaká je vize dlouhodobého rozvoje lidských zdrojů v oblasti FAIR dat a kompetencí potřebných k využívání NDI včetně ukotvení pracovních pozic potřebných pro správu FAIR dat v rámci organizační struktury instituce;"
guidanceLanguage = "cs"
locator = "kap. 5.7, minimální požadavky na Strategii, s. 14"

