principles = ["R1.3"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář spolupracuje s komunitou: metadatové schéma odpovídá oborovým standardům ve FIP.", en = "The repository cooperates with the community: the metadata schema follows the domain standards in the FIP." }
guidance = "Požadavky na  Spolupráce s oborovou komunitou: V rámci FIP definovat metadatové repozitáře schéma odpovídají standardům daného oboru."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.R2"
