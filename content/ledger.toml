principles = ["R1.3"]
actor = "repository"
kind = "requirement"
text = { cs = "Metadata se validují vůči komunitním schématům.", en = "Metadata are validated against community schemas." }
guidance = "Validace metadat: Repozitáře musí umožnit validaci metadat oproti definovaným komunitním schématům."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.R3"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Požadavky na repozitáře"
principles = ["R1.3"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář umožňuje zavádět nové a aktualizované oborové standardy.", en = "The repository can implement new and updated domain standards." }
guidance = "Možnost rozšíření o specifické standardy: Repozitáře by měly umožňovat implementaci nově definovaných či aktualizovaných oborových standardů podle potřeb vědeckých komunit."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Požadavky na FIP"
principles = ["R1.3"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje doporučené metadatové a datové standardy oboru.", en = "The FIP sets the recommended metadata and data standards of the domain." }
guidance = "Definování komunitních standardů pro jednotlivé obory: Každý FIP by měl obsahovat seznam doporučených metadatových a datových standardů relevantních pro danou vědeckou oblast."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Požadavky na FIP"
principles = ["R1.3"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje povinné a doporučené atributy metadat.", en = "The FIP sets the mandatory and recommended metadata attributes." }
guidance = "Specifikace minimálních požadavků na metadata: FIP by měl definovat povinné a doporučené atributy metadat."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Naplnění v NRP, s. 43"
principles = ["R1.3"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "NRP podporuje ukládání dat přednostně ve vhodném oborovém repozitáři.", en = "NRP supports depositing data preferably in a suitable domain repository." }
guidance = "V rámci NRP je řešena implementace komunitně uznávaných standardů pro metadata a datové formáty na základě spolupráce s projektem IPs CARDS. NRP by mělo podporovat ukládání dat přednostně ve vhodném oborovém repozitáři. Tato problematika je adresována také zavedením FIP profilů, které budou napomáhat k tomu, že data uložená v rámci repozitářů v NRP budou splňovat příslušné standardy specifické pro danou doménu."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Popis, s. 43"
principles = ["R1.3"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Příklady oborových standardů: Darwin Core, MIAME, DDI-C, HDF5, CIDOC CRM; CoreTrustSeal [[clause:CTS.R13|R14]].", en = "Examples of domain standards: Darwin Core, MIAME, DDI-C, HDF5, CIDOC CRM; CoreTrustSeal [[clause:CTS.R13|R14]]." }
guidance = "Tento princip zdůrazňuje nutnost dodržování komunitně uznávaných standardů pro metadata a datové formáty. Cílem je zajistit, aby data byla konzistentní, srozumitelná a snadno interoperabilní v rámci konkrétní vědní oblasti. Použití komunitních standardů umožňuje lepší sdílení a znovuvyužití dat jak v národním, tak mezinárodním kontextu. Vědecké komunity si často vyvíjejí vlastní standardy pro metadata a formáty dat, které odpovídají specifickým potřebám jejich oborů. Například:\n\n- Biologie: Darwin Core pro biologická data.\n- Biomedicína: MIAME (Minimum Information About a Microarray Experiment)\n- Sociální vědy: DDI-C (Data Documentation Initiative - Codebook)\n- Fyzika: HDF5 (Hierarchical Data Format)\n- Humanitní vědy: CIDOC-CRM (CIDOC Conceptual Reference Model)"
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.1"
source = "analyza-fair-1.2"
locator = "kap. 2.1"
principles = ["F4"]
actor = "other"
kind = "statement"
text = { cs = "Architektura národní datové infrastruktury: Národní metadatový adresář (NMA), Národní katalog repozitářů (NKR) a Centrum PID.", en = "Architecture of the national data infrastructure: the National Metadata Directory (NMA), the National Repository Catalogue (NKR) and the PID Centre." }
status = "refresh"
note = { cs = "NMA je v provozu, NKR v pilotním provozu s otevřeným API; Centrum PID působí jako identifikatory.cz.", en = "NMA is in operation, NKR in pilot operation with an open API; the PID Centre operates as identifikatory.cz." }
noteSources = ["PID-CENTRE.01"]
guidance = "Do budoucna má NMA fungovat jako centrální služba pro agregaci, ukládání a vyhledávání metadat o výzkumných datech z projektů realizovaných na českých výzkumných institucích, a to z různých domácích i zahraničních zdrojů. Jeho cílem je zlepšit dohledatelnost českých výzkumných dat a umožnit jejich efektivní vyhledávání napříč obory.\n\nNKR (National Repository Catalogue) bude evidovat a zpřístupňovat přehled repozitářů zapojených do NRP/NDI, včetně informací o použitých metadatových schématech, ontologiích a řízených slovnících, což napomůže standardizaci a usnadní integraci repozitářů do širšího ekosystému EOSC. Správci repozitářů budou zodpovědní za poskytování těchto informací, což zajistí aktuálnost a správnost katalogu.\n\nNárodní centrum PID¹⁵ zajišťuje správu a koordinaci využívání perzistentních identifikátorů (PID) v České republice, zejména prostřednictvím členství v konsorciu DataCite a poskytování služeb DOI a dalších identifikátorů. Díky této službě mají české instituce možnost přidělovat DOI a další podporované typy PID, což usnadní citování, sledování a dlouhodobou dostupnost dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.2.1"
source = "analyza-fair-1.2"
locator = "kap. 2.2.1"
principles = ["R1.3", "I1"]
actor = "other"
kind = "statement"
text = { cs = "Metadatové profily lze spravovat v nástroji Dataspecer (verze, export SHACL a JSON Schema, mapování); jejich správa potřebuje pravidla (governance).", en = "Metadata profiles can be managed in Dataspecer (versions, SHACL and JSON Schema export, mappings); their management needs governance." }
guidance = "Správci repozitářů a odborné komunity mají k dispozici Dataspecer, nástroj pro tvorbu a správu metadatových profilů (datových specifikací) používaných pro popis dat v jednotlivých repozitářích. Dataspecer umožňuje profily verzovat, dokumentovat, exportovat (např. do SHACL/JSON Schema) a připravovat mapování mezi schématy (např. vůči CCMM, DCAT-AP nebo DataCite) za účelem zvýšení interoperability. Samotná dostupnost nástroje však nezaručuje vznik úplného přehledu používaných schémat napříč repozitáři – ten vznikne pouze tehdy, pokud repozitáře budou profily v nástroji skutečně udržovat, vhodně publikovat a bude nastaven provozní a governance model (odpovědnosti, proces změn, pravidla publikace a správa oprávnění). Předpoklady pro efektivní správu profilů zahrnují zejména: správu verzí schémat, export do SHACL/JSON Schema, podporu mapování na DCAT-AP/DataCite, řízený proces změn (governance) a nástroje pro testování shody."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.2.2"
source = "analyza-fair-1.2"
locator = "kap. 2.2.2"
principles = ["R1.1"]
actor = "other"
kind = "statement"
text = { cs = "Nástroje pro výběr licence (Public Licence Selector) samostatně i v repozitářích.", en = "Tools for choosing a licence (Public Licence Selector), standalone and within repositories." }
status = "superseded"
note = { cs = "Výběr licence nabízí průvodce licencemi v DMP.eosc.cz.", en = "The licence selector in DMP.eosc.cz helps to choose a licence." }
supersededBy = "DSW-NRP.01"
guidance = "NRP poskytne nástroje a metodickou podporu pro výběr a přidělování licencí k datovým sadám. Tímto budou mít vědci a správci dat k dispozici prostředky pro jasné a jednotné nastavení podmínek přístupu, sdílení a využití výzkumných dat. Plánováno je zveřejnění interaktivního průvodce (Public Licence Selector), který uživatele provede výběrem vhodné licence a poskytne strojově čitelné vyjádření licence (minimálně URI). Cílem je zpřístupnit tuto službu samostatně (web/API) a současně – tam, kde to repozitářové platformy umožní – ji integrovat do publikačního workflow repozitářů; konkrétní forma integrace bude upřesněna pro jednotlivé platformy v implementačních profilech/FIP."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.2.3"
source = "analyza-fair-1.2"
locator = "kap. 2.2.3"
principles = ["A1.2"]
actor = "other"
kind = "statement"
text = { cs = "Řízení přístupu, citlivá data a specializované repozitáře jsou plánované.", en = "Access control, sensitive data and specialised repositories are planned." }
status = "refresh"
note = { cs = "Vyšel dokument Initial AAI architecture for sensitive data in NRP; pro zpracování citlivých dat slouží Sensitive Cloud v e-INFRA CZ.", en = "The document Initial AAI architecture for sensitive data in NRP has been published; Sensitive Cloud in e-INFRA CZ serves for processing sensitive data." }
noteSources = ["AAI-SENSITIVE.01"]
guidance = "I když by FAIR data měla být co nejotevřenější, ne vždy je to možné kvůli etickým, právním nebo bezpečnostním omezením. Proto NRP vyvíjí nástroje pro řízení přístupu, které umožní detailní nastavení oprávnění na úrovni datových sad i jednotlivých distribucí, včetně podpory pro data s omezeným nebo podmíněným přístupem. Pro správu citlivých dat, která vyžaduje speciální přístup, se plánuje vybudování specializovaných repozitářů určených pro tato data, vytvoření metodik, které budou reflektovat požadavky jednotlivých vědních disciplín, a implementace technologií, umožňujících bezpečné ukládání a sdílení citlivých datových sad."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.2.4"
source = "analyza-fair-1.2"
locator = "kap. 2.2.4"
principles = ["R1.2"]
actor = "other"
kind = "statement"
text = { cs = "Plánuje se automatizovaný sběr dat z přístrojů.", en = "Automated collection of data from instruments is planned." }
status = "refresh"
note = { cs = "K tomu slouží aplikace DDRapp.", en = "The DDRapp application serves this purpose." }
noteSources = ["DDRAPP.01"]
guidance = "Součástí budoucího rozvoje infrastruktury NRP/NDI je také podpora automatizovaného sběru dat a metadat z výzkumných zařízení a/nebo datových akvizičních pipeline, například prostřednictvím sběrných služeb a API. To umožní okamžitý sběr a strukturovaný popis experimentálních dat přímo při jejich vzniku, což je zásadní pro zajištění jejich kvality a FAIR kompatibility. Metadata extrahovaná z přístrojů mohou být následně automaticky synchronizována s repozitáři a katalogy, což zjednoduší procesy FAIR správy dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.3.1"
source = "analyza-fair-1.2"
locator = "kap. 2.3.1, s. 15, plán správy dat"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Aktéři a nástroje: DMP v Data Stewardship Wizard, sebehodnocení, FIP a automatizované hodnocení.", en = "Actors and tools: DMPs in the Data Stewardship Wizard, self-assessment, FIPs and automated assessment." }
guidance = "Pro efektivní správu dat využívá uživatel plán správy dat (DMP), který je optimálně vytvářen v nástroji podporujícím strojové zpracování, jako je například Data Stewardship Wizard (DSW). Tento nástroj umožňuje nejen systematickou správu výzkumných dat, ale také provádění sebehodnocení FAIRness (Self Assessment) na základě zadaných informací ještě před samotným vytvořením nebo uložením dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.3.2a"
source = "analyza-fair-1.2"
locator = "kap. 2.3.2"
principles = ["R1.3"]
actor = "other"
kind = "statement"
text = { cs = "Pravidla repozitáře tvoří metadatový profil, datová politika a případně FIP.", en = "A repository's rules consist of its metadata profile, its data policy and, optionally, a FIP." }
guidance = "Definice pravidel: Práci uživatele vymezuje konfigurace repozitáře, kterou nastavuje správce a kurátor na základě tří vzájemně provázaných typů pravidel:\n\n- Metadatový profil (Metadata Profile): určuje jaká pole jsou povinná/volitelná, jaké jsou kontrolované slovníky a validace (např. povinná licence, typ dat, vazba na projekt/grant).\n- Datová politika repozitáře (Data Policy): definuje podmínky přijímání a správy dat (přístupová práva, licencování, verzování, doba uchování, postup pro stažení dat, přidělování PID).\n- FAIR Implementation Profile (FIP, volitelně): doplňuje specifická rozhodnutí a doporučení komunity užívající repozitář (např. preferované ontologie/slovníky, oborová schémata a formáty) a slouží jako vodítko pro konfiguraci repozitáře a kurátorské postupy v dané komunitě."
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.3.2b"
source = "analyza-fair-1.2"
locator = "kap. 2.3.2"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Repozitář dává zpětnou vazbu přímo v rozhraní: rychlou kontrolu souladu a automatizované hodnocení.", en = "The repository gives feedback in its interface: a quick compliance check and automated assessment." }
guidance = "Nástroje pro zpětnou vazbu: Přímo v uživatelském rozhraní by měly být dostupné nástroje pro ověření souladu nahrávaných dat, konkrétně:\n\n- Rychlá kontrola souladu (Self Assessment)\n- Automatizované hodnocení (Automated Assessment)"
guidanceLanguage = "cs"

[[clause]]
id = "A.K2.3.2c"
source = "analyza-fair-1.2"
locator = "kap. 2.3.2"
principles = ["R1.1", "R1.3"]
actor = "other"
kind = "statement"
text = { cs = "Pravidla repozitáře jsou strojově čitelná: profil (SHACL, JSON Schema), licence a přístup jako URI a seznam formátů.", en = "A repository's rules are machine-readable: the profile (SHACL, JSON Schema), licences and access as URIs, and a list of formats." }
status = "refresh"
note = { cs = "Část těchto údajů nese záznam repozitáře v NKR.", en = "Part of this information is carried by the repository's NKR record." }
noteSources = ["NKR-SCHEMA.01"]
guidance = "Strojově čitelné vyjádření pravidel (cílový stav): Cílem je, aby klíčová pravidla repozitáře byla dostupná také ve strojově čitelné podobě a mohla být využita externími nástroji (např. pro plánování správy dat/DMP). Minimální rozsah zahrnuje: (i) zveřejnění metadatového profilu ve strukturované podobě (např. SHACL/JSON Schema), (ii) strojově jednoznačnou informaci o licencích a přístupových podmínkách (minimálně jako URI v metadatech) a (iii) seznam podporovaných formátů/typů distribucí. Konkrétní způsob publikace (API/registry/dokumenty) bude sjednocen v implementačních profilech a doporučeních pro repozitářové platformy."
guidanceLanguage = "cs"

[[clause]]
id = "A.K4.1"
source = "analyza-fair-1.2"
locator = "kap. 4.1"
principles = ["R1.3"]
actor = "other"
kind = "statement"
text = { cs = "FIP zachycuje komunitní volbu zdrojů umožňujících FAIR (FER); je strojově zpracovatelný (nanopublikace).", en = "A FIP records a community's choice of FAIR-enabling resources (FERs); it is machine-actionable (nanopublications)." }
guidance = "FAIR principy záměrně nestanovují ani nedoporučují žádné konkrétní technologie, nástroje, standardy nebo postupy – jsou to pouze obecná pravidla, která mají podpořit maximální využití stávajících a osvědčených řešení a usměrnit vývoj nových tam, kde v současnosti chybí. Cesta k FAIR datům musí být z podstaty věci do značné míry uchopena na úrovni jednotlivých komunit, které potřebují efektivní metody a nástroje k dosažení optimálního naplnění požadavků FAIR. K tomuto směřuje iniciativa FAIR Implementation Profile (FIP) –Profil implementace FAIR, což je metodika vyvinutá v rámci iniciativy GO FAIR. Díky ní mají vědecké a výzkumné komunity možnost vyjádřit svůj výběr standardů, technologií, nástrojů a postupů, tzv. FAIR-Enabling Resources (FER), zdroje umožňující FAIR, kterými naplňují FAIR principy. Tím se vytváří globální znalostní báze, ze které mohou čerpat, jak samotní členové dané komunity, tak i další komunity, které se mohou inspirovat při tvorbě vlastních FIP.\n\nNa rozdíl od jiných přístupů zaměřených na vytváření pokynů a doporučení pro FAIRifikaci dat FIP nabízí i plně strojově zpracovatelné výstupy, např. ve formě nano-publikací. Ty umožňují automatizovanou podporu a propojení s nástroji, a zároveň zajišťují sledovatelnost a důvěryhodnost v globálně distribuovaném prostředí založeném na digitálně podepsaném původu dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.K4.2"
source = "analyza-fair-1.2"
locator = "kap. 4.2"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Pro tvorbu FIP slouží FIP Wizard; zvažovala se národní instance.", en = "FIPs are created with the FIP Wizard; a national instance was considered." }
status = "superseded"
note = { cs = "Průvodce nepočítá se samostatnou národní instancí FIP Wizard; schválené FER bude nabízet NKR.", en = "The guide does not assume a separate national FIP Wizard instance; NKR will offer approved FERs." }
guidance = "V rámci NDI bude FIP Wizard využíván pro tvorbu FIP, jak bylo zmíněno výše. Bude spravována vlastní instance, která bude technicky nezávislá na globální síti nanopublikací z důvodu zajištění plné technické kontroly na národní úrovni, nicméně tyto globální nanopublikace bude možné využívat a bude možné do nich i přispívat."
guidanceLanguage = "cs"

[[clause]]
id = "A.K4.3"
source = "analyza-fair-1.2"
locator = "kap. 4.3"
principles = []
actor = "other"
kind = "statement"
text = { cs = "FIP se propojuje s DMP (FIP2DMP); Data Stewardship Wizard slouží jako „kokpit“; strojově zpracovatelné DMP (maDMP).", en = "FIPs connect to DMPs (FIP2DMP); the Data Stewardship Wizard serves as a cockpit; machine-actionable DMPs (maDMP)." }
status = "refresh"
note = { cs = "DMP.eosc.cz je v pilotním provozu; modul FIP je ve vývoji.", en = "DMP.eosc.cz is in pilot operation; the FIP module is in development." }
noteSources = ["DSW-NRP.01"]
guidance = "FIP představuje zdroj informací, které mohou významně usnadnit přípravu kvalitního plánu správy dat (DMP) – výzkumníci se mohou opřít o kvalitní, prověřená a dobře použitelná řešení pro zajišťování FAIR principů, která jsou navíc komunitně zaměřena, a použít je do svého plánu správy dat. K tomu bude na technické úrovni sloužit vyvinuté propojení mezi FIP Wizard a Data Stewardship Wizard⁶³, které zajistí přenos vhodných FER z FIP do DMP, jak je popsáno v sekci 2.3.1 a 2.3.2. Samotný Data Stewardship Wizard poté představuje nejen nástroj pro plánování správy dat, ale může sloužit též ve všech částech životního cyklu dat jako “kokpit pilota”. To je umožněno strojovou zpracovatelností plánů dat (machine-actionable DMP, maDMP⁶⁴) a rozsáhlými možnostmi technických integrací skrze API. Konkrétní možnosti integrací jsou v tuto chvíli předmětem dalších technických analýz. Kromě popsané integrace s FIP Wizardem je na ideové úrovni možné uvažovat o integracích znázorněných ve schématu níže (obr. 4)."
guidanceLanguage = "cs"

[[clause]]
id = "A.K5.0"
source = "analyza-fair-1.2"
locator = "kap. 5"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Sebehodnocení a automatizované nástroje se doplňují a liší se načasováním.", en = "Self-assessment and automated tools complement each other and differ in timing." }
guidance = "Sebeevaluační test nabízí uživateli možnost odpovídat na předem připravený set otázek s uzavřenou množinou možných odpovědí, kdy jednotlivé možnosti jsou předem expertně ohodnoceny, a to v jaké míře přispívají k naplnění principů FAIR. Touto variantou nástrojů je možné pokrývat i fáze před samotným vznikem datové sady. Následující nástroje jsou příklady sebehodnotících testů, první dva jsou určeny zejména jednotlivcům, třetí je zaměřen na správce repozitářů.\n\nHodnocení FAIR principů v této kategorii probíhá automaticky, a to zejména prostřednictvím kontroly metadat, použitých ontologií a kontrolovaných slovníků. V některých případech nástroje porovnávají hodnocenou datovou sadu s komunitně definovanými schématy. Tyto nástroje pracují výhradně s již popsanými a uloženými datovými sadami, což znamená, že hodnocení je fixováno na konkrétní fázi životního cyklu dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.K5.1"
source = "analyza-fair-1.2"
locator = "kap. 5.1"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Nástroje sebehodnocení: FAIR Data Maturity Model, ARDC FAIR self-assessment (český překlad VUT), FAIR-Aware, CAT.", en = "Self-assessment tools: FAIR Data Maturity Model, ARDC FAIR self-assessment (Czech translation by BUT), FAIR-Aware, CAT." }
guidance = "Metodologický rámec pro hodnocení FAIR poskytuje FAIR Data Maturity Model (FDMM)⁶⁵. Není to nástroj sám o sobě, ale slouží ke sjednocení popisu toho, jak dobře data splňují principy FAIR. Tento model definuje metriky a úrovně „zralosti“ dat, což umožňuje organizacím systematicky posuzovat kvalitu a připravenost jejich dat pro sdílení a opětovné využití. FDMM je koncipován jako standardizovaný přístup, který mohou využívat různé nástroje a metodiky k hodnocení FAIR úrovně dat. Model byl vyvinut organizací Research Data Alliance (RDA).\n\nSebeevaluační test nabízí uživateli možnost odpovídat na předem připravený set otázek s uzavřenou množinou možných odpovědí, kdy jednotlivé možnosti jsou předem expertně ohodnoceny, a to v jaké míře přispívají k naplnění principů FAIR. Touto variantou nástrojů je možné pokrývat i fáze před samotným vznikem datové sady. Následující nástroje jsou příklady sebehodnotících testů, první dva jsou určeny zejména jednotlivcům, třetí je zaměřen na správce repozitářů.\n\nFAIR Self-Assessment Tool⁶⁶ je jednoduchý nástroj navržený pro jednotlivce a organizace, který umožňuje provést základní hodnocení, jak data splňují principy FAIR. Tento nástroj je velmi užitečný pro jednoduché a rychlé hodnocení datových sad a poskytuje první krok k lepší správě a sdílení dat podle FAIR principů. Nástroj vytvořený australským Australian Research Data Commons (ARDC)⁶⁷ je dostupný na GitHub pod otevřenou licencí. Konkrétní hodnocení zvolených odpovědí je postaveno na srovnání s interpretací „FAIR Data Principles“ definovaných skupinou „FORCE11“68 – tedy komunitou vědců, knihovníků, archivářů, vydavatelů a poskytovatelů podpory. Nástroj má i český překlad69, který zajistil kolektiv knihovny VUT.\n\nFAIR Aware⁷⁰ byl vyvinut organizací DANS (Data Archiving and Networked Services)71 v rámci iniciativy FAIRsFAIR. Je to sebehodnotící nástroj určený pro výzkumníky, kteří chtějí lépe pochopit FAIR principy a jejich implementaci ve své práci. Uživatel prochází sérií otázek zaměřených na jeho přístup k FAIR datům a na znalosti potřebné pro jejich správné publikování. Poskytuje personalizovanou zpětnou vazbu a doporučení ke zlepšení. Slouží jako vzdělávací nástroj pro zvýšení povědomí o FAIR principech. Neprovádí přímé technické hodnocení datových sad. Compliance Assessment Toolkit (CAT)⁷² je praktický nástroj, který umožňuje organizacím a výzkumným týmům hodnotit, nakolik jejich data splňují FAIR principy. CAT poskytuje konkrétní testy a kontrolní seznamy, které pomáhají identifikovat nedostatky v metadatech, přístupnosti a interoperabilitě dat. Kromě hodnocení nabízí také doporučení k nápravě a zlepšení datové správy. Tento nástroj byl vyvinut v rámci projektu FAIRsFAIR a je zaměřen především na praktickou aplikaci FAIR principů v datových repozitářích a výzkumných organizacích."
guidanceLanguage = "cs"

[[clause]]
id = "A.K5.2.1"
source = "analyza-fair-1.2"
locator = "kap. 5.2.1"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Výsledky automatických testů FAIR odrážejí hlavně nastavení repozitáře, ne práci autora.", en = "Results of automated FAIR tests mainly reflect the repository's setup, not the author's work." }
guidance = "Je zásadní si uvědomit, že výsledky automatizovaných testů neodráží primárně práci autora dat, ale technickou připravenost a nastavení samotného repozitáře. Skóre je do značné míry ovlivněno tím, jaká metadatová schémata správce repozitáře zpřístupnil a jak jsou metadata strojově dostupná. Výsledky by proto měly sloužit především jako zpětná vazba pro správce repozitářů, nikoliv jako absolutní měřítko kvality konkrétní datové sady."
guidanceLanguage = "cs"

[[clause]]
id = "A.K5.2.2"
source = "analyza-fair-1.2"
locator = "kap. 5.2.2"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Automatizované nástroje: FAIR-Checker, F-UJI (nehodnotí A2), FAIR Evaluator, OpenAIRE Validator, FAIR Assist, FAIR Implementation Framework, FC4E-CAT.", en = "Automated tools: FAIR-Checker, F-UJI (does not assess A2), FAIR Evaluator, OpenAIRE Validator, FAIR Assist, FAIR Implementation Framework, FC4E-CAT." }
status = "refresh"
note = { cs = "Průvodce doporučuje především FAIR Champion (OSTrails).", en = "The guide primarily recommends FAIR Champion (OSTrails)." }
noteSources = ["FAIR-CHAMPION.01"]
guidance = "FAIR-Checker⁵⁴ - nástroj vytvořený v rámci francouzského nodu projektu ELIXIR (IFB - French Institute for Bioinformatics) je dostupný pod otevřenou licencí na portálu GitHub. Z webových stránek je extrahována anotace datové sady, která tvoří minimální znalostní graf. Tento znalostní graf je následně doplněn o data z již existujících znalostních grafů, jako jsou DataCite PID Graph, OpenAIRE Graph a Wikidata. Výsledný graf je testován, zda použité prvky odpovídají standardizovaným Linked Open Vocabularies (LOV), Ontology Lookup Service (OLS) nebo Bioportal. Nakonec je ověřena kvalita metadat vůči komunitním profilům, jako jsou Bioschemas. Výstupem je paprskový graf s procentuálně vyjádřeným skóre ve čtyřech kategoriích (F, A, I, R), tabulka bodového ohodnocení jednotlivých testů (0, 1, 2) a textová doporučení pro zlepšení v případě nižšího skóre. Důležité je, že stoprocentní FAIR compliance není podmíněna dosažením plného bodového výsledku.\n\nF-UJI⁵⁵ - nástroj vyvinutý v rámci projektu FAIRsFAIR. Hodnotí již uložené datové sady na základě agregovaných metadat získaných z landing pages, PID služeb (např. DataCite) a dalších zdrojů, jako je re3data⁷⁵. Testuje 16 ze 17 FAIR metrik (vše kromě A2 principu – Metadata jsou přístupná, i když data již nejsou k dispozici). Výstupem je procentuální skóre FAIR compliance. Tabulka bodového hodnocení pro čtyři FAIR kategorie na základě bodového hodnocení přiřazuje každé kategorii úroveň plnění FAIR principů:\n\n- Incomplete (neúplné)\n- Initial (počáteční)\n- Moderate (střední)\n- Advanced (pokročilé)\n\nF-UJI poskytuje podrobnější analytický pohled na FAIR compliance než FAIR-Checker. Je vhodný zejména pro organizace a správce repozitářů, kteří chtějí získat přehled o slabinách svého metadatového popisu a jeho strojového zpřístupnění. V Příloze 1 je k dispozici hodnocení konkrétních repozitářů, které ilustruje, jak pracovat s výsledky hodnocení nástrojem F-UJI a následnými doporučeními.\n\nFAIR Evaluator⁷⁶ - nástroj vyvinutý v rámci iniciativy GO FAIR, zaměřený na automatické hodnocení FAIR compliance pomocí sady FAIR Metrics definovaných FAIR Metrics Group. Ověřuje metadata digitálních objektů na základě jejich identifikátorů (např. DOI, URL) a provádí testy strojové čitelnosti a přístupnosti. Na rozdíl od jiných nástrojů se soustředí výhradně na automatizované testování, přičemž výsledky jsou prezentovány jako skóre pro jednotlivé FAIR kategorie. Umožňuje také manuální úpravy hodnocení a zpětnou vazbu. Tento nástroj je vhodný zejména pro výzkumníky a vývojáře, kteří chtějí systematicky hodnotit FAIR vlastnosti svých datových zdrojů.\n\nOpenAIRE Validator⁷⁷ - vytvořen v rámci projektu OpenAIRE. Hodnotí naplňování FAIR principů v rámci jednotlivých repozitářů. Vyhodnocuje nastavení metadatových standardů podle doporučení Research Data Alliance (RDA). Na rozdíl od F-UJI a FAIR-Checker se zaměřuje na hodnocení celého repozitáře, jeho politiku a strukturu, nikoli na hodnocení jednotlivých datových záznamů. Výstupem je report o souladu repozitáře s FAIR principy a doporučení ke zlepšení metadatových standardů v repozitáři. Tento nástroj je užitečný především pro správce repozitářů, kteří chtějí vylepšit FAIR kompatibilitu své infrastruktury.\n\nDalší relevantní nástroje:\n\n- FAIR Assist⁷⁸: Portál s užitečnými nástroji a průvodci pro FAIR hodnocení.\n- FAIR Implementation Framework⁷⁹: Rámec pro implementaci FAIR principů v různých kontextech vytvořený v projektu FAIR-Impact.\n- FC4E-CAT-UI⁸⁰: FAIR Compliance Assessment Toolkit – Nástroj pro podrobné hodnocení FAIR compliance organizací a jejich datových sad vytvořený v projektu FAIR-CORE4EOSC."
guidanceLanguage = "cs"

[[clause]]
id = "A.K6"
source = "analyza-fair-1.2"
locator = "kap. 6"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Výsledky hodnocení jsou měkká zpětná vazba; malá změna může skóre výrazně změnit.", en = "Assessment results are soft feedback; a small change can move the score a lot." }
guidance = "Důležitou součástí podpory FAIR dat jsou také nástroje pro hodnocení jejich FAIRness, jako jsou automatizované testovací systémy nebo sebehodnotící modely. Tyto nástroje umožňují správcům repozitářů a uživatelům získat základní vodítka k posouzení toho, do jaké míry data odpovídají FAIR principům, a identifikovat oblasti pro zlepšení. Navzdory svým limitům jsou tyto nástroje cenné pro získání zpětné vazby. Je však klíčové, aby jejich výsledky nesloužily jako jediné kritérium kvality datové sady. Automatizované hodnocení totiž primárně odráží technické nastavení repozitáře – za které zodpovídá jeho správce – a nemůže postihnout specifický kontext dat. Kromě toho mnohdy i malá úprava může vést k významně odlišnému hodnocení, proto je s výsledky třeba nakládat nanejvýš obezřetně, jako s měkkým nástrojem pro zajištění zpětné vazby."
guidanceLanguage = "cs"

[[clause]]
id = "A.P1"
source = "analyza-fair-1.2"
locator = "příloha 1"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Případové studie F-UJI: ASEP (rozdíl mezi DOI a Handle), LINDAT (chybějící identifikátor dat), ČSDA (úprava Dataverse).", en = "F-UJI case studies: ASEP (DOI versus Handle), LINDAT (missing data identifier), ČSDA (Dataverse adjustment)." }
guidance = "Repozitář ASEP\n\nNa landing page chybí metadata o souvisejících zdrojích a verzích datové sady – hodnocení se liší podle použití handle nebo DOI: datové záznamy s uloženou datovou sadou v ASEP mají přidělen handle a DOI, datové záznamy s odkazem na datovou sadu v jiném repozitáři mají přidělen handle. Rozdíl je patrný při zadání handle – hodnocení má výrazně nižší skóre. Rozdíl je způsoben tím, že na landing page chybí údaje v metadatech. Pokud nástroj hodnotí podle DOI, dohledává metadata v DataCite. Údaj o verzi daové sady chybí v metadatech na landing page i v DataCite.\n\nLINDAT/CLARIAH-CZ\n\nMetadata neobsahují identifikátor dat, na která odkazují. Jelikož nástroj nenalezl identifikátor samotných dat, tak celá řada dalších testů vychází neúspěšně, a celkový bodový výsledek hodnocení je nízký. To ovšem neznamená, že požadované údaje nejsou k dispozici, pouze to, že je nástroj nebyl schopen nalézt.\n\nČeský sociálněvědní datový archiv (ČSDA)\n\n- Chybí URI jmenného prostoru (namespace) slovníku. ČSDA používá standardní kontrolované slovníky, zde může být chyba v metadatovém popisu.\n- Chybí strojově čitelné licence pro datové sady, tato poznámka je validní, ČSDA používá vlastní licence/podmínky použití dat.\n- Předchozí verze sytému Dataverse vykazovala při stejném záznamu nižší FAIR skóre. Systém Dataverse byl přímo upraven v reakci na způsob automatického testování nástroje F-UJI."
guidanceLanguage = "cs"

