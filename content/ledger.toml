guidanceLanguage = "cs"

[[clause]]
id = "A.R1.1.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.1, Požadavky na repozitáře"
principles = ["R1.1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář nabízí výběr z doporučených licencí; licence je u každé datové sady a validuje se její přítomnost a strojová čitelnost (minimálně URI).", en = "The repository offers a choice of recommended licences; every dataset has a licence, and its presence and machine readability (at least a URI) are validated." }
guidance = "Repozitáře by měly umožňovat výběr z doporučených licencí, zajistit, aby u každé datové sady byla licence uvedena, a validovat její přítomnost a strojově čitelný formát (minimálně jako URI)."
guidanceLanguage = "cs"

[[clause]]
