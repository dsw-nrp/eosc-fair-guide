[[clause]]
id = "ETHICAL-SEVEN.01"
source = "ethical-seven"
principles = ["A1.2"]
actor = "other"
kind = "statement"
text = { cs = "Etické sedmero shrnuje etické zásady práce s výzkumnými daty: důvěryhodnost, transparentnost, odpovědnost, udržitelnost a ochranu účastníků výzkumu.", en = "The Ethical Seven summarises ethical principles for working with research data: trustworthiness, transparency, accountability, sustainability and the protection of research participants." }
locator = "Úvod; PDF p. 2"
guidanceLanguage = "cs"
guidance = "Práce s výzkumnými daty vyžaduje odpovědný přístup k celému jejich životnímu cyklu – od vzniku, přes zpracování a analýzu, jejich archivaci, případné sdílení a opakované využití. Základní etická pravidla práce s výzkumnými daty se vztahují k důvěryhodnosti, transparentnosti, odpovědnosti, dlouhodobé udržitelnosti a v neposlední řadě k ochraně zájmů účastníků výzkumu. Níže uvedené etické aspekty navazují na FAIR principy (Findable, Accessible, Interoperable, Reusable) nakládání s výzkumnými daty a doplňují je o některé zásady vědecké integrity a otevřené vědy s cílem umožnit jejich dlouhodobé využití a budoucí přínos."


