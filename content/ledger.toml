locator = "kap. 3, R1.2, Požadavky na repozitáře"
principles = ["R1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář uchovává verze dat i metadat.", en = "The repository keeps versions of data and metadata." }
guidance = "Podpora nástrojů pro sledování verzí: Umožnit uchovávání různých verzí datové sady a metadat, aby bylo možné dohledat jejich historii."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Požadavky na FIP"
principles = ["R1.2"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje minimální rozsah provenience v oboru.", en = "The FIP sets the minimum provenance for the domain." }
guidance = "Definování minimálního rozsahu provenienčních informací: Každý FIP by měl specifikovat, jaké informace o provenienci jsou pro daný obor povinné a doporučené."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Požadavky na FIP"
principles = ["R1.2"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje standardy provenience (PROV-O, DataCite).", en = "The FIP sets provenance standards (PROV-O, DataCite)." }
guidance = "Doporučené standardy pro popis provenience: FIP by měl obsahovat doporučení pro využití existujících standardů, jako jsou PROV-O nebo DataCite Metadata Schema."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Naplnění v NRP, s. 41"
principles = ["R1.2"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "V současnosti se uvádí ORCID tvůrců, textový popis metodiky a PID zdrojových dat; výhledově PROV-O.", en = "Currently, creators' ORCIDs, a textual description of the methodology and PIDs of source data are given; PROV-O is foreseen." }
status = "refresh"
note = { cs = "CCMM 2.0.0 část toho posouvá dál (provenienční aktivita).", en = "CCMM 2.0.0 takes part of this further (provenance activity)." }
noteSources = ["CCMM-RELEASES.01"]
guidance = "Implementace podrobného sledování provenience je strategickým cílem. V současné fázi se implementace zaměřuje na zajištění základních provenienčních informací v metadatech:\n\n- Jednoznačná identifikace tvůrců a přispěvatelů (pomocí ORCID).\n- Popis klíčových kroků zpracování dat (formou textového popisu metodologie).\n- Propojení na zdrojová data, pokud je to relevantní (pomocí PID).\n\nDo budoucna se počítá s podporou strukturované, strojově čitelné provenience s využitím standardizovaných sémantických modelů, jako je W3C PROV Ontology (PROV-O). Konkrétní požadavky budou definovány v návaznosti na výstupy klíčových aktivit zaměřených na automatizaci sběru dat a ověřování souladu s definovanými pravidly a standardy (compliance)."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Doporučení CDIF / Požadavky CTS"
principles = ["R1.2"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R07|R7]] a [[clause:CTS.R13|R14]]; CDIF [[clause:CDIF.DataStructure|Data Integration]] (DDI-CDI).", en = "CoreTrustSeal [[clause:CTS.R07|R7]] and [[clause:CTS.R13|R14]]; CDIF [[clause:CDIF.DataStructure|Data Integration]] (DDI-CDI)." }
status = "refresh"
note = { cs = "Viz CDIF 1.1.", en = "See CDIF 1.1." }
noteSources = ["CDIF.01"]
guidance = "Data Integration profil se zaměřuje na propojení dat s jejich původem a transformacemi pomocí DDI-CDI. Tento přístup umožňuje sledovat historii datových sad a zajistit jejich důvěryhodnost a reprodukovatelnost.\n\nTento princip úzce souvisí s požadavky CoreTrustSeal R7 (Integrita a autenticita dat) a R14 (Podpora opětovného použití dat). R7 vyžaduje, aby repozitáře zajišťovaly integritu a autenticitu dat, což zahrnuje i uchování informací o provenienci. R14 požaduje, aby repozitáře zajistily, že metadata budou dostatečně podrobná, aby umožnila opakované použití dat. Důležitou součástí tohoto požadavku je zachování informací o provenienci, včetně citací a odkazů na zdroje dat. FAIR R1.2 a CoreTrustSeal R7, R14 jsou tedy úzce propojené, protože shodně požadují uchování provenienčních informací pro zvýšení důvěryhodnosti a opětovné využitelnosti dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Požadavky na NRP"
principles = ["R1.3"]
actor = "nrp"
kind = "requirement"
text = { cs = "Repozitáře podporují oborové standardy, zejména na základě FIP.", en = "Repositories support domain standards, especially on the basis of FIPs." }
guidance = "Podpora komunitních standardů: Zajistit, aby repozitáře podporovaly metadatové a datové standardy odpovídající jednotlivým vědním oborům, především na základě FIP profilů."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.3, Požadavky na NRP"
principles = ["R1.3"]
actor = "nrp"
kind = "requirement"
text = { cs = "NRP nabízí mechanismy (částečně automatického) sebehodnocení a validace vůči komunitním standardům (FAIR-Checker, F-UJI).", en = "NRP offers mechanisms for (partly automated) self-assessment and validation against community standards (FAIR-Checker, F-UJI)." }
status = "refresh"
note = { cs = "Pro automatizované hodnocení průvodce doporučuje FAIR Champion.", en = "For automated assessment, the guide recommends FAIR Champion." }
noteSources = ["FAIR-CHAMPION.01"]
guidance = "Validace standardů: Zavést mechanismy pro podporu (částečně automatického sebehodnocení a validaci metadat vůči komunitním standardům (např. pomocí FAIR-Checker⁵⁴ , F-UJI⁵⁵)."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.3.N3"
source = "analyza-fair-1.2"
