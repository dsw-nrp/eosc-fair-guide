note = { cs = "V CDIF 1.1 odpovídají profily Data Description a Data Structure.", en = "In CDIF 1.1, the Data Description and Data Structure profiles correspond." }
noteSources = ["CDIF.01"]
guidance = "Příklad vztahů mezi metadaty ve schématu DataCite:\n\n- isDerivedFrom – označuje datovou sadu, ze kterého jsou data odvozena.\n- isCitedBy – odkazuje na publikaci, která datovou sadu cituje.\n- hasPart / isPartOf – propojuje datové sady, které jsou součástí většího celku.\n- affiliation – propojuje datovou sadu s organizací prostřednictvím ROR identifikátoru.\n- creator – propojuje datovou sadu s autorem prostřednictvím ORCID identifikátoru.\n\nData Integration profil doporučuje využití DDI-CDI⁴⁶ pro popis vztahů mezi logickou strukturou dat a jejich fyzickou reprezentací. To umožňuje jasně definovat vztahy mezi různými datovými sadami a zajistit, že uživatelé mohou data správně interpretovat a propojit s jinými relevantními zdroji.\n\nTento princip souvisí s požadavkem CoreTrustSeal R14 (Podpora opětovného použití dat) a s požadavkem R11 (Zajištění kvality dat). R11 vyžaduje, aby koncoví uživatelé měli k dispozici dostatek informací pro hodnocení kvality. R14 se soustředí na opakované použití dat v průběhu času a zajištění toho, aby byla k dispozici vhodná metadata, která podporují porozumění a používání dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Požadavky na NRP"
principles = ["R1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Minimální schéma obsahuje klíčové atributy pro opakované použití.", en = "The minimum schema contains the key attributes for reuse." }
guidance = "Zajistit, aby minimální metadatové schéma obsahovalo všechny klíčové atributy potřebné pro opakované použití dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.R1"
