text = { cs = "Školení EOSC CZ vysvětluje laboratorní a terénní deníky a jejich vztah k poznámkovým nástrojům a repozitářům.", en = "EOSC CZ training explains laboratory and field notebooks and their relationship to note-taking tools and repositories." }

[[clause]]
id = "LONDON.4.6"
source = "london-charter"
locator = "Documentation, principle 4.6"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Dokumentujte rozhodnutí, důvody a nejistotu interpretace; Londýnská charta tuto praxi rozvíjí pro vizualizaci kulturního dědictví.", en = "Document decisions, reasoning and interpretation uncertainty; the London Charter develops this practice for cultural heritage visualisation." }

[[clause]]
id = "FDO-INTRO.01"
source = "fdo-overview"
locator = "What is an FDO?"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "FDO spojuje trvalý identifikátor, typ a profil s definovanými atributy a strojově použitelnými vazbami. Samotný DOI nebo balíček RO-Crate soulad neprokazuje.", en = "An FDO connects a persistent identifier, type and profile with defined attributes and machine-actionable links. A DOI or RO-Crate alone does not establish conformance." }

[[clause]]
id = "FRSM.FRSM-01"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-01"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Software má celosvětově jednoznačný a trvalý identifikátor.", en = "The software has a globally unique, persistent identifier." }
guidance = "A software object may be assigned with a globally unique identifier such that it can be referenced unambiguously by humans or machines. Globally unique means an identifier should be associated with only one resource at any time. Examples of unique identifiers of data used for software include: Digital Object Identifier (DOI), the Handle System, Uniform Resource Identifier (URI) such as URL and URN, and Software Heritage Identifiers (SWHID). A data repository may assign a globally unique identifier to your data or metadata when you publish and make it available through its curation service.\n\nThe type of identifier assigned will often depend on the type of repository that the software is deposited in, for example a URL for GitHub, DOI for Zenodo, or SWHID for Software Heritage. Note that URLs are not guaranteed to be persistent and by default GitHub only provides permalinks by request. It is not practical to directly test the global uniqueness or persistence of any individual identifier, therefore this metric proposes testing for an identifier scheme that provides guarantees of persistence.\n\nThe suitability of an identifier scheme may depend on the domain. If software metadata is available as a separate record, this should be FAIR (see FRSM-08)."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-02"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-02"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Pokud software tvoří více odlišných komponent, mají vlastní identifikátory a vztahy mezi nimi jsou zachyceny v metadatech identifikátorů.", en = "If the software consists of distinct components, they have their own identifiers and their relationships are represented in identifier metadata." }
guidance = "Conceptually, it is useful for identifiers to be assigned at a more granular level than just the software project (often synonymous with the “software concept” or “software project”). For instance a software product may consist of different modules, which in turn may be implemented by different files. This metric tests that these different components are not all assigned the same identifier, and that the relationship between components is embodied in the identifier metadata.\n\nThe granularity levels for software have been defined by the RDA Software Source Code Identifiers WG in Gruenpeter et al. (2021). Identifiers for each software component should be globally unique and persistent (as tested by FRSM-01).\n\nThis metric should not be confused with FRSM-10 and FRSM-12 (related to I2) which checks that other related non-software objects are properly described and FRSM-13 (related to R2) which checks that software dependencies which are not considered a part of the software concept of product are described."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-03"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-03"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Každá verze softwaru má vlastní identifikátor, odlišný od jiných verzí.", en = "Each version of the software has its own identifier, distinct from other versions." }
guidance = "To make different versions of the same software (or component) findable, each version needs to be assigned a different identifier. The relationship between versions is embodied in the associated metadata.\n\nWhat is considered a “version” is defined by the owner of the software: in many cases this will be something that the owner wants to specifically identify and use and/or “release” or “publish” so that others can use and reference/cite. This is something for which there may be disciplinary norms, which may be documented in domain-specific software guidelines e.g. ESIP Software Guidelines in the earth sciences and CESSDA Software Development Guidelines in the social sciences.\n\nIdentifiers for each software version should be globally unique and persistent (as tested by FRSM-01) and use the same identifier scheme. It may be useful to reference these identifiers in any release documentation or CHANGELOG."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-04"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-04"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Metadata uvádějí název softwaru a vysvětlují, co dělá a k čemu slouží.", en = "Metadata give the software title and explain what it does and its purpose." }
guidance = "Software requires descriptive metadata to support indexing, search and discoverability.\n\nThere are several common places for descriptive metadata to be found, including intrinsic metadata that is part of the software source code such as README files, requirements files that describe dependencies, POM, CodeMeta or CFF files, or in the extrinsic metadata available through resolving the software identifier. It may also be directly embedded in software source code files. The implementation of this metric will depend on the coding standards for the programming language as well as community norms for which descriptive metadata is used. It is hard to check the relevance / correctness of unstructured metadata such as a text description, but it is possible to automatically check for existence."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-05"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-05"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Metadata popisují stav vývoje softwaru a uvádějí kontakt nebo podporu.", en = "Metadata describe the software’s development status and give contact or support information." }
guidance = "Software requires descriptive metadata to support indexing, search and discoverability\n\nThere are many forms of guidance and community standards for structuring development metadata, such as RepoStatus, Software Release Practice HOWTO, Make a README, and AboutCode. It is still difficult to check all descriptive metadata around development and status as it is often provided in an unstructured form; machine-readable semantic metadata schema are available but not widely used for this purpose (e.g. RepoStatus, Semantic Versioning) or language specific (e.g. Trove Classifiers)."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-06"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-06"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Metadata uvádějí přispěvatele softwaru a jejich role.", en = "Metadata name the software contributors and their roles." }
guidance = "Software should make it easy to recognise and credit all contributors.\n\nThere are several common places for contributor metadata to be found, including README files, CodeMeta or CFF files, in the code repository metadata, or in the software identifier metadata. It may also be directly embedded in software source code files. Criteria for which roles are included is normally defined by the community."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-07"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-07"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Metadata obsahují identifikátor právě toho softwaru, který popisují.", en = "Metadata include the identifier of the software they describe." }
guidance = "Software should include its identifier to make it easier to be cited and indexed\n\nThere are several common places for identifier metadata to be found, including README files, CodeMeta or CFF files. The choice of location may depend on community standards."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-08"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-08"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Software má veřejně a otevřeně přístupný trvalý záznam metadat, který zůstane dostupný i bez softwaru.", en = "The software has a public, openly accessible, persistent metadata record that remains available even without the software." }
guidance = "Even if the software itself is no longer usable or accessible, its metadata should still be available and accessible.\n\nPotential locations for persistent metadata records include scholarly repositories (e.g. Zenodo, HAL, OSF), registries or catalogues (e.g. ASCL, bio.tools, swMath), open scholarly infrastructure (e.g. Wikidata, DataCite, IPOL, eLife). The choice of location is dependent on community standards."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-09"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-09"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Software se vyvíjí v repozitáři zdrojového kódu, který je dostupný standardním komunikačním protokolem.", en = "The software is developed in a source-code repository accessible through a standard communications protocol." }
guidance = "Software source code repositories / forges (a.k.a. version control platforms) should use standard communications protocols (such as https / sftp) to enable the widest possible set of contributors.\n\nFrameworks such as the Internet Protocol suite and Open Systems Interconnection model define different abstraction layers for networked communication. Several bodies, such as the IETF and ISO define standardised communications protocols utilised at each layer. In general, most widely used code repositories / forges use common standardised communications protocols such as https or sftp. In normal use, this test will be implemented by checking that the repository / forge can be accessed using one of these protocols.\n\nUsing a software forge that is properly indexed by search engines will help with other aspects of findability."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-10"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-10"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Formáty dat, která software čte nebo vytváří, jsou popsané, otevřené a mají odkaz na specifikaci.", en = "Formats of data consumed or produced by the software are described, open and reference their specifications." }
guidance = "The use of open file formats for data improves the reusability and understandability of the software.\n\nThis metric is inherently difficult to implement as at present there is no standardised or common method for describing the data / file formats used by a piece of software in a machine-readable way. Community standards commonly define the data formats in use in a discipline, and resources such as FAIRsharing.org provide a curated catalogues of standards."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-11"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-11"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Pokud software implementuje API, jsou tato rozhraní zdokumentovaná, otevřená a mají strojově čitelný popis.", en = "If the software implements APIs, those interfaces are documented, open and have machine-readable definitions." }
guidance = "An open Application Programming Interface can be freely accessed by other software or developers, which makes it easier to integrate software and encourages modularity and reuse.\n\nOnly applicable if APIs are implemented.\n\nThe OpenAPI specification is a machine-readable interface definition language for describing, producing, consuming and visualising web services. Additionally, the SmartAPI project has developed a openAPI-based specification for defining the key API metadata elements and value sets, to maximise the FAIRness of web-based APIs.\n\nThis could be extended to test that the API is callable and does not return an error code."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-12"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-12"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Metadata softwaru obsahují strojově čitelné odkazy na další objekty, které podporují jeho použití.", en = "Software metadata include machine-readable references to other objects that support its use." }
guidance = "Determining the usefulness of a piece of software is often aided by understanding what it is used with.\n\nThis metric is currently difficult to implement as there is no standard machine-readable way to define the relationships at a level of detail that provides suitable meaning, although CodeMeta defines some of these relationships (e.g. supportingData, referencePublication)."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-13"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-13"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Informace o závislostech, sestavení a nastavení potřebných k použití softwaru jsou strojově zpracovatelné; k dispozici je návod k sestavení, instalaci nebo spuštění.", en = "Information about dependencies, build and configuration needed to use the software is machine-actionable; build, installation or execution instructions are available." }
guidance = "Software is made more reusable by providing suitable machine-actionable information on dependencies, build and configuration.\n\nMost programming languages provide standardised ways of providing dependency information in a machine-actionable format. Build and package management systems can be used to automate the installation process. It is hard to check the relevance / correctness of this information, but it is possible to automatically check for existence and error-free build.\n\nDetailed documentation also aids the reusability of software but it is difficult to automatically test for documentation coverage."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-14"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-14"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Software má testy a potřebná testovací data, které dokládají, že funguje podle očekávání.", en = "The software provides tests and necessary test data demonstrating that it works as expected." }
guidance = "The provision of test cases improves confidence in the software.\n\nMost programming languages have commonly associated test frameworks. The specific definition of what constitutes adequate testing is often defined by community norms. It is hard to check the relevance / correctness of this information, but it is possible to automatically check for existence."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-15"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-15"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Zdrojový kód obsahuje licenční informace pro software i všechny přibalené externí softwarové součásti.", en = "The source code includes licensing information for the software and all bundled external software components." }
guidance = "Clear software licensing enables reuse.\n\nEach community may have different licences that are popular.\n\nIt is important that software licences are included with the source code as many tools and processes look for licensing information there to determine licence compatibility.\n\nThe SPDX License List is a widely used part of the Software Project Data eXchange (SPDX) open standard. Information about the licence for a piece of software can be provided either as a file in the source code repository, or as a short identifier embedded in the source code files."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-16"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-16"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Veřejný záznam metadat uvádí licenční a autorskoprávní informace k softwaru.", en = "The public metadata record includes licensing and copyright information for the software." }
guidance = "It is important for licensing information to be on the publicly searchable and accessible metadata record\n\nThis can be defined in different ways, e.g. the “Rights” field in the DOI metadata."
guidanceLanguage = "en"

[[clause]]
id = "FRSM.FRSM-17"
source = "frsm-report-1.1"
locator = "D5.2 report 1.1, section 2; metric set 1.0, FRSM-17"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Software obsahuje informace o původu a průběhu svého vývoje.", en = "The software includes provenance information describing its origins and development." }
guidance = "Good provenance metadata clarifies the origins and intent behind the development of the software, and establishes authenticity and trust. As a type of metadata this overlaps with the metadata called for in guiding principles F2 and F4.\n\nIt is hard to check the relevance / correctness of this information, but it is possible to automatically check for existence.\n\nIt may also be necessary to record information about the way that the software has been developed, such as the development environment used. The methodology for building the software is tested in FRSM-13."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDOR-GR1"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDOR-GR1"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Každý posuzovaný FDO má jeden nebo více celosvětově jednoznačných, trvalých a resolvovatelných identifikátorů (PID).", en = "Each assessed FDO has one or more globally unique, persistent and resolvable identifiers (PIDs)." }
guidance = "FDOR-GR1: A PID, standing for a globally unique, persistent and resolvable identifier, is assumed to be the basis for FAIR Digital Objects. Every FDO is assigned one or more PIDs."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDOR-GR2"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDOR-GR2"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "PID vede na strukturovaný záznam podle určeného profilu PID, který umožňuje programu dohledat FDO a jeho prvky.", en = "The PID resolves to a structured record conforming to a specified PID profile, enabling a program to locate the FDO and its elements." }
guidance = "FDOR-GR2: A PID resolves to a structured record (PID Record) compliant with a specified PID Profile which leads to resolution results that enable programmatic resolution from PID back to the FDO and its elements as specified by these requirements. PID Records represent the information characterising FDOs and together with their resolving PIDs they can themselves be FDOs."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDOR-GR3"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDOR-GR3"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Obsahuje-li FDO strukturovanou posloupnost bitů, záznam PID odkazuje na místo jejího zpřístupnění a na definici typu FDO.", en = "If the FDO contains a structured bit-sequence, its PID record references the content’s access location and the FDO type definition." }
guidance = "FDOR-GR3: If an FDO contains a structured bit-sequence, the structured PID record includes at least a reference to the location(s) where the bit-sequence encoding the content of a FAIR-DO (FDO) can be accessed as well as the type definition of the FDO. The structured record may also contain PIDs pointing to Metadata FDOs describing properties of the target FDO.\n\nNote that ‘location’ here means the network access point providing FDO access, not necessarily the network storage location of the underlying bits."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR4"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR4"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Záznam PID obsahuje povinné atributy FDO; profil PID nebo definice atributu v registru určuje, které hodnoty jsou vložené a které odkazované.", en = "The PID record contains mandatory FDO attributes; the PID profile or registry attribute definition specifies which values are embedded and which are referenced." }
guidance = "FDO-GR4: The PID record needs to contain mandatory FDO attributes, may contain optional FDO attributes and attributes agreed upon by recognized communities. Values of attributes can be part of the PID record or they can be references. Expectations of which attribute values are contained within the PID record and which are references pointing from the record to external sources should be specified in the PID profile or definition of said attribute in a Data Type Registry."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR5"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR5"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "K FDO lze přistoupit nebo nad ním provést operaci protokolem rozhraní, který přijímá PID registrované podporované operace.", en = "An interface protocol allows access to or operation on the FDO by specifying the PID of a registered supported operation." }
guidance = "FDO-GR5: Each FDO identified by a PID can be accessed or operated on using an interface protocol by specifying the PID of a registered supported operation."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR6"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR6"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Základní rozhraní FDO nabízí standardní operace vytvoření, čtení, změny a smazání (CRUD) a možnost využít rozšířené či oborové operace.", en = "The basic FDO interface offers standard create, read, update and delete (CRUD) operations and a way to use extended or domain operations." }
guidance = "FDO-GR6: Any basic FDO interface protocol offers standard Create, Read, Update, Delete (CRUD) operations on FDOs and a possibility to use extended/domain operations for specific FDO applications. The addition of an operation to list available extended/domain operation for specific FDO types is strongly recommended."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR7"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR7"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Vztahy mezi typy FDO a podporovanými operacemi jsou udržovány v samostatných registrech.", en = "Relationships between FDO types and supported operations are maintained in separate registries." }
guidance = "FDO-GR7: The relations between FDO Types and supported operations are maintained in separate registries."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR8"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR8"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Jsou-li metadata sama FDO, jejich registrované schéma odkazuje na definované a registrované metadatové kategorie.", en = "If metadata are themselves FDOs, their registered schema refers to defined and registered metadata categories." }
guidance = "FDO-GR8: Metadata can themselves be FDOs which describe the properties of the referenced FDO. They must be specified by a registered schema that refers to defined and registered metadata categories."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR9"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR9"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Metadata mohou mít různé druhy, například popisná, oborová, provenienční nebo metadata o přístupových právech.", en = "Metadata may be of different kinds, such as descriptive, domain-specific, provenance or access-permission metadata." }
guidance = "FDO-GR9: Metadata can be of different types such as descriptive, domain specific, provenance, system, access permissions, transactions, etc."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR10"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR10"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Komunita spravuje metadatová schémata jako FDO; doporučení očekává, že i tato schémata naplňují principy FAIR.", en = "The community maintains metadata schemas as FDOs; the recommendation expects these schemas themselves to follow the FAIR principles." }
guidance = "FDO-GR10: Metadata schemas are maintained by communities of practice and are FDOs. Such metadata schemas should therefore themselves follow FAIR principles."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR11"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR11"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Kolekce FDO je sama FDO a její obsah popisuje skladbu a vztahy členů dohodnutým formálním jazykem.", en = "An FDO collection is itself an FDO, and its content describes its construction and member relationships using an agreed formal language." }
guidance = "FDO-GR11: A collection of FDOs is also an FDO. The content of collection FDOs describes its construction using an agreed formal language which specifies the relationships of the constituent members. An FDO may be a member of several collections."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR12"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR12"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Po smazání FDO zůstává jeho PID a standardizované, strojově interpretovatelné záznamy o smazání v metadatech i záznamu PID.", en = "After an FDO is deleted, its PID remains, with standardised, machine-interpretable tombstone notes in both metadata and PID records." }
guidance = "FDO-GR12: Deletion of an FDO must lead to standardised and thus machine interpretable tombstone notes in metadata and PID records. The PID itself is not deleted."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR13"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR13"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výsledek resoluce PID a informace vrstvy FDO jsou strojově interpretovatelné a náležejí k typu, jehož operace jsou popsány symbolickou gramatikou.", en = "PID resolution results and FDO-layer information are machine-interpretable and belong to a type whose operations are specified in symbolic grammar." }
guidance = "FDO-GR13: The PID resolution and the FDO Layer information must be “machine actionable” i.e., are machine interpretable and belong to a type for which operations have been specified in symbolic grammar."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR14"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR14"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Zvolená konfigurace FDO je v souladu se specifikacemi FDO; přípustné jsou různé konfigurace.", en = "The selected FDO configuration conforms to the FDO specifications; different configurations are permitted." }
guidance = "FDO-GR14: FDOs can be configured in different ways as long as the configurations are compliant with the FDO Specifications."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-GR15"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-GR15"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Komunita určuje podrobnost samostatně identifikovaných FDO podle užitečnosti v daném oboru.", en = "The community determines the granularity of independently identified FDOs according to usefulness in its field." }
guidance = "FDO-GR15: The granularity of FDOs is dependent on pragmatic utility decisions within the communities of practice Those communities define the level of useful entities to use in the corresponding application field."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-PIDR1"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-PIDR1"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Protokoly pro resoluci PID na užitečné informace jsou standardizované, volně přístupné a veřejně použitelné.", en = "Protocols resolving a PID to useful information are standardised, freely accessible and publicly usable." }
guidance = "FDO-PIDR1: In accordance with the FAIR principles the protocols to resolve a PID into useful information need to be standardised, freely accessible, and publicly usable."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-PIDR2"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-PIDR2"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Resoluce PID poskytuje předvídatelný výsledek určený strojově zpracovatelným profilem FDO.", en = "PID resolution yields predictable results specified by a machine-actionable FDO profile." }
guidance = "FDO-PIDR2: The resolution of a PID needs to lead to predictable results which are specified by a machine actionable FDO profile."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-PIDR3"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-PIDR3"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "PID vede na páry atribut–hodnota podle profilu FDO; všechny atributy mají definice v otevřených registrech odpovídajících standardům FDO nebo komunity.", en = "The PID resolves to attribute–value pairs defined by the FDO profile; all attributes have definitions in open registries conforming to FDO or community standards." }
guidance = "FDO-PIDR3: The PID is resolved to a set of key attribute-value pairs defined by the FDO profile. The profile needs to be machine actionable, i.e., all attributes need to be defined and registered in open registries which are compliant with the overall FDO or community-specific standards."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-PIDR4"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-PIDR4"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Používaný systém PID je globální, robustní a škálovatelný a dokládá trvalost identifikátorů.", en = "The PID system in use is global, robust and scalable and demonstrates persistence." }
guidance = "FDO-PIDR4: The PID system which is used for the identification of FDOs must be global, robust, scalable, and demonstrate persistence."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-PIDR5"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-PIDR5"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Systém PID poskytuje vysokou úroveň zabezpečení; jen vlastník PID nebo jeho pověřený zástupce může měnit záznam, určit přístup k jeho hodnotám a požádat o šifrování.", en = "The PID system provides high security; only the PID owner or owner-delegated agent may change the record, define access to its values and request encryption." }
guidance = "FDO-PIDR5: The PID System which is used for the identification of FDOs must support high security capabilities. The owner, or owner-delegated agent, of a PID and its associated attribute-value pairs is the only actor allowed to make changes, to define accessibility to attribute-value pair information, and to request encryption of information."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-PIDR6"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-PIDR6"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Správa systému PID je zabezpečena infrastrukturou veřejných klíčů a v případě potřeby umožňuje použití standardizovaných certifikátů.", en = "PID-system management is secured by public-key infrastructure and supports standardised certificates where necessary." }
guidance = "FDO-PIDR6: Management access to the PID system needs to be secured by a public key infrastructure and if necessary the use of standardised certificates must be possible."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR1"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR1"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Obsah každého záznamu FDO odpovídá profilu FDO a jeho schématu registrovanému v uznávaném registru.", en = "Each FDO record’s content conforms to an FDO profile and its schema registered in a recognised registry." }
guidance = "FDO-FDOR1: The content of each FDO record must be structured according to an FDO profile in accordance with an FDO defined schema registered in a recognized registry."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR2"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR2"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Záznam FDO tvoří páry atribut–hodnota podle profilu; všechny použité atributy jsou definované a registrované podle schématu specifikace typů.", en = "The FDO record consists of profile-defined attribute–value pairs; every attribute in use is defined and registered according to the type specification schema." }
guidance = "FDO-FDOR2: The FDO record consists of a set of attribute-value pairs as defined by the FDO Profile and all used attributes need to be defined and registered according to the type specification schema."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR3"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR3"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Záznam FDO obsahuje všechny povinné základní atributy profilu, včetně typu FDO.", en = "The FDO record contains all mandatory profile kernel attributes, including the FDO type." }
guidance = "FDO-FDOR3: Each FDO record needs to contain the mandatory kernel attributes, as defined by the FDO profile, including the type of the FDO."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR4"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR4"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Pokud záznam používá volitelné základní nebo další komunitní atributy, vychází z definic FDO Forum nebo registrovaných komunitních definic a zaručuje jejich strojové zpracování.", en = "If the record uses optional kernel or additional community attributes, it follows FDO Forum definitions or registered community definitions and guarantees machine actionability." }
guidance = "FDO-FDOR4: FDO records can include a) optional kernel attributes which are defined by the FDO Forum or b) can include other community defined and registered attributes if machine actionability is guaranteed."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR5"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR5"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Pokud FDO zahrnuje bitové sekvence kódující jeho obsah, jeho atributy obsahují odkazy na tento obsah a bohatý metadatový popis.", en = "If the FDO includes bit-sequences encoding its content, its attributes contain references to the content and a rich metadata description." }
guidance = "FDO-FDOR5: In the canonical case that an FDO includes bit-sequences encoding FDO content, the attribute-value set must contain the reference to these bit-sequences and a rich metadata description as requested by the FAIR principles."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR6"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR6"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Každý FDO má typ FDO, který umožňuje automatickou validaci a zpracování.", en = "Each FDO has an FDO type facilitating automated validation and processing." }
guidance = "FDO-FDOR6: Every FDO must have an FDO Type, facilitating automated machine validation and processing of the FDO."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR7"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR7"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Každá zahrnutá posloupnost bitů, ať jde o data, metadata, software či jiný obsah, má typ uvedený párem typ–hodnota.", en = "Each included bit-sequence, whether data, metadata, software or other content, is typed using a type–value pair." }
guidance = "FDO-FDOR7: An FDO may have included any sort of bit-sequences (data, metadata, software, semantic assertions, etc.) but each must be typed using a type-value pair in compliance with the FAIR principles."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDOR8"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDOR8"
principles = []
actor = "other"
kind = "statement"
text = { cs = "FDO může používat existující typ, typ odvozený z existujícího nebo zcela nově definovaný typ.", en = "An FDO may use an existing type, a type derived from an existing one or a completely newly defined type." }
guidance = "FDO-FDOR8: FDOs can use any existing types or define new types, either completely new or derived from existing types."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDO9"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDO9"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Definice typu FDO používá dohodnutý syntaktický popis a sama je FDO v souladu s FAIR.", en = "The FDO type definition uses an agreed syntactic description and is itself a FAIR-compliant FDO." }
guidance = "FDO-FDO9: The type of an FDO is specified using an agreed upon syntactic description that may be structured and dependent on components that are themselves FDOs. This syntactic description is called FDO Type definition in the following and is an FDO itself and thus FAIR compliant."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDO10"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDO10"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Typ má PID, který vede na FDO obsahující jeho definici.", en = "The type has a PID resolving to the FDO containing its definition." }
guidance = "FDO-FDO10: Every FDO Type and type is associated with a PID which resolves to the FDO that includes the type definition. So it is of type FDO type definition."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-FDO11"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-FDO11"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Rámec typů FDO stanovuje metody pro definování typů a jejich přiřazování k FDO.", en = "The FDO Type Framework specifies methods for defining types and attaching them to FDOs." }
guidance = "FDO-FDO11: The FDO Type Framework specifies methods for defining types for and attaching types to FDOs"
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-RESR1"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-RESR1"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Všechny zdroje, na které FDO odkazuje, naplňují příslušné principy FAIR.", en = "All resources referenced by the FDO follow the applicable FAIR principles." }
guidance = "FDO-RESR1: All resources referenced by FDOs must be FAIR compliant."
guidanceLanguage = "en"

[[clause]]
id = "FDO.FDO-RESR2"
source = "fdo-specification"
locator = "Proposed Recommendation 3.0, FDO-RESR2"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Poskytovatelé zdrojů a služeb dokládají důvěryhodnost pravidelným posuzováním kvality postupů podle standardů, například CoreTrustSeal.", en = "Resource and service providers demonstrate trustworthiness by regularly assessing procedural quality against standards such as CoreTrustSeal." }
guidance = "FDO-RESR2: All resource and service providers should demonstrate trustworthiness by regularly assessing the quality of the procedures applied according to standards such as CoreTrustSeal."
guidanceLanguage = "en"

[[clause]]
id = "CAMBRIDGE-ERN.01"
source = "cambridge-notebooks"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Při výběru výzkumného deníku ověřte historii změn, export, přístupová práva a zálohy; nároky se liší podle způsobu práce.", en = "When choosing a research notebook, check change history, export, permissions and backups; needs vary with the work." }
locator = "Features to consider / Interoperability and formats"
guidanceLanguage = "en"
guidance = "Make sure the ERN:\n\n- supports open file formats\n- allows easy export of your data\n- handles proprietary formats you use"


[[clause]]
id = "ZENODO-SW.01"
source = "zenodo-software-guide"
locator = "Create a software deposit"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Vydání softwaru lze uložit v repozitáři s popisem a zdrojovým kódem; Zenodo nabízí ruční nahrání i propojení s vydáním na GitHubu. Archivaci kódu je třeba ověřit na zveřejněném záznamu.", en = "A software release can be deposited with descriptive metadata and source code; Zenodo offers manual upload and integration with GitHub releases. Code archival needs verification on the published record." }
