source = "os3-rules"
principles = ["A1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí být uložen včetně metadat ve veřejně dostupném důvěryhodném nebo oborově certifikovaném digitálním repozitáři, vybraném podle oborových zvyklostí.", en = "A dataset output of Open Science III must be deposited with its metadata in a publicly available, trustworthy or domain-certified digital repository, chosen by the domain's practice." }
guidance = "Doložený dataset musí:\n\n- být uložen včetně metadat ve veřejně dostupném důvěryhodném nebo oborově certifikovaném digitálním repozitáři, přičemž výběr repozitáře pro deponování dat probíhá dle oborových zvyklostí,"
guidanceLanguage = "cs"
