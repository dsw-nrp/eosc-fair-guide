kind = "statement"
text = { cs = "NRP buduje systém pro centrální sběr a uložení aplikačních logů, do kterého mají své záznamy posílat všechny komponenty infrastruktury NRP a pravděpodobně i aplikace repozitářů.", en = "NRP is building a system for the central collection and storage of application logs, to which every component of the NRP infrastructure, and probably every repository application, is to send its records." }

[[clause]]
