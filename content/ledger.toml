text = { cs = "Repozitáře a služby NRP se k AAI EOSC CZ připojují dvojmo: k ProxyIdP protokolem OIDC kvůli jednotnému přihlášení a atributům pro řízení přístupu a ke správě identit konektorem JSON kvůli zakládání a rušení účtů. Role přiřazené v AAI dostává repozitář při přihlášení a při jejich změnách a musí podle nich aktualizovat účty a jejich role.", en = "NRP repositories and services connect to the EOSC CZ AAI twice: to the ProxyIdP over OIDC for single sign-on and the attributes used in access control, and to identity management through a JSON connector for creating and removing accounts. A repository receives the roles assigned in the AAI at login and when they change, and must update the accounts and their roles accordingly." }

