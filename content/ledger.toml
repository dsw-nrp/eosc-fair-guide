# The EOSC CZ manual for creating an institutional data policy: its recommendations for the articles of a policy.
guidance = "Cílem Aktivity 4 je proškolení/vzdělání zaměstnanců instituce žadatele v oblasti správy výzkumných dat dle FAIR principů tak, aby se na správě mohli sami aktivně podílet, např. získávání znalostí v oblasti bezpečného zacházení s výzkumnými daty, efektivní práce s repozitářovými systémy, nastavení procesu řízení správy dat – od tvorby metadat, přes anonymizaci až po ukládání a sdílení apod."
guidanceLanguage = "cs"
locator = "kap. 5.7.3, Aktivita 4, s. 20"

[[clause]]
id = "POLICY-MANUAL.02"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politika uvádí, na která výzkumná data se vztahuje, a zda jen na digitální, nebo i na fyzická. Má-li odrážet zákon o výzkumu, vztahuje se nejméně na data v elektronické podobě potřebná pro publikaci výsledků výzkumu podpořeného z veřejných prostředků.", en = "The policy states which research data it covers, and whether only digital or also physical data. To reflect the research act, it covers at least the electronic data needed to publish the results of publicly funded research." }
guidance = "Zde doplňte rozsah výzkumných dat, na která se Vaše politika vztahuje, např. „všechna výzkumná data“, „výzkumná data přímo navázaná na publikované nebo patentované výsledky“, „data vytvořená nebo použitá ve výzkumu podpořeném z veřejných prostředků“ apod. - Povinnosti se správou výzkumných dat („údajů z výzkumu“ dle zákona o výzkumu, 328/2025 Sb.) se týkají těch dat, které jsou v elektronické podobě a byly zapotřebí pro publikaci výsledků z těch výzkumů, které byly podpořeny z veřejných prostředků. Pokud je cílem, aby politika reflektovala zákonné povinnosti, pak toto představuje minimální rozsah výzkumných dat, na které se politika vztahuje. - Pokud zvolíte možnost zaobírat se pouze daty navázanými na publikace nebo patenty, je třeba zde také specifikovat, co se stane s daty, která nejsou publikovatelná. - Nezapomeňte udělat případné příslušné úpravy v sekci Definice u definice „Výzkumná data“ (viz níže).\n\nDruhá informace, která by tu měla být specifikována, je, o jaký typ výzkumných dat se v dokumentu jedná, zda pouze o digitální nebo i fyzické. Mezi fyzická data spadají např. biomateriály, vzorky, nebo dotazníky či laboratorní deníky v papírové podobě.\n\nDoplňte, jaké relevantní směrnice a doporučení na Vaší instituci existují. Běžná, doporučená formulace je např. „… předpisy zejména z oblastí práva duševního vlastnictví, autorského práva, ochrany osobních údajů a kybernetické bezpečnosti a musí být v souladu s dalšími právními, institucionálními a smluvními požadavky.“ Pro snadné dohledání relevantních textů nezapomeňte zmíněné dokumenty i s trvalými odkazy doplnit do sekce Související dokumenty."
guidanceLanguage = "cs"

[[clause]]
id = "POLICY-MANUAL.03"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumníkům se doporučuje připravovat ke svým projektům DMP a průběžně ho aktualizovat; instituce schválí nástroj pro plánování, například Data Stewardship Wizard, dostupný všem relevantním osobám.", en = "Researchers are advised to prepare a DMP for their projects and keep it up to date; the institution approves a planning tool, such as the Data Stewardship Wizard, open to everyone concerned." }
guidance = "Zde je možno specifikovat konkrétní nástroj pro plánování správy výzkumných dat, například Data Stewardship Wizard, nebo institucionální šablonu DMP. Takový nástroj by měl být schválen a dostupný všem relevantním osobám na instituci bez omezení přístupu na základě povinné úhrady provozu nebo omezení pro určitý segment osob se vztahem k instituci (typicky pracovně-právní nebo vztah typu student, stážista) a měl by sloužit jako řešení první volby pro všechny výzkumníky.\n\nInstituce doporučuje primárně využívat schválená institucionální řešení a poskytne k tomuto účelu výzkumníkům jasná doporučení a kritéria, na která je třeba se při výběru nástroje zaměřit. Volba nástroje i míra jeho formalizace však může záviset na požadavcích financující organizace a praxi daného projektu či mezinárodní spolupráce. Pro správu DMP lze tedy využívat také nástroje třetích stran, pokud splňují institucionální, právní a smluvní požadavky (zejména GDPR, bezpečnost, licenční podmínky a udržitelnost provozu). V případě nejasností je vhodné konzultovat řešení s příslušnou podporou (zejména open science a/nebo projektovou podporou fakulty či pracoviště)."
guidanceLanguage = "cs"

[[clause]]
id = "POLICY-MANUAL.04"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politika stanoví, jak dlouho se nejméně uchovávají data, která jsou podkladem publikací nebo samostatným výsledkem, a od kdy se doba počítá; běžné jsou 3–10 let od publikace nebo od konce projektu. Zákon o výzkumu minimální dobu nestanovuje.", en = "The policy sets how long the data behind publications, or published as results in their own right, are kept at least, and from when the period runs; 3 to 10 years from publication or from the end of the project are common. The research act sets no minimum period." }
guidance = "Specifikujte spodní hranici toho, jak dlouho by měla být data minimálně uchovávána a od jakého momentu se daná doba počítá. Běžné je cokoliv mezi 3–⁠10 lety „ode dne publikace výzkumu“ nebo „od konce projektu“. Toto rozhodnutí záleží na úložných kapacitách cílového repozitáře, příp. instituce, jejím výzkumném zaměření, případně povinné udržitelnosti projektů, stejně jako na rozhodnutí, zda uchovávat všechna výzkumná data, nebo jen ta publikovaná, příp. data z výzkumu, jehož výsledek byl následně patentován. Zákon o výzkumu (328/2025 Sb.) mezi údaje z výzkumu řadí také „dokumenty v elektronické podobě … které jsou akceptovány výzkumnou obcí jako nezbytné k validaci zjištění a výsledků výzkumu“, přičemž požaduje, aby tyto údaje byly dohledatelné, přístupné a opakovaně využitelné, a zároveň zákon nestanovuje žádnou minimální dobu platnosti. V případě pochybnosti, a zejména ve vědních oborech, pro které je typické shromažďování velkých datových setů, je nutné, aby instituce dlouhodobé uchování dat projednávala s jednotlivými výzkumníky a v rámci DMP byl zjišťován předpoklad objemu dat v postupných životních cyklech výzkumných dat."
guidanceLanguage = "cs"

[[clause]]
id = "POLICY-MANUAL.05"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Data mají být co nejotevřenější a uzavřená jen podle potřeby; politika určí, zda je sdílení povinné, nebo doporučené, doporučuje veřejné licence, například CC BY 4.0, a eviduje výjimky podle § 83 odst. 5 zákona o výzkumu.", en = "Data should be as open as possible and as closed as necessary; the policy says whether sharing is required or recommended, recommends public licences such as CC BY 4.0, and records exceptions under section 83(5) of the research act." }
guidance = "V této části je vhodné vymezit, zda instituce sdílení výzkumných dat stanovuje jako povinnost, doporučenou praxi, nebo kombinuje oba přístupy (např. povinnost u projektů financovaných poskytovateli, kteří sdílení dat vyžadují, a doporučení v ostatních případech).\n\nPoužijte, pouze pokud chcete evidovat důvody, proč nelze zpřístupnit výzkumná data, která by ze zákona o výzkumu přístupná být měla – v opačném případě bod smažte z textu datové politiky (viz níže). Podle §83, odst. 5 zákona o výzkumu „příjemce může odmítnout poskytnutí údajů z výzkumu v případech, kdy by jím došlo k zásahu do práva na ochranu soukromí včetně osobních údajů, práva na ochranu duševního vlastnictví, práva na ochranu obchodního tajemství, bezpečnosti nebo obrany státu, kybernetické bezpečnosti nebo jiných oprávněných zájmů příjemce, zejména zájmu na transferu znalostí“."
guidanceLanguage = "cs"

[[clause]]
id = "POLICY-MANUAL.06"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politika uvádí kontakty na podporu správy dat (IT, open science, duševní vlastnictví, ochrana osobních údajů, etika, data stewardi) a koho výzkumníci osloví, když jejich data překročí úložnou kapacitu instituce.", en = "The policy lists the contacts for data management support (IT, open science, intellectual property, data protection, ethics, data stewards) and whom researchers turn to when their data exceed the institution's storage capacity." }
guidance = "Zde doplníte hlavní kontakt(y) na tým nebo organizační jednotku zajišťující podporu v oblasti vědecké infrastruktury nebo open science na instituci. Doporučujeme přímo uvádět relevantní e-mailové adresy, primárně obecné kontaktní adresy a aliasy, které zajišťují kontinuitu agendy bez ohledu na personální změny.\n\nSouběžně s přípravou datové politiky na instituci je vhodné zvážit, jak by měla zveřejněná data přispívat k hodnocení výzkumné činnosti, například v otázkách dopadu, profesního růstu či propagace. Instituce by se měla snažit rozvíjet širší vnímání datasetu jako hodnotného výstupu výzkumu.\n\nDále je v této sekci je vhodné detailně rozepsat kontakty na datovou a open science podporu na instituci. Patří sem mj. kontakt na IT podporu, týmy řešící open science, duševní vlastnictví, ochranu osobních údajů či etiku ve výzkumu nebo přímo kontakty na institucionální data stewardy."
guidanceLanguage = "cs"

[[clause]]
id = "POLICY-MANUAL.07"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politiku pravidelně vyhodnocuje a aktualizuje určený tým, jehož součástí jsou zaměstnanci podpory správy výzkumných dat.", en = "A named team, including the institution's research data support staff, reviews and updates the policy regularly." }

# Zákon č. 328/2025 Sb., § 83 (effective 1 January 2027).
guidance = "Doplňte, kdo je zodpovědný za stav a aktualizaci datové politiky. V ustanoveném týmu by neměli chybět zaměstnanci instituce věnující se podpoře správy výzkumných dat. Je dobrou praxí se v týmu dohodnout, zda bude revize dokumentu provedena pouze v případě potřeby změn, nebo periodicky."
guidanceLanguage = "cs"

[[clause]]
id = "LAW-328-2025.83"
source = "law-328-2025"
principles = ["F1", "A1", "R1"]
actor = "other"
kind = "requirement"
text = { cs = "Příjemce spravuje údaje z výzkumu podpořeného z veřejných prostředků, tedy elektronické dokumenty kromě odborných publikací, které při výzkumu vznikly a slouží jako doklad nebo k ověření jeho zjištění, tak, aby byly dohledatelné, přístupné a opakovaně využitelné (§ 83 odst. 1, účinnost od 1. ledna 2027).", en = "The recipient manages the data from publicly funded research, that is the electronic documents other than scientific publications created in research and serving as evidence or to validate its findings, so that they are findable, accessible and reusable (section 83(1), in force from 1 January 2027)." }
guidance = "(1) Příjemce zajistí správu údajů z výzkumu, kterými jsou dokumenty v elektronické podobě, s výjimkou vědeckých publikací, které jsou shromažďovány nebo vytvářeny v průběhu činností vědeckého výzkumu a jsou používány jako důkazy v procesu výzkumu, nebo které jsou akceptovány výzkumnou obcí jako nezbytné k validaci zjištění a výsledků výzkumu, vytvořených nebo užitých ve výzkumu podpořeném z veřejných prostředků podle tohoto zákona tak, aby byly dohledatelné, přístupné a opakovaně využitelné."
guidanceLanguage = "cs"
locator = "§ 83 odst. 1, vyhlášené znění, s. 49–50"

[[clause]]
id = "LAW-328-2025.83.2"
source = "law-328-2025"
principles = ["A1"]
actor = "other"
kind = "requirement"
text = { cs = "Příjemce bezplatně poskytne třetím osobám dříve zveřejněné údaje z veřejně financovaného výzkumu v působnosti § 83 odst. 2; odstavec rozlišuje chráněná práva a zvláštní právo pořizovatele databáze, jehož je příjemce vykonavatelem. U údajů s bezplatným dálkovým přístupem postačuje odkaz (§ 83 odst. 4).", en = "The recipient provides third parties, free of charge, with previously published publicly funded research data covered by section 83(2); that subsection distinguishes protected rights and the special right of a database producer exercised by the recipient. A link suffices for data with free remote access (section 83(4))." }
guidance = "(2) Příjemce bezplatně poskytne třetí osobě údaje z výzkumu, které byly již dříve zveřejněny prostřednictvím institucionálního nebo tematického repozitáře a které nejsou chráněny podle zákonů upravujících ochranu výsledků autorské, vynálezecké nebo obdobné tvůrčí činnosti nebo které jsou chráněny pouze zvláštním právem pořizovatele databáze podle jiného právního předpisu16), jehož je příjemce vykonavatelem. Povinnost podle věty první se vztahuje pouze na údaje z výzkumu vytvořené nebo shromážděné ve výzkumu podporovaném podle tohoto zákona, který byl hrazen z veřejných prostředků.\n\n(4) V případě, že jsou údaje z výzkumu již zveřejněny způsobem umožňujícím bezplatný dálkový přístup, postačuje ke splnění povinnosti podle odstavců 1 a 2 uvedení odkazu, kde jsou tyto údaje z výzkumu již zveřejněny.\n\n16) § 88 až 94 zákona č. 121/2000 Sb., o právu autorském, o právech souvisejících s právem autorským a o změně některých zákonů (autorský zákon), ve znění pozdějších předpisů."
guidanceLanguage = "cs"
locator = "§ 83 odst. 2 a 4, vyhlášené znění, s. 49–50"

[[clause]]
id = "LAW-328-2025.83.3"
source = "law-328-2025"
principles = ["I1", "R1.1"]
actor = "other"
kind = "requirement"
text = { cs = "Údaje z výzkumu a informace o nich poskytuje příjemce v otevřeném a strojově čitelném formátu, za objektivních, přiměřených, nevýhradních a nediskriminačních podmínek, které neomezují jejich další využití (§ 83 odst. 3).", en = "The recipient provides research data and information about them in an open, machine-readable format, on objective, reasonable, non-exclusive and non-discriminatory terms that do not restrict their further use (section 83(3))." }
guidance = "(3) Příjemce poskytne údaje z výzkumu a informace o nich v otevřeném a strojově čitelném formátu a za takových podmínek, které jsou objektivní, přiměřené, nevýlučné, nediskriminační a neomezují způsob ani účel následného využití poskytovaných údajů z výzkumu."
guidanceLanguage = "cs"
locator = "§ 83 odst. 3, vyhlášené znění, s. 49–50"

[[clause]]
id = "LAW-328-2025.83.5"
source = "law-328-2025"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Příjemce může poskytnutí údajů z výzkumu odmítnout, pokud by zasáhlo do ochrany soukromí včetně osobních údajů, duševního vlastnictví, obchodního tajemství, bezpečnosti nebo obrany státu, kybernetické bezpečnosti nebo jiných oprávněných zájmů příjemce, zejména transferu znalostí (§ 83 odst. 5).", en = "The recipient may refuse to provide research data where doing so would interfere with privacy, including personal data, intellectual property, trade secrets, state security or defence, cybersecurity or other legitimate interests of the recipient, in particular knowledge transfer (section 83(5))." }

# The programmes' requirements for a funded dataset output: the Open Science III specific rules (chapter 5.7.1,
# activity 1), the Open Science III FAQ, and the catalogue of outputs of the second minizáměr call.
guidance = "(5) Příjemce může odmítnout poskytnutí údajů z výzkumu v případech, kdy by jím došlo k zásahu do práva na ochranu soukromí včetně osobních údajů, práva na ochranu duševního vlastnictví, práva na ochranu obchodního tajemství, bezpečnosti nebo obrany státu, kybernetické bezpečnosti nebo jiných oprávněných zájmů příjemce, zejména zájmu na transferu znalostí."
guidanceLanguage = "cs"
locator = "§ 83 odst. 5, vyhlášené znění, s. 49–50"

[[clause]]
id = "OS3-RULES.19"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí vzniknout netriviálním procesem vyžadujícím expertizu ve správě FAIR výzkumných dat; aktivitu nelze využít pro samotnou akvizici dat, jen pro jejich FAIRifikaci.", en = "A dataset output of Open Science III must result from a non-trivial process that needs expertise in FAIR research data management; the activity cannot pay for acquiring data, only for making them FAIR." }
guidance = "Doložený dataset musí:\n\n- vzniknout netriviálním procesem vyžadujícím expertizu v oblasti správy FAIR výzkumných dat,\n\nAktivitu nelze využít pro samotnou akvizici dat, ale až pro jejich FAIRifikaci."
guidanceLanguage = "cs"
locator = "kap. 5.7.1, doložení datasetu, s. 15–16"

