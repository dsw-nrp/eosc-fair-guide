text = { cs = "Podmínkou všech aktivit výzvy Open Science III je využití Národní datové infrastruktury (NDI); vytvořené datové sady se evidují v Národním metadatovém adresáři.", en = "All Open Science III activities require the use of the national data infrastructure (NDI); the datasets created are recorded in the National Metadata Directory." }
guidance = "Podmínkou realizace všech oprávněných aktivit je využití Národní datové infrastruktury (NDI), jejích služeb, nástrojů a infrastruktury, která se koordinovaně buduje v rámci projektů IPs EOSC-CZ a IPs CARDS, projektu Národní repozitářová platforma pro výzkumná data podpořeného z výzvy OP JAK č. 02_23_014 Open Science I a projektu Open Science II podpořeného z výzvy OP JAK č. 02_24_030 Open Science II.\n\nVyužívání NDI je v případě jednotlivých aktivit chápáno rámcově v následujícím smyslu:\n\n- Aktivita 1: evidence vytvořených datasetů v Národním metadatovém adresáři,\n- Aktivita 2: zapracování způsobů využívání NDI do strategického dokumentu,\n- Aktivita 3: využití, rozšíření nebo integrace nástrojů, služeb a infrastruktury NDI,\n- Aktivita 4: akvizice znalostí a kompetencí potřebných k FAIRifikaci dat (definice viz kap. 2) a využívání nástrojů, služeb a infrastruktury NDI."
guidanceLanguage = "cs"
locator = "kap. 5.7, využívání NDI, s. 12–13"

