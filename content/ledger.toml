locator = "Úvod; printed p. 5"
guidanceLanguage = "cs"
guidance = "Cílem dokumentu je seznámit data stewardy s definicí FAIR principů. K lepšímu pochopení dané problematiky navíc přináší i praktické příklady v jednotlivých sekcích. Nad rámec základních principů nabízí příručka rozšířené kapitoly, které autoři pokládají za podstatné k dokreslení celé problematiky. Věnuje se tak i více technickým tématům jako anonymizace dat, sémantická interoperabilita nebo strojová funkčnost. Tato témata jsou podstatná v mezioborové spolupráci nebo i pro data stewardy působící v instituci s širokým vědeckým záběrem."


