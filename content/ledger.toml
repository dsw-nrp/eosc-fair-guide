[[clause]]
id = "OSTRAILS-CZ-PILOT.01"
source = "ostrails-cz-pilot"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Pilotní hodnocení 100 záznamů repozitáře DSpace ČVUT nástrojem FAIR Champion (červenec 2026): 38 % volání testů nevrátilo výsledek, třetina výsledků byla neurčitá, některé sady testů se na běžný repozitář nevztahují a výsledky byly napříč typy záznamů podobné; zpráva uvádí deset doporučení pro platformy.", en = "Pilot assessment of 100 records of the CTU DSpace repository with FAIR Champion (July 2026): 38 % of test calls returned no verdict, a third of verdicts were indeterminate, some test suites do not apply to an ordinary repository, and results were uniform across record types; the report gives ten recommendations for platforms." }
guidance = "Actionable adjustments for the CTU DSpace repository, derived from the July 2026 FAIR assessment\n\n4. Ground metadata in FAIR / controlled vocabularies\n\nComplexity: High\n\nFree-text subject, type and access values are not linked to controlled vocabularies, so interoperability tests that look for vocabulary-grounded terms fail or cannot decide. Map key fields (subjects, resource type, access rights) to community vocabularies with resolvable term URIs (e.g. COAR resource types, controlled subject schemes, standardised access-rights vocabulary). Depends on recommendation 3 being in place.\n\n5. Use ISO 639 language codes for the language field\n\nComplexity: Low\n\nPopulate the language field with standard ISO 639 codes (e.g. “cs”, “en”) instead of free text or leaving it empty. This is a small, mostly configuration/normalisation change with an immediate, isolated effect."
guidanceLanguage = "en"
locator = "DSpace FAIR Improvement Recommendations, recommendations 4 and 5, s. 2–3"

