# Clause ledger: every statement the guide relies on, with a stable ID and its published source.
# Field reference and ID prefixes: docs/content-model.md. Every clause of the FAIR analysis' principle table
# (A.*) is listed under its principle, so the principle explorer shows all of them.

[[clause]]
id = "A.F1.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na NRP"
principles = ["F1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Každá publikovaná datová sada má trvalý identifikátor (PID); převzaté záznamy bez PID mají aspoň stabilní URL a postup doplnění PID.", en = "Every published dataset has a persistent identifier (PID); imported records without a PID have at least a stable URL and a procedure for adding a PID." }

[[clause]]
