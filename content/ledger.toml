guidance = "Podpora oborově specifických metadat: Repozitáře by měly umožňovat přidání oborově specifických metadatových prvků definovaných v příslušných FIP."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.R3"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Požadavky na repozitáře"
principles = ["R1"]
actor = "repository"
kind = "requirement"
text = { cs = "Metadata se verzují; minimem je, že nová verze dostane nový PID a vazbu isNewVersionOf.", en = "Metadata are versioned; at minimum, a new version gets a new PID and an isNewVersionOf relation." }
guidance = "Verzování metadat: Doporučuje se podporovat verzování metadat. V systémech, které plné verzování metadat neumožňují, by mělo být alespoň zajištěno, že nové verze datové sady obdrží nový PID (DOI) a budou explicitně propojeny s předchozí verzí pomocí relačních vlastností v metadatech (např. isNewVersionOf ve schématu DataCite)."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Požadavky na FIP"
principles = ["R1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje povinné atributy.", en = "The FIP sets the mandatory attributes." }
guidance = "Definování povinných metadatových atributů."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Požadavky na FIP"
principles = ["R1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje doporučené slovníky a standardy.", en = "The FIP sets the recommended vocabularies and standards." }
guidance = "Popis používaných slovníků a standardů: FIP by měl obsahovat seznam doporučených slovníků a standardů, které zvýší interoperabilitu dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Naplnění v NRP"
principles = ["R1"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Profil pro vyhledání (CCMM) a profil pro opakované použití (oborová metadata); NMA slouží jako rozcestník.", en = "A discovery profile (CCMM) and a reusability profile (domain metadata); NMA serves as a signpost." }
guidance = "V rámci NRP/NDI se pro naplnění tohoto principu rozlišují dvě úrovně metadat:\n\n- Discovery profil (CCMM): Jádro metadatových prvků sklízené do NMA, které slouží primárně k vyhledání a identifikaci datové sady.\n- Reusability profil (Oborová metadata): Bohatý soubor metadat, který zůstává v repozitáři a je definován oborovými standardy (např. v rámci FIP). Tento profil obsahuje detailní informace nezbytné pro znovupoužití dat, jako jsou podrobná provenience, popis metodologie a kontext vzniku dat.\n\nNMA slouží jako rozcestník, zatímco plnou znovupoužitelnost zajišťují bohatá metadata dostupná na landing page v repozitáři."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Doporučení CDIF / Požadavky CTS"
principles = ["R1"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R08|R8]], [[clause:CTS.R10|R11]] a [[clause:CTS.R13|R14]].", en = "CoreTrustSeal [[clause:CTS.R08|R8]], [[clause:CTS.R10|R11]] and [[clause:CTS.R13|R14]]." }
guidance = "Tento princip úzce souvisí s požadavky CoreTrustSeal R8 (Uložená metadata), Požadavky na R11 (Zajištění kvality dat) a R14 (Podpora opětovného použití dat). R8 vyžaduje, aby metadata byla dostatečně podrobná, aby umožnila dlouhodobé uchování a správnou interpretaci dat. R11 požaduje, aby repozitáře měly jasně definované procesy pro validaci kvality metadat, čímž se zajistí jejich konzistence a správnost."
guidanceLanguage = "cs"

[[clause]]
