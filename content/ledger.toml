# Open Science III, rules for applicants and beneficiaries (specific part, version 1), chapter 5.7: the minimum
# content of the research data strategy, the action plan and the policy.

[[clause]]
id = "OS3-RULES.01"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Výzva Open Science III podmiňuje akceptaci výstupů formálně přijatou strategií pro nakládání s výzkumnými daty na celoinstitucionální úrovni, schválenou statutárním orgánem a splňující minimální požadavky výzvy.", en = "The Open Science III call makes the acceptance of outputs conditional on a formally adopted, institution-wide strategy for research data, approved by the statutory body and meeting the call's minimum requirements." }
guidance = "Nutnou podmínkou pro akceptaci výstupů Aktivit 1, 3 a 4 je doložení celoinstitucionální formálně přijaté (tj. statutárním zástupcem schválené) Strategie pro nakládání s výzkumnými daty, která splňuje minimální požadavky uvedené níže. Strategie může být buď výstupem volitelné Aktivity 2, nebo výstupem činnosti žadatele realizované mimo projekt OS III. Strategie musí být příjemcem doložena nejpozději v předposlední ZoR."
guidanceLanguage = "cs"
locator = "kap. 5.7, akceptace výstupů, s. 13"

[[clause]]
id = "OS3-RULES.02"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí pokrývat vizi a cíle správy výzkumných dat: hlavní cíle instituce ve správě a sdílení dat, například FAIR principy, otevřenost dat a etické principy.", en = "The strategy must cover the vision and goals of research data management: the institution's main goals in managing and sharing data, such as the FAIR principles, open data and ethical principles." }
guidance = "Minimální požadavky na Strategii pro nakládání s výzkumnými daty: Strategie musí věcně pokrývat tyto oblasti:\n\n1. vize a cíle správy výzkumných dat: definice hlavních cílů dané instituce v oblasti správy a sdílení výzkumných dat (např. FAIR principy, otevřenost dat, etické principy ad.);"
guidanceLanguage = "cs"
locator = "kap. 5.7, minimální požadavky na Strategii, s. 14"

[[clause]]
id = "OS3-RULES.03"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí vymezit svůj rozsah a působnost: na jaké typy výzkumných dat, projekty, pracoviště a výzkumné pracovníky se vztahuje.", en = "The strategy must set out its scope: the kinds of research data, projects, departments and researchers it covers." }
guidance = "Minimální požadavky na Strategii pro nakládání s výzkumnými daty: Strategie musí věcně pokrývat tyto oblasti:\n\n2. rozsah a působnost strategie: vymezení, na jaké typy výzkumných dat, projekty, pracoviště a výzkumné pracovníky se strategie vztahuje;"
