guidance = "Doporučit sadu licencí, které jsou v dané komunitě považovány za vhodné a přijatelné, a specifikovat formáty pro strojově čitelné licence."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.1.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.1, Naplnění v NRP, s. 39"
principles = ["R1.1"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Licence je součástí metadat (název a URI) a je dostupná přes NMA.", en = "The licence is part of the metadata (name and URI) and is available through NMA." }
status = "refresh"
note = { cs = "V CCMM 2.0.0 se licence váže ke třídám.", en = "In CCMM 2.0.0, licences are attached per class." }
noteSources = ["CCMM-RELEASES.01"]
guidance = "NRP vyžaduje, aby každá datová sada měla přiřazenou licenci, která je součástí metadatového záznamu (název licence, URI). Metadata obsahující licenční informace jsou dostupná prostřednictvím NMA."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.1.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.1, Naplnění v NRP"
principles = ["R1.1"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Formáty pro vyjádření licencí: CC REL, DC Terms, DCAT-AP, JSON-LD, ODRL, SPDX.", en = "Formats for expressing licences: CC REL, DC Terms, DCAT-AP, JSON-LD, ODRL, SPDX." }
guidance = "Pro zajištění strojové čitelnosti licenčních podmínek je doporučeno používat standardizované formáty, jako jsou:\n\n- Creative Commons Rights Expression Language (CC REL)⁴⁸\n- Dublin Core (DC Terms)\n- DCAT-AP\n- JSON-LD\n- ODRL (Open Digital Rights Language)\n- SPDX (Software Package Data Exchange)⁴⁹, zejména pokud se metadata vztahují k softwarovým komponentám nebo open-source datovým sadám."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.1.X3"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.1, Doporučení CDIF / Požadavky CTS"
principles = ["R1.1"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R02|R2]]; CDIF [[clause:CDIF.Access|Data Access]] (ODRL).", en = "CoreTrustSeal [[clause:CTS.R02|R2]]; CDIF [[clause:CDIF.Access|Data Access]] (ODRL)." }
status = "refresh"
note = { cs = "CDIF 1.1 obsahuje doporučení k ODRL.", en = "CDIF 1.1 includes guidance on ODRL." }
noteSources = ["CDIF.01"]
guidance = "Data Access profil doporučuje použití ODRL⁴⁷ pro popis licencí a podmínek použití. Tímto způsobem mohou být licence snadno interpretovány automatizovanými systémy, což usnadňuje dodržování licenčních podmínek při opětovném použití dat.\n\nTento princip souvisí s požadavkem CoreTrustSeal R2 (Licence). R2 vyžaduje, aby repozitáře spravovaly všechny platné licence, které se vztahují na přístup k datům a jejich používání."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Požadavky na NRP"
principles = ["R1.2"]
actor = "nrp"
kind = "requirement"
text = { cs = "Metadata obsahují provenienci (autoři, metodologie, historie změn) minimálně v rozsahu CCMM.", en = "Metadata include provenance (authors, methodology, change history) at least to the extent of CCMM." }
status = "refresh"
note = { cs = "CCMM 2.0.0 přidává popis provenienční aktivity.", en = "CCMM 2.0.0 adds a description of the provenance activity." }
noteSources = ["CCMM-RELEASES.01"]
guidance = "Standardizace metadat o provenienci: Zajistit, že metadatové schéma v NRP bude obsahovat informace o původu dat, včetně autorů, metodologie a historie změn, a to minimálně v rozsahu požadavků CCMM."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Požadavky na NRP"
principles = ["R1.2"]
actor = "nrp"
kind = "requirement"
text = { cs = "Repozitáře mají mechanismy verzování.", en = "Repositories have versioning mechanisms." }
guidance = "Podpora verzování: Implementovat mechanismy pro sledování změn v datových sadách a jejich metadatech."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.N3"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Požadavky na NRP"
principles = ["R1.2"]
actor = "nrp"
kind = "requirement"
text = { cs = "Datové sady se propojují s publikacemi a projekty pomocí DOI, ORCID a dalších PID.", en = "Datasets are linked to publications and projects through DOI, ORCID and other PIDs." }
guidance = "Propojení s PID a publikacemi: Umožnit propojení datových sad s jejich odpovídajícími vědeckými publikacemi a projekty prostřednictvím DOI, ORCID a dalších perzistentních identifikátorů."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, R1.2, Požadavky na repozitáře"
principles = ["R1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Základní provenienční informace (původ, verze, historie) jsou povinné, minimálně v rozsahu CCMM.", en = "Basic provenance information (origin, version, history) is mandatory, at least to the extent of CCMM." }
guidance = "Povinné zahrnutí provenienčních informací: Repozitáře musí zajistit, že metadata obsahují základní informace o původu dat, jejich verzi a historii změn, a to minimálně v rozsahu požadavků CCMM."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.2.R2"
