[[clause]]
id = "COPYRIGHT-LICENCES.01"
source = "copyright-licences"
principles = ["R1.1"]
actor = "other"
kind = "statement"
text = { cs = "Příručka Autorská práva a licence vysvětluje autorskoprávní pojmy, ochranu výzkumných dat, depoziční a uživatelské licence a licence Creative Commons.", en = "The handbook on copyright and licences explains copyright concepts, the legal protection of research data, deposit and user licences, and Creative Commons licences." }
locator = "Právní ochrana výzkumných dat; Licence v kontextu repozitářů; PDF pp. 6, 9"
guidanceLanguage = "cs"
guidance = "Právní ochrana výzkumných dat\n\nVzhledem k různorodé povaze dat neexistuje jednotný systém právní ochrany. Podle charakteru konkrétních výzkumných dat se uplatní různé režimy právní ochrany. Pro některá data se může použít více režimů ochrany najednou, a naopak může nastat situace, kdy výzkumným datům nepřísluší žádná forma právní ochrany a data tak nejsou chráněna vůbec – např. hodnoty získané měřením meteorologickými přístroji, která zároveň netvoří databázi. V takovém případě se jedná o tzv. „prostá data“.\n\nLicence v kontextu repozitářů\n\nFungování repozitářů je do značné míry založeno na licencování ukládaných dat. Provozovatel repozitáře musí být oprávněn ukládat a zpřístupňovat data a uživatelé musí být oprávněni s těmito daty dále nakládat. Dochází tedy ke dvojímu licencování; vkladatel uděluje souhlas s licenčními podmínkami provozovatele repozitáře, na jejichž základě uděluje provozovateli licenci k užití vkládaného obsahu (depoziční licenční podmínky), a zároveň si určuje, pod jakou licencí mají být data v repozitáři dále sdílena, tedy jak mohou uživatelé s daty nakládat (uživatelská licenční smlouva)."


