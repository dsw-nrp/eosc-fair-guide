# Open Science III, rules for applicants and beneficiaries (specific part, version 1), chapter 5.7: the minimum
# content of the research data strategy, the action plan and the policy.

[[clause]]
id = "OS3-RULES.01"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Výzva Open Science III podmiňuje akceptaci výstupů formálně přijatou strategií pro nakládání s výzkumnými daty na celoinstitucionální úrovni, schválenou statutárním orgánem a splňující minimální požadavky výzvy.", en = "The Open Science III call makes the acceptance of outputs conditional on a formally adopted, institution-wide strategy for research data, approved by the statutory body and meeting the call's minimum requirements." }

[[clause]]
id = "OS3-RULES.02"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí pokrývat vizi a cíle správy výzkumných dat: hlavní cíle instituce ve správě a sdílení dat, například FAIR principy, otevřenost dat a etické principy.", en = "The strategy must cover the vision and goals of research data management: the institution's main goals in managing and sharing data, such as the FAIR principles, open data and ethical principles." }

[[clause]]
id = "OS3-RULES.03"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí vymezit svůj rozsah a působnost: na jaké typy výzkumných dat, projekty, pracoviště a výzkumné pracovníky se vztahuje.", en = "The strategy must set out its scope: the kinds of research data, projects, departments and researchers it covers." }

[[clause]]
id = "OS3-RULES.04"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí pokrývat lidské zdroje pro správu výzkumných dat: odpovědnosti jednotlivých aktérů (výzkumníci, datoví správci, IT podpora, vedení), vizi dlouhodobého rozvoje lidských zdrojů a kompetencí pro FAIR data a využívání NDI a ukotvení pracovních pozic pro správu FAIR dat v organizační struktuře.", en = "The strategy must cover human resources for research data management: the responsibilities of each actor (researchers, data stewards, IT support, management), a vision for developing people and competences for FAIR data and the use of the NDI over the long term, and the anchoring of FAIR data positions in the organisational structure." }

[[clause]]
id = "OS3-RULES.05"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Strategie musí pokrývat infrastrukturu a institucionální podporu: rámcový popis potřebných služeb, nástrojů, podpory a využití NDI, například školení, poradenství a IT infrastruktury.", en = "The strategy must cover infrastructure and institutional support: an outline of the services, tools and support needed and of the use of the NDI, such as training, advice and IT infrastructure." }

[[clause]]
id = "OS3-RULES.06"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Akční plán musí obsahovat opatření pro implementaci strategie: konkrétní aktivity, například zavedení podpůrného týmu, infrastrukturu pro dlouhodobé uchovávání dat, školení a šíření povědomí.", en = "The action plan must contain measures for implementing the strategy: specific activities, such as setting up a support team, infrastructure for long-term retention, training and raising awareness." }

[[clause]]
id = "OS3-RULES.07"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Akční plán musí obsahovat harmonogram realizace: časový plán jednotlivých opatření nebo jejich etapizaci.", en = "The action plan must contain a schedule: a timeline for each measure or its stages." }

[[clause]]
id = "OS3-RULES.08"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Akční plán musí určit odpovědné osoby nebo útvary za realizaci konkrétních opatření.", en = "The action plan must name the people or units responsible for each measure." }

[[clause]]
id = "OS3-RULES.09"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Akční plán musí rámcově vymezit personální, finanční a technické zdroje potřebné k realizaci strategie a formálně ukotvit způsob realizace akčního plánu.", en = "The action plan must outline the staff, financial and technical resources needed to implement the strategy and anchor formally how the plan is carried out." }

[[clause]]
id = "OS3-RULES.10"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Akční plán musí stanovit monitoring a vyhodnocování: indikátory plnění, pravidelné vyhodnocování (jak často a kdo) a aktualizaci plánu.", en = "The action plan must set out monitoring and evaluation: indicators, regular evaluation (how often and by whom) and updates to the plan." }

[[clause]]
id = "OS3-RULES.11"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Akční plán a politika musí být formálně schváleny statutárním orgánem; dokumenty nižších organizačních celků vysoké školy děkanem.", en = "The action plan and the policy must be formally approved by the statutory body, or by the dean for the documents of a faculty." }

[[clause]]
id = "OS3-RULES.12"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Politika musí definovat svou působnost: na koho se vztahuje (například zaměstnanci, studenti, externí partneři), co instituce považuje za výzkumná data, na která se politika vztahuje, a základní zasazení do právního rámce.", en = "The policy must define its scope: whom it applies to (such as staff, students, external partners), what the institution counts as the research data it covers, and how it fits the legal framework." }

[[clause]]
id = "OS3-RULES.13"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Politika musí stanovit, jakým způsobem instituce řeší plánování a správu dat.", en = "The policy must set out how the institution handles data planning and management." }

[[clause]]
id = "OS3-RULES.14"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Politika musí určit minimální dobu, po kterou musí být data uchována, a pravidla pro výběr míst dlouhodobého uchovávání.", en = "The policy must set the minimum period for which data must be kept and the rules for choosing where they are kept long-term." }

[[clause]]
id = "OS3-RULES.15"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Politika musí vysvětlit role a odpovědnosti výzkumníků za správu dat i instituce za poskytování podpory, včetně kontaktů na podporu.", en = "The policy must explain the roles and responsibilities of researchers for managing data and of the institution for providing support, including support contacts." }

[[clause]]
id = "OS3-RULES.16"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Aktivity výzvy Open Science III se realizují prostřednictvím povinné pracovní pozice Specialista v oblasti správy výzkumných dat (data steward).", en = "The Open Science III activities are carried out through the mandatory position of a research data management specialist (data steward)." }

[[clause]]
id = "OS3-RULES.17"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Podmínkou všech aktivit výzvy Open Science III je využití Národní datové infrastruktury (NDI); vytvořené datové sady se evidují v Národním metadatovém adresáři.", en = "All Open Science III activities require the use of the national data infrastructure (NDI); the datasets created are recorded in the National Metadata Directory." }

[[clause]]
id = "OS3-RULES.18"
source = "os3-rules"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Volitelná aktivita Vzdělávání výzvy Open Science III umožňuje proškolit zaměstnance ve správě výzkumných dat, v FAIRifikaci a ve využívání NDI.", en = "The optional Education activity of the Open Science III call lets institutions train staff in research data management, FAIRification and the use of the NDI." }

# The EOSC CZ manual for creating an institutional data policy: its recommendations for the articles of a policy.

[[clause]]
id = "POLICY-MANUAL.02"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politika uvádí, na která výzkumná data se vztahuje, a zda jen na digitální, nebo i na fyzická. Má-li odrážet zákon o výzkumu, vztahuje se nejméně na data v elektronické podobě potřebná pro publikaci výsledků výzkumu podpořeného z veřejných prostředků.", en = "The policy states which research data it covers, and whether only digital or also physical data. To reflect the research act, it covers at least the electronic data needed to publish the results of publicly funded research." }

[[clause]]
id = "POLICY-MANUAL.03"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumníkům se doporučuje připravovat ke svým projektům DMP a průběžně ho aktualizovat; instituce schválí nástroj pro plánování, například Data Stewardship Wizard, dostupný všem relevantním osobám.", en = "Researchers are advised to prepare a DMP for their projects and keep it up to date; the institution approves a planning tool, such as the Data Stewardship Wizard, open to everyone concerned." }

[[clause]]
id = "POLICY-MANUAL.04"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politika stanoví, jak dlouho se nejméně uchovávají data, která jsou podkladem publikací nebo samostatným výsledkem, a od kdy se doba počítá; běžné jsou 3–10 let od publikace nebo od konce projektu. Zákon o výzkumu minimální dobu nestanovuje.", en = "The policy sets how long the data behind publications, or published as results in their own right, are kept at least, and from when the period runs; 3 to 10 years from publication or from the end of the project are common. The research act sets no minimum period." }

[[clause]]
id = "POLICY-MANUAL.05"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Data mají být co nejotevřenější a uzavřená jen podle potřeby; politika určí, zda je sdílení povinné, nebo doporučené, doporučuje veřejné licence, například CC BY 4.0, a eviduje výjimky podle § 83 odst. 5 zákona o výzkumu.", en = "Data should be as open as possible and as closed as necessary; the policy says whether sharing is required or recommended, recommends public licences such as CC BY 4.0, and records exceptions under section 83(5) of the research act." }

[[clause]]
id = "POLICY-MANUAL.06"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politika uvádí kontakty na podporu správy dat (IT, open science, duševní vlastnictví, ochrana osobních údajů, etika, data stewardi) a koho výzkumníci osloví, když jejich data překročí úložnou kapacitu instituce.", en = "The policy lists the contacts for data management support (IT, open science, intellectual property, data protection, ethics, data stewards) and whom researchers turn to when their data exceed the institution's storage capacity." }

[[clause]]
id = "POLICY-MANUAL.07"
source = "policy-manual"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Politiku pravidelně vyhodnocuje a aktualizuje určený tým, jehož součástí jsou zaměstnanci podpory správy výzkumných dat.", en = "A named team, including the institution's research data support staff, reviews and updates the policy regularly." }

# Zákon č. 328/2025 Sb., § 83 (effective 1 January 2027).

[[clause]]
id = "LAW-328-2025.83"
source = "law-328-2025"
principles = ["F1", "A1", "R1"]
actor = "other"
kind = "requirement"
text = { cs = "Příjemce spravuje údaje z výzkumu podpořeného z veřejných prostředků, tedy elektronické dokumenty kromě odborných publikací, které při výzkumu vznikly a slouží jako doklad nebo k ověření jeho zjištění, tak, aby byly dohledatelné, přístupné a opakovaně využitelné (§ 83 odst. 1, účinnost od 1. ledna 2027).", en = "The recipient manages the data from publicly funded research, that is the electronic documents other than scientific publications created in research and serving as evidence or to validate its findings, so that they are findable, accessible and reusable (section 83(1), in force from 1 January 2027)." }

[[clause]]
id = "LAW-328-2025.83.2"
source = "law-328-2025"
principles = ["A1"]
actor = "other"
kind = "requirement"
text = { cs = "Na žádost poskytuje příjemce třetím osobám bezplatně údaje z výzkumu podpořeného z veřejných prostředků, které už zveřejnil v institucionálním nebo oborovém repozitáři, pokud je nechrání autorské, patentové nebo obdobné právo; jsou-li volně dostupné na dálku, stačí odkaz na ně (§ 83 odst. 2 a 4).", en = "On request, the recipient provides third parties free of charge with data from publicly funded research that it has already published in an institutional or domain repository, unless copyright, patent or similar rights protect them; where the data are freely available remotely, a link is enough (section 83(2) and (4))." }

[[clause]]
id = "LAW-328-2025.83.3"
source = "law-328-2025"
principles = ["I1", "R1.1"]
actor = "other"
kind = "requirement"
text = { cs = "Údaje z výzkumu a informace o nich poskytuje příjemce v otevřeném a strojově čitelném formátu, za objektivních, přiměřených, nevýhradních a nediskriminačních podmínek, které neomezují jejich další využití (§ 83 odst. 3).", en = "The recipient provides research data and information about them in an open, machine-readable format, on objective, reasonable, non-exclusive and non-discriminatory terms that do not restrict their further use (section 83(3))." }

[[clause]]
id = "LAW-328-2025.83.5"
source = "law-328-2025"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Příjemce může poskytnutí údajů z výzkumu odmítnout, pokud by zasáhlo do ochrany soukromí včetně osobních údajů, duševního vlastnictví, obchodního tajemství, bezpečnosti nebo obrany státu, kybernetické bezpečnosti nebo jiných oprávněných zájmů příjemce, zejména transferu znalostí (§ 83 odst. 5).", en = "The recipient may refuse to provide research data where doing so would interfere with privacy, including personal data, intellectual property, trade secrets, state security or defence, cybersecurity or other legitimate interests of the recipient, in particular knowledge transfer (section 83(5))." }

# The programmes' requirements for a funded dataset output: the Open Science III specific rules (chapter 5.7.1,
# activity 1), the Open Science III FAQ, and the catalogue of outputs of the second minizáměr call.

[[clause]]
id = "OS3-RULES.19"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí vzniknout netriviálním procesem vyžadujícím expertizu ve správě FAIR výzkumných dat; aktivitu nelze využít pro samotnou akvizici dat, jen pro jejich FAIRifikaci.", en = "A dataset output of Open Science III must result from a non-trivial process that needs expertise in FAIR research data management; the activity cannot pay for acquiring data, only for making them FAIR." }

[[clause]]
id = "OS3-RULES.20"
source = "os3-rules"
principles = ["F2", "R1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí být opatřen strojově zpracovatelnými a veřejně dostupnými metadaty podle FAIR principů.", en = "A dataset output of Open Science III must have machine-readable, publicly available metadata that follow the FAIR principles." }

[[clause]]
id = "OS3-RULES.21"
source = "os3-rules"
principles = ["F1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí mít přiřazen jednoznačný, strojově čitelný perzistentní digitální identifikátor, například DOI nebo handle.", en = "A dataset output of Open Science III must have a unique, machine-readable persistent identifier, such as a DOI or a Handle." }

[[clause]]
id = "OS3-RULES.22"
source = "os3-rules"
principles = ["R1.1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí mít přiřazenu licenci nebo podmínky dalšího užití a distribuce.", en = "A dataset output of Open Science III must have a licence or terms of further use and distribution." }

[[clause]]
id = "OS3-RULES.23"
source = "os3-rules"
principles = ["A1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí být uložen včetně metadat ve veřejně dostupném důvěryhodném nebo oborově certifikovaném digitálním repozitáři, vybraném podle oborových zvyklostí.", en = "A dataset output of Open Science III must be deposited with its metadata in a publicly available, trustworthy or domain-certified digital repository, chosen by the domain's practice." }

[[clause]]
id = "OS3-RULES.24"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí mít jako autora nebo přispěvatele data stewarda, který se na výstupu podílel, bez ohledu na roli, kterou mu metadata přiřazují; dokládá se i jeho pracovní smlouva.", en = "A dataset output of Open Science III must name the data steward who worked on it as a creator or contributor, whatever role the metadata give them; their employment contract is part of the evidence." }

[[clause]]
id = "OS3-RULES.25"
source = "os3-rules"
principles = ["F4"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí mít metadatový záznam v Národním metadatovém adresáři (dokládá se odkazem do NMA).", en = "A dataset output of Open Science III must have a metadata record in the National Metadata Directory (evidenced by a link into NMA)." }

[[clause]]
id = "OS3-RULES.26"
source = "os3-rules"
principles = []
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí splňovat klíčové parametry, které projekt popsal ve studii proveditelnosti a které se přenášejí do právního aktu.", en = "A dataset output of Open Science III must meet the key parameters the project set out in its feasibility study, which carry over into the legal act." }

[[clause]]
id = "OS3-FAQ.01"
source = "os3-faq"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Samotné přeuložení už publikované datové sady do jiného repozitáře nestačí; netriviální FAIRifikací je například zlepšení metadat, dokumentace, převod do standardních formátů nebo překlad do angličtiny.", en = "Merely depositing an already published dataset in another repository is not enough; non-trivial FAIRification is, for example, better metadata, documentation, conversion to standard formats or translation into English." }

[[clause]]
id = "OS3-FAQ.02"
source = "os3-faq"
principles = ["A1"]
actor = "other"
kind = "recommendation"
text = { cs = "Nejprve ověřte, zda pro daný typ dat existuje oborový repozitář v re3data, který splňuje požadavky důvěryhodnosti, například CoreTrustSeal; jinak lze použít obecný repozitář, například Zenodo nebo Datový catch-all repozitář NRP, jehož metadata se do NMA přenášejí automaticky.", en = "First check whether re3data lists a domain repository for the data that meets the trustworthiness requirements, such as CoreTrustSeal; otherwise a general repository such as Zenodo or the NRP Data Catch-all Repository, whose metadata flow into NMA automatically, can be used." }

[[clause]]
id = "OS3-FAQ.03"
source = "os3-faq"
principles = ["F4"]
actor = "other"
kind = "recommendation"
text = { cs = "Záznam v NMA založíte zadáním DOI nebo Handle; metadata dostupná v DataCite se načtou automaticky, ostatní pole doplníte ručně. Jakmile NMA datovou sadu sklidí z repozitáře, ruční záznam nahradí.", en = "You create the NMA record by entering the DOI or Handle; metadata available in DataCite load automatically, and you fill in the other fields by hand. Once NMA harvests the dataset from a repository, that replaces the manual record." }

[[clause]]
id = "MINIZAMER-CATALOGUE.01"
source = "minizamer-catalogue"
principles = ["F1", "F4", "R1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup minizáměru musí mít volně dostupná metadata a splňovat FAIR principy, mít mezinárodně uznávaný perzistentní identifikátor (například DOI) a kompletní záznam v NMA; dokládá se funkčním odkazem na dataset v repozitáři s přiděleným PID.", en = "A dataset output of a mini-project must have freely available metadata and meet the FAIR principles, have an internationally recognised persistent identifier (such as a DOI) and a complete NMA record; it is evidenced by a working link to the dataset in a repository with its PID." }

# The European Commission's living guidelines on the responsible use of generative AI in research (third version).

[[clause]]
id = "EC-GENAI-GUIDELINES.01"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumník zůstává za výstup plně odpovědný: výstupy generativní AI posuzuje kriticky s vědomím jejích omezení, jako jsou zkreslení a vymyšlené informace. AI není autorem ani spoluautorem.", en = "Researchers remain ultimately responsible for scientific output: they take a critical approach to the output of generative AI, aware of its limitations such as bias and hallucinations. AI systems are neither authors nor co-authors." }

[[clause]]
id = "EC-GENAI-GUIDELINES.02"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Generativní AI umí vytvořit věrohodně vypadající, ale nesprávné citace a shrnutí; výzkumník odpovídá za kontrolu všech odkazů a jejich obsahu.", en = "Generative AI can produce plausible but incorrect citations and summaries; researchers are responsible for checking all references and their content." }

[[clause]]
id = "EC-GENAI-GUIDELINES.03"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumník používá generativní AI transparentně: uvádí, které nástroje podstatně použil a jak, a kde je to vhodné, zpřístupní zadání a výstupy v souladu s otevřenou vědou a principy FAIR.", en = "Researchers use generative AI transparently: they state which tools they used substantially and how, and where relevant make the prompts and the output available in line with open science and the FAIR principles." }

[[clause]]
id = "EC-GENAI-GUIDELINES.04"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Nepublikovanou nebo citlivou práci výzkumník nevkládá do externího systému AI, pokud nemá záruku, že data nebudou dále využita, například k učení modelů; osobní údaje třetích osob jen se souhlasem a v souladu s ochranou osobních údajů. Ověřuje, kdo nástroj spravuje a kde běží.", en = "Researchers do not upload unpublished or sensitive work into an external AI system unless there are assurances that the data will not be re-used, for example to train models; third parties' personal data only with consent and in compliance with data protection rules. They check who manages the tool and where it runs." }

[[clause]]
id = "EC-GENAI-GUIDELINES.05"
source = "ec-genai-guidelines"
principles = []
actor = "other"
kind = "recommendation"
text = { cs = "Výzkumné organizace mají tam, kde je to možné, zavádět nástroje generativní AI hostované lokálně nebo spravované důvěryhodnou stranou, aby do nich zaměstnanci mohli vkládat vědecká data se zajištěnou ochranou dat a důvěrností.", en = "Where possible, research organisations implement generative AI tools hosted locally or governed by trusted parties, so that staff can feed scientific data into a tool that ensures data protection and confidentiality." }

# Sources behind the gate's infrastructure questions (AAI, security, logging, support).

[[clause]]
id = "AAI-NRP.01"
source = "aai-nrp"
principles = ["A1.2"]
actor = "other"
kind = "statement"
text = { cs = "Repozitáře a služby NRP se k AAI EOSC CZ připojují dvojmo: k ProxyIdP protokolem OIDC kvůli jednotnému přihlášení a atributům pro řízení přístupu a ke správě identit konektorem JSON kvůli zakládání a rušení účtů. Role přiřazené v AAI dostává repozitář při přihlášení a při jejich změnách a musí podle nich aktualizovat účty a jejich role.", en = "NRP repositories and services connect to the EOSC CZ AAI twice: to the ProxyIdP over OIDC for single sign-on and the attributes used in access control, and to identity management through a JSON connector for creating and removing accounts. A repository receives the roles assigned in the AAI at login and when they change, and must update the accounts and their roles accordingly." }

[[clause]]
id = "NRP-AAI-INTEGRATION.01"
source = "nrp-aai-integration"
principles = ["A1.2"]
actor = "other"
kind = "statement"
text = { cs = "Repozitář musí přijímat identity z AAI EOSC; pro každý repozitář vzniká virtuální organizace, která eviduje jeho osoby a služby, se skupinami podle jmenných konvencí. Napojení se nastavuje po konzultaci se specialisty na repozitářové systémy a před ostrým provozem se testuje.", en = "A repository must accept identities from the EOSC AAI; each repository gets a virtual organisation that records its people and service identities, with groups following the naming conventions. The connection is set up after a consultation with repository-system specialists and tested before production." }

[[clause]]
id = "OS2-KB1.01"
source = "os2-kb1"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Repozitáře NRP běží na společné infrastruktuře, v prostředí Kubernetes s úložištěm CEPH, každý ve vlastním jmenném prostoru. Sdružení CESNET ji provozuje v několika lokalitách, nyní ve dvou, a počítá až s pěti.", en = "NRP repositories run on shared infrastructure, a Kubernetes environment with CEPH storage, each in its own namespace. CESNET operates it at several sites, two at present, with up to five foreseen." }

[[clause]]
id = "OS2-KB1.02"
source = "os2-kb1"
principles = []
actor = "other"
kind = "statement"
text = { cs = "Technická zpráva projektu Open Science II navrhuje bezpečnostní monitoring NRP zaměřený na síťový provoz infrastruktury; zjištěné události se mají hlásit systémy Warden a Mentat a incidenty řešit tým CESNET-CERTS, případně se správci repozitářů. Aplikace repozitářů procházejí penetračními testy (alespoň Invenio).", en = "A technical report of the Open Science II project designs NRP's security monitoring around the infrastructure's network traffic; detected events are to be reported through Warden and Mentat, and incidents handled by CESNET-CERTS, with the repository administrators where needed. The repository applications undergo penetration tests (at least Invenio)." }

[[clause]]
id = "OS2-KB1.03"
