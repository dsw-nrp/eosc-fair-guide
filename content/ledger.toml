principles = ["A2"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje, která metadata zůstanou veřejná i po ztrátě dat.", en = "The FIP sets which metadata remain public after the data are lost." }
guidance = "Požadavky na  Specifikace minimálních metadat: FIP by měl jasně definovat, která metadata musí zůstat veřejně dostupná i po ztrátě dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.A2.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, A2, Doporučení CDIF / Požadavky CTS"
principles = ["A2"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R08|R8]] a [[clause:CTS.R09|R10]]; tombstone stránky podle praxe DataCite.", en = "CoreTrustSeal [[clause:CTS.R08|R8]] and [[clause:CTS.R09|R10]]; tombstone pages follow DataCite practice." }
guidance = "Doporučení Tato zásada vyžaduje, aby metadata zůstala přístupná i v případě, že samotná data již nejsou k dispozici. Důvody pro ztrátu dat mohou zahrnovat vypršení časového limitu pro jejich uchování, změnu podmínek přístupu nebo smazání dat Požadavky na žádost uživatele. Přesto je důležité, aby metadata byla nadále veřejně dostupná jako trvalý záznam o existenci datové sady, její provenienci a vlastnostech. Jednou z doporučených praktik (viz doporučení DataCite) je použití tzv. tombstone pages (náhrobků), které uchovávají základní informace\n\nodstraněné datové sadě včetně důvodu její nedostupnosti.\n\nCDIF všeobecně doporučuje ukládání metadat na landing pages nebo do samostatných souborů. Díky tomu metadata zůstávají dostupná i v případě, že původní data byla odstraněna nebo přesunuta, což pomáhá zajistit dlouhodobou dohledatelnost vědeckých výstupů.\n\nTento princip úzce souvisí s požadavky CoreTrustSeal R8 (Uložená metadata) a zejména R10 (Plán uchování dat). Požadavek CoreTrustSeal R10 vyžaduje, aby repozitáře měly jasnou strategii pro dlouhodobou správu metadat i dat."
guidanceLanguage = "cs"

