guidance = "Manuál k přípravě institucionální datové politiky je určen zejména vysokým školám, výzkumným institucím a dalším organizacím napříč Českou republikou, které pracují s výzkumnými daty a chtějí systematicky ukotvit jejich správu, sdílení a ochranu v rámci instituce. Cílem manuálu je těmto institucím usnadnit přípravu vlastní datové politiky a poskytnout rámec, vzor, který je v souladu s principy open science, požadavky poskytovatelů financování i s českým administrativním a právním prostředím."


