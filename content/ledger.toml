[[clause]]
id = "NRP.M1"
source = "nrp-conditions"
locator = "Version 3.4, section 3"
principles = ["F1"]
actor = "repository"
kind = "requirement"
text = { cs = "Záznamy jsou citovatelné, mají PID a repozitář popisuje záruku jejich neměnnosti.", en = "Records are citable and have PIDs, and the repository describes how their immutability is guaranteed." }
guidance = "A citable record refers to the reliable preservation of a clearly identified digital object (e.g., a dataset). This involves two fundamental components: object identification and a guarantee of immutability.\n\nObject identification typically means assigning a persistent identifier (commonly a DOI). In case of repositories that behave more like databases, an appropriate system for unambiguous identification of individual records with equivalent properties is used.\n\nThe guarantee of immutability is a precise description of which modifications are allowed once a record has been finalized. Generally, the data in a finalized record should not be altered. In the case of metadata, it may be appropriate to allow the addition of references to related items, such as “UsedBy” or “ObsoletedBy” relationships. Corrections should primarily be implemented through versioning. The purpose of making the record citable is to ensure reproducibility of scientific results, providing guarantees that the data remains identical to that referenced, for example, in the literature. This prevents situations in which different users rely on the assumption that a given dataset is still the same, while it has in fact been modified—even if only by a minor correction."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M2"
source = "nrp-conditions"
locator = "Version 3.4, section 3"
principles = ["A1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář má webové rozhraní i API.", en = "The repository has a web interface and an API." }
guidance = "All repositories within the NRP meet this definition. In particular, they must contain citable records and provide both a web interface and an API for machine access."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M3"
source = "nrp-conditions"
locator = "Version 3.4, section 3"
principles = ["R1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář má politiku změn; preferuje verzování nebo „patch“ balíčky.", en = "The repository has a change policy; versioning or patch packages are preferred." }
guidance = "This does not imply that the NRP must enforce a single, uniform policy on corrections and modifications across all repositories. Such policies should be set according to the needs and practices of each user community. Nevertheless, every repository must define its own policy aimed at minimizing allowed changes, preferring mechanisms like versioning or separately identified “patch” bundles for larger datasets. The repository’s policy must explicitly delimit and precisely describe the scope of permitted changes. A system that allows arbitrary changes to closed records without any of the guarantees described above cannot be considered a repository."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M4"
source = "nrp-conditions"
locator = "Version 3.4, section 1"
principles = ["R1.1", "F4"]
actor = "repository"
kind = "requirement"
text = { cs = "Metadata mají permisivní licenci (odpovídající CC0), aby je šlo sklízet.", en = "Metadata have a permissive licence (equivalent to CC0) so they can be harvested." }
guidance = "Metadata exported to the NMD must have a permissive license that allows unrestricted harvesting and distribution (effectively equivalent to CC0; note that stating this requirement in terms of licensing does not have the goal to trigger discussion whether metadata is a specific object with a license)."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M5"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["F4"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář je registrován v Národním katalogu repozitářů (NKR) a svůj záznam udržuje aktuální.", en = "The repository is registered in the National Repository Catalogue (NKR) and keeps its record up to date." }
guidance = "Submit information to the National Repository Catalogue—register the repository and its parameters in the National Repository Catalogue (NKR) and send updates in case of changes. The records include metadata profiles (schemas) and the controlled vocabularies and ontologies used. Submission of information about the repository to NKR should be automated via OAI-PMH or API."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M6"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["A1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář je integrován s AAI e-INFRA CZ / EOSC CZ.", en = "The repository is integrated with the e-INFRA CZ / EOSC CZ AAI." }
guidance = "Technical integration with the e-INFRA CZ/EOSC CZ AAI systems, including the configuration of user roles and groups within the repository instance."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M7"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["F1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář přiděluje trvalé identifikátory a využívá metodickou podporu Centra PID (identifikatory.cz).", en = "The repository assigns persistent identifiers and uses the methodological support of the PID Centre (identifikatory.cz)." }
guidance = "Integrated persistent identifier (PID) assignment functionality, along with available methodological and administrative support (see identifikatory.cz)."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M8"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["F4"]
actor = "repository"
kind = "requirement"
text = { cs = "Metadata se sklízejí do NMA podle CCMM.", en = "Metadata are harvested into NMA according to CCMM." }
guidance = "Technical setup of metadata harvesting into the NMD, in accordance with the Czech Core Metadata Model."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M9"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = []
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář je zapojen do monitoringu kybernetické bezpečnosti (CESNET-CERTS, FTAS) a prochází penetračními testy.", en = "The repository takes part in cyber-security monitoring (CESNET-CERTS, FTAS) and undergoes penetration tests." }
guidance = "Inclusion in cybersecurity monitoring (CESNET-CERTS, FTAS), performing security and particularly penetration tests of systems. Incident handling and collaboration with the cybersecurity team."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M10"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = []
actor = "repository"
kind = "requirement"
text = { cs = "Systém loguje do centrálního logování.", en = "The system logs to central logging." }
guidance = "Configuration of repository system logging into the central logging system."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M11"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["A1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář má depoziční a přístupový workflow, od otevřeného po schvalovaný přístup.", en = "The repository has deposit and access workflows, from open to approved access." }
guidance = "Define the workflow for data deposition (e.g. the record approval process).\n\nDefine the workflow for data access (from open access to a process involving approval by an ethics committee or an access control committee)."
guidanceLanguage = "en"

[[clause]]
id = "NRP.M12"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["R1.3", "F2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář nasazuje metadatové profily a harmonizuje metadata podle oborových profilů.", en = "The repository deploys metadata profiles and harmonises metadata according to domain profiles." }
guidance = "Define the domain-specific metadata profiles available in the repository (in collaboration with IPs CARDS and specialists for the respective systems), utilizing tools for metadata profile management. However, implementing a metadata profile in the repository requires serialization of the profile into the repository configuration and the creation of a user interface for metadata entry and search. The NRP infrastructure will handle this for standard metadata models (i.e., CCMM). For larger and more complex metadata models, the user community/repository administrator must ensure the capacity for implementation on their side (the NRP will provide documentation and potential consultations). Define the metadata schema elements that will be exported to the NMD (mapping to the Czech Core Metadata Model). For metadata profiles that exceed the capabilities of core repository systems, collaborate on implementing their support."
guidanceLanguage = "en"

[[clause]]
id = "NRP.R1"
source = "nrp-conditions"
locator = "Version 3.4, section 4"
principles = []
actor = "repository"
kind = "recommendation"
text = { cs = "Klíčové role obsazuje více osob.", en = "Key roles are covered by more than one person." }
guidance = "Whenever this document refers to the assignment of a certain role, it does not imply any assumptions about required staffing capacity or number of individuals. However, for the sake of redundancy and continuity, it is strongly recommended that each role be covered by more than one person. At the same time, it is assumed that one person may perform multiple roles in relation to the repository and the NRP. Parts of the associated responsibilities can, of course, be delegated to other individuals—for example, the repository administrator may delegate the roles of curator, reviewer, etc."
guidanceLanguage = "en"

[[clause]]
id = "NRP.R2"
source = "nrp-conditions"
locator = "Version 3.4, section 3"
principles = []
actor = "repository"
kind = "recommendation"
text = { cs = "Repozitář konzultuje oborovou pracovní skupinu EOSC CZ.", en = "The repository consults the EOSC CZ domain working group." }
guidance = "In all cases, repositories should be established in consultation with the relevant domain-specific expert working group of EOSC, which should shape recommendations regarding appropriate structure, granularity, and domain-specific metadata models for repositories in different fields."
guidanceLanguage = "en"

[[clause]]
id = "NRP.R3"
source = "nrp-conditions"
locator = "Recommended conditions, 3"
principles = []
actor = "repository"
kind = "recommendation"
text = { cs = "Repozitáře nemají být příliš úzce specializované.", en = "Repositories should not be too narrowly specialised." }

[[clause]]
id = "NRP.R4"
source = "nrp-conditions"
locator = "Recommended conditions, 4"
principles = []
actor = "repository"
kind = "recommendation"
text = { cs = "Přednost mají instance základních systémů NRP (InvenioRDM/OARepo, CLARIN-DSpace, ASEP/ARL).", en = "Instances of the core NRP systems (InvenioRDM/OARepo, CLARIN-DSpace, ASEP/ARL) are preferred." }

[[clause]]
id = "NRP.ROLE.admin"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = []
actor = "repository"
kind = "requirement"
text = { cs = "Správce repozitáře je partnerem pro infrastrukturu, odpovídá za data a řeší incidenty.", en = "The repository administrator is the partner for the infrastructure, is responsible for the data and handles incidents." }
guidance = "Establish the role of the repository administrator. The repository administrator is the partner of the infrastructure operator (primarily the NRP project) for agreement on the configuration of the repository in all the points described below. The repository administrator also has primary responsibility for the data stored in the repository and all the settings described below (which can, of course, be delegated to other individuals as needed). The repository administrator is also informed about operational events of the repository and repository systems or the entire NRP (updates, outages, etc.). The repository administrator is also responsible for collaborating with the cybersecurity team and reporting cybersecurity incidents if they occur at the level of the repository they manage."
guidanceLanguage = "en"

[[clause]]
id = "NRP.ROLE.curator"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = ["R1.3"]
actor = "repository"
kind = "requirement"
text = { cs = "Datový kurátor stanovuje pravidla ukládání, rozhoduje o datech a harmonizuje metadata.", en = "The data curator sets deposit rules, decides on data and harmonises metadata." }
guidance = "Establish the role of a data curator, who sets general rules for the data stored in the repository (e.g. regarding retention periods based on record type) and makes decisions on specific datasets (e.g. addressing deletion requests). The curator also acts as a metadata specialist, ensuring metadata harmonization within the repository in accordance with established domain-specific metadata profiles and ensuring metadata interoperability with other systems (especially NMD). They participate in setting the domain-specific metadata profile. These roles can be separated if necessary."
guidanceLanguage = "en"

[[clause]]
id = "NRP.CS"
source = "nrp-conditions"
locator = "Version 3.4, section 4.1"
principles = []
actor = "repository"
kind = "requirement"
text = { cs = "U základních systémů NRP komunita zajišťuje metadatový profil, licence, formáty, workflow, dokumentaci, politiku, podporu L1 a záznam v NKR.", en = "For core NRP systems, the community provides the metadata profile, licences, formats, workflows, documentation, policy, first-line support and the NKR record." }
guidance = "Determine the list of licenses available in the data deposition process.\n\nDetermine the list of supported data formats that can be stored in the repository (this can even be “any”).\n\nCreate user documentation for the repository. The NRP will provide prefabricated components describing the basic functioning of individual repository systems within the NRP and recommended documentation templates. However, the user documentation must describe the metadata models used, the repository’s deposition workflow, the search interface, descriptions of group roles within the repository, and similar aspects for specific repository instances. Tools from e-INFRA CZ/NRP can be used for documentation creation, which is done in Markdown format and maintained in GIT.\n\nDescribe the repository policy, especially when a record is considered closed—this policy should clearly define when a stored record in the repository is considered finalized and what changes are permissible in finalized records (e.g. “adding a metadata item with a link to a correction or usage of the record, but nothing else”). The repository policy description can also be prepared as certification documentation (e.g. for Core Trust Seal).\n\nProvide user support (first level) for end-users of the repository. The NRP will provide optional tools for tracking user requests. Other levels of user support, which include escalated requests requiring intervention from infrastructure administrators and support for the repository administrators themselves, are covered by NRP resources."
guidanceLanguage = "en"

[[clause]]
id = "NRP.EXT"
source = "nrp-conditions"
locator = "Version 3.4, section 4.3"
principles = ["F1", "F4", "A1", "A1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Minimum pro samostatně provozované repozitáře: metadata do NMA, registrace v NKR, AAI, API, PID (ne nutně DOI), bezpečnost, monitoring, statistiky a logování.", en = "Minimum for independently operated repositories: metadata to NMA, registration in NKR, AAI, an API, PIDs (not necessarily DOI), security, monitoring, statistics and logging." }
guidance = "The administrator of a repository operated outside of NRP has full responsibility for its operation, from hardware to the repository service itself. To consider such a repository as “integrated with the NRP”, it must generally satisfy the same conditions as repositories in alternative implementations directly operated within NRP. However, the repository administrator is also responsible for operating hardware resources, system management, and complete user support. This concerns not only the repository system itself and its data storage but also other components necessary for its operation. The administrator of such a repository must ensure functionality equivalent to that provided by NRP. There are no restrictions on how this is achieved and implemented, but all functionalities must be provided in an adequate form (adequacy is primarily determined by the administrator but the administrator may be asked to provide justification of the measures by the NRP administrators).\n\nThese repositories are also subject to all provisions concerning administrators, roles, licensing settings, and other policies and conditions related to the operation of the repository. The repository must also have appropriate cybersecurity infrastructure and at least a basic level of monitoring to ensure operational quality and data collection for statistical purposes. The repository must be logged, which is essential for analysing cybersecurity incidents. The repository administrator is also responsible for sufficient compliance with legal and other regulations, depending on the nature of the data and operation."
guidanceLanguage = "en"

