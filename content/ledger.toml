guidance = "Doložený dataset musí:\n\n- být opatřen strojově zpracovatelnými a veřejně dostupnými metadaty podle FAIR principů,"
guidanceLanguage = "cs"
locator = "kap. 5.7.1, doložení datasetu, s. 15–16"

[[clause]]
