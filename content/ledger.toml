source = "os3-rules"
principles = ["F1"]
actor = "other"
kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí mít přiřazen jednoznačný, strojově čitelný perzistentní digitální identifikátor, například DOI nebo handle.", en = "A dataset output of Open Science III must have a unique, machine-readable persistent identifier, such as a DOI or a Handle." }
guidance = "Doložený dataset musí:\n\n- mít přiřazen jednoznačný, strojově čitelný perzistentní digitální identifikátor (PID) – DOI, handle apod.,"
