principles = ["I2"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Příklady slovníků: DCMI, Schema.org, GO, MeSH, Wikidata, ROR, ORCID; katalogem je FAIRsharing; pro klasifikace XKOS.", en = "Example vocabularies: DCMI, Schema.org, GO, MeSH, Wikidata, ROR, ORCID; FAIRsharing serves as a catalogue; XKOS for classifications." }
guidance = "Katalog FAIR kompatibilních slovníků a standardů nabízí stránky FAIRsharing.org.³⁸ Příklady FAIR slovníků:\n\n- DCMI Metadata Term³⁹ (obecná metadata)\n- Schema.org⁴⁰ (webová metadata)\n- Gene Ontology⁴¹ (GO) (biomedicína)\n- MeSH⁴² (Medical Subject Headings) (medicína)\n- Wikidata⁴³ (globálně propojená znalostní databáze)\n- ROR (Research Organization Registry) (identifikátory výzkumných organizací)\n- ORCID (identifikátory výzkumníků) Profil Controlled Vocabularies podporuje použití FAIR slovníků a doporučuje standard XKOS⁴⁴ (rozšíření standardu SKOS o funkcionality potřebné pro statistická a ekonomická data). Tímto bude zajištěno, že metadata budou konzistentně strukturována a snadno interpretovatelná v různých vědeckých disciplínách."
guidanceLanguage = "cs"

