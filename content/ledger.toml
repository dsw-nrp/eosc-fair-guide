# Clause ledger: every statement the guide relies on, with a stable ID and its published source.
# Field reference and ID prefixes: docs/content-model.md. Every clause of the FAIR analysis' principle table
# (A.*) is listed under its principle, so the principle explorer shows all of them.

[[clause]]
id = "A.F1.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na NRP"
principles = ["F1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Každá publikovaná datová sada má trvalý identifikátor (PID); převzaté záznamy bez PID mají aspoň stabilní URL a postup doplnění PID.", en = "Every published dataset has a persistent identifier (PID); imported records without a PID have at least a stable URL and a procedure for adding a PID." }
guidance = "Zajištění PID pro publikované datové sady: Každá publikovaná datová sada v NRP musí mít přiřazený perzistentní identifikátor (PID), který bude součástí metadat. U převzatých záznamů bez PID musí být minimálně stabilní URL a definovaný postup doplnění PID."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na NRP"
principles = ["F1"]
actor = "nrp"
kind = "requirement"
text = { cs = "NRP garantuje DOI (NC DOI / DataCite); jiné PID (Handle, ARK) lze evidovat v NMA, pokud je přiděluje repozitář.", en = "NRP guarantees DOIs (NC DOI / DataCite); other PIDs (Handle, ARK) can be recorded in NMA if the repository assigns them." }
guidance = "Podpora typů PID (rozsah): NRP bude garantovat podporu přidělování DOI pro datové sady (prostřednictvím služeb NC DOI / DataCite). V metadatech NMA bude možné evidovat i jiné uznávané PID (např. Handle, ARK), pokud je přiděluje konkrétní repozitář/instituce; NRP je však centrálně nezajišťuje a jejich dostupnost závisí na použité repozitářové platformě."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.N3"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na NRP"
principles = ["F1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Pole pro identifikátory se mapují mezi CCMM a exportními profily (DataCite, DCAT-AP).", en = "Identifier fields are mapped between CCMM and export profiles (DataCite, DCAT-AP)." }
status = "refresh"
note = { cs = "CCMM 2.0.0 se profiluje vůči DCAT-AP.", en = "CCMM 2.0.0 is profiled against DCAT-AP." }
noteSources = ["CCMM-RELEASES.01"]
guidance = "Zajistit mapování metadatových polí pro identifikátory (tj. kde je PID uveden a jaký má význam) mezi minimálním schématem NRP/CCMM a exportními profily používanými pro interoperabilitu (např. DataCite a DCAT-AP), aby se identifikátory při sklizni/exportu přenesly bez ztráty významu."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.N4"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na NRP"
principles = ["F1"]
actor = "nrp"
kind = "requirement"
text = { cs = "PID je identifikátorem záznamu v NMA a vede na landing page; distribuce mají jednoznačné odkazy a jejich PID se uvádí explicitně.", en = "The PID is the record identifier in NMA and resolves to the landing page; distributions have unambiguous links and their PIDs are stated explicitly." }
guidance = "Integrace PID do metadatového schématu: Metadatový záznam v NMA musí obsahovat PID datové sady jako identifikátor záznamu a tento PID musí být resolvovatelný na landing page konkrétní datové sady. Záznam zároveň musí obsahovat jednoznačné odkazy na distribuce (např. download URL / access URL nebo API endpoint); pokud je některé distribuci přidělen samostatný PID, musí být v metadatech uveden jako identifikátor dané distribuce a být k ní explicitně přiřazen."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.N5"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na NRP"
principles = ["F1"]
actor = "nrp"
kind = "requirement"
text = { cs = "PID musí zůstat dlouhodobě dostupné.", en = "PIDs must remain available in the long term." }
guidance = "Zajištění dlouhodobé dostupnosti PID: PID musí být trvale dostupný a spravovaný tak, aby nedocházelo k jeho zneplatnění nebo ztrátě."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na repozitáře"
principles = ["F1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář přiděluje PID při publikaci, přednostně DOI, jinak jiný uznávaný PID.", en = "The repository assigns a PID at publication, preferably a DOI, otherwise another recognised PID." }
guidance = "Přidělení PID při publikaci: Repozitář/instituce zajistí přidělení (mintování) PID každé publikované datové sadě (preferovaně DOI; alternativně jiný uznávaný PID dle možností platformy)."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.R2"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na repozitáře"
principles = ["F1"]
actor = "repository"
kind = "requirement"
text = { cs = "PID je součástí metadat a vede na landing page; distribuce se zpřístupňují podle F3 a F4.", en = "The PID is part of the metadata and resolves to the landing page; distributions are made available according to F3 and F4." }
guidance = "PID v metadatech a resolvovatelnost: PID je uveden jako identifikátor datové sady v metadatovém záznamu a resolvuje na landing page. Identifikace distribucí je řešena dle principů F3/F4 (stabilní URL; v odůvodněných případech samostatný PID distribuce)."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.R3"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na repozitáře"
principles = ["F1"]
actor = "repository"
kind = "requirement"
text = { cs = "Správa PID: landing page je vždy platná, po odstranění dat zůstává tombstone a cílové URL se aktualizují.", en = "PID management: the landing page is always valid, a tombstone remains after data removal, and target URLs are kept up to date." }
guidance = "Podpora správy a aktualizace PID: Repozitář musí zajistit dlouhodobou resolvovatelnost PID (tj. PID musí vždy vést na platnou landing page; v případě odstranění dat na tombstone page). Při změnách infrastruktury/URL repozitář zajistí aktualizaci cílové URL PID (např. v registrační službě pro DOI) a potřebná přesměrování."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na FIP"
principles = ["F1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje preferované typy PID v oboru a jejich implementaci.", en = "The FIP sets the preferred PID types in the domain and their implementation." }
guidance = "Specifikace preferovaných PID pro daný obor: FIP musí definovat, jaké typy PID jsou v daném oboru preferovány a jakým způsobem by měly být implementovány."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky na FIP"
principles = ["F1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP dává pokyny pro dlouhodobou správu PID a jejich propojení s metadaty.", en = "The FIP gives guidance on long-term PID management and on linking PIDs with metadata." }
guidance = "Doporučení pro správu PID: FIP by měl obsahovat pokyny, jak zajistit dlouhodobou správu PID a jejich propojení s dalšími metadatovými prvky."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Naplnění v NRP"
principles = ["F1"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "DOI v NRP zajišťuje Národní centrum DOI (Centrum PID v NTK): smluvní a metodickou podporu a prefix; DOI přiděluje repozitář.", en = "In NRP, DOIs are provided through the National DOI Centre (PID Centre at NTK): contractual and methodological support and a prefix; the repository mints the DOIs." }
status = "refresh"
note = { cs = "Členům NC DOI hradí NTK v letech 2023–2028 náklady na DOI přes DataCite.", en = "For NC DOI members, NTK covers the cost of DataCite DOIs in 2023–2028." }
noteSources = ["NCDOI-2023.01"]
guidance = "repozitáře Přidělování DOI bude v NRP prioritně realizováno prostřednictvím služeb Národního centra DOI (NC DOI) koordinovaného Centrem PID v NTK, které institucím zajišťuje smluvní a metodickou podporu a přístup k registrační agentuře DataCite (včetně zřízení repozitářového účtu a přidělení DOI prefixu). Samotné DOI následně přiděluje (mintuje) příslušný repozitář/instituce při publikaci záznamu; alternativně mohou repozitáře využít i jiné uznávané systémy PID (např. Handle) dle svých potřeb a možností."
guidanceLanguage = "cs"

[[clause]]
id = "A.F1.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, F1, Požadavky CTS, s. 19"
principles = ["F1"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R12|R12]]: datové sady jsou citovatelné prostřednictvím PID.", en = "CoreTrustSeal [[clause:CTS.R12|R12]]: datasets are citable through PIDs." }
guidance = "CoreTrustSeal R12 vyžaduje, aby repozitáře umožnily uživatelům vyhledávat datové sady a odkazovat na ně trvalým způsobem prostřednictvím správného citování. To znamená, že každá uložená datová sada musí mít PID, který je indexovatelný a dlouhodobě dostupný. Oba požadavky (FAIR F1 a CoreTrustSeal R12) se shodují v klíčovém aspektu: nutnosti trvalého a globálně unikátního identifikátoru pro metadata a data."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Požadavky na NRP"
principles = ["F2"]
actor = "nrp"
kind = "requirement"
text = { cs = "Minimální sadu metadat definuje Český základní metadatový model (CCMM).", en = "The minimum metadata set is defined by the Czech Core Metadata Model (CCMM)." }
status = "refresh"
note = { cs = "NMA sklízí metadata ve formátu ccmm-xml podle CCMM 1.1.0; CCMM 2.0.0 vyšel v říjnu 2026 a jeho podporu NMA připravuje (plánováno na rok 2027).", en = "NMA harvests metadata as ccmm-xml following CCMM 1.1.0; CCMM 2.0.0 was released in October 2026 and NMA is preparing to support it (planned for 2027)." }
noteSources = ["CCMM-RELEASES.01"]
guidance = "Definování sady minimálních požadavků na metadata (zajišťuje CCMM)."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Požadavky na NRP"
principles = ["F2"]
actor = "nrp"
kind = "requirement"
text = { cs = "Každá datová sada obsahuje povinná metadata, například původ a licenci.", en = "Every dataset includes the mandatory metadata, such as provenance and licence." }
guidance = "Zajištění toho, aby každá datová sada obsahovala povinná metadata, zahrnující klíčové informace o původu, licencování apod."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Požadavky na repozitáře"
principles = ["F2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář poskytuje minimální záznam, který splňuje požadavky NMA a je mapovaný na CCMM.", en = "The repository provides a minimum record that meets the NMA requirements and is mapped to CCMM." }
guidance = "Povinné zahrnutí klíčových metadatových atributů: Repozitáře musí zajistit, že každá datová sada obsahuje alespoň minimální metadatový záznam, splňující požadavky NMA, a zajistit jeho mapování na metadatový standard CCMM."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.R2"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Požadavky na repozitáře"
principles = ["F2"]
actor = "repository"
kind = "requirement"
text = { cs = "Vedle CCMM nabízí repozitář oborový profil podle FIP; FIP uvádí profil a kde je plný záznam.", en = "Alongside CCMM, the repository offers a domain profile according to the FIP; the FIP names the profile and where the full record is." }
guidance = "Podpora oborově specifických metadat: Repozitář musí umožnit, aby vedle CCMM bylo možné použít také oborový/komunitní metadatový profil popsaný ve FIP (např. jako samostatné schéma nebo rozšíření formuláře/API). Minimálně musí být ve FIP uvedeno, jaký oborový profil se používá a kde je dostupný plný oborový metadatový záznam (landing page/API), zatímco NMA sklízí CCMM jako společné minimum."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Požadavky na FIP"
principles = ["F2"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje povinné a doporučené metadatové profily oboru.", en = "The FIP sets the mandatory and recommended metadata profiles of the domain." }
guidance = "Definování požadavků na metadata pro daný obor: Každý FIP by měl obsahovat seznam povinných a doporučených metadatových profilů relevantních pro konkrétní vědeckou komunitu."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Naplnění v NRP"
principles = ["F2"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Metadata mají dvě úrovně: jádro CCMM sklízené do NMA a bohatá oborová metadata v repozitáři (landing page, API); komunity mohou CCMM rozšířit nebo dodat druhý záznam.", en = "Metadata have two levels: the CCMM core harvested into NMA, and rich domain metadata in the repository (landing page, API); communities can extend CCMM or provide a second record." }
guidance = "V kontextu NRP/NDI je důležité rozlišovat dvě úrovně metadat.\n\nPro centrální vyhledávání v NMA je sklízeno standardizované metadatové jádro (CCMM), které zajišťuje základní interoperabilitu. Plně bohatá a oborově specifická metadata zůstávají v repozitářích a jsou dostupná prostřednictvím jejich rozhraní (landing page, API). Oborové komunity si mohou CCMM pro své potřeby rozšířit nebo poskytovat vedle CCMM i druhý metadatový záznam ve svém oborovém standardu."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Naplnění v NRP"
principles = ["F2"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "CCMM udržuje pracovní skupina EOSC-CZ Metadata spolu s provozovatelem NMA a správci repozitářů.", en = "CCMM is maintained by the EOSC-CZ Metadata working group together with the NMA operator and repository managers." }
status = "refresh"
note = { cs = "Vývoj modelu popisuje web ccmm.cz; vydání jsou na GitHubu (techlib/CCMM).", en = "Model development is described at ccmm.cz; releases are on GitHub (techlib/CCMM)." }
noteSources = ["CCMM-RELEASES.01"]
guidance = "Minimální požadavky na metadata pro zařazení do NMA jsou definovány jako jednotné metadatové jádro CCMM a jsou udržovány Pracovní skupinou EOSC-CZ Metadata ve spolupráci s provozovatelem NMA a správci repozitářů."
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.X3"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Doporučení CDIF / Požadavky CTS"
principles = ["F2"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R08|R8]], [[clause:CTS.R10|R11]], [[clause:CTS.R12|R13]] a [[clause:CTS.R13|R14]] se týkají kvality metadat.", en = "CoreTrustSeal [[clause:CTS.R08|R8]], [[clause:CTS.R10|R11]], [[clause:CTS.R12|R13]] and [[clause:CTS.R13|R14]] concern metadata quality." }
guidance = "Kvality metadat se přímo či nepřímo týkají požadavky CoreTrustSeal R8, R11, R13 a R14. FAIR F2 a CoreTrustSeal jsou v přímém souladu v tom, že vyžadují bohatá, kvalitní a indexovaná metadata. Metadata musí být dostatečně detailní, aby umožnila správné vyhledávání, citování a opětovné použití dat. Metadata musí být standardizovaná, bohatá a strukturovaná tak, aby byla kompatibilní se standardy používanými danou oborovou komunitou (souvislost s R1.3, dále rovněž souvisí s licenčními metadaty, R1.1)"
guidanceLanguage = "cs"

[[clause]]
id = "A.F2.X4"
source = "analyza-fair-1.2"
locator = "kap. 3, F2, Doporučení CDIF / Požadavky CTS"
principles = ["F2"]
actor = "other"
kind = "statement"
text = { cs = "CDIF: [[clause:CDIF.Core|Discovery]] (Schema.org) a [[clause:CDIF.ConceptScheme|řízené slovníky]] (SKOS, OWL).", en = "CDIF: [[clause:CDIF.Core|Discovery]] (Schema.org) and [[clause:CDIF.ConceptScheme|controlled vocabularies]] (SKOS, OWL)." }
status = "refresh"
note = { cs = "CDIF 1.1 pojmenovává profily Core, Discovery, Concept Scheme, Codelist, Data Description, Data Structure a Manifest.", en = "CDIF 1.1 names the profiles Core, Discovery, Concept Scheme, Codelist, Data Description, Data Structure and Manifest." }
noteSources = ["CDIF.01"]
guidance = "Discovery profil podporuje použití Schema.org pro klíčová metadata, což přispívá k bohatému popisu dat. Controlled Vocabularies profil doporučuje použití SKOS a OWL pro řízené slovníky a sémantické propojení metadat."
guidanceLanguage = "cs"

[[clause]]
id = "A.F3.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, F3, Požadavky na NRP"
principles = ["F3"]
actor = "nrp"
kind = "requirement"
text = { cs = "Minimální propojení: identifikátor vede na landing page, ta obsahuje strojově čitelná metadata (JSON-LD) s odkazy na distribuce; preferovaný je signposting.", en = "Minimum linkage: the identifier resolves to the landing page, which carries machine-readable metadata (JSON-LD) with links to the distributions; signposting is preferred." }
guidance = "Zajištění jednoznačného propojení metadat a datových sad: NRP definuje minimální technickou specifikaci propojení: (i) identifikátor v metadatech (PID/URL) musí vést na landing page datové sady, (ii) landing page musí obsahovat strojově čitelná metadata (např. JSON-LD) s odkazy na distribuce, (iii) preferovaně je toto propojení doplněno signpostingem (HTTP Link hlavičky), pokud jej platforma umožňuje."
guidanceLanguage = "cs"

[[clause]]
id = "A.F3.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, F3, Požadavky na NRP"
principles = ["F3"]
actor = "nrp"
kind = "requirement"
text = { cs = "Distribuce mají jedinečné identifikátory (URL).", en = "Distributions have unique identifiers (URLs)." }
guidance = "Podpora standardizovaných identifikačních polí: Metadata musí obsahovat jedinečné identifikátory (např. URL) distribucí dat (datových souborů, API), které umožňují jednoznačnou identifikaci a zpřístupnění konkrétní distribuce."
guidanceLanguage = "cs"

[[clause]]
id = "A.F3.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, F3, Požadavky na repozitáře"
principles = ["F3"]
actor = "repository"
kind = "requirement"
text = { cs = "Propojení metadata → landing page → distribuce je strojově zjistitelné; preferovaný je signposting (nativně nebo přes reverse proxy), minimem je JSON-LD s odkazy na distribuce.", en = "The link from metadata to landing page to distributions is machine-discoverable; signposting is preferred (natively or through a reverse proxy), and JSON-LD with links to distributions is the minimum." }
guidance = "Zahrnutí identifikátoru dat do metadat: Repozitář musí implementovat strojově zjistitelné propojení: metadata → landing page → distribuce (stabilní URL/endpointy). Preferovaným mechanismem je signposting (HTTP Link hlavičky); pokud jej repozitářová platforma neumí nativně, lze jej zajistit na webové vrstvě (např. reverse proxy) nebo minimálně publikací JSON-LD metadat na landing page s explicitními odkazy na distribuce."
guidanceLanguage = "cs"

[[clause]]
id = "A.F3.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, F3, Požadavky na FIP"
principles = ["F3"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP odkazuje na metadatový profil se standardním polem pro identifikátor dat.", en = "The FIP points to a metadata profile with a standard field for the data identifier." }
guidance = "Specifikace, jakým způsobem má být identifikátor dat zahrnut do metadat: FIP musí obsahovat odkaz na metadatový profil, který definuje standardizované pole pro identifikátor dat."
guidanceLanguage = "cs"

[[clause]]
id = "A.F3.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, F3, Naplnění v NRP"
principles = ["F3"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "NRP bude požadovat jasnou metodiku tvorby odkazu na datovou sadu.", en = "NRP will require a clear method for creating the link to a dataset." }
guidance = "Zajištění jednoznačného propojení metadat a datových sad: NRP definuje minimální technickou specifikaci propojení: (i) identifikátor v metadatech (PID/URL) musí vést na landing page datové sady, (ii) landing page musí obsahovat strojově čitelná metadata (např. JSON-LD) s odkazy na distribuce, (iii) preferovaně je toto propojení doplněno signpostingem (HTTP Link hlavičky), pokud jej platforma umožňuje."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na NRP"
principles = ["F4"]
actor = "nrp"
kind = "requirement"
text = { cs = "Metadata se automaticky indexují v NMA.", en = "Metadata are indexed in NMA automatically." }
guidance = "Automatická indexace metadat: Metadata musí být automaticky indexována v NMA a zpřístupněna pro vyhledávání."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na NRP"
principles = ["F4"]
actor = "nrp"
kind = "requirement"
text = { cs = "Metadata jsou dostupná přes OAI-PMH a ve strojově čitelných exportních profilech (Schema.org/JSON-LD, DCAT-AP).", en = "Metadata are available through OAI-PMH and in machine-readable export profiles (Schema.org/JSON-LD, DCAT-AP)." }
guidance = "Podpora rozhraní a exportních profilů pro indexaci: NRP/NMA musí podporovat OAI-PMH pro sklizeň metadat a současně poskytovat metadata i ve strojově čitelných exportních profilech pro indexaci (např. Schema.org/JSON-LD pro webové vyhledávače a DCAT-AP pro katalogové/integrační scénáře), dle implementačních možností jednotlivých platforem."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.N3"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na NRP"
principles = ["F4"]
actor = "nrp"
kind = "requirement"
text = { cs = "Metadata se synchronizují s mezinárodními agregátory (OpenAIRE, DataCite Commons).", en = "Metadata are synchronised with international aggregators (OpenAIRE, DataCite Commons)." }
status = "refresh"
note = { cs = "Napojení na OpenAIRE přes EOSC Node Czechia se připravuje.", en = "The connection to OpenAIRE through EOSC Node Czechia is in preparation." }
guidance = "Registrace v mezinárodních agregátorech: Metadata by měla být pravidelně synchronizována s mezinárodními databázemi (OpenAIRE, DataCite Commons)."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.N4"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na NRP"
principles = ["F4"]
actor = "nrp"
kind = "requirement"
text = { cs = "Metadata jsou optimalizovaná pro internetové vyhledávače.", en = "Metadata are optimised for web search engines." }
guidance = "Optimalizace pro vyhledávače: Platformy podporované v NRP by měly být co nejlépe optimalizovány pro indexaci běžnými internetovými vyhledávači."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na repozitáře"
principles = ["F4"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář zpřístupňuje metadata přes OAI-PMH ve formátu CCMM (pro NMA) a Dublin Core.", en = "The repository exposes metadata through OAI-PMH in CCMM (for NMA) and Dublin Core." }
status = "refresh"
note = { cs = "NMA sklízí formát ccmm-xml; repozitáře bez nativního CCMM mohou dodat veřejnou transformaci XSLT.", en = "NMA harvests the ccmm-xml format; repositories without native CCMM can provide a public XSLT transformation." }
noteSources = ["NMA-EXPORT-DOCS.01"]
guidance = "Poskytování metadat přes OAI-PMH: Repozitáře musí pro účely automatické sklizně zpřístupnit metadata ve dvou klíčových formátech: ▫ CCMM (Czech Core Metadata Model) pro zajištění vyhledatelnosti v Národním metadatovém adresáři (NMA). ▫ Dublin Core pro splnění základních podmínek užívání protokolu OAI-PMH."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.R2"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na repozitáře"
principles = ["F4"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář nabízí strojově čitelnou reprezentaci pro indexaci, minimálně Schema.org/JSON-LD na landing page; REST API je doporučené, ne povinné minimum.", en = "The repository offers a machine-readable representation for indexing, at least Schema.org/JSON-LD on the landing page; a REST API is recommended but not part of the minimum." }
guidance = "Podpora indexace a exportu: Repozitář musí vedle OAI-PMH zajistit strojově čitelnou reprezentaci metadat pro indexaci (minimálně Schema.org/JSON-LD na landing page nebo ekvivalentní export). Strojové API (např. REST) je doporučené rozšíření pro pokročilé integrace, není však minimální podmínkou pro splnění F4."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.R3"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na repozitáře"
principles = ["F4"]
actor = "repository"
kind = "requirement"
text = { cs = "Metadata se před uložením validují.", en = "Metadata are validated before they are stored." }
guidance = "Validace metadat: Před uložením musí být metadata validována, aby byla zajištěna jejich úplnost a správnost pro efektivní indexaci."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na FIP"
principles = ["F4"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje minimální metadata pro indexaci v oborových vyhledávačích.", en = "The FIP sets the minimum metadata for indexing in domain search services." }
guidance = "Definování minimální úrovně metadat pro indexaci: FIP by měl specifikovat, jaké atributy musí metadata obsahovat, aby byla úspěšně indexována v relevantních mezinárodních vyhledávačích."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Požadavky na FIP"
principles = ["F4"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje mapování na formáty vyhledávacích systémů.", en = "The FIP sets mappings to the formats of search systems." }
guidance = "Doporučení pro kompatibilitu se standardy: FIP by měl obsahovat pokyny pro správné mapování metadat na standardizované formáty používané ve vyhledávacích systémech."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Naplnění v NRP"
principles = ["F4"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "DataCite Commons zobrazuje jen datové sady s DOI registrovaným u DataCite.", en = "DataCite Commons shows only datasets with a DOI registered with DataCite." }
guidance = "Základní metadata datových sad publikovaných v repozitářích zapojených do NRP jsou sklízena a indexována v NMA (primárně prostřednictvím OAI-PMH v profilu CCMM), aby byla vyhledatelná z jednoho místa a zároveň připravená pro další sdílení. Pro webovou a katalogovou indexaci jsou metadata zpřístupňována také ve strojově čitelných reprezentacích (např. Schema.org/JSON-LD a exportní profil typu DCAT-AP); tím je umožněna integrace do mezinárodních agregátorů (např. OpenAIRE), přičemž integrace do DataCite Commons je podmíněna DOI registrovaným u DataCite."
guidanceLanguage = "cs"

[[clause]]
id = "A.F4.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, F4, Doporučení CDIF / Požadavky CTS"
principles = ["F4"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R08|R8]] a [[clause:CTS.R12|R13]] se týkají uložených metadat a dohledatelnosti.", en = "CoreTrustSeal [[clause:CTS.R08|R8]] and [[clause:CTS.R12|R13]] concern deposited metadata and discoverability." }
guidance = "Tento princip úzce souvisí s požadavky CoreTrustSeal R8 (Uložená metadata) a R13 (Možnost vyhledávání a citování). CoreTrustSeal R8 požaduje, aby metadata byla strojově čitelná a indexovaná v odpovídajících metadatových systémech. Požadavek R13 zdůrazňuje, že metadata musí být registrována ve vyhledávačích a uživatelé musí mít možnost citovat data prostřednictvím perzistentních identifikátorů."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1, Požadavky na NRP"
principles = ["A1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Protokoly přístupu: HTTPS a OAI-PMH, v odůvodněných případech SPARQL.", en = "Access protocols: HTTPS and OAI-PMH, and SPARQL where justified." }
guidance = "Podpora protokolů: NRP musí podporovat standardní a široce používané komunikační protokoly (HTTPS, OAI-PMH). V odůvodněných případech může být rozšířeno o další protokoly, např. SPARQL pro dotazování nad metadaty."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.N2"
source = "analyza-fair-1.2"
locator = "kap. 3, A1, Požadavky na NRP"
principles = ["A1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Informace o strojovém přístupu jsou součástí metadat; signposting je doporučen; endpoint OAI-PMH je uveden v záznamu NKR.", en = "Information on machine access is part of the metadata; signposting is recommended; the OAI-PMH endpoint is given in the NKR record." }
status = "refresh"
note = { cs = "Záznam repozitáře v NKR má pole oaipmhEndpoint.", en = "The NKR repository record has an oaipmhEndpoint field." }
noteSources = ["NKR-SCHEMA.01"]
guidance = "Standardizace přístupu k metadatům: Metadata každé datové sady musí obsahovat informaci o tom, jakým způsobem jsou dostupná pro strojové zpracování. Doporučenou metodou je signposting, které pomocí HTTP hlaviček odkazuje na různé reprezentace metadat (např. ve formátu JSON-LD, RDF/XML). Odkaz na OAI-PMH endpoint repozitáře, kde jsou metadata dostupná, by měl být součástí záznamu repozitáře v Národním katalogu repozitářů (NKR)."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1, Požadavky na repozitáře"
principles = ["A1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář podporuje alespoň jeden standardizovaný protokol pro data i metadata.", en = "The repository supports at least one standardised protocol for both data and metadata." }
guidance = "Kompatibilita s podporovanými protokoly: Všechny repozitáře musí implementovat alespoň jeden standardizovaný protokol pro přístup k datům a metadatům."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1, Požadavky na FIP"
principles = ["A1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP uvádí podporované protokoly.", en = "The FIP lists the supported protocols." }
guidance = "Definování standardů pro přístup: FIP musí obsahovat seznam podporovaných protokolů."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, A1, Požadavky na FIP"
principles = ["A1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP uvádí oborově specifické protokoly.", en = "The FIP lists domain-specific protocols." }
guidance = "- Definování standardů pro přístup: FIP musí obsahovat seznam podporovaných protokolů.\n- Oborově specifické protokoly: Pokud určité obory vyžadují specifické protokoly, měly by být jasně uvedeny v příslušných FIP."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1, Doporučení CDIF / Požadavky CTS"
principles = ["A1"]
actor = "other"
kind = "statement"
text = { cs = "CoreTrustSeal [[clause:CTS.R15|R15]] se týká technické infrastruktury.", en = "CoreTrustSeal [[clause:CTS.R15|R15]] concerns technical infrastructure." }
guidance = "repozitáře Tento princip úzce souvisí s požadavkem CoreTrustSeal R15 (Technická inPožadavky na frastruktura). R15 požaduje, aby repozitáře disponovaly odpovídající technickou infrastrukturou, která zajistí spolehlivou správu a přístup k datům."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.1.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.1, Požadavky na NRP"
principles = ["A1.1"]
actor = "nrp"
kind = "requirement"
text = { cs = "Protokoly jsou otevřené a bezplatné; minimem je HTTPS a OAI-PMH, další určuje FIP.", en = "Protocols are open and free; HTTPS and OAI-PMH are the minimum, and the FIP sets any others." }
guidance = "Implementace otevřených protokolů: NRP musí zajistit, že veškerý přístup k datům a metadatům probíhá přes otevřené, bezplatné a univerzálně podporované komunikační protokoly. Minimálním požadavkem pro všechny repozitáře je podpora HTTPS pro přímý přístup a OAI-PMH pro sklizeň metadat. Podpora dalších protokolů (např. SPARQL) se řídí oborovými potřebami definovanými v příslušných FIP."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.1.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.1, Požadavky na repozitáře"
principles = ["A1.1"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitáře podporují minimálně HTTPS a OAI-PMH.", en = "Repositories support at least HTTPS and OAI-PMH." }
guidance = "Použití otevřených protokolů: Všechny repozitáře musí používat otevřené a široce přijímané protokoly pro zpřístupnění dat a metadat, minimálně však HTTPS a OAI-PMH."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.1.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.1, Požadavky na FIP"
principles = ["A1.1"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP doporučuje protokoly pro obor.", en = "The FIP recommends protocols for the domain." }
guidance = "Definice otevřených protokolů pro oborové využití: Každý FIP by měl specifikovat, které protokoly jsou doporučené pro daný obor."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.2.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.2, Požadavky na NRP"
principles = ["A1.2"]
actor = "nrp"
kind = "requirement"
text = { cs = "NRP umožní repozitářům zavést ověřování a autorizaci podle povahy dat.", en = "NRP enables repositories to introduce authentication and authorisation according to the nature of the data." }
status = "refresh"
note = { cs = "Integrace s e-INFRA CZ AAI je v provozu a je podmínkou NRP (C.M6).", en = "Integration with e-INFRA CZ AAI is in operation and is an NRP condition (C.M6)." }
noteSources = ["NRP.M6"]
guidance = "Podpora autentizačních a autorizačních protokolů: NRP musí zajistit, aby repozitáře (případně i samotná úložiště) mohla zavést nezbytné autentizační a autorizační služby, pokud to bude povaha dat vyžadovat."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.2.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.2, Požadavky na repozitáře"
principles = ["A1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Tam, kde je to nutné, se k datům přistupuje přes autentizační a autorizační protokoly.", en = "Where necessary, data are accessed through authentication and authorisation protocols." }
status = "refresh"
note = { cs = "Prostřednictvím e-INFRA CZ AAI.", en = "Through e-INFRA CZ AAI." }
noteSources = ["NRP.M6"]
guidance = "Implementace autentizačních služeb: Repozitáře musí umožňovat přístup k datům prostřednictvím autorizačních a autentizačních protokolů (např. HTTP Basic Auth, OAuth, SAML) tam, kde je to nezbytné."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.2.R2"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.2, Požadavky na repozitáře"
principles = ["A1.2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář má pravidla přístupu a úrovně oprávnění (veřejná data, data před zveřejněním, citlivá data).", en = "The repository has access rules and permission levels (public data, data before publication, sensitive data)." }
guidance = "Definice přístupových práv: Správci repozitářů musí nastavit jasná pravidla pro řízení přístupu a rozlišovat mezi různými úrovněmi oprávnění (veřejná data, data před zveřejněním, citlivá data, atd)."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.2.F1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.2, Požadavky na FIP"
principles = ["A1.2"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP dává doporučení pro bezpečný přístup.", en = "The FIP gives recommendations for secure access." }
guidance = "Doporučení ohledně bezpečnosti: FIP by měl zahrnovat doporučení pro bezpečný přístup k datům prostřednictvím autentizačních protokolů."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.2.F2"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.2, Požadavky na FIP"
principles = ["A1.2"]
actor = "fip"
kind = "requirement"
text = { cs = "FIP určuje přístupová pravidla v oboru (etická, bezpečnostní a právní omezení).", en = "The FIP sets the access rules of the domain (ethical, security and legal restrictions)." }
guidance = "Specifikace přístupových pravidel: FIP by měl obsahovat doporučení pro implementaci autentizace a autorizace v konkrétním oboru, zejména u dat, která podléhají etickým, bezpečnostním nebo právním omezením."
guidanceLanguage = "cs"

[[clause]]
id = "A.A1.2.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, A1.2, Naplnění v NRP"
principles = ["A1.2"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Ověřování a autorizaci řeší klíčová aktivita AAI s napojením na identitní federace (eduID.cz).", en = "Authentication and authorisation are handled by the AAI key activity, connected to identity federations (eduID.cz)." }
status = "refresh"
note = { cs = "Platí e-INFRA CZ AAI; pro citlivá data vyšel dokument Initial AAI architecture for sensitive data in NRP (březen 2026).", en = "e-INFRA CZ AAI applies; for sensitive data, the document Initial AAI architecture for sensitive data in NRP was published (March 2026)." }
noteSources = ["AAI-SENSITIVE.01"]
guidance = "NRP zajišťuje ověřování a autorizaci přístupu k datům prostřednictvím klíčové aktivity AAI, zaměřené na bezpečný a standardizovaný přístup k výzkumným datům. Cílem je, aby všechny repozitáře zapojené do NRP měly možnost implementovat vhodné mechanismy ověřování identity uživatelů a jejich autorizace, zejména v případě citlivých nebo omezeně dostupných dat.\n\nSystém řízení přístupu bude integrován s existujícími autentizačními službami, což zajistí kompatibilitu s národními i mezinárodními standardy a identitními federacemi (např. eduID.cz), a umožní jednotné ověřování uživatelů napříč repozitáři. Tím bude možné efektivně spravovat přístupová práva a zajistit bezpečné nakládání s daty v souladu s principy FAIR a legislativními požadavky."
guidanceLanguage = "cs"

[[clause]]
id = "A.A2.N1"
source = "analyza-fair-1.2"
locator = "kap. 3, A2, Požadavky na NRP"
principles = ["A2"]
actor = "nrp"
kind = "requirement"
text = { cs = "NRP uchová minimální záznam v NMA i poté, co data přestanou být dostupná.", en = "NRP keeps the minimum record in NMA even after the data are no longer available." }
guidance = "Požadavky na NRP bude zajištovat uchování a zveřejnění minimálního záznamu metadat v NMA, a to i v případě, že související data již nejsou dostupná."
guidanceLanguage = "cs"

[[clause]]
id = "A.A2.R1"
source = "analyza-fair-1.2"
locator = "kap. 3, A2, Požadavky na repozitáře"
principles = ["A2"]
actor = "repository"
kind = "requirement"
text = { cs = "Repozitář uchovává metadata i po odstranění dat; plný záznam zůstává v repozitáři a je mapovaný na NMA.", en = "The repository keeps the metadata after the data are removed; the full record stays in the repository, mapped to NMA." }
guidance = "Uchování metadat: Repozitáře musí zajistit, že metadata budou uchovávána i po odstranění příslušných datových sad. V rámci repozitáře musí být zachován úplný záznam metadat a musí být řádně namapován na minimální záznam v NMA."
guidanceLanguage = "cs"

[[clause]]
id = "A.A2.R2"
source = "analyza-fair-1.2"
locator = "kap. 3, A2, Požadavky na repozitáře"
principles = ["A2"]
