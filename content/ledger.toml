guidanceLanguage = "cs"

[[clause]]
id = "A.I1.X1"
source = "analyza-fair-1.2"
locator = "kap. 3, I1, Naplnění v NRP, s. 32"
principles = ["I1"]
actor = "nrp"
kind = "fulfilment"
text = { cs = "Přípustné jsou i zavedené oborové formáty (například XML); je třeba rozlišovat rámec (RDF) a serializaci (JSON-LD).", en = "Established domain formats (such as XML) are also acceptable; the framework (RDF) and the serialisation (JSON-LD) must be told apart." }
guidance = "Metadata a data mají být poskytována v sémanticky interoperabilních formátech. Doporučené jsou především frameworky umožňující propojení a strojovou interpretaci (např. RDF s různými serializacemi jako Turtle, JSON-LD, XML; nebo OWL pro ontologické modelování). Zároveň je přípustné využívat i jiné formáty, pokud jsou dostatečně standardizované a umožňují jednoznačnou výměnu a interpretaci dat (např. některé XML-based workflow používané v oborových komunitách). Rozlišujeme zde rámec (framework, např. RDF) a jeho konkrétní serializace (např. JSON-LD). Cílem není omezit se na jedinou technologii, ale podpořit interoperabilitu a opakovatelné zpracování dat v prostředí NRP/NDI."
guidanceLanguage = "cs"

[[clause]]
id = "A.I1.X2"
source = "analyza-fair-1.2"
locator = "kap. 3, I1, Doporučení CDIF / Požadavky CTS"
principles = ["I1"]
actor = "other"
kind = "statement"
text = { cs = "CDIF: [[clause:CDIF.ConceptScheme|řízené slovníky]] a [[clause:CDIF.Universals|univerzální veličiny]] (čas, geografie, jednotky); CoreTrustSeal [[clause:CTS.R13|R14]] a [[clause:CTS.R15|R15]].", en = "CDIF: [[clause:CDIF.ConceptScheme|controlled vocabularies]] and [[clause:CDIF.Universals|universals]] (time, geography, units); CoreTrustSeal [[clause:CTS.R13|R14]] and [[clause:CTS.R15|R15]]." }
status = "refresh"
note = { cs = "CDIF 1.1 to pokrývá profily Concept Scheme a Codelist a doporučeními k univerzálním veličinám.", en = "CDIF 1.1 covers this with the Concept Scheme and Codelist profiles and with guidance on universals." }
noteSources = ["CDIF.01"]
guidance = "CDIF profil Controlled Vocabularies doporučuje SKOS³⁴ pro řízené slovníky a OWL pro sémantickou interoperabilitu. Tyto technologie umožňují propojení dat s jinými zdroji v rámci Linked Open Data a zlepšují automatizovanou analýzu dat. CDIF profil³⁵ definuje standardy pro popis univerzálních konceptů, jako je čas, geografie a měrné jednotky, což je klíčové pro sjednocení různorodých datových struktur.\n\nTento princip souvisí s požadavky CoreTrustSeal R14 (Podpora opětovného použití dat) a R15 (Technická infrastruktura). R14 CoreTrustSeal požaduje, aby repozitáře zajistily, že metadata a data budou podrobně popsaná a znovu použitelná v průběhu času. R15 pak požaduje, aby repozitáře měly adekvátní technickou infrastrukturu, která umožní správné zpracování metadat v různých systémech."
guidanceLanguage = "cs"

