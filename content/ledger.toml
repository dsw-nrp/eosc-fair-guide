guidance = "Doložený dataset musí:\n\n- splňovat klíčové parametry stanovené v ZPP.\n\nU výstupů Aktivit 1 a 3 je žadatel povinen ve Studii proveditelnosti popsat klíčové parametry plánovaných výstupů. Tyto klíčové parametry budou jako závazek přeneseny do ZPP projektu a v realizaci slouží jako podklad pro hodnocení splnění výstupu."
guidanceLanguage = "cs"
