principles = ["R1.3"]
actor = "nrp"
kind = "requirement"
text = { cs = "V oborech bez standardů se standardy vyvíjejí ve spolupráci s projektem Open Science II.", en = "In domains without standards, standards are developed in cooperation with the Open Science II project." }
guidance = "Doporučení pro nové obory: Pro vědní oblasti, kde komunitní standardy dosud nejsou plně definovány, podpořit vývoj a přijetí nových standardů, ve spolupráci s projektem OSII."
guidanceLanguage = "cs"

