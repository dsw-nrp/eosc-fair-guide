kind = "requirement"
text = { cs = "Dataset jako výstup Open Science III musí mít jako autora nebo přispěvatele data stewarda, který se na výstupu podílel, bez ohledu na roli, kterou mu metadata přiřazují; dokládá se i jeho pracovní smlouva.", en = "A dataset output of Open Science III must name the data steward who worked on it as a creator or contributor, whatever role the metadata give them; their employment contract is part of the evidence." }
guidance = "Doložený dataset musí:\n\n- mít jako autora nebo přispěvatele uvedeného data stewarda, který se na výstupu podílel (musí být také doložena jeho pracovní smlouva),\n\nViz definice autora (https://vocabs.ccmm.cz/AgentRole/en/page/Creator?clang=cs) a definice přispěvatele (https://vocabs.ccmm.cz/AgentRole/en/page/Contributor?clang=cs) přičemž nezáleží na konkrétní roli, kterou má data steward přiřazenou v metadatech datasetu."
guidanceLanguage = "cs"
