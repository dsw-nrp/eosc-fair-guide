principles = ["R1"]
actor = "repository"
kind = "requirement"
text = { cs = "Minimální schéma repozitáře je v souladu s NMA.", en = "The repository's minimum schema is aligned with NMA." }
guidance = "Implementace minimálního metadatového schématu: Všechna základní metadata musí být v souladu s požadavky NMA."
guidanceLanguage = "cs"

[[clause]]
id = "A.R1.R2"
source = "analyza-fair-1.2"
locator = "kap. 3, R1, Požadavky na repozitáře"
principles = ["R1"]
actor = "repository"
kind = "requirement"
