[lifecycle]
id = "knav-tools"
position = 3
source = "knav-dm-tools-catalogue"
name = { cs = "Kroky životního cyklu v Katalogu nástrojů pro správu dat KNAV", en = "Life-cycle steps of the KNAV Data Management Tools Catalogue" }

[[stage]]
id = "planning"
name = { cs = "Plánování", en = "Planning" }
translated = "cs"
definition = "Preparing data management before a project or experiment, e.g., creating a Data Management Plan (DMP)."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "collecting"
name = { cs = "Sběr dat", en = "Collecting" }
translated = "cs"
definition = "Ensuring proper data collection, including metadata, documentation, and formats."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "organizing-collaborating"
name = { cs = "Organizace a spolupráce", en = "Organizing & Collaborating" }
translated = "cs"
definition = "Collaboration and organization of data during the research process."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "processing"
name = { cs = "Zpracování", en = "Processing" }
translated = "cs"
definition = "Cleaning, transforming, and converting data into suitable formats for further use."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "analyzing"
name = { cs = "Analýza", en = "Analyzing" }
translated = "cs"
definition = "Analyzing data to obtain results that answer research questions."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "sharing"
name = { cs = "Sdílení", en = "Sharing" }
translated = "cs"
definition = "Sharing data publicly or within teams, in compliance with legal and ethical requirements."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "storing-archiving"
name = { cs = "Ukládání a archivace", en = "Storing & Archiving" }
translated = "cs"
definition = "Ensuring long-term accessibility and integrity of data after project completion."
locator = "index.html, cycle diagram; data.js, lifecycleData"

[[stage]]
id = "reusing"
name = { cs = "Opakované užití", en = "Reusing" }
translated = "cs"
definition = "Reusing existing data for new research purposes."
locator = "index.html, cycle diagram; data.js, lifecycleData"
