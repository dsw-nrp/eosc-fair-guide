# Optional external evaluators (docs/design.md, "Optional evaluators"). Nothing runs until the reader chooses a
# service, and only the target identifier is sent to it. A metric's `name` is the provider's own wording; `label`
# is the guide's reading of it. Each mapping names the provider versions it was reviewed against; an assessment
# from another version keeps its native results as evidence without answer suggestions. Each result is read as the
# provider presents it; `whole` coverage answers as that reading, `partial` coverage answers Partly when its part is
# met and No when it fails (D-168).
[providers]
script = "assets/js/providers.js"
maxImportBytes = 2097152

