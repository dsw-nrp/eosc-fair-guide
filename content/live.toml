principle = "R1.3"
label = { cs = "Komunitní metadatový standard", en = "Community metadata standard" }

[[provider.metric]]
id = "FsF-R1.3-02D"
name = "Data is available in a file format recommended by the target research community."
principle = "R1.3"
label = { cs = "Komunitou doporučený formát souboru", en = "Community-recommended file format" }

[[provider.mapping]]
metric = "FsF-F1-02MD"
question = "dataset.01"
coverage = "whole"
note = { cs = "Úroveň 3 znamená, že F-UJI našel identifikátor metadat ve schématu trvalých identifikátorů a ověřil, že ho spravuje registrační autorita; úroveň 1 jen rozpoznal jeho zápis. Nebodované dílčí testy identifikátoru dat úroveň nemění, i když stav testu ve zprávě pak může být fail.", en = "Level 3 means that F-UJI found the metadata identifier in a persistent-identifier scheme and confirmed that a registration authority maintains it; level 1 only recognised its syntax. The unscored data-identifier subtests do not change the level, even when they leave the report's test status at fail." }

[[provider.mapping]]
metric = "FsF-F3-01M"
question = "dataset.03"
coverage = "partial"
note = { cs = "Metrika hledá odkaz na data v metadatech; odkazy na samotné stránce datové sady ověřte přímo.", en = "The metric looks for a data link in the metadata; check the links on the dataset's page itself directly." }

[[provider.mapping]]
metric = "FsF-R1.1-01M"
question = "dataset.04"
coverage = "partial"
note = { cs = "F-UJI spojuje licenční údaje z několika sklizených zdrojů. Zda je licence datové sady uvedena odkazem (URI), ukazují jednotlivé údaje s jejich zdrojem; účinná licence se z jejich souhrnu neurčuje.", en = "F-UJI combines licence statements from several harvested sources. Whether the dataset's licence is given as a link (URI) is shown by the individual statements with their sources; an effective licence is not derived from the combination." }

[[provider.mapping]]
metric = "FsF-A1-01M"
question = "dataset.10"
coverage = "whole"
note = { cs = "Úroveň 3 znamená, že F-UJI v metadatech rozpoznal úroveň přístupu (například otevřený nebo omezený přístup). Samotné podmínky zůstávají ve zdroji.", en = "Level 3 means that F-UJI recognised an access level in the metadata (for example open or restricted access). The conditions themselves remain in the source." }

[[provider.mapping]]
metric = "FsF-F2-01M"
question = "dataset.06"
coverage = "partial"
note = { cs = "Základní popisné prvky nezahrnují ověření, že odborná hesla pocházejí z řízeného slovníku.", en = "Core descriptive elements do not include confirming that subject terms come from a controlled vocabulary." }

[[provider.mapping]]
metric = "FsF-R1.2-01M"
question = "dataset.08"
coverage = "partial"
note = { cs = "Údaje o vzniku dat nemusejí popisovat metodu, přístroje a software, na které se otázka ptá.", en = "Information on data creation need not describe the method, instruments and software the question asks about." }

[[provider.mapping]]
metric = "FsF-I3-01M"
question = "dataset.09"
coverage = "partial"
note = { cs = "Kvalifikované odkazy ještě neříkají, zda jde o články, zdrojová data a verze uvedené trvalými identifikátory.", en = "Qualified references do not yet show whether they are articles, source data and versions given through persistent identifiers." }

[[provider.mapping]]
metric = "FsF-R1.3-02D"
question = "dataset.11"
coverage = "partial"
note = { cs = "Metrika posuzuje formát souborů; README nebo datový slovník neověřuje.", en = "The metric assesses file formats; it does not check for a README or a data dictionary." }

[[provider.mapping]]
metric = "FsF-R1.3-01M"
question = "dataset.14"
coverage = "partial"
note = { cs = "F-UJI rozpozná standard podle jmenných prostorů a schémat; zda je to standard vašeho oboru, posuďte sami.", en = "F-UJI recognises a standard by namespaces and schemas; judge yourself whether it is your field's standard." }

