# Live services. The page calls no host outside this list; the Content Security Policy is generated from it.
# Every call starts from a user action. Field reference: docs/content-model.md.

[[connector]]
id = "datacite"
name = "DataCite REST API"
origin = "https://api.datacite.org"
purpose = "DOI metadata and formatted citations"

[[connector]]
id = "doi"
name = "DOI resolver (doi.org)"
origin = "https://doi.org"
purpose = "Resolve a DOI to its landing page"

[[connector]]
id = "handle"
name = "Handle resolver (hdl.handle.net)"
origin = "https://hdl.handle.net"
purpose = "Resolve a Handle to its landing page"

[[connector]]
id = "orcid"
name = "ORCID public API"
origin = "https://pub.orcid.org"
purpose = "Show the name behind an ORCID iD"

[[connector]]
id = "ror"
name = "ROR API"
origin = "https://api.ror.org"
purpose = "Show the organisation behind a ROR ID"

[[connector]]
id = "nkr"
name = "National Repository Catalogue (NKR) API"
origin = "https://repo.cz"
purpose = "Repository records for the finder and the repository self-check"

[[connector]]
id = "nanopub"
name = "Nanopublication query service"
origin = "https://query.knowledgepixels.com"
purpose = "Declarations of a published FAIR Implementation Profile"

[[connector]]
id = "fip-dashboard"
name = "FIP Dashboard API"
origin = "https://fip-dashboard.dmp.eosc.cz"
purpose = "Current FIP profiles, used once the API admits the guide's origin; the snapshot serves otherwise"
# The API does not admit the guide's origin yet (CORS), so the page uses the snapshot. Set to true once it does.
browserAccess = false

[[connector]]
id = "champion"
name = "FAIR Champion (OSTrails)"
origin = "https://tests.ostrails.eu"
purpose = "Opt-in automated FAIR tests"

[[connector]]
id = "dmp-status"
name = "DMP.eosc.cz status (Upptime)"
origin = "https://raw.githubusercontent.com"
purpose = "Availability of DMP.eosc.cz"

# Link targets the page builds links to; links are not calls, and the page fetches nothing from them.
[links]
fipDashboard = "https://fip-dashboard.dmp.eosc.cz/"
nmaSearch = "https://nma.eosc.cz/datasets/"
nkr = "https://repo.cz/"
eoscHome = "https://www.eosc.cz/"
opJak = "https://opjak.cz/"

# Declarations of a published FIP nanopublication (spike in docs/design.md, "Spikes and findings"). The page puts
# the FIP's IRIs, in every published form, in place of {fips}; {code} is the nanopublication's trusty URI code.
[nanopub]
path = "repo/full"
fipIri = ["https://w3id.org/np/{code}#fip", "https://w3id.org/np/{code}/fip", "http://purl.org/np/{code}#fip"]
query = """
PREFIX fip: <https://w3id.org/fair/fip/terms/>
PREFIX npx: <http://purl.org/nanopub/x/>
PREFIX np: <http://www.nanopub.org/nschema#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT DISTINCT ?fip ?q ?rel ?fer ?ferLabel WHERE {
  VALUES ?fip { {fips} }
  GRAPH ?g1 { ?fip fip:has-declaration-index ?index . }
  GRAPH ?g2 { ?index npx:includesElement ?declNp . }
  GRAPH ?h { ?declNp np:hasAssertion ?a . }
  GRAPH ?a {
    ?d a fip:FIP-Declaration ; fip:refers-to-question ?q ; ?rel ?fer .
    FILTER(?rel IN (fip:declares-current-use-of, fip:declares-planned-use-of, fip:declares-planned-replacement-of))
  }
  OPTIONAL { GRAPH ?g3 { ?fer rdfs:label ?ferLabel . } }
} LIMIT 500
"""

# Upptime summary of DMP.eosc.cz on the status connector.
[dmpStatus]
path = "dsw-nrp/status/master/history/summary.json"

[champion]
endpoint = "https://tests.ostrails.eu/tests/assess/test"
maxParallel = 4
timeoutSeconds = 60

# Curated core set (FAIR analysis K5.2.1; OSTrails CZ pilot, E.OSTRAILS-CZ). Health comes from a probe of every
# test with a DOI and a Handle (docs/design.md); the scheduled health job keeps it current. Unavailable tests
# are hidden, degraded ones carry a warning.

[[champion.test]]
id = "fc_metadata_identifier_persistence"
principle = "F1"
label = { cs = "Identifikátor metadat je trvalý", en = "Metadata identifier is persistent" }
health = "available"
asOf = 2026-10-08

