# The large research infrastructures of the Roadmap of Large Research Infrastructures of the Czech Republic for
# 2023-2026 (2024 update), as a reviewed record of what the roadmap states, each fact cited by annex (D-174): Annex 1
# for the acronym, English name, hosting institution (the coordinator), life-cycle phase, character, year of inclusion
# and ESFRI status; Annex 7 for the European research infrastructures an infrastructure is the Czech national node of;
# Annex 6 for its ERIC memberships. Czech names come from the portal or the entry's named official source.
# Descriptions and contact details are not copied. An infrastructure operates a catalogue entry only where a source
# states it, and that source is recorded. Field reference: docs/content-model.md. The roadmap's 2027 update is
# watched (content/live.toml).

[infrastructures]
source = "lri-roadmap-2023"
namesSource = "ri-portal"
checked = 2026-10-14

