# CoreTrustSeal readiness, for repository administrators: one question per requirement of the CoreTrustSeal
# Requirements 2026-2028, which supplies the question's text, its source and its FAIR principles.

[check]
id = "coretrustseal"
name = { cs = "Připravenost na CoreTrustSeal", en = "CoreTrustSeal readiness" }
icon = "certificate"
description = { cs = "Je repozitář připraven požádat o certifikaci CoreTrustSeal? Otázky odpovídají požadavkům vydání 2026–2028 a u každé najdete pokyny CoreTrustSeal k tomu, co má žádost doložit. Odpověď Ano odpovídá v žádosti úrovni Implemented, Částečně úrovni In progress. Certifikaci uděluje CoreTrustSeal; Průvodce jen radí.", en = "Is the repository ready to apply for CoreTrustSeal certification? The questions follow the 2026–2028 requirements, and each carries CoreTrustSeal's guidance on what an application must show. Yes corresponds to the Implemented compliance level in an application, Partly to In progress. CoreTrustSeal grants the certification; the Guide only advises." }
lenses = ["SR"]
minutes = 30

