statement = { cs = "Rozhraní umožňuje zpřístupnit objekt nebo s ním provést operaci. Operace se vybírá pomocí jejího PID a je registrována jako podporovaná.", en = "The interface lets a client access or operate on the object by specifying the PID of a registered supported operation." }
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false

[[item]]
