[check]
id = "fdo"
name = { cs = "Připravenost na FAIR Digital Objects", en = "FAIR Digital Object readiness" }
icon = "list-check"
description = { cs = "Vlastní posouzení objektu a infrastruktury podle [[resources/fdo-specification|FDO Requirement Specifications 3.0]] (2023). Šest úvodních otázek; rozšířená kontrola zpřístupní všech 34 pasáží čtyř vrstev, včetně vysvětlujícího kontextu. U poskytovatele si vyžádejte doklady k jeho části. DOI ani [[resources/ro-crate|RO-Crate]] samy soulad neprokazují; kontrola nevydává certifikát.", en = "Self-assessment of an object and its infrastructure against [[resources/fdo-specification|FDO Requirement Specifications 3.0]] (2023). Six introductory questions; the extended check opens all 34 passages across four layers, including explanatory context. Ask providers for evidence of their part. A DOI or [[resources/ro-crate|RO-Crate]] alone does not establish conformance; this check issues no certificate." }
lenses = ["V", "DS", "SR", "K"]
minutes = 15

[[block]]
id = "general"
name = { cs = "Objekt a jeho vztahy", en = "Object and relationships" }
icon = "circle-nodes"

[[block]]
id = "pid"
name = { cs = "Služba PID — doloží poskytovatel", en = "PID service — provider evidence" }
icon = "fingerprint"

[[block]]
id = "object"
name = { cs = "Profil, atributy a typy", en = "Profile, attributes and types" }
icon = "layer-group"

[[block]]
id = "resources"
name = { cs = "Odkazované zdroje a důvěryhodnost", en = "Referenced resources and trustworthiness" }
icon = "server"

[[item]]
id = "fdo.01"
principles = ["F1", "A1"]
requirement = "FDO.FDOR-GR1"
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Ověřte, který objekt PID označuje a zda jej lze resolvovat. Samotný DOI dokládá identifikaci, ne všechny další vlastnosti FDO.", en = "Check which object the PID identifies and whether it resolves. A DOI alone supports identification, not all the other FDO properties." }

[[item]]
id = "fdo.02"
principles = ["A1", "I1"]
requirement = "FDO.FDOR-GR2"
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Vyžádejte si záznam PID a jeho profil. Běžná webová stránka může posloužit člověku; tento bod ověřuje strukturu a vazby, které umí použít program.", en = "Request the PID record and its profile. An ordinary web page may serve a person; this item checks structure and links that a program can use." }

[[item]]
id = "fdo.03"
principles = ["A1", "I3"]
requirement = "FDO.FDOR-GR3"
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true
help = { cs = "Posloupností bitů může být soubor s daty, metadaty nebo kódem. Umístění zde znamená síťový přístupový bod; definice typu FDO je víc než MIME typ nebo volný text „Dataset“. Bez takového obsahu zvolte „Netýká se“.", en = "A bit-sequence may be a data, metadata or code file. Location here means a network access point; an FDO type definition is more than a MIME type or a free-text “Dataset” label. Choose “Not applicable” if no such content is included." }

[[item]]
id = "fdo.04"
principles = ["I1"]
requirement = "FDO.FDO-GR4"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Porovnejte záznam s profilem a definicemi atributů. Volitelné a komunitní atributy jsou přípustné; tento bod nevyžaduje vyplnit všechny možné atributy.", en = "Compare the record with the profile and attribute definitions. Optional and community attributes are permitted; this item does not require every possible attribute." }

[[item]]
id = "fdo.05"
principles = ["A1"]
requirement = "FDO.FDO-GR5"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "V dokumentaci rozhraní rozlište PID objektu a PID operace. Odkaz na objekt nebo seznam názvů funkcí sám nedokládá registraci a vyvolání podporované operace.", en = "Distinguish the object PID from the operation PID in the interface documentation. An object link or list of function names alone does not establish registration and invocation of a supported operation." }

[[item]]
id = "fdo.06"
principles = ["A1"]
requirement = "FDO.FDO-GR6"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Ověřte specifikaci rozhraní a doklady poskytovatele; kvůli této kontrole nemažte ani neměňte produkční objekty. Specifikace navíc silně doporučuje operaci pro výpis dostupných rozšířených operací, ale nečiní z ní povinnost.", en = "Inspect the interface specification and provider evidence; do not delete or modify production objects for this check. The specification also strongly recommends an operation listing available extended operations, but does not make it mandatory." }

[[item]]
id = "fdo.07"
principles = ["I3"]
requirement = "FDO.FDO-GR7"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["community"]
allowNotApplicable = false
help = { cs = "Požádejte poskytovatele o záznamy registrů, které spojují konkrétní typ s jeho operacemi. Seznam operací bez vztahu k typu tento bod nepokrývá.", en = "Ask the provider for registry records linking the particular type to its operations. An operation list without type relationships does not cover this item." }

[[item]]
id = "fdo.08"
principles = ["I1", "I2"]
requirement = "FDO.FDO-GR8"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true
help = { cs = "Specifikace připouští metadata jako samostatné FDO; netvrdí, že tak musí být reprezentována všechna metadata. U takového FDO ověřte schéma i definice kategorií; jinak zvolte „Netýká se“.", en = "The specification permits metadata to be separate FDOs; it does not say all metadata must be represented this way. For such an FDO, check the schema and category definitions; otherwise choose “Not applicable”." }

[[item]]
id = "fdo.09"
requirement = "FDO.FDO-GR9"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Tato pasáž vysvětluje možné druhy metadat. Nevytváří samostatnou povinnost dodat všechny vyjmenované kategorie; potřebný obsah stanovují příslušný profil a další konkrétní požadavky.", en = "This passage explains possible metadata kinds. It creates no separate obligation to provide every listed category; the relevant profile and other specific requirements determine the needed content." }
context = true

[[item]]
id = "fdo.10"
principles = ["I2", "R1.3"]
requirement = "FDO.FDO-GR10"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["community"]
allowNotApplicable = false
help = { cs = "Zjistěte, kdo schéma spravuje, jak je identifikováno a zpřístupněno. Zdroj zde používá „should“ pro naplnění FAIR u schémat; nejde o požadavek na konkrétní certifikát.", en = "Identify who maintains the schema and how it is identified and accessible. The source uses “should” for schemas following FAIR; it does not require a particular certificate." }

[[item]]
id = "fdo.11"
principles = ["I1", "I3"]
requirement = "FDO.FDO-GR11"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true
help = { cs = "U kolekce prohlédněte formální popis členství a vztahů; jeden člen může patřit do více kolekcí. Pokud neposuzujete kolekci, zvolte „Netýká se“.", en = "For a collection, inspect the formal description of membership and relationships; one member may belong to several collections. Choose “Not applicable” when the assessed object is not a collection." }

[[item]]
id = "fdo.12"
principles = ["A2"]
requirement = "FDO.FDO-GR12"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Prohlédněte pravidla mazání a existující nebo testovací záznam o smazání. Kvůli kontrole objekt nemažte. Běžná chybová stránka ani vysvětlení určené pouze lidem samy neprokazují strojově interpretovatelný tombstone.", en = "Inspect deletion policy and an existing or test tombstone record. Do not delete an object for this check. An ordinary error page or human-only explanation alone does not establish a machine-interpretable tombstone." }

[[item]]
id = "fdo.13"
principles = ["I1"]
requirement = "FDO.FDO-GR13"
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Ověřte společně záznam, definici typu a formální specifikaci jeho operací. Samotná serializace v JSON či strojově čitelná landing page tento rozsah nepokrývá.", en = "Check the record, type definition and formal operation specification together. JSON serialisation or a machine-readable landing page alone does not cover this scope." }

[[item]]
id = "fdo.14"
requirement = "FDO.FDO-GR14"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Porovnejte vlastnosti konfigurace s příslušnou specifikací. Zdroj připouští různé technické uspořádání a nevyžaduje jeden konkrétní nástroj ani samostatný dokument o volbě konfigurace.", en = "Compare the configuration’s properties with the relevant specification. The source permits different technical arrangements and requires neither one particular tool nor a separate document recording the configuration choice." }

[[item]]
id = "fdo.15"
principles = ["F1"]
requirement = "FDO.FDO-GR15"
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["community"]
allowNotApplicable = false
help = { cs = "Zjistěte, co komunita považuje za užitečnou samostatnou jednotku, například soubor či kolekci. Zdroj nepředepisuje jednu úroveň pro všechny obory.", en = "Find out what the community considers a useful independent entity, such as a file or collection. The source does not prescribe one level for every domain." }

[[item]]
id = "fdo.16"
principles = ["A1.1"]
requirement = "FDO.FDO-PIDR1"
tier = "advanced"
block = "pid"
fixAt = "metadata"
owner = ["repository-admin"]
allowNotApplicable = false
help = { cs = "Vyžádejte si specifikaci protokolu a podmínky jeho použití. Tento bod se týká protokolu, nikoli tvrzení, že veškerý obsah objektu je veřejný.", en = "Request the protocol specification and terms of use. This item concerns the protocol, not a claim that all object content is public." }

[[item]]
id = "fdo.17"
principles = ["A1", "I1"]
requirement = "FDO.FDO-PIDR2"
tier = "advanced"
block = "pid"
fixAt = "metadata"
owner = ["repository-admin"]
allowNotApplicable = false
help = { cs = "Porovnejte vrácený záznam s profilem, který určuje jeho strukturu a význam. Pouhý odkaz na lidsky čitelný popis profilu strojovou zpracovatelnost neprokazuje.", en = "Compare the returned record with the profile specifying its structure and meaning. A link to a human-readable profile description alone does not establish machine actionability." }

[[item]]
id = "fdo.18"
principles = ["I1", "I2"]
requirement = "FDO.FDO-PIDR3"
tier = "advanced"
block = "pid"
fixAt = "metadata"
owner = ["repository-admin"]
allowNotApplicable = false
help = { cs = "Zkontrolujte nejen názvy polí, ale také jejich registrované definice a vazbu na profil. Tím získá program jednoznačný význam hodnot.", en = "Check field names together with their registered definitions and relationship to the profile. This gives a program an unambiguous meaning for the values." }

[[item]]
id = "fdo.19"
principles = ["F1"]
requirement = "FDO.FDO-PIDR4"
tier = "advanced"
block = "pid"
fixAt = "metadata"
owner = ["repository-admin"]
allowNotApplicable = false
help = { cs = "Požádejte poskytovatele o doklady k provozu, kapacitě a závazkům dlouhodobé správy. Jedna úspěšná resoluce neověří globální odolnost ani trvalost systému.", en = "Ask the provider for operational, capacity and long-term management evidence. One successful resolution does not verify global robustness or system persistence." }

[[item]]
id = "fdo.20"
principles = ["A1.2"]
requirement = "FDO.FDO-PIDR5"
tier = "advanced"
block = "pid"
fixAt = "metadata"
owner = ["repository-admin"]
allowNotApplicable = false
help = { cs = "Vyžádejte si pravidla oprávnění a popis bezpečnostních funkcí od poskytovatele. Nejde o povinnost šifrovat každý záznam; zdroj určuje, kdo smí změny a šifrování řídit.", en = "Request authorisation rules and a description of security capabilities from the provider. This is not an obligation to encrypt every record; the source specifies who may control changes and request encryption." }

[[item]]
id = "fdo.21"
requirement = "FDO.FDO-PIDR6"
tier = "advanced"
block = "pid"
fixAt = "metadata"
owner = ["repository-admin"]
allowNotApplicable = false
help = { cs = "Ověřte architekturu správy a zabezpečení u poskytovatele. Zámek HTTPS na veřejné stránce sám neprokazuje zabezpečení správy systému PID.", en = "Verify the management and security architecture with the provider. An HTTPS padlock on a public page alone does not establish security of PID-system management." }

[[item]]
id = "fdo.22"
principles = ["I1", "R1.3"]
requirement = "FDO.FDO-FDOR1"
tier = "basic"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Prohlédněte záznam, odkaz na profil a registraci jeho schématu. Pouhé zveřejnění obecného metadatového schématu nedokládá shodu konkrétního záznamu.", en = "Inspect the record, its profile reference and the schema’s registration. Publication of a general metadata schema alone does not establish conformance of the particular record." }

[[item]]
id = "fdo.23"
principles = ["I1", "I2"]
requirement = "FDO.FDO-FDOR2"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Porovnejte použité atributy s profilem a s jejich registrovanými definicemi. Volně zvolené názvy polí bez společného významu tento bod nepokrývají.", en = "Compare the attributes in use with the profile and their registered definitions. Arbitrary field names without shared meaning do not cover this item." }

[[item]]
id = "fdo.24"
principles = ["I1"]
requirement = "FDO.FDO-FDOR3"
tier = "basic"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Povinnou sadu určuje použitý profil. Ověřte její přítomnost a význam; nerozšiřujte ji automaticky o všechny volitelné atributy.", en = "The profile in use determines the mandatory set. Check its presence and meaning; do not automatically expand it to every optional attribute." }

[[item]]
id = "fdo.25"
principles = ["I1", "I2"]
requirement = "FDO.FDO-FDOR4"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true
help = { cs = "Volitelné atributy nejsou povinnou částí každého záznamu. Pro použité atributy ověřte definice a strojový výklad; pokud žádné takové atributy nepoužíváte, zvolte „Netýká se“.", en = "Optional attributes are not mandatory in every record. For attributes in use, check definitions and machine interpretation; choose “Not applicable” when none are used." }

[[item]]
id = "fdo.26"
principles = ["F2", "A1"]
requirement = "FDO.FDO-FDOR5"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true
help = { cs = "Prohlédněte obsah záznamu FDO a jeho odkazy; samotný odkaz ke stažení obsahu nenahrazuje bohatý metadatový popis. Pokud FDO takový obsah nezahrnuje, zvolte „Netýká se“.", en = "Inspect the FDO record’s contents and references; a content download link alone does not cover a rich metadata description. Choose “Not applicable” if no such content is included." }

[[item]]
id = "fdo.27"
principles = ["I1"]
requirement = "FDO.FDO-FDOR6"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Ověřte definici typu a jeho použití programem. MIME typ, přípona souboru či obecné označení „Dataset“ samy registrovaný typ FDO neprokazují.", en = "Check the type definition and its use by a program. A MIME type, file extension or general “Dataset” label alone does not establish a registered FDO type." }

[[item]]
id = "fdo.28"
principles = ["I1"]
requirement = "FDO.FDO-FDOR7"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true
help = { cs = "Zkontrolujte typy jednotlivých zahrnutých částí, nejen označení celého balíčku. Bez zahrnutých posloupností bitů zvolte „Netýká se“.", en = "Check the types of included content parts, not only the label of the whole package. Choose “Not applicable” if no bit-sequences are included." }

[[item]]
id = "fdo.29"
requirement = "FDO.FDO-FDOR8"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Jde o povolené možnosti typování. Tato pasáž sama nevyžaduje dokumentovat volbu ani vytvořit nový typ; definici a identifikaci použitého typu řeší další konkrétní body.", en = "These are permitted typing choices. This passage alone requires neither documenting the choice nor creating a new type; other specific items cover the definition and identification of the type in use." }
context = true

[[item]]
id = "fdo.30"
principles = ["I1", "I2"]
requirement = "FDO.FDO-FDO9"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Prohlédněte formální definici typu. Může být strukturovaná a záviset na dalších FDO, ale zdroj tuto možnost nečiní povinnou pro každý typ.", en = "Inspect the formal type definition. It may be structured and depend on other FDOs, but the source does not make this possibility mandatory for every type." }

[[item]]
id = "fdo.31"
principles = ["F1", "A1"]
requirement = "FDO.FDO-FDO10"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Resolvujte PID typu a ověřte, že cílem je jeho definice. Identifikátor posuzovaného objektu a identifikátor jeho typu mají odlišné úlohy.", en = "Resolve the type PID and verify that it leads to its definition. The assessed object’s identifier and its type’s identifier serve different purposes." }

[[item]]
id = "fdo.32"
principles = ["I1"]
requirement = "FDO.FDO-FDO11"
tier = "advanced"
block = "object"
fixAt = "metadata"
owner = ["community"]
allowNotApplicable = false
help = { cs = "Tato pasáž popisuje úlohu rámce typů. Konkrétní definici, přiřazení a identifikaci typu posuzují ostatní body této vrstvy.", en = "This passage describes the role of the type framework. Other items in this layer assess the particular type’s definition, attachment and identification." }
context = true

[[item]]
id = "fdo.33"
principles = ["I3"]
requirement = "FDO.FDO-RESR1"
tier = "advanced"
block = "resources"
fixAt = "publication"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Zahrňte odkazovaná data, metadata, definice i další zdroje. Posuďte je podle jejich povahy; funkční odkaz ověřuje dostupnost, nikoli celé naplnění FAIR.", en = "Include referenced data, metadata, definitions and other resources. Assess them according to their nature; a working link checks accessibility, not complete FAIR compliance." }

[[item]]
id = "fdo.34"
requirement = "FDO.FDO-RESR2"
tier = "advanced"
block = "resources"
fixAt = "publication"
owner = ["curator", "repository-admin"]
allowNotApplicable = false
help = { cs = "Vyžádejte si datum, rozsah a výsledek posouzení od poskytovatele. Zdroj tento postup doporučuje; [[resources/coretrustseal|CoreTrustSeal]] je příklad standardu, nikoli jediná přijatelná volba ani povinnost mít jeho certifikát.", en = "Ask the provider for the assessment’s date, scope and outcome. The source recommends this practice; [[resources/coretrustseal|CoreTrustSeal]] is an example standard, not the only accepted option or a requirement to hold its certificate." }
