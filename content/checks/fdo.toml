[check]
id = "fdo"
name = { cs = "Připravenost na FAIR Digital Objects", en = "FAIR Digital Object readiness" }
icon = "list-check"
description = { cs = "Vlastní posouzení objektu a infrastruktury podle FDO Requirement Specifications 3.0 (2023), navrhovaného doporučení. Šest úvodních otázek, v rozšířené kontrole všech 34 požadavků čtyř vrstev. U poskytovatele si vyžádejte doklady k jeho části. DOI ani RO-Crate samy soulad neprokazují; kontrola nevydává certifikát.", en = "Self-assessment of an object and its infrastructure against FDO Requirement Specifications 3.0 (2023), a Proposed Recommendation. Six introductory questions; the extended check covers all 34 requirements across four layers. Ask providers for evidence of their part. A DOI or RO-Crate alone does not establish conformance; this check issues no certificate." }
lenses = ["V", "DS", "SR", "K"]
minutes = 15

[[block]]
id = "general"
name = { cs = "Objekt a jeho vztahy", en = "Object and relationships" }

[[block]]
id = "pid"
name = { cs = "Služba PID — doloží poskytovatel", en = "PID service — provider evidence" }

[[block]]
id = "object"
name = { cs = "Profil, atributy a typy", en = "Profile, attributes and types" }

[[block]]
id = "resources"
name = { cs = "Odkazované zdroje a důvěryhodnost", en = "Referenced resources and trustworthiness" }

[[item]]
id = "fdo.01"
requirement = "FDO.FDOR-GR1"
statement = { cs = "Každý posuzovaný objekt má celosvětově jednoznačný a trvalý identifikátor (PID), pomocí kterého lze objekt dohledat.", en = "Each assessed object has a globally unique, persistent identifier (PID) that can be resolved to locate the object." }
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false

[[item]]
id = "fdo.02"
requirement = "FDO.FDOR-GR2"
statement = { cs = "Pomocí PID lze získat strukturovaný záznam podle určeného profilu, z něhož program dohledá objekt.", en = "Resolving the PID returns a structured record following a specified profile, from which a program can locate the object." }
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false

[[item]]
id = "fdo.03"
requirement = "FDO.FDOR-GR3"
statement = { cs = "Má-li objekt datový obsah, záznam uvádí odkaz na tento obsah a definici jeho typu.", en = "If the object has data content, the record provides its access location and type definition." }
tier = "basic"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = true

[[item]]
id = "fdo.04"
requirement = "FDO.FDO-GR4"
statement = { cs = "Záznam obsahuje atributy požadované profilem; profil rozlišuje vložené hodnoty a odkazy.", en = "The record contains profile-required attributes; the profile distinguishes embedded values from references." }
tier = "advanced"
block = "general"
fixAt = "metadata"
owner = ["curator", "repository-admin"]
allowNotApplicable = false

[[item]]
id = "fdo.05"
