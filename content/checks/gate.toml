# NRP onboarding gate for repository administrators. The list depends on the repository profile. Field reference:
# docs/content-model.md.

[check]
id = "gate"
name = { cs = "Podmínky NRP", en = "NRP conditions" }
icon = "door-open"
description = { cs = "Splňuje repozitář podmínky pro zapojení do NRP? Nejdřív zvolte profil repozitáře; seznam se podle něj upraví. Zvažte také doporučení NRP: nespecializovat repozitář příliš úzce a dát přednost základním systémům NRP. O zapojení rozhoduje NRP; Průvodce jen radí.", en = "Does the repository meet the conditions for joining NRP? First choose the repository profile; the list adapts to it. Also consider the NRP recommendations: do not specialise the repository too narrowly, and prefer the core NRP systems. NRP decides on joining; the Guide only advises." }
lenses = ["SR"]
minutes = 10

[[check.profile]]
id = "core-system"
label = { cs = "Instance základního systému NRP (InvenioRDM/OARepo, CLARIN-DSpace, ASEP/ARL)", en = "Instance of a core NRP system (InvenioRDM/OARepo, CLARIN-DSpace, ASEP/ARL)" }

[[check.profile]]
id = "nrp-infrastructure"
label = { cs = "Alternativní systém na infrastruktuře NRP", en = "Alternative system on NRP infrastructure" }

[[check.profile]]
id = "independent"
label = { cs = "Samostatně provozovaný existující repozitář", en = "Independently operated existing repository" }

[[item]]
id = "gate.01"
tier = "required"
principles = ["F1"]
statement = { cs = "Záznamy jsou citovatelné, mají PID a repozitář popisuje záruku jejich neměnnosti.", en = "Records are citable and have PIDs, and the repository describes how their immutability is guaranteed." }
sources = ["NRP.M1"]
fixAt = "publication"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["pidType"] }

[[item]]
id = "gate.02"
tier = "required"
principles = ["A1"]
statement = { cs = "Repozitář má webové rozhraní i API pro strojový přístup.", en = "The repository has a web interface and an API for machine access." }
sources = ["NRP.M2", "NRP.EXT"]
fixAt = "collect"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["restApi"] }

[[item]]
id = "gate.03"
tier = "required"
principles = ["R1"]
statement = { cs = "Repozitář má politiku změn (verzování nebo „patch“ balíčky).", en = "The repository has a change policy (versioning or patch packages)." }
sources = ["NRP.M3"]
fixAt = "publication"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["versioning"] }

[[item]]
id = "gate.04"
tier = "required"
principles = ["R1.1"]
statement = { cs = "Metadata mají permisivní licenci (odpovídající CC0), která umožňuje sklizeň.", en = "Metadata have a permissive licence (equivalent to CC0) that allows harvesting." }
sources = ["NRP.M4"]
fixAt = "licence"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]

[[item]]
id = "gate.05"
tier = "required"
principles = ["F4"]
statement = { cs = "Repozitář je registrován v [[nkr|NKR]] a záznam je aktuální.", en = "The repository is registered in [[nkr|NKR]] and its record is up to date." }
help = { cs = "NKR je národní katalog repozitářů; záznam v něm hledají výzkumníci i NRP.", en = "NKR is the national repository catalogue; researchers and NRP look for repositories there." }
sources = ["NRP.M5", "NRP.EXT"]
fixAt = "repository"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["@record"] }

[[item]]
id = "gate.06"
tier = "required"
principles = ["A1.2"]
statement = { cs = "Repozitář je napojen na AAI e-INFRA CZ včetně rolí a skupin.", en = "The repository is connected to the e-INFRA CZ AAI, including roles and groups." }
sources = ["NRP.M6", "NRP.EXT", "AAI-NRP.01", "NRP-AAI-INTEGRATION.01"]
fixAt = "licence"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["aaiIntegration"] }

[[item]]
id = "gate.07"
tier = "required"
principles = ["F1"]
statement = { cs = "Repozitář přiděluje trvalé identifikátory (DOI nebo jiné) a ví, kde hledat metodickou podporu.", en = "The repository assigns persistent identifiers (DOI or others) and knows where to find methodological support." }
help = { cs = "DOI je doporučený identifikátor; přijatelné jsou i jiné trvalé, resolvovatelné a spravované identifikátory.", en = "DOI is the recommended identifier; other persistent, resolvable and managed identifiers are acceptable." }
sources = ["NRP.M7", "NRP.EXT", "A.F1.N2"]
fixAt = "publication"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["pidType"] }

[[item]]
id = "gate.08"
tier = "required"
principles = ["F4"]
statement = { cs = "Metadata se sklízejí do [[nma|NMA]] podle [[ccmm|CCMM]].", en = "Metadata are harvested into [[nma|NMA]] according to [[ccmm|CCMM]]." }
sources = ["NRP.M8", "NMA-EXPORT-DOCS.01"]
fixAt = "findability"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["oaipmhEndpoint"] }
prefillLevel = "partly"

[[item]]
id = "gate.09"
tier = "required"
principles = []
statement = { cs = "Repozitář je zapojen do monitoringu kybernetické bezpečnosti a prochází penetračními testy.", en = "The repository takes part in cyber-security monitoring and undergoes penetration tests." }
sources = ["NRP.M9", "NRP.EXT", "OS2-KB1.02", "AAI-NRP.02", "OS2-KB1.01"]
fixAt = "repository"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
providedByNrp = ["core-system"]

[[item]]
id = "gate.10"
tier = "required"
principles = []
statement = { cs = "Systém loguje do centrálního logování.", en = "The system logs to central logging." }
sources = ["NRP.M10", "NRP.EXT", "OS2-KB1.03"]
fixAt = "repository"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
providedByNrp = ["core-system"]

[[item]]
id = "gate.11"
tier = "required"
principles = ["A1.2"]
statement = { cs = "Je definován workflow ukládání (schvalování) i přístupu.", en = "Deposit (approval) and access workflows are defined." }
sources = ["NRP.M11"]
fixAt = "licence"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]

[[item]]
id = "gate.12"
tier = "required"
principles = ["R1.3"]
statement = { cs = "Jsou nasazeny metadatové profily a metadata se harmonizují.", en = "Metadata profiles are deployed, and metadata are harmonised." }
sources = ["NRP.M12"]
fixAt = "metadata"
owner = ["repository-admin", "curator"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["metadataSchema"] }
prefillLevel = "partly"

[[item]]
id = "gate.13"
tier = "required"
principles = []
statement = { cs = "Role správce repozitáře je obsazena.", en = "The repository administrator role is filled." }
sources = ["NRP.ROLE.admin"]
fixAt = "repository"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["mainContact"] }

[[item]]
id = "gate.14"
tier = "required"
principles = []
statement = { cs = "Role datového kurátora je obsazena.", en = "The data curator role is filled." }
sources = ["NRP.ROLE.curator"]
fixAt = "metadata"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]

[[item]]
id = "gate.15"
tier = "required"
principles = ["R1.1"]
statement = { cs = "Seznam licencí a podporovaných formátů je zveřejněn.", en = "The list of licences and supported formats is published." }
sources = ["NRP.CS"]
fixAt = "licence"
owner = ["community", "repository-admin"]
profiles = ["core-system", "nrp-infrastructure"]
prefill = { nkr = ["license"] }

[[item]]
id = "gate.16"
tier = "required"
principles = ["R1"]
statement = { cs = "Existuje uživatelská dokumentace a popis politiky repozitáře, zejména kritéria pro dokončení záznamu.", en = "There is user documentation and a description of the repository's policy, especially the criteria for finalising a record." }
sources = ["NRP.CS"]
fixAt = "repository"
owner = ["community", "repository-admin"]
profiles = ["core-system", "nrp-infrastructure"]
prefill = { nkr = ["documentationUser", "policy"] }

[[item]]
id = "gate.17"
tier = "required"
principles = []
statement = { cs = "Je zajištěna podpora uživatelů první úrovně.", en = "First-line user support is provided." }
sources = ["NRP.CS", "NRP-SUPPORT.01"]
fixAt = "plan"
owner = ["community", "repository-admin"]
profiles = ["core-system", "nrp-infrastructure"]
prefill = { nkr = ["serviceQueue"] }

[[item]]
id = "gate.18"
tier = "required"
principles = []
statement = { cs = "Je zajištěn provozní monitoring a sběr statistik.", en = "Operational monitoring and usage statistics are in place." }
sources = ["NRP.EXT"]
fixAt = "repository"
owner = ["repository-admin"]
profiles = ["nrp-infrastructure", "independent"]

[[item]]
id = "gate.19"
tier = "recommended"
principles = []
statement = { cs = "Klíčové role jsou pokryty více osobami a repozitář konzultuje oborovou pracovní skupinu EOSC CZ.", en = "Key roles are covered by more than one person, and the repository consults the EOSC CZ domain working group." }
sources = ["NRP.R1", "NRP.R2"]
fixAt = "repository"
owner = ["repository-admin"]
profiles = ["core-system", "nrp-infrastructure", "independent"]
prefill = { nkr = ["workingGroup"] }
prefillLevel = "partly"
