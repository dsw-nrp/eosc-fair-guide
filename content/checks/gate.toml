# NRP onboarding gate for repository administrators. The list depends on the repository profile. Field reference:
# docs/content-model.md.

[check]
id = "gate"
name = { cs = "Podmínky NRP", en = "NRP conditions" }
icon = "door-open"
description = { cs = "Splňuje repozitář podmínky pro zapojení do NRP? Nejdřív zvolte profil repozitáře; seznam se podle něj upraví. Zvažte také doporučení NRP: nespecializovat repozitář příliš úzce a dát přednost základním systémům NRP. O zapojení rozhoduje NRP; průvodce jen radí.", en = "Does the repository meet the conditions for joining NRP? First choose the repository profile; the list adapts to it. Also consider the NRP recommendations: do not specialise the repository too narrowly, and prefer the core NRP systems. NRP decides on joining; the guide only advises." }
lenses = ["SR"]
minutes = 10

[[check.profile]]
id = "a"
label = { cs = "Instance základního systému NRP (InvenioRDM/OARepo, CLARIN-DSpace, ASEP/ARL)", en = "Instance of a core NRP system (InvenioRDM/OARepo, CLARIN-DSpace, ASEP/ARL)" }

[[check.profile]]
id = "b"
label = { cs = "Alternativní systém na infrastruktuře NRP", en = "Alternative system on NRP infrastructure" }

[[check.profile]]
id = "c"
label = { cs = "Samostatně provozovaný existující repozitář", en = "Independently operated existing repository" }

[[item]]
id = "G01"
tier = "required"
principles = ["F1"]
statement = { cs = "Záznamy jsou citovatelné, mají PID a repozitář popisuje záruku jejich neměnnosti.", en = "Records are citable and have PIDs, and the repository describes how their immutability is guaranteed." }
sources = ["C.M1"]
fixAt = "publikace"
owner = ["repository-admin"]
profiles = ["a", "b", "c"]
prefill = { nkr = ["pidType"] }

[[item]]
id = "G02"
tier = "required"
principles = ["A1"]
statement = { cs = "Repozitář má webové rozhraní i API pro strojový přístup.", en = "The repository has a web interface and an API for machine access." }
sources = ["C.M2", "C.EXT"]
fixAt = "prace"
owner = ["repository-admin"]
profiles = ["a", "b", "c"]
prefill = { nkr = ["restApi"] }

[[item]]
id = "G03"
tier = "required"
principles = ["R1"]
statement = { cs = "Repozitář má politiku změn (verzování nebo „patch“ balíčky).", en = "The repository has a change policy (versioning or patch packages)." }
sources = ["C.M3"]
fixAt = "publikace"
owner = ["repository-admin"]
profiles = ["a", "b", "c"]
prefill = { nkr = ["versioning"] }

[[item]]
id = "G04"
tier = "required"
principles = ["R1.1"]
statement = { cs = "Metadata mají permisivní licenci (odpovídající CC0), která umožňuje sklizeň.", en = "Metadata have a permissive licence (equivalent to CC0) that allows harvesting." }
sources = ["C.M4"]
fixAt = "licence"
owner = ["repository-admin"]
profiles = ["a", "b", "c"]

[[item]]
id = "G05"
tier = "required"
principles = ["F4"]
statement = { cs = "Repozitář je registrován v NKR a záznam je aktuální.", en = "The repository is registered in NKR and its record is up to date." }
help = { cs = "NKR je národní katalog repozitářů; záznam v něm hledají výzkumníci i NRP.", en = "NKR is the national repository catalogue; researchers and NRP look for repositories there." }
sources = ["C.M5", "C.EXT"]
fixAt = "repozitar"
owner = ["repository-admin"]
profiles = ["a", "b", "c"]
prefill = { nkr = ["@record"] }

[[item]]
id = "G06"
