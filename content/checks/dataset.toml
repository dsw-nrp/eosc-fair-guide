# Dataset check for researchers and data stewards, in a before-publication and an after-publication mode.
# Field reference: docs/content-model.md.

[check]
id = "dataset"
name = { cs = "Kontrola datové sady", en = "Dataset check" }
icon = "magnifying-glass-chart"
description = { cs = "Jak FAIR je vaše datová sada? Před zveřejněním projdete otázky k plánu, po zveřejnění otázky k hotovému záznamu. Odpovědi zůstávají ve vašem prohlížeči a průvodce nepočítá žádné skóre.", en = "How FAIR is your dataset? Before publication you go through questions about the plan, after publication questions about the published record. Your answers stay in your browser, and the guide computes no score." }
lenses = ["V", "DS"]
minutes = 5
modes = ["before", "after"]
defaultProfile = "none"

# A dataset funded as a programme output: its requirements show when the programme is picked.

[[check.profile]]
id = "none"
label = { cs = "Bez programu", en = "No programme" }

[[check.profile]]
id = "os3"
label = { cs = "Open Science III: FAIR dataset", en = "Open Science III: FAIR dataset" }

[[check.profile]]
id = "minizamer"
label = { cs = "Open Science II: minizáměr", en = "Open Science II: mini-project" }

[[item]]
id = "P01"
tier = "minimum"
principles = ["R1"]
statement = { cs = "Máte plán správy dat (DMP).", en = "You have a data management plan (DMP)." }
help = { cs = "Plán popisuje, jaká data vzniknou, jak je popíšete, kam je uložíte a za jakých podmínek je zpřístupníte.", en = "The plan describes which data you will create, how you will describe them, where you will deposit them and on what terms you will make them available." }
sources = ["K2.3.1", "E.DMP"]
fixAt = "plan"
owner = ["user"]
modes = ["before"]

[[item]]
id = "P02"
tier = "minimum"
principles = ["F1", "F4"]
statement = { cs = "Víte, do kterého repozitáře data uložíte, a ten přiděluje trvalý identifikátor.", en = "You know which repository you will deposit the data in, and it assigns a persistent identifier." }
sources = ["A.R1.3.X1", "A.F1.R1"]
fixAt = "repozitar"
owner = ["user"]
modes = ["before"]

[[item]]
id = "P03"
tier = "minimum"
principles = ["R1.1", "A1.2"]
statement = { cs = "Máte rozmyšlenou licenci a režim přístupu.", en = "You have decided on the licence and the access mode." }
sources = ["A.R1.1.R1", "A.A1.2.R2"]
fixAt = "licence"
owner = ["user"]
modes = ["before"]

[[item]]
id = "P04"
tier = "recommended"
principles = ["R1.2"]
statement = { cs = "Data průběžně dokumentujete (README, záznam postupu).", en = "You document the data as you go (README, a record of how they were made)." }
sources = ["A.R1.2.X1", "E.CESSDA-DMEG"]
fixAt = "prace"
owner = ["user"]
modes = ["before"]

[[item]]
id = "P05"
tier = "recommended"
principles = ["A1.2"]
statement = { cs = "Pokud pracujete s citlivými daty, víte, kdo vám poradí.", en = "If you work with sensitive data, you know who can advise you." }
sources = ["E.DATA-STEWARDS", "E.ETHICS-SEVEN"]
fixAt = "plan"
owner = ["user", "data-steward"]
modes = ["before"]
allowNotApplicable = true

[[item]]
id = "D01"
tier = "minimum"
principles = ["F1"]
statement = { cs = "Datová sada má trvalý identifikátor (DOI, Handle nebo jiný).", en = "The dataset has a persistent identifier (DOI, Handle or another)." }
sources = ["S.MIN1", "A.F1.R1"]
fixAt = "publikace"
owner = ["repository-admin"]
modes = ["after"]
prefill = { resolver = true, datacite = ["doi"] }

[[item]]
id = "D02"
tier = "minimum"
principles = ["F1", "A1"]
statement = { cs = "Identifikátor vede na stránku datové sady (landing page).", en = "The identifier leads to the dataset's page (landing page)." }
sources = ["A.F1.R2"]
fixAt = "publikace"
owner = ["repository-admin"]
modes = ["after"]
prefill = { resolver = true, champion = ["fc_metadata_identifier_persistence"] }

[[item]]
id = "D03"
tier = "minimum"
principles = ["F3"]
statement = { cs = "Ze stránky datové sady vedou odkazy na soubory nebo jiný přístup k datům.", en = "The dataset's page links to the files or to another way of accessing the data." }
sources = ["S.MIN3", "A.F3.N1"]
fixAt = "publikace"
owner = ["repository-admin"]
modes = ["after"]
prefill = { champion = ["fc_data_identifier_in_metadata"] }

[[item]]
id = "D04"
tier = "minimum"
principles = ["R1.1"]
statement = { cs = "Licence je uvedena odkazem (URI), ne jen názvem.", en = "The licence is given as a link (URI), not only by name." }
sources = ["S.MIN3", "A.R1.1.X1"]
fixAt = "licence"
owner = ["user", "repository-admin"]
modes = ["after"]
prefill = { datacite = ["rightsList[].rightsUri"], champion = ["fc_metadata_includes_license"] }

[[item]]
id = "D05"
tier = "minimum"
principles = ["F4"]
statement = { cs = "Datová sada je v Národním metadatovém adresáři ([[nma|NMA]]).", en = "The dataset is in the [[nma|National Metadata Directory (NMA)]]." }
help = { cs = "Vyhledejte ji v NMA podle PID; pokud tam není, můžete záznam založit sami.", en = "Search for it in NMA by its PID; if it is not there, you can create the record yourself." }
note = { cs = "Potřebné pro vykázání datové sady v RIV jako výsledku typu T.", en = "Needed for reporting the dataset in RIV as a result of type T." }
sources = ["DOC.NMA.RIV", "S.MIN2"]
fixAt = "dohledatelnost"
owner = ["user", "repository-admin"]
modes = ["after"]
allowNotApplicable = true
lookup = "nmaSearch"

[[item]]
id = "D06"
tier = "recommended"
principles = ["F2", "I2"]
statement = { cs = "Popis obsahuje název, abstrakt a klíčová slova; odborná hesla jsou z řízeného slovníku.", en = "The description includes a title, an abstract and keywords; subject terms come from a controlled vocabulary." }
sources = ["A.F2.N2", "A.I2.R1"]
fixAt = "popis"
owner = ["user"]
modes = ["after"]
prefill = { datacite = ["descriptions", "subjects[].subjectScheme"] }

[[item]]
id = "D07"
tier = "recommended"
principles = ["I2", "I3"]
statement = { cs = "Autoři mají [[orcid|ORCID]] a instituce [[ror|ROR]].", en = "Authors have [[orcid|ORCID]] iDs and institutions have [[ror|ROR]] IDs." }
sources = ["A.I2.R2"]
fixAt = "popis"
owner = ["user"]
modes = ["after"]
prefill = { datacite = ["creators[].nameIdentifiers", "creators[].affiliation"], champion = ["community_metadata_includes_author_affiliation"] }

[[item]]
id = "D08"
tier = "recommended"
principles = ["R1.2"]
statement = { cs = "Je popsáno, jak data vznikla (metoda, přístroje, software).", en = "It is described how the data were made (method, instruments, software)." }
sources = ["A.R1.2.X1"]
fixAt = "popis"
owner = ["user"]
modes = ["after"]
prefill = { datacite = ["descriptions[descriptionType=Methods]"] }

[[item]]
id = "D09"
tier = "recommended"
principles = ["I3", "R1.2"]
statement = { cs = "Vazby na články, zdrojová data a předchozí verze jsou uvedeny pomocí trvalých identifikátorů.", en = "Links to articles, source data and previous versions are given through persistent identifiers." }
sources = ["A.I3.R3", "A.R1.2.N3"]
fixAt = "popis"
owner = ["user"]
modes = ["after"]
prefill = { datacite = ["relatedIdentifiers"], champion = ["fc_metadata_outward_links"] }

[[item]]
id = "D10"
tier = "recommended"
principles = ["A1.2"]
statement = { cs = "Podmínky přístupu jsou popsané (otevřený, embargo, omezený).", en = "The access conditions are described (open, embargoed, restricted)." }
sources = ["A.A1.2.R2"]
fixAt = "licence"
owner = ["user", "repository-admin"]
modes = ["after"]
prefill = { datacite = ["rightsList"] }

[[item]]
id = "D11"
tier = "recommended"
principles = ["I1", "R1"]
statement = { cs = "Soubory jsou v otevřených nebo rozšířených formátech a mají README nebo datový slovník.", en = "The files are in open or widely used formats and have a README or a data dictionary." }
sources = ["A.I1.X1", "E.CESSDA-DMEG"]
fixAt = "prace"
owner = ["user"]
modes = ["after"]
prefill = { datacite = ["formats"] }
prefillLevel = "partly"

[[item]]
id = "D12"
tier = "recommended"
principles = ["R1"]
statement = { cs = "Verze datové sady je označena.", en = "The dataset's version is stated." }
sources = ["A.R1.R3"]
fixAt = "publikace"
owner = ["user", "repository-admin"]
modes = ["after"]
prefill = { datacite = ["version"] }

[[item]]
id = "D13"
tier = "recommended"
principles = ["R1.2"]
statement = { cs = "Datová sada je citována v článku nebo uvedena v prohlášení o dostupnosti dat.", en = "The dataset is cited in an article or listed in a data availability statement." }
sources = ["A.R1.2.N3", "E.FORCE11"]
fixAt = "citace"
owner = ["user"]
modes = ["after"]
allowNotApplicable = true
prefill = { datacite = ["relatedIdentifiers[relationType=IsCitedBy]"] }

[[item]]
id = "D14"
tier = "advanced"
principles = ["R1.3"]
statement = { cs = "Použili jste oborový metadatový standard, pokud ve vašem oboru existuje.", en = "You used a domain metadata standard, if your field has one." }
sources = ["A.R1.3.X2"]
fixAt = "popis"
owner = ["user", "community"]
modes = ["after"]
allowNotApplicable = true

# Funded output: requirements both programmes share, then those only Open Science III sets.

[[item]]
id = "O01"
tier = "minimum"
principles = ["F2", "R1"]
statement = { cs = "Metadata datové sady jsou volně dostupná, strojově zpracovatelná a odpovídají FAIR principům.", en = "The dataset's metadata are freely available, machine-readable and follow the FAIR principles." }
sources = ["E.OS3-RULES.D-METADATA", "E.MINIZAMER.DATASET"]
fixAt = "popis"
owner = ["user", "data-steward"]
modes = ["after"]
profiles = ["os3", "minizamer"]
prefill = { datacite = ["descriptions", "subjects"] }
prefillLevel = "partly"

[[item]]
id = "O02"
tier = "minimum"
principles = ["F1"]
statement = { cs = "Datová sada má mezinárodně uznávaný perzistentní identifikátor, například DOI.", en = "The dataset has an internationally recognised persistent identifier, such as a DOI." }
sources = ["E.OS3-RULES.D-PID", "E.MINIZAMER.DATASET"]
fixAt = "publikace"
owner = ["user"]
modes = ["after"]
profiles = ["os3", "minizamer"]
prefill = { resolver = true, datacite = ["doi"] }

[[item]]
id = "O03"
tier = "minimum"
principles = ["A1"]
statement = { cs = "Datová sada je uložená v repozitáři a odkaz na ni funguje.", en = "The dataset is deposited in a repository, and the link to it works." }
sources = ["E.MINIZAMER.DATASET", "E.OS3-RULES.D-REPOSITORY"]
fixAt = "repozitar"
owner = ["user"]
modes = ["after"]
profiles = ["os3", "minizamer"]
prefill = { resolver = true }

[[item]]
id = "O04"
tier = "minimum"
principles = ["F4"]
statement = { cs = "Datová sada má kompletní záznam v [[nma|Národním metadatovém adresáři]].", en = "The dataset has a complete record in the [[nma|National Metadata Directory]]." }
help = { cs = "Záznam založíte v NMA zadáním DOI nebo Handle; metadata z DataCite se načtou sama.", en = "You create the record in NMA by entering the DOI or Handle; the metadata from DataCite load by themselves." }
sources = ["E.OS3-RULES.D-NMA", "E.MINIZAMER.DATASET", "E.OS3-FAQ.NMA"]
fixAt = "dohledatelnost"
owner = ["user", "data-steward"]
modes = ["after"]
profiles = ["os3", "minizamer"]
lookup = "nmaSearch"

[[item]]
id = "O05"
tier = "minimum"
principles = []
statement = { cs = "Datová sada vznikla netriviální FAIRifikací, například lepšími metadaty, dokumentací nebo převodem do standardních formátů, ne jen přeuložením už zveřejněných dat.", en = "The dataset results from non-trivial FAIRification, such as better metadata, documentation or conversion to standard formats, not just from re-depositing data already published." }
sources = ["E.OS3-RULES.D-NONTRIVIAL", "E.OS3-FAQ.REDEPOSIT"]
fixAt = "popis"
owner = ["data-steward"]
modes = ["after"]
profiles = ["os3"]

[[item]]
id = "O06"
tier = "minimum"
principles = ["R1.1"]
statement = { cs = "Datová sada má licenci nebo podmínky dalšího užití.", en = "The dataset has a licence or terms of further use." }
sources = ["E.OS3-RULES.D-LICENCE"]
fixAt = "licence"
owner = ["user"]
modes = ["after"]
profiles = ["os3"]
prefill = { datacite = ["rightsList[].rightsUri"] }

[[item]]
id = "O07"
tier = "minimum"
principles = ["A1"]
statement = { cs = "Repozitář je veřejně dostupný a důvěryhodný nebo oborově certifikovaný, vybraný podle zvyklostí oboru.", en = "The repository is publicly available and trustworthy or domain-certified, chosen by the domain's practice." }
help = { cs = "Nejdřív oborový repozitář v re3data s certifikací, například CoreTrustSeal; jinak Zenodo nebo Datový catch-all repozitář NRP.", en = "First a domain repository in re3data with a certification such as CoreTrustSeal; otherwise Zenodo or the NRP Data Catch-all Repository." }
sources = ["E.OS3-RULES.D-REPOSITORY", "E.OS3-FAQ.REPOSITORY"]
fixAt = "repozitar"
owner = ["user", "data-steward"]
modes = ["after"]
profiles = ["os3"]

[[item]]
id = "O08"
tier = "minimum"
principles = []
statement = { cs = "Data steward, který se na datové sadě podílel, je v metadatech uveden jako autor nebo přispěvatel.", en = "The data steward who worked on the dataset is named in the metadata as a creator or contributor." }
help = { cs = "Zadejte jeho ORCID iD u předvyplnění a průvodce ho v metadatech DataCite vyhledá.", en = "Enter their ORCID iD with the pre-fill, and the guide looks for it in the DataCite metadata." }
sources = ["E.OS3-RULES.D-STEWARD"]
fixAt = "citace"
owner = ["data-steward"]
modes = ["after"]
profiles = ["os3"]
prefill = { datacite = ["@steward"] }

[[item]]
id = "O09"
tier = "minimum"
principles = []
statement = { cs = "Datová sada splňuje klíčové parametry, ke kterým se projekt zavázal.", en = "The dataset meets the key parameters the project committed to." }
sources = ["E.OS3-RULES.D-PARAMS"]
fixAt = "plan"
owner = ["data-steward"]
modes = ["after"]
profiles = ["os3"]
