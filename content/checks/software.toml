[check]
id = "software"
name = { cs = "Kontrola výzkumného softwaru", en = "Research software check" }
icon = "list-check"
description = { cs = "Skripty, výpočetní notebooky i aplikace: praktické otázky podle FAIR4RS a FRSM 1.0, doplněné o spuštění příkladu a zachování kódu. Začněte osmi otázkami; rozšířená kontrola přidá další praxi. Jde o vlastní posouzení bez skóre a certifikace.", en = "Scripts, computational notebooks and applications: practical questions based on FAIR4RS and FRSM 1.0, with an execution example and code preservation. Start with eight questions; the extended check adds further practice. This is self-assessment without a score or certification." }
lenses = ["V", "DS", "SR", "K"]
minutes = 15

[[block]]
id = "identity"
name = { cs = "Identifikace a zachování", en = "Identification and preservation" }

[[block]]
id = "description"
name = { cs = "Popis, autorství a licence", en = "Description, credit and licensing" }

[[block]]
id = "execution"
name = { cs = "Spuštění a propojení", en = "Execution and integration" }

[[item]]
id = "software.01"
requirement = "FRSM.FRSM-01"
statement = { cs = "Software má trvalý a jednoznačný identifikátor.", en = "The software has a persistent, unambiguous identifier." }
tier = "basic"
block = "identity"
fixAt = "publication"
owner = ["user"]
allowNotApplicable = false

[[item]]
id = "software.02"
requirement = "FRSM.FRSM-02"
statement = { cs = "Samostatně používané komponenty mají rozlišitelné identifikátory a popsané vztahy.", en = "Independently used components have distinct identifiers and described relationships." }
tier = "advanced"
block = "identity"
fixAt = "metadata"
owner = ["user"]
allowNotApplicable = true

[[item]]
id = "software.03"
requirement = "FRSM.FRSM-03"
statement = { cs = "Použitá verze má vlastní identifikátor, odlišný od jiných verzí.", en = "The version used has its own identifier, distinct from other versions." }
