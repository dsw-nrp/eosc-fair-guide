# Policy

[[item]]
id = "I16"
block = "policy"
tier = "recommended"
principles = []
statement = { cs = "Politika vymezuje, na koho se vztahuje, která výzkumná data pokrývá a jak zapadá do právního rámce.", en = "The policy sets out whom it applies to, which research data it covers and how it fits the legal framework." }
help = { cs = "Má-li odrážet zákon o výzkumu, pokrývá nejméně data v elektronické podobě potřebná pro publikaci výsledků výzkumu z veřejných prostředků.", en = "To reflect the research act, it covers at least the electronic data needed to publish the results of publicly funded research." }
sources = ["E.OS3-RULES.P1", "E.POLICY-MANUAL.SCOPE", "E.LAW-328.83"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I17"
block = "policy"
tier = "recommended"
principles = ["R1"]
statement = { cs = "Politika stanoví, jak se plánuje a spravuje data, včetně DMP ve schváleném nástroji dostupném všem výzkumníkům.", en = "The policy sets out how data are planned and managed, including DMPs in an approved tool open to every researcher." }
sources = ["E.OS3-RULES.P2", "E.POLICY-MANUAL.DMP"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I18"
block = "policy"
tier = "recommended"
principles = []
