# Institution check for data stewards. The basic check is the research data strategy, which the Open Science III call
# requires before it accepts outputs, and the obligations of the research act (section 83). The extended check adds
# the minimum content the call sets for an action plan and a policy when an institution prepares them, with the
# policy detailed by the EOSC CZ manual, and the national data infrastructure with the people it needs.
# Field reference: docs/content-model.md.

[check]
id = "institution"
name = { cs = "Instituce a správa dat", en = "Institution and data management" }
icon = "building-columns"
description = { cs = "Kontrola pro data stewardy: splňuje strategie vaší instituce minimum výzvy Open Science III a plní instituce povinnosti zákona o výzkumu? Rozšířená kontrola projde i akční plán, politiku a využití národní datové infrastruktury.", en = "A check for data stewards: does your institution's strategy meet the Open Science III minimum, and does the institution meet the research act's obligations? The extended check also covers the action plan, the policy and the use of the national data infrastructure." }
lenses = ["DS"]
minutes = 10

[[block]]
id = "law"
icon = "section"
name = { cs = "Povinnosti podle zákona o výzkumu", en = "Obligations under the research act" }
description = { cs = "§ 83 zákona č. 328/2025 Sb., účinný od 1. ledna 2027.", en = "Section 83 of act No. 328/2025, in force from 1 January 2027." }

[[block]]
id = "strategy"
icon = "compass"
name = { cs = "Strategie pro nakládání s výzkumnými daty", en = "Research data strategy" }
description = { cs = "Podmínka, bez které výzva Open Science III neakceptuje výstupy.", en = "The condition without which the Open Science III call accepts no outputs." }

[[block]]
id = "action-plan"
icon = "list-check"
name = { cs = "Akční plán", en = "Action plan" }
description = { cs = "Minimální obsah, který výzva Open Science III stanoví, když instituce akční plán připravuje.", en = "The minimum content the Open Science III call sets when an institution prepares an action plan." }

[[block]]
id = "policy"
icon = "file-contract"
name = { cs = "Politika správy výzkumných dat", en = "Research data policy" }
description = { cs = "Minimální obsah, který výzva Open Science III stanoví, když instituce politiku připravuje, rozpracovaný podle manuálu EOSC CZ.", en = "The minimum content the Open Science III call sets when an institution prepares a policy, detailed by the EOSC CZ manual." }

[[block]]
id = "infrastructure"
icon = "network-wired"
name = { cs = "Národní datová infrastruktura a lidé", en = "National data infrastructure and people" }
description = { cs = "Služby národní datové infrastruktury a lidé, které jejich využití potřebuje.", en = "The services of the national data infrastructure and the people their use needs." }

# Strategy

# Obligations under the research act

[[item]]
id = "I01"
block = "law"
tier = "minimum"
principles = ["F1", "A1", "R1"]
statement = { cs = "Instituce spravuje údaje z výzkumu podpořeného z veřejných prostředků tak, aby byly dohledatelné, přístupné a opakovaně využitelné.", en = "The institution manages the data from publicly funded research so that they are findable, accessible and reusable." }
help = { cs = "Údaji z výzkumu zákon rozumí elektronické dokumenty kromě odborných publikací, které při výzkumu vznikly a slouží jako doklad nebo k ověření jeho zjištění.", en = "The act means by research data the electronic documents, other than scientific publications, created in research and serving as evidence or to validate its findings." }
sources = ["E.LAW-328.83"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I02"
block = "law"
tier = "minimum"
principles = ["A1"]
statement = { cs = "Na žádost instituce bezplatně poskytne údaje, které už zveřejnila v repozitáři, nebo odkaz na ně.", en = "On request, the institution provides free of charge the data it has already published in a repository, or a link to them." }
sources = ["E.LAW-328.83.2"]
fixAt = "publikace"
owner = ["data-steward"]

[[item]]
id = "I03"
block = "law"
tier = "minimum"
principles = ["I1", "R1.1"]
statement = { cs = "Údaje poskytuje v otevřeném a strojově čitelném formátu, za podmínek, které jejich další využití neomezují.", en = "It provides the data in an open, machine-readable format, on terms that do not restrict their further use." }
sources = ["E.LAW-328.83.3"]
fixAt = "licence"
owner = ["data-steward"]

[[item]]
id = "I04"
block = "law"
tier = "minimum"
principles = []
statement = { cs = "Instituce ví, z jakých zákonných důvodů smí poskytnutí údajů odmítnout, a odmítnutí eviduje.", en = "The institution knows on which legal grounds it may refuse to provide data, and records each refusal." }
sources = ["E.LAW-328.83.5", "E.POLICY-MANUAL.SHARING"]
fixAt = "licence"
owner = ["data-steward"]

# Strategy

[[item]]
id = "I05"
block = "strategy"
tier = "minimum"
principles = []
statement = { cs = "Instituce má strategii pro nakládání s výzkumnými daty, formálně přijatou statutárním orgánem pro celou instituci.", en = "The institution has a research data strategy, formally adopted by the statutory body for the whole institution." }
help = { cs = "Stačí i strategický dokument jiného názvu se stejným obsahem.", en = "A strategic document under another name with the same content counts." }
sources = ["E.OS3-RULES.STRATEGY"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I06"
block = "strategy"
tier = "minimum"
principles = []
statement = { cs = "Strategie stanoví vizi a cíle správy výzkumných dat, například FAIR principy, otevřenost a etiku.", en = "The strategy sets the vision and goals of research data management, such as the FAIR principles, openness and ethics." }
sources = ["E.OS3-RULES.S1"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I07"
block = "strategy"
tier = "minimum"
principles = []
statement = { cs = "Strategie vymezuje, na jaká data, projekty, pracoviště a pracovníky se vztahuje.", en = "The strategy sets out which data, projects, departments and staff it covers." }
sources = ["E.OS3-RULES.S2"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I08"
block = "strategy"
tier = "minimum"
principles = []
statement = { cs = "Strategie řeší lidské zdroje: odpovědnosti aktérů, rozvoj kompetencí pro FAIR data a NDI a pozice data stewardů v organizační struktuře.", en = "The strategy covers people: the actors' responsibilities, developing competences for FAIR data and the NDI, and data steward positions in the organisational structure." }
sources = ["E.OS3-RULES.S3", "E.OS3-RULES.DS"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I09"
block = "strategy"
tier = "minimum"
principles = []
statement = { cs = "Strategie popisuje potřebné služby, nástroje a podporu včetně využití národní datové infrastruktury (NDI).", en = "The strategy describes the services, tools and support needed, including the use of the national data infrastructure (NDI)." }
sources = ["E.OS3-RULES.S4", "E.OS3-RULES.NDI"]
fixAt = "plan"
owner = ["data-steward"]

