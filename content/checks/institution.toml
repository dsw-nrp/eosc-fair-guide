# Optional institution check for data stewards. Field reference: docs/content-model.md.

[check]
id = "institution"
name = { cs = "Instituce a správa dat", en = "Institution and data management" }
description = { cs = "Volitelná krátká kontrola pro data stewardy: má instituce to, co výzkumníci ke správě dat potřebují?", en = "An optional short check for data stewards: does the institution have what researchers need for data management?" }
lenses = ["DS"]
minutes = 5

[[item]]
id = "I01"
tier = "recommended"
principles = ["R1.1", "A1.2"]
statement = { cs = "Instituce má zveřejněnou datovou politiku.", en = "The institution has a published data policy." }
sources = ["E.POLICY-MANUAL"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I02"
tier = "recommended"
principles = ["R1"]
statement = { cs = "Výzkumníci mají podporu s plány správy dat (data steward, DMP.eosc.cz).", en = "Researchers get support with data management plans (a data steward, DMP.eosc.cz)." }
sources = ["E.DATA-STEWARDS", "E.DMP"]
fixAt = "plan"
owner = ["data-steward"]

[[item]]
id = "I03"
tier = "recommended"
principles = ["A1.2"]
statement = { cs = "Výzkumníci mají k dispozici spravované a zálohované úložiště, i pro citlivá data.", en = "Researchers have managed, backed-up storage, also for sensitive data." }
sources = ["E.EINFRA"]
fixAt = "prace"
owner = ["data-steward"]

[[item]]
id = "I04"
tier = "recommended"
principles = []
statement = { cs = "Instituce má strategii správy výzkumných dat; výzva Open Science III ji vyžaduje.", en = "The institution has a research data management strategy; the Open Science III call requires one." }
sources = ["E.OS3"]
fixAt = "plan"
owner = ["data-steward"]
