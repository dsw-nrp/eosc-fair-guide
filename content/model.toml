transfer = { cs = "Požadavky komunit a priority rozvoje", en = "Community requirements and development priorities" }
sender = { cs = "Pracovní skupiny a komunity", en = "Working groups and communities" }
recipient = { cs = "Poskytovatelé služeb", en = "Service providers" }
carrier = { cs = "Koordinace pracovních skupin a roadmapy služeb", en = "Working-group coordination and service roadmaps" }
maintainers = { cs = "Pracovní skupiny a poskytovatelé služeb průběžně slaďují potřeby a rozvoj.", en = "Working groups and service providers continually align needs and development." }

[[seam]]
guideRoute = "model/seam"

id = "repository-catalogue-planning"
