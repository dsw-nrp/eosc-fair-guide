# Shared conceptual model and reviewed associations. Model descriptions are guide-authored summaries.
# Assessment requirements retain their published ledger sources. Field reference: docs/content-model.md.

[model]

id = "layers-seams"
source = "layers-seams-manuscript"
name = { cs = "Vrstvy a návaznosti FAIR implementace", en = "Layers and seams of FAIR implementation" }
description = { cs = "FAIR data vznikají spoluprací lidí a služeb. Model pomáhá rozlišit jejich úlohy a sledovat, co si potřebují předat.", en = "FAIR data depend on people and services working together. The model helps distinguish their functions and follow what they need to pass on." }
introduction = { cs = "Vrstva sdružuje činnosti podle jejich funkce. Návaznost (seam) je předání informací přes hranici odpovědnosti: mezi vrstvami i mezi různými činnostmi uvnitř jedné vrstvy. Předání funguje, když příjemce informacím rozumí a dokáže je použít.", en = "A layer groups activities by function. A seam is an information transfer across a responsibility boundary, between layers or between distinct functions within one layer. A transfer works when the recipient can interpret the information and act on it." }
ordering = { cs = "Pořadí vrstev vysvětluje cestu od záměru k praxi. Činnosti se překrývají a mohou probíhat současně; jedna organizace může působit v několika vrstvách.", en = "The layer order explains the rationale from purpose to practice. Activities overlap and can run concurrently; one organisation may act in several layers." }
feedback = { cs = "Plánování přináší požadavky na služby. Podpora předává opakující se zkušenosti komunitám a poskytovatelům. Hodnocení vrací konkrétní zjištění lidem, kteří mohou upravit metadata, službu nebo pravidla.", en = "Planning supplies service requirements. Support returns recurring experience to communities and providers. Evaluation returns concrete findings to people who can change metadata, services or policies." }

[model.workedExample]
name = { cs = "Jak Průvodce předává požadavek do kontroly", en = "How the Guide carries a requirement into a check" }
description = { cs = "Publikovaný požadavek na identifikátor vede k otázce a k pojmenovanému testu. Test dokládá rozlišení PID; dlouhodobou dostupnost neověřuje. Záznam revize vysvětluje, jak vznikla jeho implementace a popis rozsahu. U konkrétního výsledku kontroly zůstávají také posuzovaný objekt, pozorování a datum.", en = "A published identifier requirement leads to a question and a named test. The test establishes PID resolution; it does not verify long-term availability. A revision record explains how its implementation and scope description were produced. A specific assessment result also retains the assessed object, observations and date." }
steps = ["A.F1.R1", "dataset.01", "test:guide-dataset-01", "action:2026-10-11-test-health"]

[[layer]]
guideRoute = "model/layer"
id = "policy"
name = { cs = "Principy, politika a řízení", en = "Principles, policy and governance" }
description = { cs = "Určují cíle, odpovědnosti a podmínky pro správu dat: financování, přístup, licence, uchování a uznání výsledků.", en = "Set goals, responsibilities and conditions for data management: funding, access, licensing, preservation and recognition of outputs." }

[[layer]]
guideRoute = "model/layer"
id = "community"
name = { cs = "Rozhodování a implementace v komunitě", en = "Community decision and implementation" }
description = { cs = "Komunita vybírá standardy a služby a vymezuje oborový popis dat. Společné jádro, oborové profily a popis jednotlivých metod propojuje podle potřeby mapováním.", en = "The community selects standards and services and defines disciplinary data descriptions. A common core, domain profiles and method descriptions can be connected through mappings." }

[[layer]]
guideRoute = "model/layer"
id = "infrastructure"
name = { cs = "Infrastruktura", en = "Infrastructure" }
description = { cs = "Poskytuje repozitáře, identifikátory, vyhledávání a rozhraní. Sdílené služby se přizpůsobují oborovým potřebám; přenos mezi dvěma službami vyžaduje použitelnou návaznost.", en = "Provides repositories, identifiers, discovery and interfaces. Shared services accommodate domain needs; a transfer between two services requires a usable seam." }

[[layer]]
guideRoute = "model/layer"
id = "planning"
name = { cs = "Plánování výzkumu", en = "Research planning" }
description = { cs = "Promítá pravidla a komunitní volby do konkrétního projektu. Plán správy dat zachycuje očekávaná data, postupy a služby i potřeby, které dosud nejsou pokryty.", en = "Applies policies and community choices to a specific project. A data management plan captures expected data, practices and services, including needs that are not yet met." }

[[layer]]
guideRoute = "model/layer"
id = "support"
name = { cs = "Provozní podpora", en = "Operational support" }
description = { cs = "Pomáhá při každodenní práci a řešení problémů. Zkušenosti výzkumníků, kurátorů a správců vrací do metodik, služeb a komunitních rozhodnutí.", en = "Helps with day-to-day work and problem solving. Returns experience from researchers, curators and administrators to guidance, services and community decisions." }

[[layer]]
guideRoute = "model/layer"
id = "evaluation"
name = { cs = "Hodnocení", en = "Evaluation" }
description = { cs = "Posuzuje data, záznamy, služby nebo organizace podle konkrétních kritérií. Výsledek dává podklad pro nápravu; různé druhy hodnocení zodpovídají různé otázky.", en = "Assesses data, records, services or organisations against specific criteria. Findings support remediation; different kinds of evaluation answer different questions." }

[[seam]]
guideRoute = "model/seam"
id = "repository-nma"
layers = ["infrastructure"]
source = "layers-seams-manuscript"
name = { cs = "Repozitář → NMA", en = "Repository → NMA" }
description = { cs = "Repozitář zpřístupňuje záznamy pro společné vyhledávání. Mapování zachovává význam oborového popisu při převodu do společného jádra.", en = "The repository exposes records for shared discovery. A mapping preserves the meaning of the domain description when converting it to the common core." }
transfer = { cs = "Záznam pro vyhledávání a vztah k původnímu oborovému popisu", en = "A discovery record and its relationship to the original domain description" }
sender = { cs = "Správce repozitáře", en = "Repository administrator" }
recipient = { cs = "Provozovatel NMA", en = "NMA operator" }
carrier = { cs = "CCMM-XML, OAI-PMH a mapování, například XSLT", en = "CCMM-XML, OAI-PMH and mappings, for example XSLT" }
maintainers = { cs = "Repozitář spravuje mapování; NMA spravuje sklizeň.", en = "The repository maintains mappings; NMA maintains harvesting." }

[[seam]]
