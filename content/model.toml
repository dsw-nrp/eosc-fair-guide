layers = ["infrastructure"]
source = "layers-seams-manuscript"
name = { cs = "Repozitář ↔ ověření identity", en = "Repository ↔ authentication" }
description = { cs = "Ověřená identita a oprávnění umožňují přístup k datům za stanovených podmínek. Omezený přístup může být v souladu s FAIR.", en = "An authenticated identity and authorisation enable access under defined conditions. Restricted access can be consistent with FAIR." }
transfer = { cs = "Identita uživatele a oprávnění k přístupu", en = "User identity and access authorisation" }
sender = { cs = "Repozitář a uživatel", en = "Repository and user" }
recipient = { cs = "Poskytovatel ověření identity", en = "Authentication provider" }
carrier = { cs = "Federovaná identita a přístupová pravidla; v národním prostředí EOSC CZ AAI", en = "Federated identity and access policies; EOSC CZ AAI in the national setting" }
maintainers = { cs = "Správce repozitáře a poskytovatel infrastruktury pro ověření identity.", en = "Repository administrator and authentication infrastructure provider." }

[[seam]]
guideRoute = "model/seam"
id = "repository-pid-registry"
layers = ["infrastructure"]
source = "layers-seams-manuscript"
name = { cs = "Repozitář / instituce → registry PID", en = "Repository / institution → PID registries" }
description = { cs = "Záznamy identifikátorů propojují data s jejich popisem, osobami a organizacemi. Správa registrace a následných aktualizací je součástí této návaznosti.", en = "Identifier records connect data to their description, people and organisations. Registration and subsequent updates are part of this seam." }
transfer = { cs = "Identifikátory a metadata dat, osob a organizací", en = "Identifiers and metadata for data, people and organisations" }
sender = { cs = "Repozitář nebo instituce", en = "Repository or institution" }
recipient = { cs = "Registry identifikátorů", en = "Identifier registries" }
carrier = { cs = "Spravované PID a jejich metadata; například DOI, ORCID a ROR", en = "Managed PIDs and their metadata; for example DOI, ORCID and ROR" }
maintainers = { cs = "Repozitář či instituce spravuje záznamy; registry zajišťují jejich infrastrukturu.", en = "The repository or institution maintains records; registries provide their infrastructure." }

[[seam]]
guideRoute = "model/seam"
