[[context]]
station = "plan"
lens = "V"
seams = ["plan-repository"]
text = { cs = "Plán propojuje váš výzkum s podmínkami služby, kterou budete používat. Včasný výběr repozitáře pomůže sladit formáty, popis, přístup a uchování; potřeby, které služba nepokrývá, můžete probrat s data stewardem.", en = "A plan connects your research to the conditions of the service you will use. Selecting a repository early helps align formats, description, access and preservation; discuss needs the service does not cover with your data steward." }

[[context]]
station = "plan"
lens = "DS"
seams = ["community-planning", "repository-catalogue-planning"]
text = { cs = "Plánování potřebuje použitelný popis komunitních standardů a služeb. Data steward pomáhá přenést tyto informace do rozhodnutí projektu a vrátit neřešené potřeby příslušné komunitě nebo poskytovateli.", en = "Planning needs usable descriptions of community standards and services. A data steward helps apply this information to project decisions and return unmet needs to the relevant community or provider." }

[[context]]
station = "plan"
lens = "K"
seams = ["community-planning"]
text = { cs = "FIP zaznamenává výběr zdrojů umožňujících FAIR. Podrobné požadavky zůstávají v odkazovaných profilech a schématech; srozumitelné a dostupné popisy umožní výzkumníkům promítnout výběr do vlastního plánu.", en = "A FIP records selected FAIR-enabling resources. Detailed requirements remain in the referenced profiles and schemas; clear, accessible descriptions let researchers apply these selections to their own plans." }

[[context]]
station = "collect"
lens = "K"
seams = ["community-repository"]
text = { cs = "Popis metody a experimentu vymezuje komunita. Stejný profil pak může vést dokumentaci během výzkumu i nastavení formuláře v repozitáři. Sjednocení metadat samo nezajišťuje, že jiný nástroj dokáže přečíst původní datový soubor.", en = "The community defines method and experiment descriptions. The same profile can guide documentation during research and repository-form configuration. Harmonised metadata alone do not ensure that another tool can read the original data file." }

[[context]]
station = "metadata"
lens = "V"
seams = ["community-repository"]
text = { cs = "Vyplněním oborového popisu předáváte informace potřebné k porozumění datům. Společný záznam pomáhá data najít; parametry experimentu, použité metody a další oborové údaje pomáhají posoudit, zda se hodí k dalšímu použití.", en = "A domain description passes on the information needed to understand your data. The common record helps people find the data; experimental parameters, methods and other domain information help them decide whether the data suit further use." }

[[context]]
station = "metadata"
lens = "DS"
seams = ["community-repository", "repository-nma"]
text = { cs = "Při přípravě popisu se potkávají požadavky oboru, repozitáře a společného vyhledávání. Data steward pomáhá rozpoznat, které údaje kam patří a jak se jejich význam zachová při převodu mezi popisy.", en = "Preparing a description brings together domain, repository and shared-discovery requirements. A data steward helps identify where information belongs and how its meaning survives transfer between descriptions." }

[[context]]
station = "metadata"
lens = "SR"
seams = ["community-repository", "repository-nma"]
text = { cs = "Komunita určuje, které údaje jsou potřeba pro odborné porozumění datům. Repozitář je promítá do formuláře a kontroly metadat. Mapování propojuje oborový popis se společným záznamem pro vyhledávání.", en = "The community determines the information needed to understand data in its domain. The repository implements it in metadata forms and validation. Mappings connect the domain description to the common discovery record." }

[[context]]
station = "metadata"
lens = "K"
seams = ["community-repository"]
text = { cs = "Oborový profil vyjadřuje význam a požadované podrobnosti popisu. Aby jej repozitář mohl použít, potřebuje dostupné schéma, slovníky a výklad jejich použití. FIP odkazuje na vybrané zdroje, jejichž požadavky se promítají do nastavení služby.", en = "A domain profile expresses meaning and the required descriptive detail. To use it, a repository needs an accessible schema, vocabularies and guidance on their use. The FIP references selected resources whose requirements inform service configuration." }

[[context]]
station = "publication"
lens = "SR"
seams = ["repository-pid-registry", "plan-repository"]
text = { cs = "Zveřejnění propojuje přijatý datový výstup s identifikátorem a jeho popisem. Podmínky dohodnuté při plánování se promítají do záznamu, přístupového režimu a následné správy metadat identifikátoru.", en = "Publication connects an accepted data output to its identifier and description. Conditions agreed during planning inform the record, access arrangements and subsequent maintenance of identifier metadata." }

[[context]]
station = "findability"
lens = "V"
seams = ["repository-nma"]
text = { cs = "Záznam v NMA rozšiřuje možnosti, jak vaše data najít. Sklizeň z repozitáře a ruční vytvoření záznamu jsou různé postupy; samotná přítomnost záznamu neříká, kterým z nich vznikl.", en = "An NMA record gives people another way to find your data. Repository harvesting and manual record creation are different routes; the presence of a record alone does not establish which route created it." }

[[context]]
station = "findability"
lens = "DS"
seams = ["repository-nma"]
text = { cs = "Vyhledávání potřebuje popis ve srozumitelné a zpracovatelné podobě. Při řešení chyb rozlišujte existenci záznamu v NMA, dostupnost rozhraní repozitáře a skutečný průběh sklizně.", en = "Discovery needs a description in an interpretable, processable form. When addressing problems, distinguish an NMA record, an available repository interface and actual harvesting." }

[[context]]
station = "findability"
lens = "SR"
seams = ["repository-nma"]
text = { cs = "OAI-PMH zpřístupňuje metadata, mapování určuje jejich význam v CCMM a sklizeň je přenáší do NMA. Každá část může vyžadovat vlastní ověření; fungující endpoint sám nepotvrzuje úspěšné převzetí záznamů.", en = "OAI-PMH exposes metadata, mappings determine their meaning in CCMM and harvesting transfers them to NMA. Each part may need its own verification; a working endpoint alone does not establish successful record ingestion." }

[[context]]
station = "citation"
lens = "SR"
seams = ["nma-research-register"]
text = { cs = "Identifikátor datasetu a odkaz na záznam NMA slouží různým účelům. První vede k citovaným datům; druhý předává evidenci výsledku informace potřebné k vykázání.", en = "The dataset identifier and NMA record URL serve different purposes. The former references the cited data; the latter supplies the output register with information needed for reporting." }

[[context]]
station = "assessment"
lens = "V"
seams = ["assessment-remediation"]
text = { cs = "Výsledek je užitečný, když vede ke konkrétní opravě nebo dotazu. Zachování identifikátoru dat, otázky a pozorovaných podkladů pomáhá data stewardovi či repozitáři porozumět tomu, co jste skutečně ověřili.", en = "A finding is useful when it leads to a concrete correction or enquiry. Retaining the data identifier, question and observed evidence helps a data steward or repository understand what you actually checked." }

[[context]]
station = "assessment"
lens = "DS"
seams = ["assessment-remediation"]
text = { cs = "Různé kontroly sledují různé předměty a rozsahy. Data steward pomáhá předat zjištění aktérovi, který může dotčený údaj nebo službu změnit; nedostupný podklad zůstává omezením kontroly.", en = "Different assessments examine different subjects and scopes. A data steward helps pass findings to an actor able to change the affected information or service; unavailable evidence remains an inspection limitation." }

[[context]]
station = "assessment"
lens = "SR"
seams = ["assessment-remediation", "repository-support"]
text = { cs = "Při čtení zjištění je potřeba znát posuzovaný záznam, reprezentaci, kritérium a průběh testu. Tyto informace pomáhají rozlišit chybu metadat, nastavení služby a nedostupný podklad a případně předat problém podpoře infrastruktury.", en = "Acting on a finding requires the assessed record, representation, criterion and test details. These help distinguish metadata problems, service configuration and unavailable evidence, and support escalation to infrastructure support." }

[[context]]
station = "assessment"
lens = "K"
seams = ["community-repository", "assessment-remediation"]
text = { cs = "Oborové posouzení vychází z konkrétních požadavků profilu či schématu. Výběr zdroje ve FIP pomáhá určit jejich původ; samotná deklarace výběru nedokládá splnění požadavků ani existenci testu.", en = "Domain assessment uses specific profile or schema requirements. Selecting a resource in a FIP helps identify their origin; the selection declaration alone does not establish conformance or the existence of a test." }
