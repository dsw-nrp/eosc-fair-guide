name = { cs = "Repozitář → katalog → plánování", en = "Repository → catalogue → planning" }
description = { cs = "Popis služby pomáhá vybrat repozitář a připravit proveditelný plán. Zveřejnění katalogového záznamu a jeho využití v plánovacím nástroji jsou dvě různé části návaznosti.", en = "A service description helps select a repository and prepare a feasible plan. Publishing a catalogue record and reusing it in a planning tool are distinct parts of the seam." }
transfer = { cs = "Rozsah služby, podmínky přijetí, schémata a slovníky", en = "Service scope, deposit conditions, schemas and vocabularies" }
sender = { cs = "Repozitář a správce katalogu", en = "Repository and catalogue maintainer" }
recipient = { cs = "Výzkumník a plánovací nástroj", en = "Researcher and planning tool" }
carrier = { cs = "Záznam repozitáře v katalogu; v národním prostředí NKR", en = "Repository catalogue record; NKR in the national setting" }
maintainers = { cs = "Repozitář aktualizuje svůj popis; katalog a plánovací nástroj zajišťují jeho přenos.", en = "The repository updates its description; the catalogue and planning tool provide its transfer." }

[[seam]]
guideRoute = "model/seam"
id = "community-planning"
layers = ["community", "planning"]
source = "layers-seams-manuscript"
name = { cs = "Komunita → plánování", en = "Community → planning" }
description = { cs = "Komunitní výběr standardů a služeb se převádí do rozhodnutí projektu. FIP zaznamenává vybrané zdroje; podrobný popis požadavků zůstává v příslušných profilech a schématech.", en = "Community selections of standards and services inform project decisions. A FIP records selected resources; detailed requirements remain in the corresponding profiles and schemas." }
transfer = { cs = "Vybrané zdroje umožňující FAIR a odkazy na jejich požadavky", en = "Selected FAIR-enabling resources and references to their requirements" }
sender = { cs = "Výzkumná komunita", en = "Research community" }
recipient = { cs = "Výzkumník a plánovací nástroj", en = "Researcher and planning tool" }
carrier = { cs = "FIP, metadatové profily a plán správy dat", en = "FIP, metadata profiles and a data management plan" }
maintainers = { cs = "Komunita udržuje svůj výběr; projekt jej promítá do plánu.", en = "The community maintains its selections; the project applies them in its plan." }

[[seam]]
guideRoute = "model/seam"
