source = "layers-seams-manuscript"
name = { cs = "Instituce → NMA", en = "Institution → NMA" }
description = { cs = "Instituce promítá požadavky programu a vlastní strategii do zveřejnění a popisu konkrétního datového výstupu.", en = "An institution applies programme requirements and its strategy to the publication and description of a specific data output." }
transfer = { cs = "Metadata financovaného datového výstupu a údaje požadované programem", en = "Metadata of a funded data output and programme-required information" }
sender = { cs = "Instituce a její data steward", en = "Institution and its data steward" }
recipient = { cs = "NMA", en = "NMA" }
