name = { cs = "NMA → evidence výsledků", en = "NMA → research-output register" }
description = { cs = "Pro vykázání datasetu slouží odkaz na jeho záznam v NMA. Identifikátor dat zůstává prostředkem pro citování samotného datasetu.", en = "Reporting a dataset uses the URL of its NMA record. The data identifier remains the reference for citing the dataset itself." }
transfer = { cs = "Odkaz na záznam datasetu pro vykázání výsledku typu T", en = "The dataset-record URL for reporting an output of type T" }
sender = { cs = "Provozovatel NMA", en = "NMA operator" }
recipient = { cs = "Instituce vykazující výsledek", en = "Institution reporting the output" }
carrier = { cs = "URL záznamu NMA a postup pro vykazování do RIV", en = "NMA record URL and the RIV reporting procedure" }
maintainers = { cs = "NMA zajišťuje adresu záznamu; instituce zajišťuje správné vykázání.", en = "NMA provides the record URL; the institution handles reporting." }

[[seam]]
guideRoute = "model/seam"
id = "institution-nma"
