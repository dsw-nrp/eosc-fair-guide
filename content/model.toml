description = { cs = "Oborové požadavky se promítají do formuláře, schématu a kontroly metadat. Společný popis pro vyhledávání se propojuje s oborovým profilem pomocí mapování.", en = "Domain requirements become metadata forms, schemas and validation. Mappings connect the common discovery description to the domain profile." }
transfer = { cs = "Oborový profil, slovníky, datové formáty a mapování", en = "Domain profile, vocabularies, data formats and mappings" }
sender = { cs = "Výzkumná komunita", en = "Research community" }
recipient = { cs = "Správce repozitáře", en = "Repository administrator" }
carrier = { cs = "Metadatové profily, schémata a mapování do společného jádra", en = "Metadata profiles, schemas and mappings to the common core" }
maintainers = { cs = "Komunita rozvíjí oborový význam; repozitář udržuje jeho implementaci.", en = "The community develops domain meaning; the repository maintains its implementation." }

[[seam]]
