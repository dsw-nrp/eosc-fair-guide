transfer = { cs = "Dohodnuté formáty, metadata, licence, přístup a uchování", en = "Agreed formats, metadata, licensing, access and preservation" }
sender = { cs = "Výzkumný tým", en = "Research team" }
recipient = { cs = "Repozitář", en = "Repository" }
carrier = { cs = "Plán správy dat, podmínky repozitáře a případně strojově zpracovatelný DMP", en = "Data management plan, repository conditions and, where supported, a machine-actionable DMP" }
maintainers = { cs = "Výzkumný tým připravuje plán; repozitář vymezuje a ověřuje podmínky přijetí.", en = "The research team prepares the plan; the repository defines and checks deposit conditions." }

