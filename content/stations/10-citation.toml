# Station 10: citation, credit and reuse of others' data (RDMkit Reuse). Citation practice comes first; RIV is a
# factual note. Field reference: docs/content-model.md.

[station]
id = "citation"
position = 10
lifecycleStage = "reuse"
name = { cs = "Citace a opakované užití", en = "Citation and reuse" }
title = { cs = "Citace dat, uznání a opakované užití", en = "Data citation, credit and reuse" }
icon = "quote-right"
principles = ["F1", "R1"]
minutes = 5
glossary = ["persistent-identifier", "digital-object-identifier", "reuse"]

[[advice]]
id = "citation.01"
lens = "*"
level = "L1"
kind = "key"
text = { cs = "Data jsou výsledek výzkumu a citují se stejně jako články; díky PID je citace jednoznačná.", en = "Data are research outputs and are cited like articles; a PID makes the citation unambiguous." }
sources = ["FORCE11-CITATION.01", "A.F1.X2"]

[[advice]]
id = "citation.02"
lens = "V"
level = "L0"
text = { cs = "Data, která používáte, citujte stejně jako články. Vaše datová sada je díky PID citovatelná; uveďte ji v článku i v profilu [[orcid|ORCID]].", en = "Cite the data you use just as you cite articles. Thanks to its PID, your dataset is citable; list it in your article and in your [[orcid|ORCID]] profile." }
action = [{ label = { cs = "Vytvořit citaci z DOI", en = "Create a citation from a DOI" }, href = "#page-citation" }, { label = { cs = "Zásady citování dat", en = "Data citation principles" }, href = "https://force11.org/info/joint-declaration-of-data-citation-principles-final/" }]
sources = ["FORCE11-CITATION.01", "A.F1.X2", "A.R1.2.N3"]

[[advice]]
id = "citation.03"
lens = "V"
level = "L1"
text = { cs = "Cizí data citujte v seznamu literatury: autor, rok, název, repozitář, verze a PID.", en = "Cite other people's data in the reference list: author, year, title, repository, version and PID." }
sources = ["FORCE11-CITATION.01", "A.F1.X2"]

[[advice]]
id = "citation.19"
lens = "V"
level = "L1"
text = { cs = "Citujte také [[page:software|software použitý při zpracování dat]]: autory, název, použitou verzi a její trvalý identifikátor, pokud jej má. Řiďte se citačními pokyny projektu; samotný odkaz na vývojový repozitář nemusí určit použitou verzi.", en = "Also cite the [[page:software|software used to process the data]]: authors, title, the version used and its persistent identifier if available. Follow the project’s citation instructions; a link to the development repository alone may not identify the version used." }
sources = ["FRSM.FRSM-03", "FRSM.FRSM-06"]

[[advice]]
id = "citation.04"
lens = "V"
level = "L1"
text = { cs = "V článku uveďte prohlášení o dostupnosti dat s PID.", en = "Include a data availability statement with the PID in your article." }
sources = ["A.R1.2.N3"]

[[advice]]
id = "citation.05"
lens = "V"
level = "L1"
text = { cs = "Propojte datovou sadu se svým profilem [[orcid|ORCID]]; s ORCID pomůže Národní centrum ORCID.", en = "Link the dataset to your [[orcid|ORCID]] profile; the National ORCID Centre helps with ORCID." }
sources = ["A.R1.2.N3", "PID-CENTRE.01"]

[[advice]]
id = "citation.20"
lens = "V"
level = "L1"
text = { cs = "Než převezmete cizí data, ověřte licenci a podmínky užití, zda metadata stačí k porozumění datům a zda je zdroj důvěryhodný. Zaznamenejte použitou verzi dat a citujte ji s PID.", en = "Before you reuse other people's data, check the licence and terms of use, whether the metadata are enough to understand the data and whether the source is trustworthy. Record the version of the data you used and cite it with its PID." }
sources = ["RDMKIT.reuse.02"]

[[advice]]
id = "citation.21"
lens = "V"
level = "L1"
text = { cs = "Existující data ušetří zbytečné experimenty a umožní ověřit zveřejněná zjištění. Hledejte je v kurátorských databázích a v repozitářích svého oboru.", en = "Existing data save unnecessary experiments and let you verify published findings. Look for them in curated databases and in your field's repositories." }
sources = ["RDMKIT.reuse.01", "RDMKIT.reuse.02"]

[[advice]]
id = "citation.06"
lens = "V"
level = "L1"
text = { cs = "Záznam v [[nma|NMA]] je podmínkou vykázání datové sady v RIV jako výsledku typu T. Odkaz pro RIV získáte v NMA (viz zastávka Dohledatelnost); v citacích ale vždy uvádějte PID.", en = "An [[nma|NMA]] record is required for reporting a dataset in RIV as a result of type T. You get the RIV link in NMA (see the Findability station); in citations, however, always give the PID." }
sources = ["NMA-RIV-DOCS.01", "KNAV-TYPE-T.01"]

[[advice]]
id = "citation.07"
lens = "V"
level = "L1"
text = { cs = "Používali jste služby EOSC CZ? Poděkování můžete vyjádřit doporučeným textem.", en = "Did you use EOSC CZ services? You can acknowledge them with the recommended text." }
sources = ["EOSC-ACKNOWLEDGEMENT.01"]

[[advice]]
id = "citation.08"
lens = "DS"
level = "L0"
text = { cs = "Podporujte citační praxi: data citovat, zpřístupňovat je citovatelně a vykazovat je tam, kde to pravidla umožňují.", en = "Support citation practice: cite data, make them citable, and report them where the rules allow." }
action = [{ label = { cs = "Zásady citování dat", en = "Data citation principles" }, href = "https://force11.org/info/joint-declaration-of-data-citation-principles-final/" }, { label = { cs = "Poděkování a citace EOSC CZ", en = "EOSC CZ acknowledgement and citation" }, href = "https://www.eosc.cz/o-nas/acknowledgement" }]
sources = ["FORCE11-CITATION.01", "NMA-RIV-DOCS.01"]

[[advice]]
id = "citation.09"
lens = "DS"
level = "L1"
text = { cs = "Opřete se o Společnou deklaraci zásad citování dat ([[force11-citation|FORCE11]]).", en = "Rely on the Joint Declaration of Data Citation Principles ([[force11-citation|FORCE11]])." }
sources = ["FORCE11-CITATION.01"]

[[advice]]
id = "citation.10"
lens = "DS"
level = "L1"
text = { cs = "Seznamte se s podmínkami vykázání výsledku typu T v RIV a s postupem v [[nma|NMA]].", en = "Learn the conditions for reporting a type T result in RIV and the procedure in [[nma|NMA]]." }
sources = ["KNAV-TYPE-T.01", "NMA-RIV-DOCS.01"]

[[advice]]
id = "citation.11"
lens = "DS"
level = "L1"
text = { cs = "Data steward může být v metadatech uveden jako přispěvatel (například [[datacite|DataCite]] contributorType). Ve výzvě [[os3|Open Science III]] je zapojení data stewarda do tvorby FAIR datové sady, jako autora nebo přispěvatele, povinné.", en = "A data steward can be listed in the metadata as a contributor (for example [[datacite|DataCite]] contributorType). In the [[os3|Open Science III]] call, involving a data steward in creating the FAIR dataset, as author or contributor, is mandatory." }
sources = ["DATACITE-SCHEMA.01", "OS3.01"]

[[advice]]
id = "citation.22"
lens = "DS"
level = "L1"
text = { cs = "Pomozte výzkumníkům posoudit, zda smějí cizí data použít: licenci, podmínky přístupu, etická a právní pravidla a dostatečnost metadat.", en = "Help researchers judge whether they may reuse other people's data: the licence, access conditions, ethical and legal rules, and whether the metadata are sufficient." }
sources = ["RDMKIT.reuse.02"]

[[advice]]
id = "citation.12"
lens = "SR"
level = "L0"
text = { cs = "Usnadněte citování: nabídněte na landing page doporučenou citaci a její export (BibTeX, RIS) a v metadatech uvádějte autory s [[orcid|ORCID]].", en = "Make citing easy: offer a recommended citation and its export (BibTeX, RIS) on the landing page, and give authors with [[orcid|ORCID]] in the metadata." }
action = [{ label = { cs = "Zralost FAIR repozitáře", en = "Repository FAIR maturity" }, href = "#check-maturity" }, { label = { cs = "FAIR Signposting", en = "FAIR Signposting" }, href = "https://signposting.org/FAIR/" }]
sources = ["A.F1.X2", "A.I2.R2"]

[[advice]]
id = "citation.13"
lens = "SR"
level = "L1"
text = { cs = "Na landing page nabídněte doporučenou citaci a její export.", en = "Offer a recommended citation and its export on the landing page." }
sources = ["A.F1.X2"]

[[advice]]
id = "citation.14"
lens = "SR"
level = "L1"
text = { cs = "Kvalitní metadata v [[datacite|DataCite]] ([[orcid|ORCID]], [[ror|ROR]], vazby) zlepšují citovatelnost i dohledatelnost.", en = "Good metadata in [[datacite|DataCite]] ([[orcid|ORCID]], [[ror|ROR]], relations) improve both citability and findability." }
sources = ["A.I2.R2", "A.I3.R1", "DATACITE-SCHEMA.01"]

[[advice]]
id = "citation.15"
lens = "SR"
level = "L1"
text = { cs = "Zajistěte sklizeň do [[nma|NMA]], aby autoři nemuseli zakládat záznamy pro RIV ručně.", en = "Make sure records are harvested into [[nma|NMA]] so that authors need not create them by hand for RIV." }
sources = ["NMA-EXPORT-DOCS.01", "NMA-RIV-DOCS.01"]

[[advice]]
id = "citation.16"
lens = "K"
level = "L0"
text = { cs = "Komunita může doporučit citační praxi pro data svého oboru, včetně citace verzí a podmnožin dat.", en = "A community can recommend citation practice for its domain's data, including citing versions and subsets of data." }
action = { label = { cs = "Zásady citování dat", en = "Data citation principles" }, href = "https://force11.org/info/joint-declaration-of-data-citation-principles-final/" }
sources = ["FORCE11-CITATION.01"]

[[advice]]
id = "citation.17"
lens = "K"
level = "L1"
text = { cs = "Doporučte citační formát a citaci verzí, případně dynamických dat, ve FIP nebo v komunitních pravidlech.", en = "Recommend a citation format and how to cite versions, or dynamic data, in the FIP or in community rules." }
sources = ["FORCE11-CITATION.01", "A.F1.F2"]

[[advice]]
id = "citation.18"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "AI vám pomůže najít v textu místa, kde používáte data, a navrhnout, co citovat. Citaci samotnou ale sestavte z metadat DOI, například v pomocníkovi [[page:citation|Citace z DOI]]: AI umí citace vymyslet.", en = "AI helps you find the places in a text where you use data and suggest what to cite. Build the citation itself from the DOI's metadata, though, for example in the [[page:citation|Citation from a DOI]] helper: AI can make citations up." }
check = { cs = "Každý DOI v citaci rozřešte a porovnejte autory, název, rok a verzi se záznamem.", en = "Resolve every DOI in a citation and compare the authors, title, year and version with the record." }
prompt = { cs = "Projdi text níže a vypiš místa, kde se používají nebo zmiňují výzkumná data, včetně dat jiných autorů. U každého uveď větu a jaká data by se měla citovat. Citace nevytvářej.\n\nText: […]", en = "Go through the text below and list the places where research data are used or mentioned, including other authors' data. For each, give the sentence and which data should be cited. Do not create citations.\n\nText: […]" }
sources = ["EC-GENAI-GUIDELINES.02", "EC-GENAI-GUIDELINES.01"]

[[advice]]
id = "citation.23"
lens = "*"
level = "L1"
text = { cs = "Při novém využití ověřte [[rdmkit-existing-data|vhodnost existujících dat]], jejich licenci a původ. Citujte konkrétní použitou verzi a popište změny; [[rdmkit-provenance|provenience]] pomůže dalšímu uživateli odlišit původní data od výsledku analýzy.", en = "Before reuse, check [[rdmkit-existing-data|whether the existing data fit your purpose]], their licence and origin. Cite the version used and describe transformations; [[rdmkit-provenance|provenance]] helps the next user distinguish source data from analysis outputs." }
sources = ["RDMKIT.tasks.01"]
