# Station 4: describing the data (metadata). Field reference: docs/content-model.md.

[station]
id = "popis"
position = 4
name = { cs = "Popis", en = "Description" }
title = { cs = "Popis dat (metadata)", en = "Describing the data (metadata)" }
icon = "tags"
principles = ["F2", "I1", "I2", "I3", "R1", "R1.2", "R1.3"]
minutes = 15
glossary = ["metadata-metadatovy-zaznam", "metadatovy-standard", "metadatovy-aplikacni-profil", "zakladni-metadatovy-model-pro-popis-vyzkumnych-dat", "rizeny-slovnik", "registr-vyzkumnych-organizaci"]

[[advice]]
id = "popis.V.L0"
lens = "V"
level = "L0"
text = { cs = "Popište data tak, aby jim porozuměl i někdo z jiného týmu za deset let: název, abstrakt, autoři s [[orcid|ORCID]], instituce s [[ror|ROR]], způsob vzniku dat, odborná hesla a klíčová slova.", en = "Describe the data so that someone from another team can understand them in ten years: title, abstract, authors with [[orcid|ORCID]], institutions with [[ror|ROR]], how the data were made, subject terms and keywords." }
action = { label = { cs = "Co připravit před vyplněním formuláře", en = "What to prepare before filling in the form" }, href = "#check-dataset" }
sources = ["A.F2.N2", "A.I2.R2", "A.R1.2.X1"]

[[advice]]
id = "popis.V.L1.1"
lens = "V"
level = "L1"
text = { cs = "Připravte základní údaje: název, popis, autory s [[orcid|ORCID]], afiliace s [[ror|ROR]], data vzniku, typ a jazyk. Repozitář je převede do společného modelu [[ccmm|CCMM]].", en = "Prepare the basic details: title, description, authors with [[orcid|ORCID]], affiliations with [[ror|ROR]], dates, type and language. The repository converts them to the common [[ccmm|CCMM]] model." }
sources = ["A.F2.N2", "A.I2.R2", "A.F2.R1"]

[[advice]]
id = "popis.V.L1.2"
lens = "V"
level = "L1"
text = { cs = "Odborná hesla vybírejte z řízených slovníků; volná klíčová slova je jen doplňují. [[ccmm|CCMM]] 2.0.0 obojí rozlišuje.", en = "Choose subject terms from controlled vocabularies; free keywords only complement them. [[ccmm|CCMM]] 2.0.0 distinguishes the two." }
sources = ["A.I2.R1", "E.CCMM"]

[[advice]]
id = "popis.V.L1.3"
lens = "V"
level = "L1"
text = { cs = "Popište, jak data vznikla: metodu, přístroje, software a zpracování.", en = "Describe how the data were made: method, instruments, software and processing." }
sources = ["A.R1.2.X1"]

[[advice]]
id = "popis.V.L1.4"
lens = "V"
level = "L1"
text = { cs = "Uveďte vazby pomocí trvalých identifikátorů: související články, zdrojová data a předchozí verze.", en = "Give links through persistent identifiers: related articles, source data and previous versions." }
sources = ["A.I3.R3", "A.R1.2.N3"]

[[advice]]
id = "popis.V.L1.5"
lens = "V"
level = "L1"
text = { cs = "K souborům přidejte README nebo datový slovník.", en = "Add a README or a data dictionary to the files." }
sources = ["E.CESSDA-DMEG"]

[[advice]]
id = "popis.V.L1.6"
lens = "V"
level = "L1"
text = { cs = "Má-li váš obor metadatový standard (například DDI, Darwin Core nebo CIDOC CRM), použijte ho; repozitář nebo FIP ukáže jak.", en = "If your field has a metadata standard (for example DDI, Darwin Core or CIDOC CRM), use it; the repository or the FIP shows how." }
sources = ["A.R1.3.X2"]

[[advice]]
id = "popis.all.L2.1"
lens = ["V", "DS"]
level = "L2"
text = { cs = "Metadata mají dvě úrovně. Jádro ([[ccmm|CCMM]]) se sklízí do [[nma|NMA]] a slouží k vyhledání; bohatý oborový popis zůstává v repozitáři a slouží k opakovanému použití.", en = "Metadata have two levels. The core ([[ccmm|CCMM]]) is harvested into [[nma|NMA]] and serves discovery; the rich domain description stays in the repository and serves reuse." }
sources = ["A.F2.X1", "A.R1.X1"]

[[advice]]
id = "popis.DS.L0"
lens = "DS"
level = "L0"
text = { cs = "Pomozte s výběrem slovníků a se strukturou popisu. [[ccmm|CCMM]] je společné minimum, oborový profil přidává hloubku.", en = "Help with choosing vocabularies and structuring the description. [[ccmm|CCMM]] is the common minimum; a domain profile adds depth." }
action = { label = { cs = "CCMM na ccmm.cz", en = "CCMM at ccmm.cz" }, href = "https://www.ccmm.cz" }
sources = ["A.F2.N1", "A.F2.X1"]

[[advice]]
id = "popis.DS.L1.1"
lens = "DS"
level = "L1"
text = { cs = "[[ccmm|CCMM]]: [[nma|NMA]] pracuje s verzí 1.1.0; verze 2.0.0 vyšla v říjnu 2026 a NMA její podporu připravuje.", en = "[[ccmm|CCMM]]: [[nma|NMA]] works with version 1.1.0; version 2.0.0 was released in October 2026, and NMA is preparing to support it." }
sources = ["A.F2.N1", "E.CCMM"]

[[advice]]
id = "popis.DS.L1.2"
lens = "DS"
level = "L1"
text = { cs = "Slovníky hledejte v katalozích ([[fairsharing|FAIRsharing]], LOV, BioPortal, OLS) a dávejte přednost těm s trvalými URI.", en = "Look for vocabularies in catalogues ([[fairsharing|FAIRsharing]], LOV, BioPortal, OLS) and prefer those with persistent URIs." }
sources = ["A.I2.N2", "A.I2.X2"]

[[advice]]
id = "popis.DS.L1.3"
lens = "DS"
level = "L1"
text = { cs = "S [[orcid|ORCID]] a [[ror|ROR]] pomůže Národní centrum ORCID a národní podpora ROR na identifikatory.cz.", en = "The National [[orcid|ORCID]] Centre and national [[ror|ROR]] support at identifikatory.cz help with ORCID and ROR." }
sources = ["A.I2.R2", "E.PID-CENTRE"]

[[advice]]
id = "popis.DS.L1.4"
lens = "DS"
level = "L1"
text = { cs = "Provenience patří do metadat alespoň v rozsahu [[ccmm|CCMM]]: tvůrci, metodika a verze.", en = "Provenance belongs in the metadata at least to the extent of [[ccmm|CCMM]]: creators, methodology and versions." }
sources = ["A.R1.2.N1"]

[[advice]]
id = "popis.DS.L1.5"
lens = "DS"
level = "L1"
text = { cs = "Kvalitu popisu pomáhá zajistit kurátorská kontrola v repozitáři.", en = "Curation in the repository helps ensure the quality of the description." }
sources = ["C.ROLE.curator"]

[[advice]]
id = "popis.SR.L0"
lens = "SR"
level = "L0"
text = { cs = "Formulář repozitáře má pokrýt povinné prvky [[ccmm|CCMM]] a nabídnout oborový profil a metadata je třeba harmonizovat. Obojí vyžadují podmínky NRP.", en = "The repository's form should cover the mandatory [[ccmm|CCMM]] elements and offer a domain profile, and metadata need to be harmonised. The NRP conditions require both." }
action = { label = { cs = "CCMM: verze a vydání", en = "CCMM: versions and releases" }, href = "https://github.com/techlib/CCMM/releases" }
sources = ["C.M12", "C.M8", "A.F2.R1"]

[[advice]]
id = "popis.SR.L1.1"
lens = "SR"
level = "L1"
text = { cs = "Poskytujte minimální záznam mapovaný na [[ccmm|CCMM]] a sledujte přechod z verze 1.1.0 na 2.0.0.", en = "Provide a minimum record mapped to [[ccmm|CCMM]], and follow the move from version 1.1.0 to 2.0.0." }
sources = ["A.F2.R1", "A.R1.R1", "S.MIN2", "A.F2.N1"]

[[advice]]
id = "popis.SR.L1.2"
lens = "SR"
level = "L1"
text = { cs = "Vedle [[ccmm|CCMM]] nabídněte oborový profil a oborové standardy podle FIP, ve spolupráci s komunitou.", en = "Alongside [[ccmm|CCMM]], offer a domain profile and domain standards according to the FIP, together with the community." }
sources = ["A.F2.R2", "A.R1.R2", "A.R1.3.N1", "A.R1.3.R1", "S.REC1", "C.M12"]

[[advice]]
id = "popis.SR.L1.3"
lens = "SR"
level = "L1"
text = { cs = "Validujte metadata před uložením, vůči [[ccmm|CCMM]] i vůči komunitním schématům.", en = "Validate metadata before they are stored, against [[ccmm|CCMM]] and against community schemas." }
sources = ["A.F4.R3", "A.R1.3.R2"]

[[advice]]
id = "popis.SR.L1.4"
lens = "SR"
level = "L1"
text = { cs = "Vazby a identifikátory v metadatech:", en = "Links and identifiers in the metadata:" }
steps = [
  { cs = "pole pro vazby na jiné záznamy a datové sady;", en = "fields for links to other records and datasets;" },
  { cs = "[[orcid|ORCID]] a [[ror|ROR]];", en = "[[orcid|ORCID]] and [[ror|ROR]];" },
  { cs = "vztahy podle [[datacite|DataCite]], PROV-O nebo DCAT-AP;", en = "relations following [[datacite|DataCite]], PROV-O or DCAT-AP;" },
  { cs = "kontrola, že externí odkazy fungují.", en = "a check that external links work." },
]
sources = ["A.I3.N1", "A.I2.R2", "A.I3.R2", "A.I3.R1", "A.I3.R4"]

[[advice]]
id = "popis.SR.L1.5"
lens = "SR"
level = "L1"
text = { cs = "Podporujte slovníky komunity, umožněte přidávat oborové slovníky a evidujte je v záznamu [[nkr|NKR]].", en = "Support community vocabularies, allow domain vocabularies to be added, and record them in the [[nkr|NKR]] entry." }
sources = ["A.I2.R1", "A.I2.R3", "A.I2.N1"]

[[advice]]
id = "popis.SR.L1.6"
lens = "SR"
level = "L1"
text = { cs = "Zpřístupněte metadata ve strojově čitelných formátech (JSON-LD, RDF/XML, Turtle, XML), ideálně v RDF.", en = "Make metadata available in machine-readable formats (JSON-LD, RDF/XML, Turtle, XML), ideally in RDF." }
sources = ["A.I1.R1", "A.I1.R2", "A.I1.N2"]

[[advice]]
id = "popis.SR.L1.7"
lens = "SR"
level = "L1"
text = { cs = "Vyžadujte základní provenienční informace (původ, verze, historie změn), alespoň v rozsahu [[ccmm|CCMM]].", en = "Require basic provenance information (origin, version, change history), at least to the extent of [[ccmm|CCMM]]." }
sources = ["A.R1.2.R1"]

[[advice]]
id = "popis.SR.L1.8"
lens = "SR"
level = "L1"
text = { cs = "Zveřejněte pravidla repozitáře (metadatový profil, datovou politiku, případně FIP), profil i strojově čitelně (SHACL nebo JSON Schema).", en = "Publish the repository's rules (metadata profile, data policy, FIP if any), with the profile also in machine-readable form (SHACL or JSON Schema)." }
sources = ["K2.3.2a", "K2.3.2c"]

[[advice]]
id = "popis.SR.L1.9"
lens = "SR"
level = "L1"
text = { cs = "Metadatové profily můžete spravovat v nástroji [[dataspecer|Dataspecer]] (verze, export SHACL a JSON Schema, mapování); k dispozici je i lokální obraz Docker.", en = "You can manage metadata profiles in [[dataspecer|Dataspecer]] (versions, SHACL and JSON Schema export, mappings); a local Docker image is also available." }
sources = ["K2.2.1", "E.DATASPECER"]

[[advice]]
id = "popis.SR.L1.10"
lens = "SR"
level = "L1"
text = { cs = "Kurátor stanovuje pravidla ukládání, harmonizuje metadata a podílí se na tvorbě profilů.", en = "The curator sets deposit rules, harmonises metadata and takes part in creating profiles." }
sources = ["C.ROLE.curator"]

[[advice]]
id = "popis.SR.L1.11"
lens = "SR"
level = "L1"
text = { cs = "Jazyk uvádějte kódem ISO 639 (například cs, en) a typ zdroje z řízeného slovníku, například COAR Resource Types.", en = "Give the language as an ISO 639 code (for example cs, en) and the resource type from a controlled vocabulary, for example COAR Resource Types." }
sources = ["E.OSTRAILS-CZ"]

[[advice]]
id = "popis.SR.L2.1"
lens = "SR"
level = "L2"
text = { cs = "Princip I1 nevyžaduje jen sémantický web; přípustné jsou i zavedené oborové formáty, například XML. Rozsah povinných metadat má odpovídat přínosu pro vyhledání a opakované použití.", en = "Principle I1 does not demand only the semantic web; established domain formats such as XML are acceptable too. The extent of mandatory metadata should match its benefit for discovery and reuse." }
sources = ["A.I1.X1", "A.I2.X1"]

[[advice]]
id = "popis.K.L0"
lens = "K"
level = "L0"
text = { cs = "FIP určuje oborový metadatový profil a slovníky nad rámec [[ccmm|CCMM]]. Zapište je jako FER, aby je mohly využít repozitáře i DMP.", en = "The FIP sets the domain metadata profile and vocabularies beyond [[ccmm|CCMM]]. Record them as FERs so that repositories and DMPs can use them." }
action = { label = { cs = "Metadatová schémata ve FIP Dashboardu", en = "Metadata schemas in the FIP Dashboard" }, href = "https://fip-dashboard.dmp.eosc.cz/resources?principles=F2" }
sources = ["S.REC3", "K4.1", "A.F2.F1", "A.I2.F1", "E.FIP-DASHBOARD"]

[[advice]]
id = "popis.K.L1.1"
lens = "K"
level = "L1"
text = { cs = "Určete povinné a doporučené metadatové profily, atributy a oborové datové standardy.", en = "Set the mandatory and recommended metadata profiles, attributes and domain data standards." }
sources = ["A.F2.F1", "A.R1.F1", "A.R1.3.F1", "A.R1.3.F2"]

[[advice]]
id = "popis.K.L1.2"
lens = "K"
level = "L1"
text = { cs = "Doporučte slovníky a ontologie s pokyny k použití.", en = "Recommend vocabularies and ontologies, with guidance on their use." }
sources = ["A.I2.F1", "A.R1.F2"]

[[advice]]
id = "popis.K.L1.3"
lens = "K"
level = "L1"
text = { cs = "Určete sémantické zdroje a serializace (SKOS, OWL, PROV-O; JSON-LD, Turtle).", en = "Set the semantic resources and serialisations (SKOS, OWL, PROV-O; JSON-LD, Turtle)." }
sources = ["A.I1.F1", "A.I1.F2"]

[[advice]]
id = "popis.K.L1.4"
lens = "K"
level = "L1"
text = { cs = "Určete povinné a doporučené vztahy mezi záznamy.", en = "Set the mandatory and recommended relations between records." }
sources = ["A.I3.F1", "A.I3.F2"]

[[advice]]
id = "popis.K.L1.5"
lens = "K"
level = "L1"
text = { cs = "Určete minimální rozsah provenience v oboru.", en = "Set the minimum provenance for your domain." }
sources = ["A.R1.2.F1", "A.R1.2.F2"]

[[advice]]
id = "popis.K.L1.6"
lens = "K"
level = "L1"
text = { cs = "Registrujte komunitní standardy ve [[fairsharing|FAIRsharing]]; záznam s DOI pak může posloužit jako FER.", en = "Register community standards in [[fairsharing|FAIRsharing]]; a record with a DOI can then serve as a FER." }
sources = ["E.FIP-TEMPLATES"]

[[advice]]
id = "popis.K.L1.7"
lens = "K"
level = "L1"
text = { cs = "V oborech bez ustálených standardů je vyvíjejte ve spolupráci s projektem [[os2|Open Science II]] a oborovými pracovními skupinami.", en = "In domains without established standards, develop them with the [[os2|Open Science II]] project and the domain working groups." }
sources = ["A.R1.3.N3", "E.OS2"]

[[advice]]
id = "popis.K.L1.8"
lens = "K"
level = "L1"
text = { cs = "Pro mezioborovou výměnu využijte profily [[cdif|CDIF 1.1]] a doporučení EOSC Task Force pro sémantickou interoperabilitu.", en = "For cross-domain exchange, use the [[cdif|CDIF 1.1]] profiles and the EOSC Task Force recommendations on semantic interoperability." }
sources = ["A.F2.X4", "E.CDIF", "E.TF-SEMANTIC"]

[[advice]]
id = "popis.all.L1.1"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "AI pomůže s návrhem abstraktu, README a datového slovníku, s překladem metadat mezi češtinou a angličtinou a s návrhy hesel. Identifikátory a hesla si ale vždy ověřte (viz Ověřte identifikátory).", en = "AI can help draft the abstract, the README and the data dictionary, translate metadata between Czech and English, and suggest subject terms. Always verify identifiers and terms, though (see Verify identifiers)." }
sources = ["E.CERIT-AI"]
