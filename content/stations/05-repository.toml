# Station 5: choosing a repository. Field reference: docs/content-model.md.

[station]
id = "repository"
position = 5
lifecycleStage = "preserve"
name = { cs = "Repozitář", en = "Repository" }
title = { cs = "Výběr repozitáře", en = "Choosing a repository" }
icon = "box-archive"
principles = ["F4", "A1", "A1.1", "A2", "R1.3"]
minutes = 10
glossary = ["211", "443", "442", "437", "400", "396"]

[[advice]]
id = "repository.01"
lens = "V"
level = "L0"
text = { cs = "Uložte data tam, kde je najde váš obor: přednostně do oborového repozitáře, jinak do institucionálního. Když se nic nehodí, nabízí NRP datový catch-all repozitář.", en = "Deposit your data where your field will find them: preferably in a domain repository, otherwise in an institutional one. If nothing fits, NRP offers a catch-all data repository." }
action = [{ label = { cs = "Najít repozitář", en = "Find a repository" }, href = "#repositories" }, { label = { cs = "Datový catch-all repozitář NRP", en = "NRP catch-all data repository" }, href = "https://datarepo.eosc.cz/" }]
sources = ["A.R1.3.X1", "DATAREPO.01"]

[[advice]]
id = "repository.02"
lens = "V"
level = "L1"
text = { cs = "Zeptejte se v oboru nebo data stewarda, kam se data běžně ukládají.", en = "Ask colleagues in your field or your data steward where data are usually deposited." }
sources = ["A.R1.3.X1", "EOSC-DATA-STEWARDS.01"]

[[advice]]
id = "repository.03"
lens = "V"
level = "L1"
text = { cs = "Vyhledejte repozitář podle oboru a typu dat; vyhledávač Průvodce čerpá z Národního katalogu repozitářů ([[nkr|NKR]]) a z registru [[re3data|re3data]].", en = "Search for a repository by field and data type; the Guide's finder draws on the [[nkr|National Repository Catalogue (NKR)]] and the [[re3data|re3data]] registry." }
sources = ["NKR-SCHEMA.01"]

[[advice]]
id = "repository.04"
lens = "V"
level = "L1"
text = { cs = "Ověřte hlavní vlastnosti repozitáře:", en = "Check the repository's main features:" }
steps = [
  { cs = "přiděluje trvalý identifikátor (DOI, Handle nebo jiný)?", en = "does it assign a persistent identifier (DOI, Handle or another)?" },
  { cs = "jaké licence a režimy přístupu podporuje?", en = "which licences and access modes does it support?" },
  { cs = "jaký má limit velikosti a podporuje citlivá data?", en = "what is its size limit, and does it support sensitive data?" },
  { cs = "je napojen na [[nma|Národní metadatový adresář (NMA)]]? To je důležité pro vykázání dat v RIV.", en = "is it connected to the [[nma|National Metadata Directory (NMA)]]? This matters for reporting the data in RIV." },
]
sources = ["NKR-SCHEMA.01", "A.F1.N2"]

[[advice]]
id = "repository.05"
lens = "V"
level = "L1"
text = { cs = "Přečtěte si podmínky repozitáře: datovou politiku a depoziční licenční podmínky, které při vkladu přijímáte.", en = "Read the repository's terms: its data policy and the deposit licence conditions you accept when you deposit." }
sources = ["A.K2.3.2a", "DEPOSIT-LICENCE.01", "COPYRIGHT-LICENCES.02"]

[[advice]]
id = "repository.06"
lens = "V"
level = "L1"
text = { cs = "Pokud se nic nehodí, použijte datový catch-all repozitář NRP (datarepo.eosc.cz); přiděluje DOI a zpřístupňuje metadata přes [[oai-pmh|OAI-PMH]].", en = "If nothing fits, use the NRP catch-all data repository (datarepo.eosc.cz); it assigns DOIs and exposes metadata through [[oai-pmh|OAI-PMH]]." }
sources = ["DATAREPO.01"]

[[advice]]
id = "repository.07"
lens = "*"
level = "L1"
kind = "key"
text = { cs = "Většinu vlastností, které definují míru souladu s FAIR, určuje nastavení repozitáře. Výběr repozitáře je proto jedno z nejdůležitějších rozhodnutí.", en = "Most properties that determine the degree of FAIR compliance are set by the repository's configuration. Choosing the repository is therefore one of the most important decisions." }
sources = ["A.K5.2.1"]

[[advice]]
id = "repository.08"
lens = "DS"
level = "L0"
text = { cs = "Pomozte vybrat repozitář podle oboru, typu dat a podmínek přístupu. Vyhledávač Průvodce filtruje podle údajů z [[nkr|NKR]] a [[re3data|re3data]].", en = "Help choose a repository by field, data type and access conditions. The Guide's finder filters by information from [[nkr|NKR]] and [[re3data|re3data]]." }
action = [{ label = { cs = "Vyhledávač repozitářů", en = "Repository finder" }, href = "#repositories" }, { label = { cs = "Zralost FAIR repozitáře", en = "FAIR maturity of a repository" }, href = "#check-maturity" }]
sources = ["A.R1.3.X1", "NKR-SCHEMA.01"]

[[advice]]
id = "repository.09"
lens = "DS"
level = "L1"
text = { cs = "Posuzujte obor a komunitu, trvalé identifikátory, licence, přístup, podporu citlivých dat, napojení na [[nma|NMA]] a certifikaci ([[coretrustseal|CoreTrustSeal]]).", en = "Weigh the field and community, persistent identifiers, licences, access, sensitive-data support, the [[nma|NMA]] connection and certification ([[coretrustseal|CoreTrustSeal]])." }
sources = ["NKR-SCHEMA.01", "CORETRUSTSEAL.01"]

[[advice]]
id = "repository.10"
lens = "DS"
level = "L1"
text = { cs = "Ověřte, že je repozitář registrován v [[re3data|re3data]] a [[fairsharing|FAIRsharing]]; i repozitář sám má být dohledatelný.", en = "Check that the repository is registered in [[re3data|re3data]] and [[fairsharing|FAIRsharing]]; the repository itself should be findable too." }
sources = ["NKR-SCHEMA.01"]

[[advice]]
id = "repository.11"
lens = "DS"
level = "L1"
text = { cs = "Instituce bez vlastního repozitáře může zvolit instanci základního systému NRP nebo využít catch-all repozitář.", en = "An institution without its own repository can choose an instance of a core NRP system or use the catch-all repository." }
sources = ["NRP.R4", "REPO-INTEGRATION.01", "DATAREPO.01"]

[[advice]]
id = "repository.12"
lens = "SR"
level = "L0"
text = { cs = "Aby vás výzkumníci našli, zaregistrujte repozitář v Národním katalogu repozitářů ([[nkr|NKR]]) a záznam udržujte aktuální. Podmínky NRP to vyžadují.", en = "So that researchers can find you, register the repository in the [[nkr|National Repository Catalogue (NKR)]] and keep the record up to date. The NRP conditions require this." }
action = [{ label = { cs = "Podmínky NRP pro repozitáře", en = "NRP conditions for repositories" }, href = "#check-gate" }, { label = { cs = "Připravenost na CoreTrustSeal", en = "CoreTrustSeal readiness" }, href = "#check-coretrustseal" }]
sources = ["NRP.M5"]

[[advice]]
id = "repository.13"
lens = "SR"
level = "L1"
text = { cs = "Zaregistrujte repozitář v [[nkr|NKR]] a záznam aktualizujte. NKR je vedle [[nma|NMA]] a [[pid-centre|Centra PID]] jednou ze sdílených služeb Národní datové infrastruktury.", en = "Register the repository in [[nkr|NKR]] and keep the record updated. Alongside [[nma|NMA]] and the [[pid-centre|PID Centre]], NKR is one of the shared services of the National Data Infrastructure." }
sources = ["NRP.M5", "A.K2.1"]

[[advice]]
id = "repository.14"
lens = "SR"
level = "L1"
text = { cs = "Zaregistrujte repozitář v [[re3data|re3data]] a [[fairsharing|FAIRsharing]] a v [[nkr|NKR]] je uveďte jako související registry.", en = "Register the repository in [[re3data|re3data]] and [[fairsharing|FAIRsharing]] and list them in [[nkr|NKR]] as related registries." }
sources = ["NKR-SCHEMA.01"]

[[advice]]
id = "repository.15"
lens = "SR"
level = "L1"
text = { cs = "Zakládáte nový repozitář?", en = "Setting up a new repository?" }
steps = [
  { cs = "přečtěte si [[repo-recommendations|Doporučení pro zakládání repozitářů v prostředí NRP]];", en = "read the [[repo-recommendations|recommendations for establishing repositories in NRP]];" },
  { cs = "konzultujte oborovou pracovní skupinu EOSC CZ;", en = "consult the EOSC CZ working group for your domain;" },
  { cs = "nespecializujte repozitář příliš úzce;", en = "do not specialise the repository too narrowly;" },
  { cs = "využijte základní systémy NRP;", en = "use the core NRP systems;" },
  { cs = "obsaďte role správce a kurátora více lidmi.", en = "cover the administrator and curator roles with more than one person." },
]
sources = ["REPO-RECOMMENDATIONS.01", "NRP.R1", "NRP.R2", "NRP.R3", "NRP.R4", "NRP.ROLE.admin"]

[[advice]]
id = "repository.16"
lens = "SR"
level = "L1"
text = { cs = "Než repozitář navrhnete, zjistěte potřeby jeho uživatelů.", en = "Before you design the repository, find out what its users need." }
sources = ["REPO-USER-NEEDS.01"]

[[advice]]
id = "repository.17"
lens = "SR"
level = "L1"
text = { cs = "Samostatně provozovaný repozitář potřebuje pro napojení na NRP minimum: metadata do [[nma|NMA]], záznam v [[nkr|NKR]], AAI, API, trvalé identifikátory (ne nutně DOI), bezpečnost a monitoring.", en = "An independently operated repository needs a minimum to connect to NRP: metadata to [[nma|NMA]], an [[nkr|NKR]] record, AAI, an API, persistent identifiers (not necessarily DOI), security and monitoring." }
sources = ["NRP.EXT", "REPO-INTEGRATION.01"]

[[advice]]
id = "repository.18"
lens = "SR"
level = "L1"
text = { cs = "Zvažte certifikaci [[coretrustseal|CoreTrustSeal]].", en = "Consider [[coretrustseal|CoreTrustSeal]] certification." }
sources = ["CORETRUSTSEAL.01", "A.F1.X2"]

[[advice]]
id = "repository.19"
lens = "K"
level = "L0"
text = { cs = "Uveďte ve FIP, které repozitáře váš obor doporučuje. Pokud oborový repozitář chybí, podporuje projekt [[os2|Open Science II]] vznik nových.", en = "State in the FIP which repositories your domain recommends. If a domain repository is missing, the [[os2|Open Science II]] project supports creating new ones." }
action = [{ label = { cs = "Open Science II", en = "Open Science II" }, href = "https://www.eosc.cz/projekty/open-science-ii" }, { label = { cs = "Vyhledávač repozitářů", en = "Repository finder" }, href = "#repositories" }]
sources = ["A.K4.1", "OS2.01"]

[[advice]]
id = "repository.20"
lens = "K"
level = "L1"
text = { cs = "Doporučené repozitáře zapište do FIP jako FER; repozitáře jiných komunit uvidíte ve [[fip-dashboard|FIP Dashboardu]].", en = "Record recommended repositories in the FIP as FERs; other communities' repositories are listed in the [[fip-dashboard|FIP Dashboard]]." }
sources = ["A.K4.1", "FIP-DASHBOARD.01"]

[[advice]]
id = "repository.21"
lens = "K"
level = "L1"
text = { cs = "V oborech bez standardů a repozitářů spolupracujte s projektem [[os2|Open Science II]] a s oborovými pracovními skupinami.", en = "In domains without standards and repositories, work with the [[os2|Open Science II]] project and the domain working groups." }
sources = ["A.R1.3.N3", "NRP.R2", "OS2.01"]

[[advice]]
id = "repository.22"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "AI vám pomůže sepsat, co od repozitáře potřebujete (obor, formáty, objem, přístup, licence, trvalý identifikátor), a porovnat to s podmínkami repozitářů. Fakta o repozitářích berte z jejich stránek, z [[re3data|re3data]] a z [[nkr|Národního katalogu repozitářů]], ne z paměti modelu.", en = "AI helps you write down what you need from a repository (field, formats, volume, access, licence, persistent identifier) and compare it with the repositories' terms. Take the facts about repositories from their own pages, from [[re3data|re3data]] and from the [[nkr|National Repository Catalogue]], not from the model's memory." }
check = { cs = "Každé tvrzení o repozitáři ověřte na jeho stránce nebo v jeho záznamu v re3data; podmínky se mění a model je nemusí znát.", en = "Verify every statement about a repository on its own page or in its re3data record; terms change and the model may not know them." }
prompt = { cs = "Z požadavků níže sestav tabulku kritérií pro výběr repozitáře (obor, formáty, objem, omezení přístupu, licence, trvalý identifikátor, poplatky). Pak ji porovnej s podmínkami repozitářů, které vložím, a u každého tvrzení uveď, ze které vložené podmínky pochází. Nic nedoplňuj z paměti.\n\nPožadavky: […]\n\nPodmínky repozitářů: […]", en = "From the requirements below, build a table of criteria for choosing a repository (field, formats, volume, access restrictions, licence, persistent identifier, fees). Then compare it with the repository terms I paste, and for each statement say which pasted term it comes from. Add nothing from memory.\n\nRequirements: […]\n\nRepository terms: […]" }
sources = ["EC-GENAI-GUIDELINES.01"]
