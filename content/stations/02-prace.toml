# Station 2: working with data during research. Field reference: docs/content-model.md.

[station]
id = "prace"
position = 2
name = { cs = "Práce", en = "Work" }
title = { cs = "Práce s daty během výzkumu", en = "Working with data during research" }
icon = "flask"
principles = ["R1.2", "I1", "R1", "A1.2"]
minutes = 5
glossary = ["metadata-metadatovy-zaznam", "podkladova-podpurna-doprovodna-data", "strojove-citelny-dokument-format"]

[[advice]]
id = "prace.V.L0"
lens = "V"
level = "L0"
text = { cs = "Už během výzkumu data průběžně organizujte a dokumentujte: jednotné názvy souborů, verze, README a záznam postupu. Při zveřejnění vám to ušetří spoustu práce.", en = "Organise and document your data as you go: consistent file names, versions, a README and a record of how the data were made. It will save you a lot of work when you publish." }
action = [{ label = { cs = "Šablony README", en = "README templates" }, href = "https://github.com/Czech-Data-Steward-Community/README_FILES_EXAMPLES" }, { label = { cs = "Jupyter jako laboratorní deník", en = "Jupyter as a lab notebook" }, href = "https://github.com/Czech-Data-Steward-Community/jupyter-ELN-example" }]
sources = ["E.CESSDA-DMEG", "A.R1.2.X1"]

[[advice]]
id = "prace.V.L1.1"
lens = "V"
level = "L1"
text = { cs = "Ukládejte data na spravované a zálohované úložiště (instituce, e-INFRA CZ), ne jen na vlastní počítač nebo přenosné médium.", en = "Store data on managed, backed-up storage (your institution, e-INFRA CZ), not only on your own computer or a portable drive." }
sources = ["E.EINFRA", "E.CESSDA-DMEG"]

[[advice]]
id = "prace.V.L1.2"
lens = "V"
level = "L1"
text = { cs = "Dohodněte se v týmu na pojmenování souborů, struktuře složek a způsobu verzování.", en = "Agree as a team on file naming, folder structure and versioning." }
sources = ["E.CESSDA-DMEG"]

[[advice]]
id = "prace.V.L1.3"
lens = "V"
level = "L1"
text = { cs = "Průběžně pište README a datový slovník: co znamenají proměnné, jednotky a kódy. Začít můžete ze [[cdsc-readme|šablon README komunity data stewardů]].", en = "Write a README and a data dictionary as you go: what the variables, units and codes mean. You can start from the [[cdsc-readme|Czech data steward community's README templates]]." }
sources = ["E.CESSDA-DMEG", "E.CDSC-README"]

[[advice]]
id = "prace.V.L1.4"
lens = "V"
level = "L1"
text = { cs = "Zaznamenávejte, jak data vznikla: přístroje, software a jeho verze, kroky zpracování. Jako elektronický laboratorní deník poslouží i Jupyter Notebook; jak na to, ukazuje [[cdsc-eln|příklad komunity data stewardů]].", en = "Record how the data were made: instruments, software and its versions, processing steps. A Jupyter notebook can serve as an electronic lab notebook; [[cdsc-eln|an example from the data steward community]] shows how." }
sources = ["A.R1.2.X1", "E.CDSC-ELN"]

[[advice]]
id = "prace.V.L1.5"
lens = "V"
level = "L1"
text = { cs = "Původní soubory z přístrojů uchovejte; pro sdílení přidejte otevřené a rozšířené formáty, pokud existují.", en = "Keep the original instrument files; for sharing, add open and widely used formats where they exist." }
sources = ["A.I1.X1", "E.MBDB"]

[[advice]]
id = "prace.V.L1.6"
lens = "V"
level = "L1"
text = { cs = "Data z přístrojů lze anotovat a předávat do repozitáře automaticky, například aplikací [[ddrapp|DDRapp]].", en = "Instrument data can be annotated and passed to a repository automatically, for example with the [[ddrapp|DDRapp]] application." }
sources = ["K2.2.4", "E.DDRAPP"]

[[advice]]
id = "prace.DS.L0"
lens = "DS"
level = "L0"
text = { cs = "Pomozte nastavit postupy dřív, než data vzniknou: úložiště, pojmenování, verzování a dokumentaci.", en = "Help set up practices before the data exist: storage, naming, versioning and documentation." }
action = [{ label = { cs = "Úložiště a výpočty v e-INFRA CZ", en = "Storage and computing in e-INFRA CZ" }, href = "https://docs.e-infra.cz/" }, { label = { cs = "AI v e-INFRA CZ", en = "AI in e-INFRA CZ" }, href = "#page-ai" }]
sources = ["E.EINFRA", "E.CESSDA-DMEG"]

[[advice]]
id = "prace.DS.L1.1"
lens = "DS"
level = "L1"
text = { cs = "Doporučte vhodné úložiště: institucionální, CESNET (S3, [[onedata|Onedata]]), pro citlivá data [[sensitive-cloud|Sensitive Cloud]].", en = "Recommend suitable storage: institutional, CESNET (S3, [[onedata|Onedata]]), and [[sensitive-cloud|Sensitive Cloud]] for sensitive data." }
sources = ["E.EINFRA"]

[[advice]]
id = "prace.DS.L1.2"
lens = "DS"
level = "L1"
text = { cs = "Připravte pro týmy šablony README a datového slovníku. Vyjít můžete ze [[cdsc-readme|šablon komunity data stewardů]] ve formátech TXT, Markdown a JSON.", en = "Prepare README and data dictionary templates for research teams. You can build on the [[cdsc-readme|Czech data steward community's templates]] in TXT, Markdown and JSON." }
sources = ["E.CESSDA-DMEG", "E.CDSC-README"]

[[advice]]
id = "prace.DS.L1.3"
lens = "DS"
level = "L1"
text = { cs = "Upozorněte na výpočetní prostředí e-INFRA CZ, které lze propojit s daty v NRP.", en = "Point out the e-INFRA CZ computing environment, which can connect to data in NRP." }
sources = ["E.NRP-COMPUTE"]

[[advice]]
id = "prace.DS.L1.4"
lens = "DS"
level = "L1"
text = { cs = "Doporučte [[eosc-training|školení ke správě výzkumných dat od EOSC CZ]].", en = "Recommend [[eosc-training|EOSC CZ training]] in research data management." }
sources = ["E.TRAINING"]

[[advice]]
id = "prace.DS.L2.1"
lens = "DS"
level = "L2"
text = { cs = "Národní průzkum správy výzkumných dat 2025 (N = 1121): během projektů ukládá data na osobní počítač 66,4 % respondentů, na přenosná média 53,2 % a do národní infrastruktury 14,5 %.", en = "National survey of research data management 2025 (N = 1121): during projects, 66.4 % of respondents store data on a personal computer, 53.2 % on portable media and 14.5 % in the national infrastructure." }
sources = ["E.SURVEY"]

[[advice]]
id = "prace.SR.L0"
lens = "SR"
level = "L0"
text = { cs = "Pokud repozitář přijímá data z přístrojů nebo z výpočetních prostředí, nabídněte zdokumentované API. Webové rozhraní i API vyžadují podmínky NRP.", en = "If the repository receives data from instruments or computing environments, offer a documented API. The NRP conditions require both a web interface and an API." }
action = [{ label = { cs = "Výpočty s daty z NRP", en = "Computing with NRP data" }, href = "https://docs.nrp.eosc.cz/en/docs/end_users/compute/support-for-computing" }, { label = { cs = "Integrace repozitáře do NRP", en = "Integrating a repository into NRP" }, href = "https://www.eosc.cz/sluzby/ukladani/repozitare-v-nrp/integrece-repo-nrp" }]
sources = ["C.M2"]

[[advice]]
id = "prace.SR.L1.1"
lens = "SR"
level = "L1"
text = { cs = "Zdokumentujte API pro vkládání a čtení dat.", en = "Document the API for depositing and reading data." }
sources = ["C.M2"]

[[advice]]
id = "prace.SR.L1.2"
lens = "SR"
level = "L1"
text = { cs = "Zveřejněte seznam podporovaných formátů, ideálně strojově čitelně.", en = "Publish the list of supported formats, ideally in machine-readable form." }
sources = ["K2.3.2c", "C.CS"]

[[advice]]
id = "prace.SR.L1.3"
lens = "SR"
level = "L1"
text = { cs = "Zvažte napojení na automatizovaný sběr dat z přístrojů ([[ddrapp|DDRapp]]).", en = "Consider connecting to automated collection of instrument data ([[ddrapp|DDRapp]])." }
sources = ["K2.2.4", "E.DDRAPP"]

[[advice]]
id = "prace.K.L0"
lens = "K"
level = "L0"
text = { cs = "Doporučené formáty a minimální popis dat pro váš obor patří do FIP; výzkumníci je pak mohou dodržovat od začátku.", en = "Your domain's recommended formats and minimum data description belong in the FIP, so researchers can follow them from the start." }
action = [{ label = { cs = "Standardy ve FIP Dashboardu", en = "Standards in the FIP Dashboard" }, href = "https://fip-dashboard.dmp.eosc.cz/resources" }, { label = { cs = "Dataspecer", en = "Dataspecer" }, href = "https://dataspecer.com/" }]
sources = ["A.R1.3.F1", "A.R1.F1", "E.FIP-DASHBOARD"]

[[advice]]
id = "prace.K.L1.1"
lens = "K"
level = "L1"
text = { cs = "Uveďte ve FIP doporučené datové formáty a minimální popis dat, například povinné parametry experimentu.", en = "State the recommended data formats and the minimum data description in the FIP, for example the mandatory parameters of an experiment." }
sources = ["A.R1.3.F1", "A.R1.F1"]

[[advice]]
id = "prace.K.L1.2"
lens = "K"
level = "L1"
text = { cs = "Data a metadata mohou mít různou strategii: originální formáty uchovat a harmonizovat jejich popis.", en = "Data and metadata can follow different strategies: keep the original formats and harmonise their description." }
sources = ["E.MBDB"]

[[advice]]
id = "prace.all.L1.1"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "Skripty pro zpracování dat napíšete s asistenty pro programování nebo v JupyterHubu v [[cerit-aiaas|prostředí CERIT]], kde nepublikovaná data zůstávají v infrastruktuře.", en = "Write data-processing scripts with coding assistants or in JupyterHub in [[cerit-aiaas|the CERIT environment]], where unpublished data stay within the infrastructure." }
check = { cs = "Skript nejdřív spusťte na kopii dat a výsledek porovnejte s očekáváním (počty řádků, součty, rozsahy hodnot). Skript uložte k datům, aby se zpracování dalo zopakovat.", en = "Run the script on a copy of the data first and compare the result with what you expect (row counts, totals, value ranges). Keep the script with the data so the processing can be repeated." }
prompt = { cs = "Napiš skript v Pythonu, který načte všechny soubory CSV ve složce data/, převede kódování na UTF-8 a oddělovač na čárku, zachová názvy sloupců a pro každý soubor vypíše počet řádků před převodem a po něm. Každý krok okomentuj a nic nemaž.", en = "Write a Python script that reads every CSV file in the data/ folder, converts the encoding to UTF-8 and the separator to a comma, keeps the column names, and prints each file's row count before and after the conversion. Comment every step and delete nothing." }
sources = ["E.CERIT-AI", "E.GENAI.R1", "E.GENAI.R3"]
