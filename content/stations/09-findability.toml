# Station 9: findability in NMA and other services. Field reference: docs/content-model.md.

[station]
id = "findability"
position = 9
lifecycleStage = "share"
name = { cs = "Dohledatelnost", en = "Findability" }
title = { cs = "NMA a další vyhledávače", en = "NMA and other discovery services" }
icon = "magnifying-glass"
principles = ["F4", "A2"]
minutes = 5
glossary = ["397", "166", "186", "394"]

[[advice]]
id = "findability.01"
lens = "*"
level = "L1"
kind = "key"
text = { cs = "Data se hledají podle metadat: [[nma|NMA]] i vyhledávače najdou datovou sadu, jen když jim repozitář zpřístupní její metadata. Samotná data zůstávají v repozitáři.", en = "Data are found through their metadata: [[nma|NMA]] and search engines find a dataset only when the repository makes its metadata available to them. The data themselves stay in the repository." }
sources = ["NRP.M8", "A.F4.R2", "NRP-DOCS-NMA-INTRODUCTION.01"]

[[advice]]
id = "findability.02"
lens = "V"
level = "L0"
text = { cs = "Je-li váš repozitář napojený na [[nma|Národní metadatový adresář (NMA)]], objeví se tam záznam sám. Pokud ne, můžete ho tam vytvořit sami; stačí, když má datová sada trvalý identifikátor.", en = "If your repository is connected to the [[nma|National Metadata Directory (NMA)]], the record appears there by itself. If not, you can create it yourself; the dataset only needs a persistent identifier." }
action = [{ label = { cs = "Vyhledat datovou sadu v NMA", en = "Search for your dataset in NMA" }, href = "https://nma.eosc.cz/" }, { label = { cs = "NMA: ověření pro RIV", en = "NMA: verification for RIV" }, href = "https://docs.nrp.eosc.cz/en/docs/end_users/national-metadata-directory/national-metadata-directory-verifying-datasets-for-RIV" }]
sources = ["A.F4.N1", "NMA-RIV-DOCS.01", "NRP-DOCS-NMA-ACCESS.01"]

[[advice]]
id = "findability.03"
lens = "V"
level = "L1"
text = { cs = "Vyhledejte PID své datové sady v [[nma|NMA]]; prohlížení nevyžaduje přihlášení.", en = "Search for your dataset's PID in [[nma|NMA]]; browsing needs no login." }
sources = ["A.F4.N1", "NRP-DOCS-NMA-INTRODUCTION.01"]

[[advice]]
id = "findability.04"
lens = "V"
level = "L1"
text = { cs = "Není tam? Záznam vytvoříte sami:", en = "Not there? Create the record yourself:" }
steps = [
  { cs = "účet v [[nma|NMA]] může získat kdokoli; s přihlášením přes českou akademickou instituci je schválen automaticky, jinak do dvou pracovních dnů;", en = "anyone can get an [[nma|NMA]] account; logging in through a Czech academic institution approves it automatically, otherwise within two working days;" },
  { cs = "v [[nma|NMA]] zvolte „Získat odkaz pro RIV“ a vložte DOI nebo Handle (má-li datová sada obojí, použijte DOI);", en = "in [[nma|NMA]], choose “Get a link for RIV” and enter the DOI or Handle (if the dataset has both, use the DOI);" },
  { cs = "[[nma|NMA]] zkusí metadata načíst z [[datacite|DataCite]] nebo z repozitáře; co chybí, doplníte ručně;", en = "[[nma|NMA]] tries to load the metadata from [[datacite|DataCite]] or from the repository; you complete whatever is missing by hand;" },
  { cs = "záznam lze upravovat 7 dní a smazat ho nelze.", en = "the record can be edited for 7 days and cannot be deleted." },
]
sources = ["NRP-DOCS-NMA-ACCESS.01", "NMA-RIV-DOCS.01"]

[[advice]]
id = "findability.05"
lens = "V"
level = "L1"
text = { cs = "Repozitář do [[nma|NMA]] sklízen není? Upozorněte jeho správce; NRP má pro napojení návod.", en = "Your repository is not harvested into [[nma|NMA]]? Tell its administrator; NRP has instructions for connecting." }
sources = ["NMA-RIV-DOCS.01", "NMA-EXPORT-DOCS.01"]

[[advice]]
id = "findability.06"
lens = "V"
level = "L1"
text = { cs = "Mezinárodní dohledatelnost:", en = "International discovery:" }
steps = [
  { cs = "[[datacite-commons|DataCite Commons]], pro DOI registrované u [[datacite|DataCite]];", en = "[[datacite-commons|DataCite Commons]], for DOIs registered with [[datacite|DataCite]];" },
  { cs = "OpenAIRE, kam se napojení přes EOSC Node Czechia připravuje;", en = "OpenAIRE, to which the connection through EOSC Node Czechia is in preparation;" },
  { cs = "[[google-dataset-search|Google Dataset Search]], podle metadat Schema.org.", en = "[[google-dataset-search|Google Dataset Search]], through Schema.org metadata." },
]
sources = ["A.F4.N3", "A.F4.X1", "SCHEMA-DATASET.01"]

[[advice]]
id = "findability.07"
lens = "V"
level = "L1"
text = { cs = "Pro vykázání v RIV použijete odkaz pro RIV z [[nma|NMA]]; v citacích ale vždy uvádějte trvalý identifikátor (viz zastávka [[station:citation|Citace a opakované užití]]).", en = "For reporting in RIV, use the RIV link from [[nma|NMA]]; in citations, however, always give the persistent identifier (see the [[station:citation|Citation and reuse]] station)." }
sources = ["NMA-RIV-DOCS.01"]

[[advice]]
id = "findability.08"
lens = "DS"
level = "L0"
text = { cs = "Dohledatelnost zajišťuje hlavně repozitář: sklizeň do [[nma|NMA]], strojově čitelná metadata pro vyhledávače a registrace v agregátorech.", en = "Findability is mainly the repository's job: harvesting into [[nma|NMA]], machine-readable metadata for search engines and registration with aggregators." }
action = [{ label = { cs = "Jak funguje NMA", en = "How NMA works" }, href = "https://docs.nrp.eosc.cz/en/docs/end_users/national-metadata-directory/national-metadata-directory-introduction" }, { label = { cs = "Výsledek typu T a NMA", en = "Result type T and NMA" }, href = "https://openscience.lib.cas.cz/en/funders-en/new-type-t-research-output-and-the-national-metadata-directory/" }]
sources = ["NRP.M8", "A.F4.R2", "A.F4.N3", "NRP-DOCS-NMA-INTRODUCTION.01"]

[[advice]]
id = "findability.09"
lens = "DS"
level = "L1"
text = { cs = "[[nma|NMA]] sklízí metadata ([[ccmm|CCMM]] přes [[oai-pmh|OAI-PMH]]), data neukládá a odkazuje do původního repozitáře: je rozcestníkem a plný popis zůstává v repozitáři.", en = "[[nma|NMA]] harvests metadata ([[ccmm|CCMM]] through [[oai-pmh|OAI-PMH]]), stores no data and links to the original repository: it is a signpost, and the full description stays in the repository." }
sources = ["A.F2.X1", "A.R1.X1", "NRP-DOCS-NMA-INTRODUCTION.01"]

[[advice]]
id = "findability.10"
lens = "DS"
level = "L1"
text = { cs = "Které repozitáře [[nma|NMA]] sklízí, zjistíte přímo v NMA filtrem podle vydavatele.", en = "To see which repositories [[nma|NMA]] harvests, filter by publisher in NMA itself." }
sources = ["NMA.01", "NRP-DOCS-NMA-INTRODUCTION.01"]

[[advice]]
id = "findability.11"
lens = "DS"
level = "L1"
text = { cs = "Když data zmizí, minimální záznam v [[nma|NMA]] zůstane; záznamy v NMA nelze smazat.", en = "If the data disappear, the minimum record in [[nma|NMA]] remains; NMA records cannot be deleted." }
sources = ["A.A2.N1", "NMA-RIV-DOCS.01"]

[[advice]]
id = "findability.12"
lens = "DS"
level = "L1"
text = { cs = "Výzkumníkům, jejichž repozitář [[nma|NMA]] nesklízí, pomozte se založením záznamu.", en = "Help researchers whose repository is not harvested by [[nma|NMA]] to create the record." }
sources = ["NRP-DOCS-NMA-ACCESS.01", "NMA-RIV-DOCS.01"]

[[advice]]
id = "findability.13"
lens = "SR"
level = "L0"
text = { cs = "Zpřístupněte metadata pro sklizeň do [[nma|NMA]] ([[oai-pmh|OAI-PMH]], CCMM-XML), což vyžadují podmínky NRP, a nabídněte strojově čitelná metadata i vyhledávačům. Autoři pak nemusejí zakládat záznamy ručně.", en = "Make metadata available for harvesting into [[nma|NMA]] ([[oai-pmh|OAI-PMH]], CCMM-XML), which the NRP conditions require, and offer machine-readable metadata to search engines too. Authors then need not create records by hand." }
action = [{ label = { cs = "Export do NMA (dokumentace NRP)", en = "Export to NMA (NRP documentation)" }, href = "https://docs.nrp.eosc.cz/en/docs/repo_admins/national-metadata-directory/exports-to-nma" }, { label = { cs = "Schema.org Dataset", en = "Schema.org Dataset" }, href = "https://schema.org/Dataset" }]
sources = ["NRP.M8", "NMA-EXPORT-DOCS.01", "A.F4.R2"]

[[advice]]
id = "findability.14"
lens = "SR"
level = "L1"
text = { cs = "Sklizeň do [[nma|NMA]] probíhá podle [[ccmm|CCMM]]:", en = "Harvesting into [[nma|NMA]] follows [[ccmm|CCMM]]:" }
steps = [
  { cs = "[[oai-pmh|OAI-PMH]] s metadataPrefix ccmm-xml, což standardní repozitáře NRP umějí;", en = "[[oai-pmh|OAI-PMH]] with the ccmm-xml metadataPrefix, which standard NRP repositories support;" },
  { cs = "bez nativního [[ccmm|CCMM]] veřejná transformace XSLT na stabilní HTTPS adrese.", en = "without native [[ccmm|CCMM]], a public XSLT transformation at a stable HTTPS address." },
]
sources = ["NRP.M8", "A.F4.R1", "A.MIN2", "NMA-EXPORT-DOCS.01"]

[[advice]]
id = "findability.15"
lens = "SR"
level = "L1"
text = { cs = "Pro napojení napište týmu [[nma|NMA]] a uveďte endpoint OAI, setSpec, metadataPrefix, případně adresu XSLT. NMA spustí testovací sklizeň a vy získáte roli správce sklizně; průběh a chyby sledujete ve webovém rozhraní.", en = "To connect, write to the [[nma|NMA]] team with the OAI endpoint, setSpec, metadataPrefix and, if needed, the XSLT address. NMA runs a test harvest, and you get the harvest manager role; you follow progress and errors in the web interface." }
sources = ["NMA-EXPORT-DOCS.01"]

[[advice]]
id = "findability.16"
lens = "SR"
level = "L1"
text = { cs = "[[nma|NMA]] pracuje s [[ccmm|CCMM]] 1.1.0; podporu verze 2.0.0 připravuje.", en = "[[nma|NMA]] works with [[ccmm|CCMM]] 1.1.0 and is preparing to support version 2.0.0." }
sources = ["A.F2.N1", "CCMM-RELEASES.01"]

[[advice]]
id = "findability.17"
lens = "SR"
level = "L1"
text = { cs = "Metadata zpřístupněte s licencí odpovídající CC0.", en = "Make metadata available under a licence equivalent to CC0." }
sources = ["NRP.M4"]

[[advice]]
id = "findability.18"
lens = "SR"
level = "L1"
text = { cs = "Endpoint [[oai-pmh|OAI-PMH]] uveďte v záznamu [[nkr|NKR]].", en = "Give the [[oai-pmh|OAI-PMH]] endpoint in the [[nkr|NKR]] record." }
sources = ["A.A1.N2", "NKR-SCHEMA.01"]

[[advice]]
id = "findability.19"
lens = "SR"
level = "L1"
text = { cs = "Pro vyhledávače a katalogy nabídněte Schema.org/JSON-LD, případně DCAT-AP, sitemap a pravidla robots, která povolují indexaci stránek záznamů, a registrujte se v agregátorech (OpenAIRE, [[datacite-commons|DataCite Commons]], oborové).", en = "For search engines and catalogues, offer Schema.org/JSON-LD, or DCAT-AP, a sitemap and robots rules that allow record pages to be indexed, and register with aggregators (OpenAIRE, [[datacite-commons|DataCite Commons]], domain ones)." }
sources = ["A.F4.R2", "A.F4.N2", "A.F4.N3", "A.F4.N4", "OSTRAILS-CZ-PILOT.01"]

[[advice]]
id = "findability.20"
lens = "SR"
level = "L1"
text = { cs = "Po odstranění dat zůstává plný záznam metadat v repozitáři, mapovaný na minimální záznam v [[nma|NMA]]. Politiku uchování zveřejněte a odkažte na ni z metadat, aby byla strojově dohledatelná.", en = "After data removal, the full metadata record stays in the repository, mapped to the minimum record in [[nma|NMA]]. Publish the retention policy and link to it from the metadata so that machines can find it." }
sources = ["A.A2.R1", "OSTRAILS-CZ-PILOT.01"]

[[advice]]
id = "findability.21"
lens = "K"
level = "L0"
text = { cs = "FIP může určit minimální metadata potřebná pro oborové vyhledávače a mapování na jejich formáty.", en = "The FIP can set the minimum metadata needed for domain search services and the mappings to their formats." }
action = { label = { cs = "Zdroje pro F4 ve FIP Dashboardu", en = "F4 resources in the FIP Dashboard" }, href = "https://fip-dashboard.dmp.eosc.cz/resources?principles=F4" }
sources = ["A.F4.F1", "A.F4.F2", "FIP-DASHBOARD.01"]

[[advice]]
id = "findability.22"
lens = "K"
level = "L1"
text = { cs = "Určete minimální metadata pro indexaci a mapování na formáty vyhledávačů.", en = "Set the minimum metadata for indexing and the mappings to search-service formats." }
sources = ["A.F4.F1", "A.F4.F2"]

[[advice]]
id = "findability.23"
lens = "K"
level = "L1"
text = { cs = "Určete, která metadata zůstanou veřejná i po ztrátě dat.", en = "Set which metadata remain public after the data are lost." }
sources = ["A.A2.F1"]

[[advice]]
id = "findability.24"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "AI navrhne klíčová slova a obory k popisu dat. Použijte ale termíny ze sdílených slovníků, které obor nebo repozitář používá, aby data našly i vyhledávače jako [[nma|Národní metadatový adresář]].", en = "AI suggests keywords and fields to describe the data. Use terms from the shared vocabularies your field or repository uses, though, so that discovery services such as the [[nma|National Metadata Directory]] find the data too." }
check = { cs = "Každý navržený termín vyhledejte v daném slovníku a použijte jeho identifikátor; termín, který ve slovníku není, nepoužívejte.", en = "Look up each suggested term in the vocabulary and use its identifier; do not use a term the vocabulary does not have." }
prompt = { cs = "Navrhni pět až osm klíčových slov k popisu datové sady níže, česky i anglicky, a ke každému uveď obecnější a užší pojem. Vrať je jen jako návrhy; ve slovníku je dohledám sám.\n\nPopis datové sady: […]", en = "Suggest five to eight keywords for the dataset described below, in Czech and English, each with a broader and a narrower term. Return them as suggestions only; I will look them up in the vocabulary myself.\n\nDataset description: […]" }
sources = ["EC-GENAI-GUIDELINES.01", "A.I2.N2"]
