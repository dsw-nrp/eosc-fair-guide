# Station 2: collecting and organising data as they are created (RDMkit Collect). Field reference: docs/content-model.md.

[station]
id = "collect"
position = 2
lifecycleStage = "collect"
name = { cs = "Sběr a organizace", en = "Collection and organisation" }
title = { cs = "Sběr a organizace dat během výzkumu", en = "Collecting and organising data during research" }
icon = "flask"
principles = ["R1.2", "R1"]
minutes = 4
glossary = ["metadata", "underlying-data", "electronic-laboratory-notebook"]

[[advice]]
id = "collect.01"
lens = "*"
level = "L1"
kind = "key"
text = { cs = "Kontext experimentu nebo terénního sběru nelze po měsících spolehlivě dopočítat: dokumentace a organizace dat proto vznikají přímo při měření a sběru.", en = "The context of an experiment or field survey cannot be reconstructed reliably months later: documentation and data organisation therefore happen as the data are collected." }
sources = ["CESSDA-DMEG.01", "A.R1.2.X1"]

[[advice]]
id = "collect.02"
lens = "V"
level = "L0"
text = { cs = "Už během výzkumu data průběžně organizujte a dokumentujte: jednotné názvy souborů, verze, README a záznam postupu. Při zveřejnění vám to ušetří spoustu práce.", en = "Organise and document your data as you go: consistent file names, versions, a README and a record of how the data were made. It will save you a lot of work when you publish." }
action = [{ label = { cs = "Šablony README", en = "README templates" }, href = "https://github.com/Czech-Data-Steward-Community/README_FILES_EXAMPLES" }, { label = { cs = "Laboratorní a terénní deníky", en = "Laboratory and field notebooks" }, href = "#page-notebooks" }]
sources = ["CESSDA-DMEG.01", "A.R1.2.X1"]

[[advice]]
id = "collect.03"
lens = "V"
level = "L1"
text = { cs = "Ukládejte data na spravované a zálohované úložiště (instituce, [[term/e-infra-cz|e-INFRA CZ]]), ne jen na vlastní počítač nebo přenosné médium.", en = "Store data on managed, backed-up storage (your institution, [[term/e-infra-cz|e-INFRA CZ]]), not only on your own computer or a portable drive." }
sources = ["EINFRA-DOCS.01", "CESSDA-DMEG.01"]

[[advice]]
id = "collect.04"
lens = "V"
level = "L1"
text = { cs = "Dohodněte se v týmu předem na [[rdmkit-organisation|struktuře složek a pojmenování souborů]], způsobu verzování, [[rdmkit-quality|kontrolách kvality]] a [[rdmkit-security|zabezpečení dat]]. Pro složky a názvy souborů například:", en = "Agree as a team in advance on [[rdmkit-organisation|folder structure and file naming]], versioning, [[rdmkit-quality|quality checks]] and [[rdmkit-security|data security]]. For folders and file names, for example:" }
steps = [
  { cs = "oddělte složky pro původní data pouze ke čtení (01_raw/), vyčištěná a odvozená data (02_processed/), skripty (03_scripts/), výstupy (04_outputs/) a kořenový README.md;", en = "separate folders for read-only original data (01_raw/), cleaned and derived data (02_processed/), scripts (03_scripts/), outputs (04_outputs/) and a root README.md;" },
  { cs = "soubory pojmenovávejte jednotně bez mezer a diakritiky, s datem ve tvaru ISO a verzí (například 2026-05-14_projekt_vzorek03_v01.csv).", en = "name files consistently without spaces or diacritics, using an ISO date and version tag (for example 2026-05-14_project_sample03_v01.csv)." },
]
sources = ["CESSDA-DMEG.01", "RDMKIT.tasks.01", "CDSC-README.01"]

[[advice]]
id = "collect.05"
lens = "V"
level = "L1"
text = { cs = "Průběžně pište README a datový slovník: co znamenají proměnné, jednotky, povolené kódy a chybějící hodnoty. Začít můžete ze [[cdsc-readme|šablon README komunity data stewardů]] a postupu ve [[cookbook-dictionary|FAIR Cookbook]].", en = "Write a README and a data dictionary as you go: what the variables, units, allowed codes and missing values mean. You can start from the [[cdsc-readme|Czech data steward community's README templates]] and the [[cookbook-dictionary|FAIR Cookbook]] recipe." }
sources = ["CESSDA-DMEG.01", "CDSC-README.01", "RDMKIT.tasks.01"]

[[advice]]
id = "collect.06"
lens = "V"
level = "L1"
text = { cs = "Průběžně zaznamenávejte, jak data vznikají a jak je zpracováváte: použitý přístroj, software a jeho verzi i jednotlivé úpravy. Do [[page:notebooks|laboratorního nebo terénního deníku]] zapisujte také [[page:provenance|důvody rozhodnutí]], například proč jste některá měření vyřadili.", en = "Record how data are produced and processed as you work: the instrument, software and version, and individual changes. In your [[page:notebooks|laboratory or field notebook]], also record [[page:provenance|reasons for decisions]], such as why you excluded particular measurements." }
sources = ["A.R1.2.N2", "CDSC-ELN.01", "LONDON.4.6", "EOSC-ELN.01"]

[[advice]]
id = "collect.07"
lens = "V"
level = "L1"
text = { cs = "Data z přístrojů lze anotovat a předávat do repozitáře automaticky, například aplikací [[ddrapp|DDRapp]].", en = "Instrument data can be annotated and passed to a repository automatically, for example with the [[ddrapp|DDRapp]] application." }
sources = ["A.K2.2.4", "DDRAPP.01"]

[[advice]]
id = "collect.08"
lens = "V"
level = "L1"
text = { cs = "Než začnete data sbírat, zjistěte, zda potřebná data už neexistují: převzetí hotových dat ušetří experiment a usnadní srovnání výsledků. Sběr navrhněte předem a rozhodnutí o kvalitě zaznamenejte.", en = "Before you collect data, find out whether the data you need already exist: reusing them saves an experiment and makes results easier to compare. Design the collection in advance and record your decisions on quality." }
sources = ["RDMKIT.collect.02", "RDMKIT.collect.01"]

[[advice]]
id = "collect.09"
lens = "DS"
level = "L0"
text = { cs = "Pomozte nastavit postupy dřív, než data vzniknou: úložiště, pojmenování, verzování a dokumentaci.", en = "Help set up practices before the data exist: storage, naming, versioning and documentation." }
action = [{ label = { cs = "Úložiště a výpočty v e-INFRA CZ", en = "Storage and computing in e-INFRA CZ" }, href = "https://docs.e-infra.cz/" }, { label = { cs = "AI v e-INFRA CZ", en = "AI in e-INFRA CZ" }, href = "#page-ai" }]
sources = ["EINFRA-DOCS.01", "CESSDA-DMEG.01"]

[[advice]]
id = "collect.10"
lens = "DS"
level = "L1"
text = { cs = "Doporučte vhodné úložiště: institucionální, [[org/cesnet|CESNET]] (S3, [[onedata|Onedata]]), pro [[term/sensitive-data|citlivá data]] [[sensitive-cloud|Sensitive Cloud]].", en = "Recommend suitable storage: institutional, [[org/cesnet|CESNET]] (S3, [[onedata|Onedata]]), and [[sensitive-cloud|Sensitive Cloud]] for [[term/sensitive-data|sensitive data]]." }
sources = ["EINFRA-DOCS.01"]

[[advice]]
id = "collect.11"
lens = "DS"
level = "L1"
text = { cs = "Připravte pro týmy šablony README a datového slovníku. Vyjít můžete ze [[cdsc-readme|šablon komunity data stewardů]] ve formátech TXT, Markdown a JSON.", en = "Prepare README and data dictionary templates for research teams. You can build on the [[cdsc-readme|Czech data steward community's templates]] in TXT, Markdown and JSON." }
sources = ["CESSDA-DMEG.01", "CDSC-README.01"]

[[advice]]
id = "collect.12"
lens = "DS"
level = "L1"
text = { cs = "Potřebuje tým [[page:notebooks|laboratorní nebo terénní deník]]? Pomozte vybrat řešení podle způsobu práce: kdo do něj zapisuje, co potřebuje exportovat a zda pracuje bez sítě. S institucionální IT podporou ověřte přístupová práva a zálohování.", en = "Does the team need a [[page:notebooks|laboratory or field notebook]]? Help select a solution for its way of working: who contributes, what needs exporting and whether work takes place offline. Check permissions and backups with institutional IT support." }
sources = ["OSII-STUDY.01", "CAMBRIDGE-ERN.01"]

[[advice]]
id = "collect.13"
lens = "DS"
level = "L1"
text = { cs = "Doporučte [[eosc-training|školení ke správě výzkumných dat od EOSC CZ]].", en = "Recommend [[eosc-training|EOSC CZ training]] in research data management." }
sources = ["EOSC-TRAINING.01"]

[[advice]]
id = "collect.14"
lens = "DS"
level = "L2"
text = { cs = "Národní průzkum správy výzkumných dat 2025 (N = 1121): během projektů ukládá data na osobní počítač 66,4 % respondentů, na přenosná média 53,2 % a do národní infrastruktury 14,5 %.", en = "National survey of research data management 2025 (N = 1121): during projects, 66.4 % of respondents store data on a personal computer, 53.2 % on portable media and 14.5 % in the national infrastructure." }
sources = ["SURVEY-2025.01"]

[[advice]]
id = "collect.15"
lens = "SR"
level = "L0"
text = { cs = "Pokud repozitář přijímá data z přístrojů nebo z výpočetních prostředí, nabídněte zdokumentované API. Webové rozhraní i API vyžadují podmínky NRP.", en = "If the repository receives data from instruments or computing environments, offer a documented API. The NRP conditions require both a web interface and an API." }
action = [{ label = { cs = "Výpočty s daty z NRP", en = "Computing with NRP data" }, href = "https://docs.nrp.eosc.cz/en/docs/end_users/compute/support-for-computing" }, { label = { cs = "Integrace repozitáře do NRP", en = "Integrating a repository into NRP" }, href = "https://www.eosc.cz/sluzby/ukladani/repozitare-v-nrp/integrece-repo-nrp" }]
sources = ["NRP.M2"]

[[advice]]
id = "collect.16"
lens = "SR"
level = "L1"
text = { cs = "Zdokumentujte API pro vkládání a čtení dat.", en = "Document the API for depositing and reading data." }
sources = ["NRP.M2"]

[[advice]]
id = "collect.17"
lens = "SR"
level = "L1"
text = { cs = "Zvažte napojení na automatizovaný sběr dat z přístrojů ([[ddrapp|DDRapp]]).", en = "Consider connecting to automated collection of instrument data ([[ddrapp|DDRapp]])." }
sources = ["A.K2.2.4", "DDRAPP.01"]

[[advice]]
id = "collect.18"
lens = "K"
level = "L0"
text = { cs = "Ve FIP zaznamenejte doporučené datové formáty a oborové profily, aby je výzkumníci mohli využít od začátku.", en = "Record recommended data formats and domain profiles in the FIP so researchers can use them from the start." }
action = [{ label = { cs = "Standardy ve FIP Dashboardu", en = "Standards in the FIP Dashboard" }, href = "https://fip-dashboard.dmp.eosc.cz/resources" }, { label = { cs = "Dataspecer", en = "Dataspecer" }, href = "https://dataspecer.com/" }]
sources = ["A.R1.3.F1", "A.R1.F1", "FIP-DASHBOARD.01"]

[[advice]]
id = "collect.19"
lens = "K"
level = "L1"
text = { cs = "Vymezte minimální popis dat v oborovém profilu nebo schématu, například potřebné parametry experimentu. Ve FIP odkažte na vybrané profily a datové formáty.", en = "Define the minimum data description in a domain profile or schema, for example the necessary experimental parameters. Reference the selected profiles and data formats in the FIP." }
sources = ["A.R1.3.F1", "A.R1.F1"]

[[advice]]
id = "collect.20"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "Návrh README nebo datového slovníku vám připraví AI asistent, například v [[cerit-aiaas|prostředí CERIT]], kde nepublikovaná data zůstávají v infrastruktuře. Vložte jen názvy proměnných a jejich popis, ne samotná data.", en = "An AI assistant can draft a README or a data dictionary, for example in [[cerit-aiaas|the CERIT environment]], where unpublished data stay within the infrastructure. Give it only the variable names and their description, not the data themselves." }
check = { cs = "Každou proměnnou, jednotku a kód porovnejte se skutečnými daty a s tím, jak data vznikla: AI může význam domyslet chybně. Co nevíte jistě, doplňte ručně.", en = "Compare every variable, unit and code with the actual data and with how the data were produced: AI may guess a meaning wrongly. Fill in by hand whatever you are not sure of." }
prompt = { cs = "Z níže uvedeného seznamu proměnných připrav datový slovník jako tabulku v Markdownu se sloupci: název, popis, jednotka, povolené hodnoty nebo kódy, značka chybějící hodnoty. Co z popisu nevyplývá, označ „doplnit“ a nic nedomýšlej.\n\nProměnné: […]", en = "From the list of variables below, prepare a data dictionary as a Markdown table with the columns: name, description, unit, allowed values or codes, missing-value marker. Mark anything the description does not state as \"to fill in\" and do not guess.\n\nVariables: […]" }
sources = ["CERIT-AIAAS.01", "EC-GENAI-GUIDELINES.01", "EC-GENAI-GUIDELINES.04"]

[[advice]]
id = "collect.22"
lens = "V"
level = "L1"
text = { cs = "Zajistěte kontinuitu v týmu: ke každému datasetu ve sdíleném úložišti týmu veďte README se základními metadaty, včetně toho, co znamenají proměnné, aby kolegové data našli a použili i bez vás. Před odchodem studenta či kolegy z projektu s ním projděte kontrolní seznam pro předání a zapište, kde leží surová a vyčištěná data, kdo je bude dál spravovat a kdo převezme přístupová práva.", en = "Ensure team continuity: give each dataset in the team's shared storage a README with basic metadata, including what the variables mean, so colleagues can find and use the data without you. Before a student or colleague leaves the project, go through a handover checklist with them and write down where raw and cleaned data sit, who maintains them next, and who takes over access permissions." }
sources = ["CESSDA-DMEG.01", "HARVARD-OFFBOARDING.01", "UKDS-DATA-LEVEL.01"]

[[advice]]
id = "collect.23"
lens = "DS"
level = "L1"
text = { cs = "Nabídněte týmům kontrolní seznam pro předání dat, který si mohou přizpůsobit svému výzkumu, a představte jej už při nástupu nových členů, ne až při jejich odchodu. Seznam zahrnuje, kdo bude která data dál spravovat, kde data leží, zda jsou README a datový slovník úplné a jak se podle [[policy-manual|institucionální datové politiky]] předávají přístupová práva.", en = "Provide teams with a data handover checklist they can tailor to their research, and introduce it when members join, not only when they leave. It covers who maintains which data next, where the data sit, whether the README and data dictionary are complete, and how access rights pass on in line with the [[policy-manual|institutional data policy]]." }
sources = ["HARVARD-OFFBOARDING.02", "HARVARD-OFFBOARDING.01", "UKDS-DATA-LEVEL.01", "CESSDA-DMEG.01"]
