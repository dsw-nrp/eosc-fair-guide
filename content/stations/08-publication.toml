# Station 8: publication and the persistent identifier. Field reference: docs/content-model.md.

[station]
id = "publication"
position = 8
lifecycleStage = "share"
name = { cs = "Publikace", en = "Publication" }
title = { cs = "Zveřejnění a trvalý identifikátor", en = "Publication and the persistent identifier" }
icon = "paper-plane"
principles = ["F1", "F3", "A1", "A1.1", "A2"]
minutes = 5
glossary = ["persistent-identifier", "digital-object-identifier", "handle"]

[[advice]]
id = "publication.01"
lens = "*"
level = "L1"
kind = "key"
text = { cs = "[[term/persistent-identifier|Trvalý identifikátor]] (PID) je adresa, která přežije změny: vede na stránku s popisem dat (landing page), je identifikátorem záznamu v [[nma|NMA]] a dělá data citovatelnými.", en = "A [[term/persistent-identifier|persistent identifier]] (PID) is an address that outlives changes: it leads to the page describing the data (the landing page), identifies the record in [[nma|NMA]] and makes the data citable." }
sources = ["A.F1.N4", "A.F1.R1", "A.F1.X2"]

[[advice]]
id = "publication.02"
lens = "V"
level = "L0"
text = { cs = "Při zveřejnění repozitář datové sadě přidělí [[term/persistent-identifier|trvalý identifikátor]] (PID), nejčastěji DOI, jinde třeba [[res/srv/handle|Handle]]. Odkaz pak funguje i po letech a data lze citovat.", en = "At publication, the repository assigns the dataset a [[term/persistent-identifier|persistent identifier]] (PID), most often a DOI, elsewhere for example a [[res/srv/handle|Handle]]. The link then works for years, and the data can be cited." }
action = [{ label = { cs = "Co zkontrolovat před zveřejněním", en = "What to check before publishing" }, href = "#check-dataset" }, { label = { cs = "Centrum PID", en = "PID Centre" }, href = "https://identifikatory.cz/cs/" }]
sources = ["A.F1.R1", "A.F1.N2"]

[[advice]]
id = "publication.03"
lens = "V"
level = "L1"
text = { cs = "Zkontrolujte náhled záznamu: metadata, soubory a licenci.", en = "Check the record preview: metadata, files and licence." }
sources = ["A.F2.N2"]

[[advice]]
id = "publication.04"
lens = "V"
level = "L1"
text = { cs = "Po zveřejnění ověřte, že PID vede na stránku datové sady (landing page).", en = "After publication, check that the PID leads to the dataset's page (landing page)." }
sources = ["A.F1.R2"]

[[advice]]
id = "publication.05"
lens = "V"
level = "L1"
text = { cs = "Oprava, nebo nová verze? Podstatná změna dat znamená novou verzi s novým PID, propojenou s předchozí.", en = "Correction or new version? A substantial change to the data means a new version with a new PID, linked to the previous one." }
sources = ["A.R1.R3", "A.I3.R5"]

[[advice]]
id = "publication.06"
lens = "V"
level = "L1"
text = { cs = "PID uvádějte všude: v článku (v prohlášení o dostupnosti dat), v profilu [[orcid|ORCID]] a v DMP.", en = "Use the PID everywhere: in the article (in the data availability statement), in your [[orcid|ORCID]] profile and in the DMP." }
sources = ["A.R1.2.N3"]

[[advice]]
id = "publication.27"
lens = "V"
level = "L1"
text = { cs = "Zveřejňujete-li s daty také [[page:software|software]], uložte konkrétní vydání zdrojového kódu s popisem a návodem do repozitáře, který software přijímá. Propojte záznamy dat a softwaru, aby bylo zřejmé, kterou verzí data vznikla.", en = "If you publish [[page:software|software]] alongside the data, deposit a specific source-code release, its description and execution instructions in a repository that accepts software. Link the data and software records so readers can identify the version used to produce the data." }
sources = ["FRSM.FRSM-03", "FRSM.FRSM-12", "ZENODO-SW.01"]

[[advice]]
id = "publication.07"
lens = "V"
level = "L1"
text = { cs = "Pokud repozitář [[term/persistent-identifier|trvalý identifikátor]] nepřiděluje, zvažte jiný: PID je minimum pro zapojení do [[term/national-data-infrastructure|Národní datové infrastruktury]].", en = "If the repository does not assign a [[term/persistent-identifier|persistent identifier]], consider another one: a PID is the minimum for joining the [[term/national-data-infrastructure|National Data Infrastructure]]." }
sources = ["A.MIN1"]

[[advice]]
id = "publication.08"
lens = "DS"
level = "L0"
text = { cs = "Ohlídejte, aby zveřejněná data měla PID a landing page a byla propojená s článkem i s autory ([[orcid|ORCID]]).", en = "Make sure published data have a PID and a landing page and are linked to the article and to the authors ([[orcid|ORCID]])." }
action = [{ label = { cs = "Centrum PID (identifikatory.cz)", en = "PID Centre (identifikatory.cz)" }, href = "https://identifikatory.cz/cs/" }, { label = { cs = "DataCite Metadata Schema", en = "DataCite Metadata Schema" }, href = "https://schema.datacite.org/" }]
sources = ["A.MIN1", "A.R1.2.N3", "PID-CENTRE.01"]

[[advice]]
id = "publication.09"
lens = "DS"
level = "L1"
text = { cs = "Typy PID: DOI je nejrozšířenější a doporučený. Přípustný je i jiný [[term/persistent-identifier|trvalý identifikátor]], například [[res/srv/handle|Handle]] nebo ARK, pokud trvale vede na landing page a repozitář ho spravuje.", en = "PID types: DOI is the most widespread and the recommended one. Another [[term/persistent-identifier|persistent identifier]], such as a [[res/srv/handle|Handle]] or ARK, is acceptable if it resolves permanently to the landing page and the repository manages it." }
sources = ["A.F1.N2", "NRP.EXT"]

[[advice]]
id = "publication.10"
lens = "DS"
level = "L1"
text = { cs = "DOI v NRP zajišťuje Národní centrum DOI (NTK): smlouvu, metodiku a prefix; DOI pak přiděluje repozitář. Členům NC DOI hradí NTK v letech 2023–2028 náklady na DOI.", en = "In NRP, DOIs are provided through the National DOI Centre (NTK): contract, methodology and prefix; the repository then assigns the DOIs. For NC DOI members, NTK covers the cost of DOIs in 2023–2028." }
sources = ["A.F1.X1", "NCDOI-2023.01"]

[[advice]]
id = "publication.11"
lens = "DS"
level = "L1"
text = { cs = "I když data zmizí, metadata zůstávají: tombstone stránka s PID, citací a důvodem nedostupnosti.", en = "Even if the data are removed, the metadata remain: a tombstone page with the PID, the citation and the reason the data are unavailable." }
sources = ["A.A2.R2"]

[[advice]]
id = "publication.12"
lens = "SR"
level = "L0"
text = { cs = "Zajistěte přidělování PID při publikaci a landing page se strojově čitelnými metadaty a odkazy na distribuce. Přidělování PID vyžadují podmínky NRP.", en = "Make sure PIDs are assigned at publication and that landing pages carry machine-readable metadata and links to distributions. The NRP conditions require PID assignment." }
action = [{ label = { cs = "Doporučení pro repozitáře", en = "Repository recommendations" }, href = "https://www.eosc.cz/projekty/vystupy-iniciativy-eosc-cz#doporuceni_repozitare" }, { label = { cs = "FAIR Signposting", en = "FAIR Signposting" }, href = "https://signposting.org/FAIR/" }]
sources = ["NRP.M7", "NRP.M1", "A.F3.N1"]

[[advice]]
id = "publication.13"
lens = "SR"
level = "L1"
text = { cs = "Záznamy musí být citovatelné, mít PID a popsanou záruku neměnnosti a repozitář potřebuje politiku změn (verzování nebo „patch“ balíčky). Převzaté záznamy bez PID mají aspoň stabilní URL a postup doplnění PID.", en = "Records must be citable and have PIDs and a described immutability guarantee, and the repository needs a change policy (versioning or patch packages). Imported records without a PID have at least a stable URL and a procedure for adding one." }
sources = ["NRP.M1", "NRP.M3", "A.F1.N1"]

[[advice]]
id = "publication.14"
lens = "SR"
level = "L1"
text = { cs = "Přidělování PID integrujte do publikace: DOI přes Národní centrum DOI, jiné PID podle platformy.", en = "Integrate PID assignment into publication: DOIs through the National DOI Centre, other PIDs according to the platform." }
sources = ["NRP.M7", "A.F1.R1", "A.F1.N2"]

[[advice]]
id = "publication.15"
lens = "SR"
level = "L1"
text = { cs = "PID vede na landing page a v [[nma|NMA]] slouží jako identifikátor záznamu; distribuce mají jednoznačné odkazy. Uveďte PID v metadatech i jako explicitní, typovaný identifikátor (například schema.org identifier), jinak ho automatické testy nenajdou.", en = "The PID resolves to the landing page and serves as the record identifier in [[nma|NMA]]; distributions have unambiguous links. Also give the PID in the metadata as an explicit, typed identifier (for example schema.org identifier), otherwise automated tests will not find it." }
sources = ["A.F1.R2", "A.F1.N4", "A.F3.N2", "A.MIN3", "OSTRAILS-CZ-PILOT.01"]

[[advice]]
id = "publication.16"
lens = "SR"
level = "L1"
text = { cs = "Propojení metadata → landing page → distribuce má být strojově zjistitelné:", en = "The link from metadata to landing page to distributions should be machine-discoverable:" }
steps = [
  { cs = "minimálně JSON-LD (Schema.org) na landing page s odkazy na distribuce;", en = "at least JSON-LD (Schema.org) on the landing page with links to distributions;" },
  { cs = "přednostně [[fair-signposting|FAIR Signposting]] v hlavičkách Link, nativně nebo přes reverse proxy.", en = "preferably [[fair-signposting|FAIR Signposting]] in Link headers, natively or through a reverse proxy." },
]
sources = ["A.F3.R1", "A.F3.N1", "A.F4.R2", "A.REC1", "A.REC2"]

[[advice]]
id = "publication.17"
lens = "SR"
level = "L1"
text = { cs = "Spravujte PID: při změnách infrastruktury aktualizujte cílové URL; po odstranění dat ponechte tombstone a PID přesměrujte na něj.", en = "Manage PIDs: update target URLs when the infrastructure changes; after data removal, keep a tombstone and redirect the PID to it." }
sources = ["A.F1.R3", "A.A2.R2", "A.A2.R3"]

[[advice]]
id = "publication.18"
lens = "SR"
level = "L1"
text = { cs = "Nabídněte webové rozhraní i API a přístup přes otevřené protokoly, minimálně HTTPS a pro metadata [[oai-pmh|OAI-PMH]].", en = "Offer a web interface and an API, and access through open protocols, at least HTTPS, and [[oai-pmh|OAI-PMH]] for metadata." }
sources = ["NRP.M2", "A.A1.R1", "A.A1.1.R1"]

[[advice]]
id = "publication.19"
lens = "SR"
level = "L1"
text = { cs = "Verzujte data i metadata; nová verze je propojená s předchozí, například vazbou isNewVersionOf.", en = "Version both data and metadata; a new version is linked to the previous one, for example with an isNewVersionOf relation." }
sources = ["A.R1.R3", "A.R1.2.R2", "A.R1.2.N2", "A.I3.R5"]

[[advice]]
id = "publication.20"
lens = "SR"
level = "L2"
text = { cs = "Strojově čitelná landing page obvykle kombinuje JSON-LD ([[schema-dataset|Schema.org Dataset]]), typované hlavičky Link (cite-as, describedby, item, license, type) a sitemap, která povoluje indexaci stránek záznamů.", en = "A machine-readable landing page usually combines JSON-LD ([[schema-dataset|Schema.org Dataset]]), typed Link headers (cite-as, describedby, item, license, type) and a sitemap that allows record pages to be indexed." }
sources = ["SCHEMA-DATASET.01", "FAIR-SIGNPOSTING.01", "OSTRAILS-CZ-PILOT.01"]

[[advice]]
id = "publication.28"
lens = "SR"
level = "L1"
text = { cs = "Má-li repozitář zveřejňovat [[page:fdo|FAIR Digital Objects]], ověřte celý řetězec: záznam PID, profil a typ objektu i odkazy na metadata a obsah. [[fdo-specification|Specifikace FDO 3.0]] a samostatná kontrola připravenosti pomohou rozdělit ověření mezi repozitář, komunitu a poskytovatele PID.", en = "If the repository is to publish [[page:fdo|FAIR Digital Objects]], verify the full chain: the PID record, object profile and type, and links to metadata and content. The [[fdo-specification|FDO 3.0 specification]] and separate readiness check help allocate verification among the repository, community and PID provider." }
sources = ["FDO.FDOR-GR2", "FDO.FDO-FDOR5"]

[[advice]]
id = "publication.21"
lens = "K"
level = "L0"
text = { cs = "FIP určuje preferované typy PID v oboru, pravidla jejich správy a protokoly přístupu k datům.", en = "The FIP sets the preferred PID types in the domain, the rules for managing them, and the protocols for accessing the data." }
action = { label = { cs = "Identifikátory ve FIP Dashboardu", en = "Identifiers in the FIP Dashboard" }, href = "https://fip-dashboard.dmp.eosc.cz/resources?principles=F1" }
sources = ["A.F1.F1", "A.F1.F2", "A.A1.F1", "FIP-DASHBOARD.01"]

[[advice]]
id = "publication.22"
lens = "K"
level = "L1"
text = { cs = "Určete preferované PID a pravidla jejich dlouhodobé správy.", en = "Set the preferred PIDs and the rules for managing them in the long term." }
sources = ["A.F1.F1", "A.F1.F2"]

[[advice]]
id = "publication.23"
lens = "K"
level = "L1"
text = { cs = "Odkažte na metadatový profil se standardním polem pro identifikátor dat.", en = "Point to a metadata profile with a standard field for the data identifier." }
sources = ["A.F3.F1"]

[[advice]]
id = "publication.24"
lens = "K"
level = "L1"
text = { cs = "Uveďte podporované a oborově specifické protokoly.", en = "List the supported and domain-specific protocols." }
sources = ["A.A1.F1", "A.A1.F2", "A.A1.1.F1"]

[[advice]]
id = "publication.25"
lens = "SR"
level = "L1"
kind = "ai"
text = { cs = "AI vám může připravit JSON-LD pro landing page podle [[schema-dataset|Schema.org Dataset]] ze záznamu [[res/srv/datacite|DataCite]].", en = "AI can draft JSON-LD for a landing page following [[schema-dataset|Schema.org Dataset]] from a [[res/srv/datacite|DataCite]] record." }
check = { cs = "Výsledek před nasazením validujte a porovnejte s metadaty záznamu; identifikátory a adresy ověřte, že se rozřeší.", en = "Validate the result before deploying it and compare it with the record's metadata; check that identifiers and addresses resolve." }
prompt = { cs = "Z metadat DataCite níže vytvoř JSON-LD typu schema.org Dataset pro landing page: name, description, identifier (DOI jako URL), creator s ORCID, license, datePublished a distribution s contentUrl a encodingFormat. Použij jen údaje z metadat; co chybí, vynech.\n\nMetadata: […]", en = "From the DataCite metadata below, create schema.org Dataset JSON-LD for a landing page: name, description, identifier (the DOI as a URL), creator with ORCID, license, datePublished and distribution with contentUrl and encodingFormat. Use only what the metadata say; leave out what is missing.\n\nMetadata: […]" }
sources = ["CERIT-AIAAS.01", "SCHEMA-DATASET.01", "EC-GENAI-GUIDELINES.01"]

[[advice]]
id = "publication.26"
lens = "*"
level = "L1"
kind = "ai"
text = { cs = "AI vám pomůže napsat do článku prohlášení o dostupnosti dat z údajů o zveřejněné datové sadě.", en = "AI helps you write the data availability statement of an article from the facts about the published dataset." }
check = { cs = "DOI, repozitář, licenci a podmínky přístupu porovnejte se záznamem datové sady, ověřte, že DOI vede na landing page, a dodržte pokyny časopisu.", en = "Compare the DOI, the repository, the licence and the access conditions with the dataset's record, check that the DOI leads to the landing page, and follow the journal's instructions." }
prompt = { cs = "Z údajů níže napiš krátké prohlášení o dostupnosti dat do článku: kde jsou data uložena, pod jakým DOI, pod jakou licencí a za jakých podmínek jsou přístupná. Použij jen uvedené údaje a drž se pokynů časopisu.\n\nÚdaje o datové sadě (název, repozitář, DOI, licence, omezení přístupu): […]\n\nPokyny časopisu: […]", en = "From the facts below, write a short data availability statement for an article: where the data are deposited, under which DOI, under which licence and on what conditions they are accessible. Use only the facts given and follow the journal's instructions.\n\nFacts about the dataset (title, repository, DOI, licence, access restrictions): […]\n\nJournal instructions: […]" }
sources = ["A.R1.2.N3", "EC-GENAI-GUIDELINES.01"]

[[advice]]
id = "publication.29"
lens = "*"
level = "L1"
text = { cs = "Před zveřejněním projděte [[rdmkit-publication|kontrolní body RDMkit k publikaci]]: popis, licenci, verzi a [[term/persistent-identifier|trvalý identifikátor]]. V českém prostředí navazují [[step/findability|kroky Průvodce pro dohledatelnost]] v [[repo/reg/nma|NMA]] a odkaz pro RIV.", en = "Before publication, follow [[rdmkit-publication|RDMkit's publication considerations]] for documentation, licensing, version and a [[term/persistent-identifier|persistent identifier]]. In the Czech setting, continue with the [[step/findability|Guide's steps]] for [[repo/reg/nma|NMA]] discovery and the RIV link." }
sources = ["RDMKIT.tasks.01"]
