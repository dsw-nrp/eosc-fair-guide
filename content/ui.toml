# Reader visuals (docs/design.md, "Visual placement"). A visual with steps lists them in order; each step has a label
# and a sentence. The hand-over visual draws its steps from the model's seam records and needs only its labels here.
[visual.evidence]
title = { cs = "Jak podklad ovlivní odpověď", en = "How evidence affects your answer" }
note = { cs = "Žádný krok nepočítá skóre. Nedostupný výsledek ani stav „fail“ v původní zprávě samy neznamenají odpověď Ne.", en = "No step computes a score. An unavailable result or a ‘fail’ status in the original report does not on its own mean No." }

[visual.evidence.observation]
label = { cs = "Zjištění", en = "Observation" }
text = { cs = "Záznam, stránka nebo služba ukáže údaj o objektu, s datem a rozsahem.", en = "A record, page or service shows a fact about the object, with its date and scope." }

[visual.evidence.criterion]
label = { cs = "Kritérium služby", en = "Provider criterion" }
text = { cs = "Hodnotící služba údaj posoudí podle vlastního kritéria a uvede svůj nativní výsledek.", en = "An evaluator judges the fact against its own criterion and states its native result." }

[visual.evidence.mapping]
label = { cs = "Posouzené mapování", en = "Reviewed mapping" }
text = { cs = "Průvodce uvádí, zda kritérium pokrývá celou otázku, nebo jen její část, a pro kterou verzi.", en = "The Guide states whether the criterion covers the whole question or only part of it, and for which version." }

[visual.evidence.answer]
label = { cs = "Návrh, nebo vaše odpověď", en = "Suggestion or your answer" }
text = { cs = "Kritérium pokrývající celou otázku navrhne odpověď, kritérium pokrývající její část navrhne Částečně, nebo Ne; vaše vlastní odpověď má vždy přednost.", en = "A criterion covering the whole question suggests an answer, one covering part of it suggests Partly or No; your own answer always takes precedence." }

[visual.evidence.followup]
label = { cs = "Další krok", en = "Follow-up" }
text = { cs = "Výsledek ukáže, co chybí, kde to vyřešit a kdo to udělá.", en = "The result shows what is missing, where to fix it and who does it." }

[visual.object]
title = { cs = "Co identifikuje PID a co z něj přečte prohlížeč", en = "What a PID identifies and what a browser can read" }
note = { cs = "Každý krok může mít jiné podmínky přístupu. Když prohlížeč stránku nebo soubor nepřečte, neznamená to, že neexistují.", en = "Each step can have its own access conditions. A browser failing to read a page or file does not mean it does not exist." }

[visual.object.identifier]
label = { cs = "Trvalý identifikátor", en = "Persistent identifier" }
text = { cs = "DOI nebo Handle pojmenovává datovou sadu natrvalo; resolver ho převede na její aktuální adresu.", en = "A DOI or Handle names the dataset for good; a resolver turns it into the current address." }

[visual.object.landing]
label = { cs = "Stránka objektu", en = "Landing page" }
text = { cs = "Stránka pro lidi s popisem a odkazy; může nést i strojově čitelná metadata.", en = "A page for people with the description and links; it may also carry machine-readable metadata." }

[visual.object.metadata]
label = { cs = "Záznam metadat", en = "Metadata record" }
text = { cs = "Strukturovaný popis, například v DataCite nebo jako JSON-LD. Popisuje datovou sadu, ne nutně každý soubor.", en = "A structured description, for example in DataCite or as JSON-LD. It describes the dataset, not necessarily every file." }

[visual.object.files]
label = { cs = "Soubory dat", en = "Data files" }
text = { cs = "Samotná data; přístup k nim může být otevřený, omezený nebo po přihlášení.", en = "The data themselves; access can be open, restricted or after signing in." }

[visual.software]
title = { cs = "Od verze k citaci softwaru", en = "From a software version to its citation" }
note = { cs = "Archiv zvolte podle potřeby, například Zenodo, Software Heritage nebo institucionální repozitář; žádná služba není povinná.", en = "Choose an archive that suits you, for example Zenodo, Software Heritage or an institutional repository; no single service is required." }

[visual.software.version]
label = { cs = "Verze", en = "Version" }
text = { cs = "Stav kódu označený číslem verze, například podle sémantického verzování.", en = "A state of the code labelled with a version number, for example following semantic versioning." }

[visual.software.release]
label = { cs = "Vydání", en = "Release" }
text = { cs = "Značka (tag) a vydání v repozitáři kódu s popisem změn.", en = "A tag and a release in the code repository, with a description of the changes." }

[visual.software.archive]
label = { cs = "Archivní kopie", en = "Archived copy" }
text = { cs = "Kopie vydání v archivu s trvalým identifikátorem.", en = "A copy of the release in an archive with a persistent identifier." }

[visual.software.citation]
label = { cs = "Citace", en = "Citation" }
text = { cs = "Citační metadata (CITATION.cff, codemeta.json) odkazují na verzi a její identifikátor.", en = "Citation metadata (CITATION.cff, codemeta.json) refer to the version and its identifier." }

[visual.handover]
title = { cs = "Kdo komu předává informace", en = "Who passes information to whom" }
publication = { cs = "Od zveřejnění k vykázání výsledku", en = "From publication to reporting the output" }

