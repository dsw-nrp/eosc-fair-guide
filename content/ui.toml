# The guide's API: its OpenAPI description (in English), the machines page's endpoint list and the catalogue's links.
[api]
title = { cs = "API průvodce FAIR daty", en = "FAIR Data Guide API" }
description = { cs = "Znalostní báze průvodce pro čtení strojem: záznam JSON pro každý princip, zastávku, kontrolu, otázku, zdroj, repozitář, požadavek, citované dílo, pojem, organizaci, profil FIP a změnu obsahu, s texty v obou jazycích a kontextem JSON-LD. Kontroly jsou benchmarky ve slovníku FAIR Testing Resources (FTR), jejich otázky metriky s ručními testy. Cesty odpovídají API FIP Dashboardu tam, kde obě popisují totéž; soubory končí na .json, protože API je statický web.", en = "The guide's knowledge base for machines to read: a JSON record for each principle, station, check, question, resource, repository, requirement, cited work, glossary term, organisation, FIP profile and content change, with texts in both languages and a JSON-LD context. Checks are benchmarks in the FAIR Testing Resources (FTR) vocabulary, their questions metrics with manual tests. Paths follow the FIP Dashboard API where both describe the same thing; files end in .json because the API is a static site." }
guide = { cs = "Průvodce FAIR daty", en = "The FAIR Data Guide" }
server = { cs = "Web, který tento popis poskytuje", en = "The site that serves this description" }
meta = { cs = "Z čeho je API sestaveno", en = "What the API is built from" }
metaTag = { cs = "Popis API a jeho kontext JSON-LD", en = "The API's provenance and its JSON-LD context" }
health = { cs = "Výsledky kontrol obsahu a sestavení", en = "Content and build check results" }
healthDescription = { cs = "Uložený přehled integrity obsahu, původních znění zdrojů a výsledků běhu kontrol. Samotné sestavení neznamená provedení kontrol; jejich běh následně aktualizuje tento soubor. Dostupnost externích služeb zůstává výslovně neověřená. Endpoint /health FIP Dashboardu naproti tomu popisuje dostupnost běžící služby a počty jejích záznamů.", en = "A published snapshot of content integrity, original-source coverage and check-run results. A build alone does not run the checks; a completed check run then updates this file. External-service availability remains explicitly unchecked. The FIP Dashboard's /health endpoint reports the running service's liveness and collection counts." }
context = { cs = "Kontext JSON-LD", en = "The JSON-LD context" }
openapi = { cs = "Popis API (OpenAPI 3.1)", en = "API description (OpenAPI 3.1)" }
docs = { cs = "Interaktivní dokumentace API", en = "Interactive API documentation" }
endpoints = { cs = "Koncové body API", en = "API endpoints" }
record = { cs = "JSON", en = "JSON" }
recordTitle = { cs = "Záznam v API průvodce", en = "Record in the guide's API" }

