# What each check is for, so that NRP conditions, FAIR maturity, certification and profile readiness are told apart.
[selfcheck.purpose]
label = { cs = "K čemu slouží", en = "What it is for" }
dataset = { cs = "stav FAIR jedné datové sady", en = "the FAIR state of one dataset" }
gate = { cs = "podmínky zapojení repozitáře do NRP; rozhoduje NRP", en = "the conditions for a repository joining NRP; NRP decides" }
maturity = { cs = "zralost FAIR repozitáře nad rámec podmínek NRP", en = "a repository's FAIR maturity beyond the NRP conditions" }
coretrustseal = { cs = "připravenost na certifikaci CoreTrustSeal; certifikuje CoreTrustSeal", en = "readiness for CoreTrustSeal certification; CoreTrustSeal certifies" }
fip = { cs = "úplnost FAIR Implementation Profile komunity", en = "the completeness of a community's FAIR Implementation Profile" }
institution = { cs = "povinnosti a strategie instituce pro správu dat", en = "an institution's data-management obligations and strategy" }
cdif = { cs = "připravenost metadat na profily CDIF", en = "metadata readiness for the CDIF profiles" }
software = { cs = "stav FAIR výzkumného softwaru", en = "the FAIR state of research software" }
fdo = { cs = "připravenost na FAIR Digital Objects", en = "readiness for FAIR Digital Objects" }

[selfcheck.mode]
before = { cs = "Ještě ne, zveřejnění připravuji", en = "Not yet, I am preparing publication" }
after = { cs = "Ano, má trvalý identifikátor", en = "Yes, it has a persistent identifier" }

# The three parts of a check, each with its own address.
# The evidence sources of a check, one card each: what it sends where, how long it takes, how many questions it can
# suggest an answer to.
[selfcheck.evidenceCard]
sends = { cs = "Odešle", en = "Sends" }
takes = { cs = "Trvá", en = "Takes" }
answers = { cs = "Navrhne", en = "Suggests" }
answersCount = { cs = "odpověď na {n} otázku|odpovědi na {n} otázky|odpovědi na {n} otázek", en = "an answer to {n} question|answers to {n} questions" }

[selfcheck.evidenceCard.pid]
title = { cs = "Záznam objektu podle DOI nebo Handle", en = "The object's record by DOI or Handle" }
sends = { cs = "identifikátor službám DataCite nebo Crossref a resolveru DOI nebo Handle", en = "the identifier to DataCite or Crossref and to the DOI or Handle resolver" }
takes = { cs = "několik sekund", en = "a few seconds" }

[selfcheck.evidenceCard.software]
title = { cs = "Repozitář zdrojového kódu", en = "The source code repository" }
sends = { cs = "adresu repozitáře veřejnému API GitHubu nebo GitLabu", en = "the repository's address to the public GitHub or GitLab API" }
takes = { cs = "několik sekund", en = "a few seconds" }

[selfcheck.evidenceCard.nkr]
title = { cs = "Záznam v NKR", en = "The NKR record" }
sends = { cs = "nic o vás: Průvodce načte veřejný seznam repozitářů z NKR", en = "nothing about you: the Guide loads NKR's public list of repositories" }
takes = { cs = "několik sekund", en = "a few seconds" }

[selfcheck.evidenceCard.re3data]
title = { cs = "Záznam v re3data", en = "The re3data record" }
sends = { cs = "identifikátor r3d nebo adresa záznamu zůstává v prohlížeči; zadáte-li DOI nebo Handle, odešle se k ověření službě doi.org nebo hdl.handle.net. Údaje se čtou ze snímků re3data a záznamů FAIRsharing získaných z DataCite", en = "an r3d identifier or record address stays in the browser; a DOI or Handle is sent to doi.org or hdl.handle.net for resolution. Facts come from snapshots of re3data and FAIRsharing records retrieved from DataCite" }
takes = { cs = "ze snímků okamžitě; ověření DOI nebo Handle několik sekund", en = "snapshots take no time; resolving a DOI or Handle takes a few seconds" }

[selfcheck.evidenceCard.sample]
title = { cs = "Vzorek záznamů repozitáře", en = "A sample of the repository's records" }
sends = { cs = "identifikátory záznamů resolverům a DataCite; adresy záznamů serveru FAIR Champion, jen když spustíte jeho testy", en = "the records' identifiers to resolvers and DataCite; their addresses to the FAIR Champion server, only when you run its tests" }
takes = { cs = "desítky sekund, testy i několik minut", en = "tens of seconds; the tests up to several minutes" }

[selfcheck.evidenceCard.fip]
title = { cs = "Profil FIP", en = "The FIP" }
sends = { cs = "identifikátor nanopublikace službě Knowledge Pixels; profil ze snímku FIP Dashboardu nic", en = "the nanopublication's identifier to Knowledge Pixels; a profile from the FIP Dashboard snapshot nothing" }
takes = { cs = "několik sekund", en = "a few seconds" }

[selfcheck.evidenceCard.evaluators]
title = { cs = "Externí hodnotitelé", en = "External evaluators" }
sends = { cs = "identifikátor službě FAIR-Checker, když ji spustíte; zpráva F-UJI se jen načte ze souboru", en = "the identifier to FAIR-Checker, when you run it; an F-UJI report is only read from a file" }
takes = { cs = "desítky sekund", en = "tens of seconds" }

[selfcheck.evidenceCard.file]
title = { cs = "Uložený výsledek", en = "A saved result" }
sends = { cs = "nic: soubor zůstává v prohlížeči", en = "nothing: the file stays in the browser" }
takes = { cs = "okamžitě", en = "no time" }

[selfcheck.parts]
label = { cs = "Části kontroly", en = "Parts of the check" }
evidence = { cs = "Podklady", en = "Evidence" }
answers = { cs = "Odpovědi", en = "Answers" }
report = { cs = "Zpráva", en = "Report" }
evidenceNote = { cs = "odkud mohou přijít návrhy odpovědí", en = "where suggested answers can come from" }
answersNote = { cs = "zodpovězeno {n} z {total}", en = "{n} of {total} answered" }
answersWaiting = { cs = "po volbě nahoře", en = "after the choice above" }
reportNote = { cs = "stav, co chybí, shoda s hodnotiteli", en = "state, gaps, agreement with evaluators" }

[selfcheck.parts.to]
answers = { cs = "Pokračovat k odpovědím", en = "Continue to the answers" }
report = { cs = "Pokračovat ke zprávě", en = "Continue to the report" }

[selfcheck.answer]
yes = { cs = "Ano", en = "Yes" }
