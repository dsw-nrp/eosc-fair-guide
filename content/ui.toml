what = { cs = "Jeden soubor JSON-LD ve formátu RO-Crate 1.2, ověřený proti profilu průvodce.", en = "One JSON-LD file in RO-Crate 1.2, validated against the guide's profile." }

[machines.task.record]
want = { cs = "údaje o jednom principu, kroku, požadavku nebo pojmu", en = "the data on one principle, step, requirement or term" }
what = { cs = "Záznam API v JSON s kontextem JSON-LD; texty česky i anglicky a odkazy na související záznamy.", en = "An API record in JSON with a JSON-LD context; texts in Czech and English and links to related records." }

[machines.task.service]
want = { cs = "napojit vlastní službu nebo nástroj", en = "to connect my own service or tool" }
what = { cs = "Popis API ve formátu OpenAPI 3.1 a jeho interaktivní dokumentace.", en = "The API's description in OpenAPI 3.1 and its interactive documentation." }

[machines.task.harvest]
want = { cs = "aby průvodce harvester našel sám", en = "a harvester to find the guide on its own" }
what = { cs = "FAIR Signposting: typované odkazy v hlavičce každé stránky a linkset, který je vypisuje v jednom souboru.", en = "FAIR Signposting: typed links in the head of every page and a linkset that lists them in one file." }

[machines.task.health]
want = { cs = "výsledky kontrol průvodce", en = "the guide's check results" }
what = { cs = "Přehled kontrol obsahu a sestavení v angličtině a stejný výsledek v JSON. Uvádí také kontroly, které neproběhly.", en = "Content and build check results in an English dashboard and the same report in JSON, including checks that did not run." }

[machines.task.tests]
want = { cs = "jak fungují automatické testy průvodce", en = "how the guide's automated tests work" }
what = { cs = "Účel, zdrojový kód a volaná funkce každého testu; katalog propojuje testy s otázkami a citovanými požadavky.", en = "Each test's purpose, source code and invoked function; the catalogue links tests to questions and cited requirements." }

[machines.task.result]
want = { cs = "uložit a sdílet výsledek kontroly", en = "to save and share a check result" }
what = { cs = "Výsledek jako sada výsledků testů ve slovníku FAIR Testing Resources (FTR) v RO-Crate; každý výsledek odkazuje na svůj test v API.", en = "The result as a test result set in the FAIR Testing Resources (FTR) vocabulary in an RO-Crate; each result names its test in the API." }

[machines.task.list]
want = { cs = "seznam z katalogu, jak jsem si ho vyfiltroval", en = "a catalogue list as I filtered it" }
what = { cs = "Pod seznamem jako CSV, nebo jako data ve tvaru seznamů API s odkazem na záznam každé položky.", en = "Under the list as CSV, or as data in the shape of the API's lists with a link to each entry's record." }

