[selfcheck.providers]
title = { cs = "Další hodnotitelé FAIR", en = "Other FAIR evaluators" }
intro = { cs = "Tyto služby posuzují objekt podle vlastních kritérií. Žádná se nespustí, dokud ji nevyberete, a dostane jen identifikátor uvedený níže. Průvodce jejich výsledky čte tak, jak je služba sama ukazuje. Kde posouzené kritérium pokrývá celou otázku, navrhne odpověď; kde jen její část, navrhne Částečně, nebo Ne, když tato část splněna není. Vaše vlastní odpovědi zůstávají.", en = "These services assess the object against their own criteria. None runs until you choose it, and it receives only the identifier shown below. The Guide reads their results as the service itself shows them. Where a reviewed criterion covers the whole question, it suggests an answer; where it covers only part, it suggests Partly, or No when that part is not met. Your own answers stay." }
