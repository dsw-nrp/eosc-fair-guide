# Pages: about the guide, accessibility statement, AI in FAIRification and the helpers' pages. A helper page holds
# the text around an interactive tool that the page script adds. Field reference: docs/content-model.md.

[[page]]
id = "about"
menu = "about"
title = { cs = "O průvodci", en = "About the guide" }

[[page.section]]
heading = { cs = "Z čeho průvodce vychází", en = "What the guide builds on" }
body = { cs = "Průvodce vychází z [[analyza-fair-1.2|Analýzy a návrhu postupů k naplňování FAIR principů v rámci NRP/NDI]] (verze 1.2, NRP KA 5.1) a doplňuje ji o současný stav národních služeb. Každé doporučení odkazuje na publikovaný zdroj; v průzkumníku principů najdete všechny požadavky analýzy. Kdo s tématem začíná, najde úvod v [[training-overview|přehledových a úvodních kurzech EOSC CZ]].", en = "The guide builds on the [[analyza-fair-1.2|Analysis and proposal of procedures for implementing the FAIR principles in NRP/NDI]] (version 1.2, NRP KA 5.1) and brings it up to date with the current state of national services. Every recommendation cites a published source; the principle explorer lists every requirement of the analysis. If you are new to the topic, the [[training-overview|EOSC CZ overview and introductory courses]] are a good start." }

[[page.section]]
id = "why"
heading = { cs = "Proč průvodce vzniká", en = "Why the guide exists" }
body = { cs = "Průvodce patří k budování národní infrastruktury pro data FAIR v iniciativě EOSC CZ. Její záměr shrnuje [[eosc-cz-vision|článek o vývoji českého ekosystému pro data FAIR]] a uspořádání [[ndi-architecture|architektura implementace iniciativy EOSC v ČR]]: páteří je Národní repozitářová platforma, v níž vznikají repozitáře, a doplňují ji oborové repozitáře a národní metadatový adresář.\n\nInfrastruktura vzniká na základě shody komunity, jak popisuje [[ercim-community|článek v ERCIM News]]. Ukazuje také mezeru mezi znalostí a praxí, kterou zjistil [[survey-2025-data|národní průzkum správy výzkumných dat 2025]]: zhruba 58 % výzkumníků zná principy FAIR, dvě třetiny ale ukládají data hlavně na osobní počítač a přes 40 % neví, jaký repozitář použít. Právě s tím má průvodce pomáhat.\n\nKteré služby NRP jsou k dispozici a co se chystá, ukazují roadmapy služeb NRP [[nrp-roadmap-2025|pro rok 2025]] a [[nrp-roadmap-2026|pro rok 2026]].", en = "The guide is part of building the national infrastructure for FAIR data in the EOSC CZ initiative. Its aims are summarised in [[eosc-cz-vision|the paper on developing the Czech ecosystem for FAIR research data]], and its layout in [[ndi-architecture|the architecture of the EOSC initiative's implementation in the Czech Republic]]: the backbone is the National Repository Platform, in which repositories are created, complemented by domain repositories and the national metadata directory.\n\nThe infrastructure grows from community consensus, as [[ercim-community|an article in ERCIM News]] describes. It also shows the gap between awareness and practice found by [[survey-2025-data|the national survey of research data management 2025]]: about 58% of researchers know the FAIR principles, yet two thirds store data mainly on a personal computer and over 40% do not know which repository to use. That gap is what the guide is meant to help close.\n\nWhich NRP services are available and what is planned is shown in the NRP service roadmaps [[nrp-roadmap-2025|for 2025]] and [[nrp-roadmap-2026|for 2026]]." }

[[page.section]]
heading = { cs = "Průvodce a FIP Dashboard", en = "The guide and the FIP Dashboard" }
body = { cs = "Průvodce radí, co a proč udělat. [[fip-dashboard|FIP Dashboard]] je katalog zdrojů umožňujících FAIR (FER) a profilů FIP komunit; ukazuje, které zdroje ověřily NRP a EOSC CZ. Obě služby se na sebe odkazují a čtou se jako jeden celek.", en = "The guide advises what to do and why. The [[fip-dashboard|FIP Dashboard]] is the catalogue of FAIR-enabling resources (FERs) and of communities' FIPs; it shows which resources NRP and EOSC CZ have verified. The two services link to each other and are meant to be read together." }

[[page.section]]
id = "credits"
heading = { cs = "Kdo se na průvodci podílel", en = "Who contributed to the guide" }
body = { cs = "Průvodce je výstupem klíčové aktivity 5.1 projektu Národní repozitářová platforma. Jeho obsah vychází z [[analyza-fair-1.2|Analýzy FAIR pro NRP/NDI]] a dalších publikovaných zdrojů; průvodce je sestavuje, doplňuje o současný stav služeb a převádí do cesty a kontrol. Proto citace průvodce uvádí jeho sestavovatele jako editora a autory analýzy uvádí zvlášť.", en = "The guide is an output of key activity 5.1 of the National Repository Platform project. Its content builds on [[analyza-fair-1.2|the FAIR analysis for NRP/NDI]] and other published sources; the guide compiles them, brings them up to date with the current state of services and turns them into a path and checks. That is why the guide's citation names its compiler as editor and credits the authors of the analysis separately." }

[[page.section]]
heading = { cs = "Využití umělé inteligence", en = "Use of artificial intelligence" }
body = { cs = "Na přípravě obsahu a kódu se podílel AI asistent (Claude, Anthropic). U každé zastávky průvodce ukazuje, z jakých zdrojů vychází a kdy se obsah měnil (úroveň „Zdroje a vznik obsahu“); kdo a s jakým nástrojem obsah připravil, zaznamenávají paradata ve znalostní bázi. Texty kontrolují lidé.", en = "An AI assistant (Claude, Anthropic) contributed to the content and code. For each station, the guide shows which sources it draws on and when the content changed (the “Sources and how this was made” level); who prepared the content and with which tool is recorded in the paradata of the knowledge base. People review the texts." }

[[page.section]]
id = "privacy"
heading = { cs = "Ochrana soukromí", en = "Privacy" }
body = { cs = "Odpovědi v sebehodnocení zůstávají jen ve vašem prohlížeči. Průvodce kontaktuje externí služby (například [[datacite|DataCite]] nebo [[fair-champion|FAIR Champion]]) jen tehdy, když kontrolu sami spustíte, a jen ty uvedené v nastavení stránky.", en = "Your self-check answers stay in your browser. The guide contacts external services (such as [[datacite|DataCite]] or [[fair-champion|FAIR Champion]]) only when you start a check yourself, and only those listed in the page's settings." }

[[page]]
id = "accessibility"
menu = "about"
title = { cs = "Prohlášení o přístupnosti", en = "Accessibility statement" }

[[page.section]]
heading = { cs = "Stav souladu", en = "Compliance status" }
body = { cs = "Průvodce usiluje o soulad s pravidly WCAG 2.2 na úrovni AA, která pokrývají požadavky normy EN 301 549 a zákona č. 99/2019 Sb. Průvodce je ve fázi testování; soulad bude před vydáním ověřen automatickými testy a ručním testem ovládání klávesnicí.", en = "The guide aims to conform to WCAG 2.2 level AA, which covers the requirements of EN 301 549 and Czech Act No. 99/2019 Coll. The guide is in testing; conformance will be verified with automated tests and a manual keyboard test before release." }

[[page.section]]
heading = { cs = "Co průvodce dělá pro přístupnost", en = "What the guide does for accessibility" }
body = { cs = "Text má kontrast alespoň 4,5 : 1, stav služeb se sděluje textem a ikonou, ne jen barvou, rozbalovací části používají nativní prvky ovladatelné klávesnicí a stránka se přizpůsobí šířce 320 pixelů. Diagramy mají textový popis a vedle sebe text se stejným významem.", en = "Text has a contrast of at least 4.5:1, service statuses are conveyed by text and icon rather than colour alone, expandable parts use native keyboard-operable elements, and the page reflows at a width of 320 pixels. Diagrams have a text description and are accompanied by text with the same meaning." }

[[page.section]]
heading = { cs = "Výjimka: interaktivní dokumentace API", en = "Exception: the interactive API documentation" }
body = { cs = "Interaktivní dokumentace API na adrese api/ je nástroj třetí strany pro vývojáře (Swagger UI) a správce průvodce ji z požadavku na přístupnost vyjmul. Tytéž koncové body přístupně uvádí stránka [[page:machines|Data pro stroje]].", en = "The interactive API documentation at api/ is a third-party developer tool (Swagger UI), which the guide's maintainer exempted from the accessibility requirement. The page [[page:machines|Data for machines]] lists the same endpoints accessibly." }

[[page.section]]
heading = { cs = "Zpětná vazba", en = "Feedback" }
body = { cs = "Narazíte-li na překážku, napište nám prostřednictvím úložiště průvodce na GitHubu (github.com/motyc/eosc-fair-guide), nebo na adresu info@eosc.cz.", en = "If you meet a barrier, tell us through the guide's repository on GitHub (github.com/motyc/eosc-fair-guide) or at info@eosc.cz." }

[[page]]
id = "live-check"
menu = "tools"
icon = "magnifying-glass-chart"
description = { cs = "Ověří, kam vede DOI nebo Handle datové sady, a spustí vybrané testy FAIR.", en = "Checks where a dataset's DOI or Handle leads and runs selected FAIR tests." }
helper = true
title = { cs = "Kontrola datové sady", en = "Dataset check" }

[[page.section]]
heading = { cs = "Rychlá a hloubková kontrola", en = "Quick and deep check" }
body = { cs = "Vložte DOI, Handle nebo URL. Rychlá kontrola za několik vteřin ověří, kam identifikátor vede, a načte metadata z [[datacite|DataCite]]. Hloubková kontrola spustí vybrané testy nástroje [[fair-champion|FAIR Champion]]; běží jen na vaše vyžádání a může trvat i několik minut.\n\nKaždý test skončí jako splněno, nesplněno, neurčité, nebo bez výsledku, pokud služba neodpověděla. Test bez výsledku se nepočítá jako nesplněný požadavek a u výsledků vždy vidíte, kolik testů skutečně proběhlo. Výsledky vypovídají hlavně o nastavení repozitáře.", en = "Enter a DOI, Handle or URL. The quick check verifies within seconds where the identifier leads and loads the metadata from [[datacite|DataCite]]. The deep check runs selected [[fair-champion|FAIR Champion]] tests; it runs only when you ask for it and can take several minutes.\n\nEach test ends as passed, failed, indeterminate, or no result if the service did not respond. A test without a result never counts as a failed requirement, and the results always show how many tests actually ran. The results mainly reflect the repository's setup." }

[[page]]
id = "identifiers"
menu = "tools"
icon = "fingerprint"
description = { cs = "Najde v textu ORCID, DOI, Handle a ROR a ukáže, ke komu nebo čemu vedou.", en = "Finds ORCID iDs, DOIs, Handles and ROR IDs in a text and shows whom or what they lead to." }
helper = true
title = { cs = "Ověřit identifikátory", en = "Verify identifiers" }

[[page.section]]
heading = { cs = "Jak pomocník funguje", en = "How the helper works" }
body = { cs = "Vložte text, například metadata připravená s pomocí AI. Pomocník v něm najde [[orcid|ORCID]], DOI, Handle a [[ror|ROR]], kontrolní číslici ORCID ověří přímo v prohlížeči a po kliknutí ukáže jméno nebo název, ke kterému identifikátor vede. Identifikátor, který nevede nikam, označí.", en = "Paste a text, for example metadata drafted with AI. The helper finds [[orcid|ORCID]] iDs, DOIs, Handles and [[ror|ROR]] IDs, checks the ORCID check digit in your browser, and on request shows the name or title each identifier leads to. It flags identifiers that lead nowhere." }

[[page]]
id = "citation"
menu = "tools"
icon = "quote-right"
description = { cs = "Připraví citaci datové sady z jejího DOI podle APA a ČSN ISO 690 a export do BibTeX a RIS.", en = "Prepares a dataset citation from its DOI in APA and Czech ISO 690 style, with BibTeX and RIS exports." }
helper = true
title = { cs = "Citace z DOI", en = "Citation from a DOI" }

[[page.section]]
heading = { cs = "Jak pomocník funguje", en = "How the helper works" }
body = { cs = "Vložte DOI datové sady registrované u [[datacite|DataCite]]. Průvodce načte metadata z DataCite a připraví citaci podle APA a podle ČSN ISO 690 a export ve formátech BibTeX a RIS ke zkopírování. Pokud DataCite neodpoví, citaci sestavíte ručně: autor, rok, název, repozitář, verze a DOI.", en = "Enter the DOI of a dataset registered with [[datacite|DataCite]]. The guide loads the metadata from DataCite and prepares an APA citation, a Czech ISO 690 citation, and BibTeX and RIS exports to copy. If DataCite does not respond, put the citation together by hand: author, year, title, repository, version and DOI." }

[[page]]
id = "ai"
menu = "tools"
icon = "robot"
description = { cs = "Kde při FAIRifikaci pomůže AI a na co si dát pozor.", en = "Where AI helps in FAIRification and what to watch out for." }
title = { cs = "AI ve FAIRifikaci", en = "AI in FAIRification" }

[[page.section]]
heading = { cs = "Kde AI pomůže", en = "Where AI helps" }
body = { cs = "AI pomůže s návrhem a kontrolou plánu správy dat, se skripty pro zpracování dat, s kritérii pro výběr repozitáře, s návrhem README, abstraktu a datového slovníku, s překladem metadat mezi češtinou a angličtinou, s mapováním metadat, s klíčovými slovy, s hledáním dat, která je třeba citovat, s přípravou JSON-LD pro landing page, s vysvětlením výsledků testů FAIR a s podkladem pro profil FAIR implementace. Tipy ze všech kroků cesty, s tím, co zkontrolovat, a zadáním ke zkopírování, najdete níže.", en = "AI can help draft and review a data management plan, write data-processing scripts, set criteria for choosing a repository, draft a README, an abstract and a data dictionary, translate metadata between Czech and English, map metadata, suggest keywords, find the data a text should cite, prepare JSON-LD for a landing page, explain FAIR test results and prepare the basis of a FAIR Implementation Profile. The tips from every step of the path, with what to check and a prompt to copy, are below." }

[[page.section]]
heading = { cs = "Tři pravidla", en = "Three rules" }
body = { cs = "- Data: nepublikovanou práci vkládejte jen do služeb, které data neposílají mimo infrastrukturu a nevyužijí je k učení modelů, například do [[cerit-aiaas|AI v e-INFRA CZ (CERIT)]]. Citlivá a osobní data do AI chatu nevkládejte, ani do chatu e-INFRA CZ, který pro ně podle svých zásad není určen.\n- Ověření: identifikátory ([[orcid|ORCID]], DOI, [[ror|ROR]]), citace i hesla AI umí vymyslet, proto její výstup ověřte. Za výsledek odpovídáte vy; AI není autorem.\n- Transparentnost: uveďte, které nástroje AI jste podstatně použili a jak, a kde je to vhodné, zveřejněte i zadání.\n\nPravidla vycházejí z [[ec-genai-guidelines|živých zásad Evropské komise pro odpovědné využívání generativní AI ve výzkumu]].", en = "- Data: put unpublished work only into services that keep the data within the infrastructure and do not use them to train models, such as [[cerit-aiaas|AI in e-INFRA CZ (CERIT)]]. Do not put sensitive or personal data into an AI chat, not even the e-INFRA CZ chat, which by its own policy is not meant for them.\n- Checking: AI can make up identifiers ([[orcid|ORCID]], DOI, [[ror|ROR]]), citations and terms, so check what it produces. You are responsible for the result; AI is not an author.\n- Transparency: say which AI tools you used substantially and how, and where relevant publish the prompts too.\n\nThe rules follow the [[ec-genai-guidelines|European Commission's living guidelines on the responsible use of generative AI in research]]." }

[[page.section]]
heading = { cs = "Když pracuje AI agent", en = "When an AI agent does the work" }
body = { cs = "Agent, například asistent pro programování, sám čte soubory, spouští příkazy a mění data. Při přípravě tohoto průvodce se osvědčilo:\n\n- Nejdřív plán: nechte agenta navrhnout plán (cíl, kroky, dotčené soubory, rizika a jak se výsledek ověří), přečtěte si ho a schvalte. Čas strávený plánem se vrátí.\n- Nástroje pro plánování: režim plánování, seznam úkolů nebo specifikace změny, kterou agent dodržuje a vy si ji můžete projít.\n- Deterministické kroky: kde to jde, svěřte opakovanou práci skriptu, který agent napíše a vy zkontrolujete, ne opakovaným dotazům. Skript dá pokaždé stejný výsledek a dá se zopakovat.\n- Kopie dat: pracujte na kopii, originály nechte jen pro čtení.\n- Git: každý ověřený krok uložte jako commit. Vidíte přesně, co agent změnil, a chybný krok vrátíte.\n- Malé kroky: při chybě hledejte příčinu, ne další záplatu; když ani třetí oprava nezabere, vraťte se k plánu.\n- Ověřujte všechno: testy, validátory metadat, porovnání před a po. Že agent napíše „hotovo“, nic nedokazuje.\n- Lidské brány: agentovi nevěřte. Kroky, které nejdou vzít zpět nebo míří ven (mazání, zveřejnění, odeslání dat, zápis do repozitáře), schvalujte sami, až uvidíte, co se skutečně zapíše.\n- Bezpečná pracovní stanice: agent pracuje s vašimi právy. Omezte ho na pracovní složku, povolte jen příkazy, které potřebuje, nesvěřujte mu hesla ani tokeny a obsah z internetu berte jako nedůvěryhodný, může obsahovat skryté pokyny.\n- Záznam kroků: zadání, model a nástroj, co se změnilo a jak jste to ověřili. Záznam patří k datům jako jejich původ a naplňuje transparentnost, kterou žádají [[ec-genai-guidelines|zásady Evropské komise]].", en = "An agent, such as a coding assistant, reads files, runs commands and changes data by itself. In making this guide, this served well:\n\n- Plan first: have the agent propose a plan (goal, steps, files affected, risks and how the result will be checked), read it and approve it. Time spent on the plan pays back.\n- Planning tools: a planning mode, a task list or a change specification the agent follows and you can review.\n- Deterministic steps: wherever you can, give repeated work to a script the agent writes and you review, not to repeated prompts. A script gives the same result every time and can be rerun.\n- A copy of the data: work on a copy and keep the originals read-only.\n- Git: commit each verified step. You see exactly what the agent changed, and you can undo a wrong step.\n- Small steps: when something fails, look for the cause, not another patch; if a third fix does not work either, go back to the plan.\n- Validate everything: tests, metadata validators, comparisons before and after. An agent saying “done” proves nothing.\n- Human gates: do not trust the agent. Approve yourself the steps that cannot be undone or that go outside (deleting, publishing, sending data, writing to a repository), once you have seen what will actually be written.\n- A safe workstation: the agent works with your permissions. Confine it to the working folder, allow only the commands it needs, give it no passwords or tokens, and treat content from the internet as untrusted, since it may carry hidden instructions.\n- Log the steps: the prompt, the model and tool, what changed and how you checked it. The log belongs with the data as their provenance and gives the transparency the [[ec-genai-guidelines|European Commission's guidelines]] ask for." }

[[page.section]]
id = "cerit"
heading = { cs = "AI v e-INFRA CZ (CERIT)", en = "AI in e-INFRA CZ (CERIT)" }
body = { cs = "[[cerit-aiaas|AI jako služba]] od CERIT-SC běží v národní infrastruktuře e-INFRA CZ s otevřenými modely. Dotazy se nevyužívají k učení modelů a mimo infrastrukturu odchází jen dotaz pro vyhledávání na webu, když ho zapnete.\n\n- [[cerit-chat-ai|Chat]]: přihlásíte se přes e-INFRA CZ a potřebujete aktivní účet MetaCentra; studenti a zaměstnanci Masarykovy univerzity mají rychlou registraci.\n- [[cerit-ai-api|API]]: kompatibilní s OpenAI, pro skripty a datové postupy; klíč si vytvoříte v nastavení chatu.\n- [[cerit-ai-coding|Asistenti pro programování]]: Claude Code, Codex, OpenCode nebo rozšíření pro VS Code a JetBrains se připojí ke stejné službě.\n- JupyterHub: asistent pomáhá přímo v notebooku.\n\nChat podle [[cerit-ai-privacy|zásad ochrany dat CERIT-SC]] nesplňuje požadavky na zpracování citlivých, utajovaných ani osobních údajů a nahrané soubory v něm zatím nejde smazat. Potřebujete-li AI pro citlivá data, obraťte se nejdřív na CERIT-SC.", en = "CERIT-SC runs [[cerit-aiaas|AI as a Service]] in the national e-INFRA CZ infrastructure, with open models. Prompts are not used to train models, and nothing leaves the infrastructure except web search queries, when you turn web search on.\n\n- [[cerit-chat-ai|Chat]]: you log in through e-INFRA CZ and need an active MetaCentrum account; Masaryk University students and staff have a fast-track registration.\n- [[cerit-ai-api|API]]: OpenAI-compatible, for scripts and data workflows; you create the key in the chat's settings.\n- [[cerit-ai-coding|Coding assistants]]: Claude Code, Codex, OpenCode or the extensions for VS Code and JetBrains connect to the same service.\n- JupyterHub: an assistant helps right in the notebook.\n\nBy [[cerit-ai-privacy|CERIT-SC's data privacy policy]], the chat does not meet the requirements for processing sensitive, classified or personal data, and files uploaded to it cannot be deleted yet. If you need AI for sensitive data, contact CERIT-SC first." }
action = { label = { cs = "Otevřít chat AI e-INFRA CZ", en = "Open the e-INFRA CZ AI chat" }, href = "https://chat.ai.e-infra.cz/" }

[[page.section]]
id = "station-tips"
heading = { cs = "Tipy u jednotlivých kroků", en = "Tips at each step" }
body = { cs = "Všechny tipy z cesty na jednom místě. Tip určený jen pro jeden pohled nese jeho ikonu.", en = "All the tips from the path in one place. A tip meant for one view carries its icon." }

[[page]]
id = "machines"
menu = "header"
icon = "code"
title = { cs = "Data pro stroje", en = "Data for machines" }

[[page.section]]
body = { cs = "Všechno, co průvodce obsahuje, jsou zároveň data, která čtou stroje: jedna znalostní báze a API sestavené z ní. Tato stránka ukazuje, jak je najít a použít, a předvádí na průvodci samém, co doporučuje repozitářům a datovým sadám. Chcete-li vidět, jak strojově čitelný obsah vypadá v praxi, vyzkoušejte si to právě tady.", en = "Everything the guide holds is also data that machines read: one knowledge base and an API built from it. This page shows how to find and use them, and demonstrates on the guide itself what it recommends to repositories and datasets. If you want to see what machine-readable content looks like in practice, try it out right here." }

[[page.section]]
id = "tasks"
heading = { cs = "Co hledáte", en = "What you are looking for" }
body = { cs = "Vyberte podle toho, co chcete udělat; každý odkaz vede na skutečná data průvodce.", en = "Choose by what you want to do; every link leads to the guide's real data." }

[[page.section]]
id = "practice"
heading = { cs = "Jak průvodce uplatňuje vlastní doporučení", en = "How the guide applies its own advice" }
body = { cs = "Strojově čitelný obsah se dá najít, přečíst a ověřit bez člověka. Průvodce k tomu používá tytéž prostředky, které doporučuje.\n\n[[fair-signposting|FAIR Signposting]]: hlavička každé stránky nese typované odkazy na metadata, API, licenci a editora a linkset je vypisuje v jednom souboru, takže je stroj najde, aniž by znal adresy. Které to jsou, ukazuje tabulka níže.\n\nMetadata v komunitním standardu: znalostní báze je [[ro-crate|RO-Crate 1.2]], odpovídá [[profile|profilu průvodce]] a profilu [[process-run-crate|Process Run Crate]] a validátor ji ověřuje při každé změně. Licence CC BY 4.0 je v ní uvedena strojově čitelně.\n\nProvenience: každá změna obsahu je zaznamenaná jako akce s autorem, použitým nástrojem včetně modelu AI a zdroji, z nichž vychází; v katalogu ji najdete mezi změnami obsahu.\n\nVýsledky testů: uložený výsledek kontroly je sada výsledků testů ve slovníku [[ftr|FAIR Testing Resources (FTR)]], který popisuje benchmarky, metriky, testy a jejich výsledky; každý výsledek odkazuje na svůj test v API průvodce.\n\nAdresy: záznamy na sebe odkazují relativně, takže obsah bude fungovat i na trvalé adrese, která se teprve stanoví.", en = "Machine-readable content can be found, read and verified without a person. The guide does this with the same means it recommends.\n\n[[fair-signposting|FAIR Signposting]]: the head of every page carries typed links to the metadata, the API, the licence and the editor, and a linkset lists them in one file, so a machine finds them without knowing their addresses. The table below shows which they are.\n\nMetadata in a community standard: the knowledge base is an [[ro-crate|RO-Crate 1.2]], conforms to [[profile|the guide's profile]] and to the [[process-run-crate|Process Run Crate]] profile, and a validator checks it at every change. The CC BY 4.0 licence is stated in it in machine-readable form.\n\nProvenance: every content change is recorded as an action with its author, the tool used, including any AI model, and the sources it draws on; you find it in the catalogue among the content changes.\n\nTest results: a saved check result is a test result set in the [[ftr|FAIR Testing Resources (FTR)]] vocabulary, which describes benchmarks, metrics, tests and their results; each result names its test in the guide's API.\n\nAddresses: records link each other relatively, so the content will work at the permanent address that is still to be settled." }

