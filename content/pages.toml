body = { cs = "Průvodce vychází z Analýzy a návrhu postupů k naplňování FAIR principů v rámci NRP/NDI (verze 1.2, NRP KA 5.1) a doplňuje ji o současný stav národních služeb. Každé doporučení odkazuje na publikovaný zdroj.", en = "The guide builds on the Analysis and proposal of procedures for implementing the FAIR principles in NRP/NDI (version 1.2, NRP KA 5.1) and brings it up to date with the current state of national services. Every recommendation cites a published source." }
