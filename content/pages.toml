id = "endpoints"
heading = { cs = "Koncové body API", en = "API endpoints" }
body = { cs = "Tytéž koncové body, které ukazuje interaktivní dokumentace API, jako přístupná tabulka. Každá kolekce má seznam a záznam pro každou položku; kontext JSON-LD říká, co která vlastnost znamená.", en = "The same endpoints the interactive API documentation shows, as an accessible table. Each collection has a list and a record for each entry; the JSON-LD context says what each property means." }
