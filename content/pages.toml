# Pages: about the guide, accessibility statement, AI in FAIRification and the helpers' pages. A helper page holds
# the text around an interactive tool that the page script adds. Field reference: docs/content-model.md.

[[page]]
id = "model"
menu = "tools"
group = "guidance"
icon = "object-group"
title = { cs = "Jak spolupráce vytváří FAIR data", en = "How collaboration enables FAIR data" }
description = { cs = "Kdo zajišťuje jednotlivé části správy dat a co si lidé a služby potřebují předat.", en = "Who provides each part of data management and what people and services need to pass on." }

[[page.section]]
id = "national-mapping"
heading = { cs = "Funkce a nástroje české NDI", en = "Functions and instruments in the Czech NDI" }
body = { cs = "Národní datová infrastruktura (NDI) propojuje politiku, komunitní rozhodování, technické služby, plánování, podporu a hodnocení. Každá část přijímá podklady a předává informace dalším aktérům.\n\nSchéma zachycuje stav k říjnu 2026.", en = "The national data infrastructure (NDI) connects policy, community decisions, technical services, planning, support and evaluation. Each part receives inputs and passes information to other actors.\n\nThe diagram shows the state as of October 2026." }
details = true

[[page.section]]
id = "metadata-architecture"
heading = { cs = "Oborový popis, společná metadata a jejich přenos", en = "Domain description, shared metadata and their transfer" }
body = { cs = "Soubory a úplný oborový popis zůstávají ve správě repozitáře a komunity. Společná metadata se mapují do Českého základního metadatového modelu (CCMM) a přenášejí do Národního metadatového adresáře (NMA) pro vyhledávání a vykazování. NMA výzkumná data neukládá.\n\nNárodní katalog repozitářů (NKR) popisuje služby, jejich zaměření, podmínky, schémata a slovníky. Využití těchto popisů v plánování a validaci je v mapování plánované. Identifikátory podporují dohledání, citování a vykazování.\n\nPlné šipky označují výměnu zavedenou alespoň pro jeden repozitář; přerušované šipky plánovanou výměnu. Schéma zachycuje stav k říjnu 2026.", en = "Files and full domain descriptions remain under repository and community control. Shared metadata map to the Czech Core Metadata Model (CCMM) and flow to the National Metadata Directory (NMA) for discovery and reporting. NMA does not store research data.\n\nThe National Catalogue of Repositories (NKR) describes services, their scope, conditions, schemas and vocabularies. Reuse of these descriptions in planning and validation is planned in the mapping. Identifiers support resolution, citation and reporting.\n\nSolid arrows mark exchanges implemented for at least one repository; dashed arrows mark planned exchanges. The diagram shows the state as of October 2026." }
details = true

[[page.section]]
heading = { cs = "Teoretický základ", en = "Theoretical basis" }
body = { cs = "Model vychází z rukopisu [[layers-seams-manuscript|Layers and seams of FAIR implementation in the Czech national research data infrastructure]] (v přípravě). Model rozlišuje funkce a předávání informací v národní infrastruktuře. Pomáhá vysvětlit návaznosti praktických kroků Průvodce; požadavky kontrol vycházejí z jejich uvedených publikovaných zdrojů.", en = "The model draws on [[layers-seams-manuscript|Layers and seams of FAIR implementation in the Czech national research data infrastructure]] (in preparation). The model distinguishes functions and information transfers in the national infrastructure. It helps explain how the Guide's practical steps connect; assessment requirements come from their cited published sources." }

[[page]]
id = "about"
menu = "about"
title = { cs = "O Průvodci", en = "About the Guide" }

[[page.section]]
heading = { cs = "Z čeho Průvodce vychází", en = "What the Guide builds on" }
body = { cs = "Průvodce vychází z [[analyza-fair-1.2|Analýzy a návrhu postupů k naplňování FAIR principů v rámci NRP/NDI]] (verze 1.2, NRP KA 5.1) a doplňuje ji o současný stav národních služeb. Každé doporučení odkazuje na publikovaný zdroj; v průzkumníku principů najdete všechny požadavky analýzy. Kdo s tématem začíná, najde úvod v [[training-overview|přehledových a úvodních kurzech EOSC CZ]].", en = "The Guide builds on the [[analyza-fair-1.2|Analysis and proposal of procedures for implementing the FAIR principles in NRP/NDI]] (version 1.2, NRP KA 5.1) and brings it up to date with the current state of national services. Every recommendation cites a published source; the principle explorer lists every requirement of the analysis. If you are new to the topic, the [[training-overview|EOSC CZ overview and introductory courses]] are a good start." }

[[page.section]]
id = "why"
heading = { cs = "Proč Průvodce vzniká", en = "Why the Guide exists" }
body = { cs = "Průvodce patří k budování národní infrastruktury pro FAIR data v iniciativě EOSC CZ. Její záměr shrnuje [[eosc-cz-vision|článek o vývoji českého ekosystému pro FAIR data]] a uspořádání [[ndi-architecture|architektura implementace iniciativy EOSC v ČR]]: páteří je Národní repozitářová platforma, v níž vznikají repozitáře, a doplňují ji oborové repozitáře a [[nma|Národní metadatový adresář]].\n\nInfrastruktura vzniká na základě shody komunity, jak popisuje [[ercim-community|článek v ERCIM News]]. Ukazuje také mezeru mezi znalostí a praxí, kterou zjistil [[survey-2025-data|národní průzkum správy výzkumných dat 2025]]: zhruba 58 % výzkumníků zná principy FAIR, dvě třetiny ale ukládají data hlavně na osobní počítač a přes 40 % neví, jaký repozitář použít. Právě s tím má Průvodce pomáhat.\n\nKteré služby NRP jsou k dispozici a co se chystá, ukazují roadmapy služeb NRP [[nrp-roadmap-2025|pro rok 2025]] a [[nrp-roadmap-2026|pro rok 2026]].", en = "The Guide is part of building the national infrastructure for FAIR data in the EOSC CZ initiative. Its aims are summarised in [[eosc-cz-vision|the paper on developing the Czech ecosystem for FAIR research data]], and its layout in [[ndi-architecture|the architecture of the EOSC initiative's implementation in the Czech Republic]]: the backbone is the National Repository Platform, in which repositories are created, complemented by domain repositories and the [[nma|National Metadata Directory]].\n\nThe infrastructure grows from community consensus, as [[ercim-community|an article in ERCIM News]] describes. It also shows the gap between awareness and practice found by [[survey-2025-data|the national survey of research data management 2025]]: about 58% of researchers know the FAIR principles, yet two thirds store data mainly on a personal computer and over 40% do not know which repository to use. That gap is what the Guide is meant to help close.\n\nWhich NRP services are available and what is planned is shown in the NRP service roadmaps [[nrp-roadmap-2025|for 2025]] and [[nrp-roadmap-2026|for 2026]]." }

[[page.section]]
heading = { cs = "Průvodce a FIP Dashboard", en = "The Guide and the FIP Dashboard" }
body = { cs = "Průvodce radí, co a proč udělat. [[fip-dashboard|FIP Dashboard]] je katalog zdrojů umožňujících FAIR (FER) a profilů FIP komunit; ukazuje, které zdroje ověřily NRP a EOSC CZ. Obě služby se na sebe odkazují a čtou se jako jeden celek.", en = "The Guide advises what to do and why. The [[fip-dashboard|FIP Dashboard]] is the catalogue of FAIR-enabling resources (FERs) and of communities' FIPs; it shows which resources NRP and EOSC CZ have verified. The two services link to each other and are meant to be read together." }

[[page.section]]
id = "support-route"
heading = { cs = "Kde hledat podporu", en = "Where to find support" }
body = { cs = "Začněte u institucionálního data stewarda a školení a podpory EOSC CZ. Dalším zdrojem je evropská iniciativa EOSC, například FAIR-IMPACT. Podle potřeby doplňujeme oborové a další mezinárodní iniciativy. U každého standardu uvádíme jeho původní zdroj; národní zaměření neomezuje, co lze v katalogu najít.", en = "Start with your institution’s data steward and EOSC CZ training and support. European EOSC initiatives, such as FAIR-IMPACT, are the next source. Disciplinary and other international initiatives supplement them where useful. Each standard retains its original source; the national focus does not limit what you can find in the catalogue." }

[[page.section]]
id = "credits"
heading = { cs = "Kdo se na Průvodci podílel", en = "Who contributed to the Guide" }
body = { cs = "Průvodce je výstupem klíčové aktivity 5.1 projektu Národní repozitářová platforma. Jeho obsah vychází z [[analyza-fair-1.2|Analýzy FAIR pro NRP/NDI]] a dalších publikovaných zdrojů; Průvodce je sestavuje, doplňuje o současný stav služeb a převádí do cesty a kontrol. Proto citace Průvodce uvádí jeho sestavovatele jako editora a autory analýzy uvádí zvlášť.", en = "The Guide is an output of key activity 5.1 of the National Repository Platform project. Its content builds on [[analyza-fair-1.2|the FAIR analysis for NRP/NDI]] and other published sources; the Guide compiles them, brings them up to date with the current state of services and turns them into a path and checks. That is why the Guide's citation names its compiler as editor and credits the authors of the analysis separately." }

[[page.section]]
heading = { cs = "Využití umělé inteligence", en = "Use of artificial intelligence" }
body = { cs = "Na přípravě obsahu a kódu se podíleli AI asistenti (Claude od Anthropic a Codex od OpenAI). U každé zastávky Průvodce ukazuje, z jakých zdrojů vychází a kdy se obsah měnil (úroveň „Zdroje a vznik obsahu“); kdo a s jakým nástrojem obsah připravil, zaznamenávají paradata ve znalostní bázi. Texty kontrolují lidé.", en = "AI assistants (Claude by Anthropic and Codex by OpenAI) contributed to the content and code. For each station, the Guide shows which sources it draws on and when the content changed (the “Sources and how this was made” level); who prepared the content and with which tool is recorded in the paradata of the knowledge base. People review the texts." }

[[page.section]]
id = "privacy"
heading = { cs = "Ochrana soukromí", en = "Privacy" }
body = { cs = "Odpovědi v sebehodnocení zůstávají jen ve vašem prohlížeči. Průvodce kontaktuje externí služby (například [[datacite|DataCite]] nebo [[fair-champion|FAIR Champion]]) jen tehdy, když kontrolu sami spustíte, a jen ty uvedené v nastavení stránky.", en = "Your self-check answers stay in your browser. The Guide contacts external services (such as [[datacite|DataCite]] or [[fair-champion|FAIR Champion]]) only when you start a check yourself, and only those listed in the page's settings." }

[[page]]
id = "accessibility"
menu = "about"
title = { cs = "Prohlášení o přístupnosti", en = "Accessibility statement" }

[[page.section]]
heading = { cs = "Stav souladu", en = "Compliance status" }
body = { cs = "Průvodce usiluje o soulad s pravidly WCAG 2.2 na úrovni AA, která pokrývají požadavky normy EN 301 549 a zákona č. 99/2019 Sb. Průvodce je ve fázi testování; soulad bude před vydáním ověřen automatickými testy a ručním testem ovládání klávesnicí.", en = "The Guide aims to conform to WCAG 2.2 level AA, which covers the requirements of EN 301 549 and Czech Act No. 99/2019 Coll. The Guide is in testing; conformance will be verified with automated tests and a manual keyboard test before release." }

[[page.section]]
heading = { cs = "Co Průvodce dělá pro přístupnost", en = "What the Guide does for accessibility" }
body = { cs = "Text má kontrast alespoň 4,5 : 1, stav služeb se sděluje textem a ikonou, ne jen barvou, rozbalovací části používají nativní prvky ovladatelné klávesnicí a stránka se přizpůsobí šířce 320 pixelů. Diagramy mají textový popis a doprovodný text se stejným významem.", en = "Text has a contrast of at least 4.5:1, service statuses are conveyed by text and icon rather than colour alone, expandable parts use native keyboard-operable elements, and the page reflows at a width of 320 pixels. Diagrams have a text description and are accompanied by text with the same meaning." }

[[page.section]]
heading = { cs = "Výjimka: interaktivní dokumentace API", en = "Exception: the interactive API documentation" }
body = { cs = "Interaktivní dokumentace API na adrese api/ je nástroj třetí strany pro vývojáře (Swagger UI) a správce Průvodce ji z požadavku na přístupnost vyjmul. Tytéž koncové body přístupně uvádí stránka [[page:machines|Data pro stroje]].", en = "The interactive API documentation at api/ is a third-party developer tool (Swagger UI), which the Guide's maintainer exempted from the accessibility requirement. The page [[page:machines|Data for machines]] lists the same endpoints accessibly." }

[[page.section]]
heading = { cs = "Zpětná vazba", en = "Feedback" }
body = { cs = "Narazíte-li na překážku, napište nám prostřednictvím úložiště Průvodce na GitHubu (github.com/motyc/eosc-fair-guide), nebo na adresu info@eosc.cz.", en = "If you meet a barrier, tell us through the Guide's repository on GitHub (github.com/motyc/eosc-fair-guide) or at info@eosc.cz." }

[[page]]
id = "live-check"
menu = "tools"
group = "tool"
icon = "magnifying-glass-chart"
description = { cs = "Ověří, kam vede DOI nebo Handle datové sady, a spustí vybrané testy FAIR.", en = "Checks where a dataset's DOI or Handle leads and runs selected FAIR tests." }
helper = false
title = { cs = "Kontrola datové sady", en = "Dataset check" }

[[page.section]]
heading = { cs = "Rychlá a hloubková kontrola", en = "Quick and deep check" }
action = { label = { cs = "Otevřít kontrolu datové sady", en = "Open the dataset check" }, href = "#check-dataset" }
body = { cs = "Vložte DOI, Handle nebo URL. Rychlá kontrola za několik vteřin ověří, kam identifikátor vede, a načte metadata z [[datacite|DataCite]]. Hloubková kontrola spustí vybrané testy nástroje [[fair-champion|FAIR Champion]]; běží jen na vaše vyžádání a může trvat i několik minut.\n\nKaždý test skončí jako splněno, nesplněno, neurčité, nebo bez výsledku, pokud služba neodpověděla. Test bez výsledku se nepočítá jako nesplněný požadavek a u výsledků vždy vidíte, kolik testů skutečně proběhlo. Výsledky vypovídají hlavně o nastavení repozitáře.", en = "Enter a DOI, Handle or URL. The quick check verifies within seconds where the identifier leads and loads the metadata from [[datacite|DataCite]]. The deep check runs selected [[fair-champion|FAIR Champion]] tests; it runs only when you ask for it and can take several minutes.\n\nEach test ends as passed, failed, indeterminate, or no result if the service did not respond. A test without a result never counts as a failed requirement, and the results always show how many tests actually ran. The results mainly reflect the repository's setup." }

[[page]]
id = "identifiers"
menu = "tools"
group = "tool"
icon = "fingerprint"
description = { cs = "Najde v textu ORCID, DOI, Handle a ROR a ukáže, ke komu nebo čemu vedou.", en = "Finds ORCID iDs, DOIs, Handles and ROR IDs in a text and shows whom or what they lead to." }
helper = true
title = { cs = "Ověřit identifikátory", en = "Verify identifiers" }

[[page.section]]
heading = { cs = "Jak pomocník funguje", en = "How the helper works" }
body = { cs = "Vložte text, například metadata připravená s pomocí AI. Pomocník v něm najde [[orcid|ORCID]], DOI, Handle a [[ror|ROR]] a přímo v prohlížeči ověří kontrolní číslice ORCID a ROR. Po kliknutí načte dostupné jméno nebo název z veřejného záznamu. Porovnejte jej s tím, koho nebo co chcete označit: platná kontrolní číslice ani existující záznam nezaručují správné přiřazení.", en = "Paste text, for example metadata drafted with AI. The helper finds [[orcid|ORCID]] iDs, DOIs, Handles and [[ror|ROR]] IDs and checks ORCID and ROR check digits in your browser. On request it retrieves the available name or title from the public record. Compare it with the person or object you intend to identify: a valid checksum or an existing record does not establish correct attribution." }

[[page]]
id = "citation"
menu = "tools"
group = "tool"
icon = "quote-right"
description = { cs = "Připraví citaci z DOI podle APA a českého stylu ČSN ISO 690 a export do BibTeX a RIS.", en = "Prepares a citation from a DOI in APA and Czech ISO 690 style, with BibTeX and RIS exports." }
helper = true
title = { cs = "Generovat citaci z DOI", en = "Generate citation from a DOI" }

[[page.section]]
heading = { cs = "Jak pomocník funguje", en = "How the helper works" }
body = { cs = "Vložte DOI registrované u [[datacite|DataCite]] nebo [[crossref-rest-api|Crossref]]. [[doi-citation-service|Citační služba DOI Foundation]] z jeho metadat připraví APA a [[csl-iso690-cs|český styl ČSN ISO 690 (autor–datum)]]. BibTeX a RIS poskytuje registrační agentura. Každý dostupný formát můžete zkopírovat nebo stáhnout.\n\nCitaci zkontrolujte podle stránky záznamu a pokynů časopisu či instituce, zejména autory, rok a verzi. Při nedostupnosti služby využijte doporučenou citaci na stránce záznamu nebo ji sestavte ručně z ověřených údajů.", en = "Enter a DOI registered with [[datacite|DataCite]] or [[crossref-rest-api|Crossref]]. The [[doi-citation-service|DOI Foundation citation service]] formats its metadata in APA and the [[csl-iso690-cs|Czech ISO 690 author–date style]]. BibTeX and RIS are supplied by the registration agency. You can copy or download each available format.\n\nCheck the citation against the record's page and the journal's or institution's instructions, especially its authors, year and version. If a service is unavailable, use the recommended citation on the record's page or put one together from verified details." }

[[page]]
id = "ai"
menu = "tools"
group = "guidance"
icon = "robot"
description = { cs = "Kde při FAIRifikaci pomůže AI a na co si dát pozor.", en = "Where AI helps in FAIRification and what to watch out for." }
title = { cs = "AI ve FAIRifikaci", en = "AI in FAIRification" }

[[page.section]]
heading = { cs = "Kde AI pomůže", en = "Where AI helps" }
body = { cs = "AI pomůže s návrhem a kontrolou plánu správy dat, se skripty pro zpracování dat, s kritérii pro výběr repozitáře, s návrhem README, abstraktu a datového slovníku, s překladem metadat mezi češtinou a angličtinou, s mapováním metadat, s klíčovými slovy, s hledáním dat, která je třeba citovat, s přípravou JSON-LD pro landing page, s vysvětlením výsledků testů FAIR a s podkladem pro profil FAIR implementace. Tipy ze všech kroků cesty, s tím, co zkontrolovat, a zadáním ke zkopírování, najdete níže.", en = "AI can help draft and review a data management plan, write data-processing scripts, set criteria for choosing a repository, draft a README, an abstract and a data dictionary, translate metadata between Czech and English, map metadata, suggest keywords, find the data a text should cite, prepare JSON-LD for a landing page, explain FAIR test results and prepare the basis of a FAIR Implementation Profile. The tips from every step of the path, with what to check and a prompt to copy, are below." }

[[page.section]]
heading = { cs = "Tři pravidla", en = "Three rules" }
body = { cs = "- Data: nepublikovanou práci vkládejte jen do služeb, které data neposílají mimo infrastrukturu a nevyužijí je k učení modelů, například do [[cerit-aiaas|AI v e-INFRA CZ (CERIT)]]. Citlivá a osobní data do AI chatu nevkládejte, ani do chatu e-INFRA CZ, který pro ně podle svých zásad není určen.\n- Ověření: identifikátory ([[orcid|ORCID]], DOI, [[ror|ROR]]), citace i hesla AI umí vymyslet, proto její výstup ověřte. Za výsledek odpovídáte vy; AI není autorem.\n- Transparentnost: uveďte, které nástroje AI jste podstatně použili a jak, a kde je to vhodné, zveřejněte i zadání.\n\nPravidla vycházejí z [[ec-genai-guidelines|živých zásad Evropské komise pro odpovědné využívání generativní AI ve výzkumu]].", en = "- Data: put unpublished work only into services that keep the data within the infrastructure and do not use them to train models, such as [[cerit-aiaas|AI in e-INFRA CZ (CERIT)]]. Do not put sensitive or personal data into an AI chat, not even the e-INFRA CZ chat, which by its own policy is not meant for them.\n- Checking: AI can make up identifiers ([[orcid|ORCID]], DOI, [[ror|ROR]]), citations and terms, so check what it produces. You are responsible for the result; AI is not an author.\n- Transparency: say which AI tools you used substantially and how, and where relevant publish the prompts too.\n\nThe rules follow the [[ec-genai-guidelines|European Commission's living guidelines on the responsible use of generative AI in research]]." }

[[page.section]]
heading = { cs = "Když pracuje AI agent", en = "When an AI agent does the work" }
body = { cs = "Agent, například asistent pro programování, sám čte soubory, spouští příkazy a mění data. Při přípravě tohoto Průvodce se osvědčilo:\n\n- Nejdřív plán: nechte agenta navrhnout plán (cíl, kroky, dotčené soubory, rizika a jak se výsledek ověří), přečtěte si ho a schvalte. Čas strávený plánem se vrátí.\n- Nástroje pro plánování: režim plánování, seznam úkolů nebo specifikace změny, kterou agent dodržuje a vy si ji můžete projít.\n- Deterministické kroky: kde to jde, svěřte opakovanou práci skriptu, který agent napíše a vy zkontrolujete, ne opakovaným dotazům. Skript dá pokaždé stejný výsledek a dá se zopakovat.\n- Kopie dat: pracujte na kopii, originály nechte jen pro čtení.\n- Git: každý ověřený krok uložte jako commit. Vidíte přesně, co agent změnil, a chybný krok vrátíte.\n- Malé kroky: při chybě hledejte příčinu, ne další záplatu; když ani třetí oprava nezabere, vraťte se k plánu.\n- Ověřujte všechno: testy, validátory metadat, porovnání před a po. Že agent napíše „hotovo“, nic nedokazuje.\n- Lidské brány: agentovi nevěřte. Kroky, které nejdou vzít zpět nebo míří ven (mazání, zveřejnění, odeslání dat, zápis do repozitáře), schvalujte sami, až uvidíte, co se skutečně zapíše.\n- Bezpečná pracovní stanice: agent pracuje s vašimi právy. Omezte ho na pracovní složku, povolte jen příkazy, které potřebuje, nesvěřujte mu hesla ani tokeny a obsah z internetu berte jako nedůvěryhodný, může obsahovat skryté pokyny.\n- Záznam kroků: zadání, model a nástroj, co se změnilo a jak jste to ověřili. Záznam patří k datům jako jejich původ a naplňuje transparentnost, kterou žádají [[ec-genai-guidelines|zásady Evropské komise]].", en = "An agent, such as a coding assistant, reads files, runs commands and changes data by itself. In making this Guide, this served well:\n\n- Plan first: have the agent propose a plan (goal, steps, files affected, risks and how the result will be checked), read it and approve it. Time spent on the plan pays back.\n- Planning tools: a planning mode, a task list or a change specification the agent follows and you can review.\n- Deterministic steps: wherever you can, give repeated work to a script the agent writes and you review, not to repeated prompts. A script gives the same result every time and can be rerun.\n- A copy of the data: work on a copy and keep the originals read-only.\n- Git: commit each verified step. You see exactly what the agent changed, and you can undo a wrong step.\n- Small steps: when something fails, look for the cause, not another patch; if a third fix does not work either, go back to the plan.\n- Validate everything: tests, metadata validators, comparisons before and after. An agent saying “done” proves nothing.\n- Human gates: do not trust the agent. Approve yourself the steps that cannot be undone or that go outside (deleting, publishing, sending data, writing to a repository), once you have seen what will actually be written.\n- A safe workstation: the agent works with your permissions. Confine it to the working folder, allow only the commands it needs, give it no passwords or tokens, and treat content from the internet as untrusted, since it may carry hidden instructions.\n- Log the steps: the prompt, the model and tool, what changed and how you checked it. The log belongs with the data as their provenance and gives the transparency the [[ec-genai-guidelines|European Commission's guidelines]] ask for." }

[[page.section]]
id = "cerit"
heading = { cs = "AI v e-INFRA CZ (CERIT)", en = "AI in e-INFRA CZ (CERIT)" }
body = { cs = "[[cerit-aiaas|AI jako služba]] od CERIT-SC běží v národní infrastruktuře e-INFRA CZ s otevřenými modely. Dotazy se nevyužívají k učení modelů a mimo infrastrukturu odchází jen dotaz pro vyhledávání na webu, když ho zapnete.\n\n- [[cerit-chat-ai|Chat]]: přihlásíte se přes e-INFRA CZ a potřebujete aktivní účet MetaCentra; studenti a zaměstnanci Masarykovy univerzity mají rychlou registraci.\n- [[cerit-ai-api|API]]: kompatibilní s OpenAI, pro skripty a datové postupy; klíč si vytvoříte v nastavení chatu.\n- [[cerit-ai-coding|Asistenti pro programování]]: Claude Code, Codex, OpenCode nebo rozšíření pro VS Code a JetBrains se připojí ke stejné službě.\n- JupyterHub: asistent pomáhá přímo v notebooku.\n\nChat podle [[cerit-ai-privacy|zásad ochrany dat CERIT-SC]] nesplňuje požadavky na zpracování citlivých, utajovaných ani osobních údajů a nahrané soubory v něm zatím nejde smazat. Potřebujete-li AI pro citlivá data, obraťte se nejdřív na CERIT-SC.", en = "CERIT-SC runs [[cerit-aiaas|AI as a Service]] in the national e-INFRA CZ infrastructure, with open models. Prompts are not used to train models, and nothing leaves the infrastructure except web search queries, when you turn web search on.\n\n- [[cerit-chat-ai|Chat]]: you log in through e-INFRA CZ and need an active MetaCentrum account; Masaryk University students and staff have a fast-track registration.\n- [[cerit-ai-api|API]]: OpenAI-compatible, for scripts and data workflows; you create the key in the chat's settings.\n- [[cerit-ai-coding|Coding assistants]]: Claude Code, Codex, OpenCode or the extensions for VS Code and JetBrains connect to the same service.\n- JupyterHub: an assistant helps right in the notebook.\n\nBy [[cerit-ai-privacy|CERIT-SC's data privacy policy]], the chat does not meet the requirements for processing sensitive, classified or personal data, and files uploaded to it cannot be deleted yet. If you need AI for sensitive data, contact CERIT-SC first." }
action = { label = { cs = "Otevřít chat AI e-INFRA CZ", en = "Open the e-INFRA CZ AI chat" }, href = "https://chat.ai.e-infra.cz/" }

[[page.section]]
id = "station-tips"
heading = { cs = "Tipy u jednotlivých kroků", en = "Tips at each step" }
body = { cs = "Všechny tipy z cesty na jednom místě. Tip určený jen pro jeden pohled nese jeho ikonu a název.", en = "All the tips from the path in one place. A tip meant for one view carries its icon and name." }

[[page]]
id = "machines"
menu = "header"
icon = "code"
title = { cs = "Data pro stroje", en = "Data for machines" }

[[page.section]]
id = "model-example"
heading = { cs = "Od požadavku k použitelnému zjištění", en = "From a requirement to a usable finding" }
body = { cs = "Průvodce sám předává informace mezi zdrojem, kontrolou a zaznamenanou revizí. Následující příklad propojuje skutečné záznamy a ukazuje, kde najdete jejich význam a rozsah. Širší souvislosti vysvětluje [[page:model|model vrstev a návazností]].", en = "The Guide itself carries information between a source, a check and a recorded revision. This example connects actual records and shows where to find their meaning and scope. The [[page:model|layers-and-seams model]] explains the wider context." }

[[page.section]]
body = { cs = "Všechno, co Průvodce obsahuje, jsou zároveň data, která čtou stroje: jedna znalostní báze a API sestavené z ní. Tato stránka ukazuje, jak je najít a použít, a předvádí na Průvodci samém, co doporučuje repozitářům a datovým sadám. Chcete-li vidět, jak strojově čitelný obsah vypadá v praxi, vyzkoušejte si to právě tady.", en = "Everything the Guide holds is also data that machines read: one knowledge base and an API built from it. This page shows how to find and use them, and demonstrates on the Guide itself what it recommends to repositories and datasets. If you want to see what machine-readable content looks like in practice, try it out right here." }

[[page.section]]
id = "tasks"
heading = { cs = "Co hledáte", en = "What you are looking for" }
body = { cs = "Vyberte podle toho, co chcete udělat; každý odkaz vede na skutečná data Průvodce.", en = "Choose by what you want to do; every link leads to the Guide's real data." }

[[page.section]]
id = "practice"
heading = { cs = "Jak Průvodce uplatňuje vlastní doporučení", en = "How the Guide applies its own advice" }
body = { cs = "Strojově čitelný obsah se dá najít, přečíst a ověřit bez člověka. Průvodce k tomu používá tytéž prostředky, které doporučuje.\n\n[[fair-signposting|FAIR Signposting]]: hlavička každé stránky nese typované odkazy na metadata, API, licenci a editora a linkset je vypisuje v jednom souboru, takže je stroj najde, aniž by znal adresy. Které to jsou, ukazuje tabulka níže.\n\nMetadata v komunitním standardu: znalostní báze je [[ro-crate|RO-Crate 1.2]], odpovídá [[profile|profilu Průvodce]] a profilu [[process-run-crate|Process Run Crate]] a validátor ji ověřuje při každé změně. Licence CC BY 4.0 je v ní uvedena strojově čitelně.\n\nProvenience: každá změna obsahu je zaznamenaná jako akce s autorem, použitým nástrojem včetně modelu AI a zdroji, z nichž vychází; v katalogu ji najdete mezi změnami obsahu.\n\nVýsledky testů: uložený výsledek kontroly je sada výsledků testů ve slovníku [[ftr|FAIR Testing Resources (FTR)]], který popisuje benchmarky, metriky, testy a jejich výsledky; každý výsledek odkazuje na svůj test v API Průvodce.\n\nAdresy: záznamy na sebe odkazují relativně, takže obsah bude fungovat i na trvalé adrese, která se teprve stanoví.", en = "Machine-readable content can be found, read and verified without a person. The Guide does this with the same means it recommends.\n\n[[fair-signposting|FAIR Signposting]]: the head of every page carries typed links to the metadata, the API, the licence and the editor, and a linkset lists them in one file, so a machine finds them without knowing their addresses. The table below shows which they are.\n\nMetadata in a community standard: the knowledge base is an [[ro-crate|RO-Crate 1.2]], conforms to [[profile|the Guide's profile]] and to the [[process-run-crate|Process Run Crate]] profile, and a validator checks it at every change. The CC BY 4.0 licence is stated in it in machine-readable form.\n\nProvenance: every content change is recorded as an action with its author, the tool used, including any AI model, and the sources it draws on; you find it in the catalogue among the content changes.\n\nTest results: a saved check result is a test result set in the [[ftr|FAIR Testing Resources (FTR)]] vocabulary, which describes benchmarks, metrics, tests and their results; each result names its test in the Guide's API.\n\nAddresses: records link each other relatively, so the content will work at the permanent address that is still to be settled." }

[[page.section]]
id = "endpoints"
heading = { cs = "Koncové body API", en = "API endpoints" }
body = { cs = "Tytéž koncové body, které ukazuje interaktivní dokumentace API, jako přístupná tabulka. Každá kolekce má seznam a záznam pro každou položku; kontext JSON-LD říká, co která vlastnost znamená.", en = "The same endpoints the interactive API documentation shows, as an accessible table. Each collection has a list and a record for each entry; the JSON-LD context says what each property means." }

[[page]]
id = "software"
menu = "tools"
group = "guidance"
icon = "laptop-code"
title = { cs = "Zveřejnit výzkumný software", en = "Publish research software" }
description = { cs = "Jak připravit skript, výpočetní notebook nebo aplikaci, aby je mohl použít i někdo další.", en = "Prepare a script, computational notebook or application for someone else to use." }

[[page.section]]
id = "version"
heading = { cs = "Verzujte kód a sdílejte jej veřejně", en = "Version the code and share it publicly" }
body = { cs = "Kód spravujte v systému [[git|Git]] od prvního řádku. Každou ucelenou změnu uložte jako samostatný commit s krátkým popisem; historie pak ukazuje, co a kdy se změnilo, a nechtěný krok lze vrátit. Verzování není jen záloha: umožňuje spolupracovat a dohledat, ze které verze vznikl výsledek.\n\nKód zveřejněte ve veřejném repozitáři na [[res/tool/github|GitHubu]] nebo [[res/tool/gitlab|GitLabu]]. Veřejný repozitář usnadní spolupráci, připomínky i opakované použití. Velké soubory, které se do Gitu nehodí, ukládejte přes Git LFS.", en = "Keep the code in [[git|Git]] from the first line. Commit each coherent change separately with a short message; the history then shows what changed and when, and an unwanted step can be reverted. Version control is more than a backup: it lets others collaborate and lets you trace which version produced a result.\n\nPublish the code in a public repository on [[res/tool/github|GitHub]] or [[res/tool/gitlab|GitLab]]. A public repository makes collaboration, feedback and reuse easier. Store large files that do not belong in Git with Git LFS." }

[[page.section]]
id = "start"
heading = { cs = "Připravte vydání, které lze spustit", en = "Prepare a release others can run" }
body = { cs = "Vyberte konkrétní verzi kódu a popište, co dělá a pro jaká data je určena. V návodu uveďte potřebné prostředí, závislosti a postup spuštění. Přidejte malý příklad se vstupy a očekávaným výsledkem; u výpočetního notebooku také pořadí spuštění buněk. Nechte kolegu příklad vyzkoušet podle návodu.\n\nS přípravou může pomoci institucionální data steward. [[training-processing|Školení EOSC CZ ke zpracování dat]] je jedním z míst, kde hledat podporu.", en = "Choose a specific code version and describe what it does and which data it is intended for. Document the required environment, dependencies and execution steps. Include a small example with inputs and expected results; for a computational notebook, include the order of running cells. Ask a colleague to try the example using the instructions.\n\nYour institution’s data steward can help with preparation. [[training-processing|EOSC CZ training for data processing]] is one place to look for support." }
action = { label = { cs = "Projít kontrolu softwaru", en = "Open the software check" }, href = "#check-software" }

[[page.section]]
id = "preserve"
heading = { cs = "Uložte a propojte konkrétní vydání", en = "Deposit and link a specific release" }
body = { cs = "Vývojový repozitář ukazuje práci na projektu. Pro citování a opakované použití uchovejte také konkrétní vydání zdrojového kódu s popisem. Zvolte oborový nebo institucionální repozitář, který software přijímá, případně obecný repozitář; jednou z možností je [[zenodo-software-guide|uložení softwaru v Zenodo]]. Záznam propojte s daty a článkem, ke kterým software patří.\n\nDalší možností zachování kódu je [[software-heritage|Software Heritage]]. Jeho [[software-heritage-guide|návod]] vysvětluje archivaci a odkazy SWHID na konkrétní obsah. Pokud máte DOI vydání i SWHID kódu, uveďte jejich vzájemnou vazbu a ověřte, že oba odkazy vedou na správnou verzi.", en = "The development repository shows work on the project. For citation and reuse, also preserve a specific source-code release with its description. Choose a disciplinary or institutional repository that accepts software, or a general repository; one option is [[zenodo-software-guide|depositing software in Zenodo]]. Link the record to the data and article associated with the software.\n\n[[software-heritage|Software Heritage]] is another option for preserving code. Its [[software-heritage-guide|guide]] explains archival and SWHID references to specific content. If you have both a release DOI and a code SWHID, record their relationship and check that both references identify the correct version." }

[[page.section]]
id = "credit"
heading = { cs = "Uveďte licenci a citační pokyny", en = "State the licence and citation instructions" }
body = { cs = "Uveďte autory, název a verzi softwaru a přidejte doporučenou citaci. Soubor CITATION.cff je jedním ze způsobů, jak citační údaje předat uživatelům i nástrojům. Při použití cizího softwaru se řiďte citačními pokyny jeho autorů a citujte verzi, kterou jste skutečně použili.\n\nLicenci kódu uveďte odděleně od licencí dat a dokumentace. U převzatých součástí zachovejte jejich licenční údaje a před zveřejněním vyřešte nejasná práva s institucí. Podrobnosti najdete v zastávkách [[station:licence|Licence a přístup]] a [[station:citation|Citace a opakované užití]].", en = "Name the authors, software title and version, and provide a recommended citation. CITATION.cff is one way to share citation information with users and tools. When using other people’s software, follow their citation instructions and cite the version you actually used.\n\nState the code licence separately from the licences of data and documentation. Retain licence information for reused components and resolve unclear rights with your institution before publication. Continue to [[station:licence|Licence and access]] and [[station:citation|Citation and reuse]] for more detail." }

[[page.section]]
id = "practice"
heading = { cs = "Jak posuzovat další praxi", en = "Assessing further practice" }
body = { cs = "[[fair4rs|FAIR4RS]] přizpůsobuje principy FAIR softwaru; [[frsm|FAIR-IMPACT FRSM 1.0]] k nim nabízí metriky. Samostatná kontrola v Průvodci z nich vybírá úvodní otázky a v rozšířené části zpřístupňuje všechny metriky. [[code-principles|CODE]] přidává praktická doporučení pro vývoj a spolupráci, která lze zavádět postupně.\n\nTým vyvíjející otevřený software může využít také [[openssf-best-practices|OpenSSF Best Practices]]: kritéria pro vývoj, testování, údržbu a zabezpečení projektu. Případný odznak je dobrovolnou sebecertifikací. Nepotřebujete jej k uložení softwaru ani jím nedokládáte splnění FAIR4RS.", en = "[[fair4rs|FAIR4RS]] adapts the FAIR principles to software; [[frsm|FAIR-IMPACT FRSM 1.0]] supplies assessment metrics. The Guide’s separate check offers introductory questions and makes all the metrics available in the extended view. [[code-principles|CODE]] adds practical development and collaboration recommendations that can be adopted gradually.\n\nTeams developing open software can also use [[openssf-best-practices|OpenSSF Best Practices]]: criteria for development, testing, maintenance and project security. Any badge is voluntary self-certification. It is not needed to deposit software and does not establish FAIR4RS conformance." }
details = true

[[page.section]]
id = "software-example"
heading = { cs = "Příklad: software tohoto Průvodce", en = "Example: this Guide’s software" }
body = { cs = "Průvodce odděluje popis softwaru od popisu jeho [[page:machines|obsahového datasetu]]. Kód má licenci MIT, obsah CC BY 4.0. Soubor CITATION.cff uvádí autora a verzi; README popisuje sestavení a závislosti. Zdrojový kód, dokumentace a ověřovací postupy jsou v repozitáři projektu.", en = "The Guide describes its software separately from its [[page:machines|content dataset]]. Code uses MIT and content uses CC BY 4.0. CITATION.cff names the author and version; the README describes the build and dependencies. Source code, documentation and verification procedures are in the project repository." }
details = true

[[page.section]]
id = "workflows"
heading = { cs = "Prostředí a výpočetní postup", en = "Environment and computational workflow" }
body = { cs = "Uložte s kódem definici prostředí [[conda|Conda]], kontejnerový recept a [[container-images|digest obrazu]], parametry a malý příklad. Samotný zápisník [[jupyter|Jupyter]] nezachytí automaticky všechny závislosti. Kroky lze vyjádřit v [[cwl|CWL]], [[nextflow|Nextflow]] nebo [[snakemake|Snakemake]]; národní možnosti zahrnují [[galaxy-cz|Galaxy]], [[jupyterhub-cerit|JupyterHub CERIT]] a [[lexis|LEXIS]].\n\nPro publikaci postupu slouží [[workflowhub|WorkflowHub]] a popis [[workflow-ro-crate|Workflow RO-Crate]]. Volte vzájemně kompatibilní verze profilů a formátu: Workflow RO-Crate 1.1 vychází z RO-Crate 1.3. Záznam postupu a jeho souborů se liší od záznamu konkrétního běhu s použitými vstupy a výsledky.", en = "Keep a [[conda|Conda]] environment definition, container recipe and [[container-images|image digest]], parameters and a small example with the code. A [[jupyter|Jupyter]] notebook does not automatically capture every dependency. Steps can be described in [[cwl|CWL]], [[nextflow|Nextflow]] or [[snakemake|Snakemake]]; Czech options include [[galaxy-cz|Galaxy]], [[jupyterhub-cerit|JupyterHub CERIT]] and [[lexis|LEXIS]].\n\nUse [[workflowhub|WorkflowHub]] and a [[workflow-ro-crate|Workflow RO-Crate]] description to publish the workflow. Select compatible profile and format versions: Workflow RO-Crate 1.1 builds on RO-Crate 1.3. A description of the workflow and its files is distinct from a record of one execution with its inputs and outputs." }

[[page]]
id = "notebooks"
menu = "tools"
group = "guidance"
icon = "book-open"
title = { cs = "Vést laboratorní a terénní deník", en = "Keep a laboratory or field notebook" }
description = { cs = "Záznam pozorování, postupů a změn, ze kterého lze později sestavit dokumentaci dat.", en = "Record observations, procedures and changes that can later inform data documentation." }

[[page.section]]
id = "start"
heading = { cs = "Zaznamenávejte průběh výzkumu", en = "Record the research as it happens" }
body = { cs = "Deník pomáhá vám i kolegům zjistit, co se při výzkumu skutečně dělo. Ke každému záznamu připojte datum, autora, postup, označení vzorků a odkazy na soubory. Opravy ponechte dohledatelné místo přepsání původního záznamu. Zapište také odchylky od postupu a jejich důvody.\n\nElektronický laboratorní či terénní deník se často označuje zkratkou ELN či EFN. Základní možnosti představuje [[eosc-notebooks|školení EOSC CZ o laboratorních a terénních denících]].", en = "A notebook helps you and your colleagues establish what actually happened during research. Include the date, author, procedure, sample identifiers and file links in each record. Keep corrections traceable rather than overwriting the original record. Also record departures from the procedure and their reasons.\n\nElectronic laboratory and field notebooks are often abbreviated ELN and EFN. [[eosc-notebooks|EOSC CZ training on laboratory and field notebooks]] introduces the available approaches." }

[[page.section]]
id = "preserve"
heading = { cs = "Předem ověřte přístup a export", en = "Check access and export in advance" }
body = { cs = "S týmem a institucionální podporou ověřte, kdo smí záznamy číst a měnit, jak se zálohují a zda lze exportovat soubory i historii změn. Pro práci v terénu si vyzkoušejte také zápis bez sítě a následný přenos záznamů. Vyberte řešení, které odpovídá vašemu postupu, ne jen seznamu funkcí.\n\nDeník slouží každodenní práci. Pro dlouhodobé uložení a zveřejnění výsledků připravte výběr záznamů a souborů do [[station:repository|repozitáře]], včetně vazeb na [[page:provenance|původ dat a důvody rozhodnutí]].", en = "With your team and institutional support, check who can read and edit records, how they are backed up and whether files and change history can be exported. For fieldwork, also try recording offline and transferring records afterwards. Choose a solution that fits your workflow, rather than just a feature list.\n\nThe notebook supports daily work. For long-term preservation and publication, prepare the relevant records and files for a [[station:repository|repository]], including links to [[page:provenance|data provenance and reasons for decisions]]." }

[[page.section]]
id = "national"
heading = { cs = "Podpora v projektu OS II", en = "Support through OS II" }
body = { cs = "Projekt [[osii-study|OS II]] připravuje podporu laboratorních i terénních deníků: integraci systémů [[kadi4mat|Kadi4Mat]] a [[elabftw|eLabFTW]], národní instance pro instituce bez vlastního řešení a metodiku nasazení. Propojení deníků s repozitáři má usnadnit přenos dat a metadat a omezit jejich opakované zadávání.", en = "The [[osii-study|OS II]] project is developing support for laboratory and field notebooks: integration of [[kadi4mat|Kadi4Mat]] and [[elabftw|eLabFTW]], national instances for institutions without their own solution, and deployment guidance. Connecting notebooks to repositories will help transfer data and metadata and reduce repeated entry." }

[[page.section]]
id = "examples"
heading = { cs = "Příklady a otázky pro výběr", en = "Examples and selection questions" }
body = { cs = "Výpočetní notebook propojuje kód, vstupy a výsledky výpočtu. Týmový laboratorní deník navíc potřebuje řešit společné záznamy, oprávnění a například evidenci vzorků. [[cdsc-eln|Jupyter jako deník]] od komunity data stewardů je příkladem pro výpočetní práci; ne každému týmu však postačí.\n\nDoplňující [[cambridge-notebooks|doporučení Univerzity v Cambridge]] pomohou sestavit otázky pro institucionální IT podporu a dodavatele systému.", en = "A computational notebook connects code, inputs and computational results. A team laboratory notebook also needs to handle shared records, permissions and, for example, sample tracking. The data steward community’s [[cdsc-eln|Jupyter notebook example]] illustrates computational work; it will not meet every team’s needs.\n\nSupplementary [[cambridge-notebooks|University of Cambridge guidance]] can help formulate questions for institutional IT support and system providers." }
details = true

[[page]]
id = "provenance"
menu = "tools"
group = "guidance"
icon = "diagram-project"
title = { cs = "Zaznamenat původ dat a rozhodnutí", en = "Capture provenance and decisions" }
description = { cs = "Co zaznamenat, aby šlo dohledat vznik výsledku i pochopit důvody jeho podoby.", en = "Record how a result was produced and why it took its particular form." }

[[page.section]]
id = "start"
heading = { cs = "Zachovejte postup i jeho zdůvodnění", en = "Keep the procedure and its reasons" }
body = { cs = "Záznam původu dat, tedy provenience, propojuje výsledek se vstupy, lidmi, nástroji a kroky zpracování. Ukazuje například, ze kterého souboru a kterou verzí skriptu vznikla publikovaná tabulka.\n\nParadata zachycují také podklady a důvody rozhodnutí: proč jste zvolili metodu, vyřadili měření nebo dali přednost určité interpretaci a jaká zůstává nejistota. Vymezení pojmů se mezi obory liší. Při dokumentování pomáhá položit si obě otázky: „Jak výsledek vznikl?“ a „Proč jsme postupovali takto?“", en = "Data provenance connects a result to its inputs, people, tools and processing steps. It can show, for example, which file and script version produced a published table.\n\nParadata also record the evidence and reasons behind decisions: why you chose a method, excluded measurements or preferred an interpretation, and what uncertainty remains. Definitions vary across disciplines. When documenting work, it helps to ask both: “How was the result produced?” and “Why did we proceed this way?”" }

[[page.section]]
id = "example"
heading = { cs = "Příklad: měření mimo rozsah přístroje", en = "Example: measurements outside the instrument range" }
body = { cs = "Záznam postupu: „Tabulka vznikla z původních měření skriptem verze 2. Skript vyřadil hodnoty mimo kalibrační rozsah; původní soubor zůstal zachován.“\n\nZdůvodnění: „Mimo kalibrační rozsah neposkytuje přístroj spolehlivé hodnoty. Použili jsme rozsah doložený kalibračním protokolem a zaznamenali počet vyřazených měření.“\n\nZachovejte vstupní soubor, použitou verzi skriptu a odkaz na kalibrační protokol. Popis a zdůvodnění propojte s výstupní tabulkou, například v README nebo v deníku. Podrobnosti pak odkažte z [[station:metadata|metadat datové sady]].", en = "Procedure record: “The table was produced from the original measurements using script version 2. The script excluded values outside the calibration range; the original file was retained.”\n\nReason: “The instrument does not provide reliable values outside its calibration range. We used the range documented in the calibration report and recorded the number of excluded measurements.”\n\nRetain the input file, the script version used and a link to the calibration report. Connect the description and reasons to the output table, for example in a README or notebook. Link that detail from the [[station:metadata|dataset metadata]]." }

[[page.section]]
id = "national"
heading = { cs = "Společná pravidla a infrastruktura", en = "Shared rules and infrastructure" }
body = { cs = "Výzkumník zapisuje průběh práce; steward pomáhá převést záznam do dokumentace a metadat. Repozitář zachovává vazby mezi verzemi a souvisejícími objekty. Komunita může určit, co se v daném oboru zaznamenává a jakým způsobem.\n\nProjekt [[osii-study|OS II]] připravuje propojené sledování původu dat v denících a repozitářích, aby záznam o vzniku a zpracování dat zůstal dohledatelný i při jejich přenosu. Využívá k tomu standard W3C PROV pro popis původu a společný model provenience CPM (Common Provenance Model). Pro zdůvodňování interpretace a práci s nejistotou je oborovým příkladem [[london-charter|Londýnská charta]] pro vizualizaci kulturního dědictví.", en = "Researchers record their work; stewards help turn that record into documentation and metadata. Repositories retain relationships between versions and related objects. Communities can define what their discipline records and how.\n\nThe [[osii-study|OS II]] project is developing connected provenance tracking across notebooks and repositories so that records of how data were produced and processed remain traceable when data move between systems. It uses the W3C PROV provenance standard and the Common Provenance Model (CPM). The [[london-charter|London Charter]] for cultural heritage visualisation provides a disciplinary example of documenting interpretation and uncertainty." }

[[page.section]]
id = "practice"
heading = { cs = "Příklad: změny v tomto Průvodci", en = "Example: changes to this Guide" }
body = { cs = "U zastávek najdete podklady doporučení a historii změn. [[page:machines|Strojově čitelný záznam Průvodce]] propojuje odpovědného člověka, použité nástroje, zdroje a změněné položky. Popis změny uvádí také její důvod; například připomínku, kvůli které bylo doporučení upraveno.\n\nZáznam používá formát Process Run Crate, který propojuje provedenou změnu s jejími vstupy, výsledky a odpovědným člověkem.", en = "Stations show the sources behind advice and a change history. The [[page:machines|guide’s machine-readable record]] connects the responsible person, tools used, sources and changed items. The change description also gives the reason, such as the feedback that led to revised advice.\n\nThe record uses Process Run Crate, which connects a change to its inputs, results and responsible person." }
details = true

[[page]]
id = "fdo"
menu = "tools"
group = "guidance"
icon = "cubes"
title = { cs = "Pracovat s FAIR digitálními objekty", en = "Work with FAIR Digital Objects" }
description = { cs = "Jak identifikátory, typy a metadata pomáhají programům pracovat s výzkumnými objekty.", en = "How identifiers, types and metadata help programs work with research objects." }

[[page.section]]
id = "start"
heading = { cs = "Co přidává FAIR digitální objekt", en = "What a FAIR Digital Object adds" }
body = { cs = "Člověk může otevřít stránku datové sady a vyhledat soubory, popis a licenci. Program potřebuje stejné informace získat předvídatelným způsobem. FAIR digitální objekt (FDO) proto propojuje trvalý identifikátor s popisem typu objektu a se strukturovaným záznamem, který odkazuje na obsah a metadata.\n\nZáznam se řídí profilem: dohodou o tom, které údaje obsahuje a co znamenají. [[fdo-overview|Úvod FDO Forum]] vysvětluje tento přístup a roli poskytované infrastruktury.", en = "A person can open a dataset page and find its files, description and licence. A program needs a predictable way to obtain the same information. A FAIR Digital Object (FDO) therefore connects a persistent identifier to the object’s type and a structured record linking its content and metadata.\n\nThe record follows a profile: an agreement on which information it contains and what that information means. The [[fdo-overview|FDO Forum introduction]] explains this approach and the role of supporting infrastructure." }

[[page.section]]
id = "researcher"
heading = { cs = "Co připraví výzkumník", en = "What researchers prepare" }
body = { cs = "Připravte popis dat, licenci, vazby na související výsledky a dokumentaci jejich vzniku. To je užitečné i v repozitáři, který FDO zatím nepodporuje.\n\nPokud potřebujete zveřejnit výsledek jako FDO, ověřte s repozitářem, zda tuto možnost nabízí a které údaje od vás potřebuje. Správu PID a registrů typů zpravidla zajišťují poskytovatelé služeb s odbornou komunitou; výzkumník tuto infrastrukturu běžně nebuduje.", en = "Prepare the data description, licence, relationships to related results and documentation of how they were produced. These are useful even in a repository that does not yet support FDOs.\n\nIf you need to publish a result as an FDO, ask the repository whether it offers that option and what information it needs from you. Service providers and disciplinary communities normally manage PIDs and type registries; researchers do not usually build this infrastructure." }

[[page.section]]
id = "infrastructure"
heading = { cs = "Ověření pro poskytovatele a komunity", en = "Verification for providers and communities" }
body = { cs = "[[fdo-specification|FDO Requirement Specifications 3.0]] z 12. ledna 2023 je navrhované doporučení (Proposed Recommendation). Samostatná kontrola připravenosti sleduje jeho čtyři oblasti:\n\n- Obecná pravidla: identifikace objektů, vazby a strojové zpracování.\n- Služba PID: získání záznamu z identifikátoru, spolehlivost a zabezpečení.\n- Vrstva FDO: profily, atributy a registrované definice typů.\n- Odkazované zdroje: zásady FAIR a důvěryhodnost jejich poskytovatelů.\n\nRepozitář, poskytovatel PID a komunita si rozdělí, kdo doloží jednotlivé části. Kontrola začíná šesti otázkami a v rozšířené části obsahuje všech 34 požadavků; slouží k přípravě a evidenci dokladů.\n\nPosuzujte vždy určenou verzi a profil. Specifikace 3.0 zahrnuje požadavky na operace s objekty, zatímco současný úvod FDO Forum je popisuje jako volitelné rozšíření. Výsledek této kontroly není certifikací.", en = "[[fdo-specification|FDO Requirement Specifications 3.0]], dated 12 January 2023, is a Proposed Recommendation. The separate readiness check follows its four areas:\n\n- General rules: object identification, relationships and machine processing.\n- PID service: obtaining a record from an identifier, reliability and security.\n- FDO layer: profiles, attributes and registered type definitions.\n- Referenced resources: FAIR principles and the trustworthiness of their providers.\n\nThe repository, PID provider and community allocate responsibility for evidence across these areas. The check starts with six questions and includes all 34 requirements in its extended view; it supports preparation and evidence recording.\n\nAlways assess a specified version and profile. Specification 3.0 includes requirements for operations on objects, while the current FDO Forum introduction describes operations as an optional extension. This check does not provide certification." }
details = true

action = { label = { cs = "Projít připravenost FDO", en = "Open FDO readiness" }, href = "#check-fdo" }

[[page.section]]
id = "example"
heading = { cs = "Co ukazuje tento Průvodce", en = "What this Guide demonstrates" }
body = { cs = "[[page:machines|RO-Crate Průvodce]] propojuje obsah, metadata, licence a záznamy změn. Program tak může rozpoznat typy položek a jejich vztahy. Jde o příklad strojově čitelného balíčku.\n\nPro označení FDO by bylo třeba doložit také podporovaný profil PID a návaznou infrastrukturu typů. Samotný RO-Crate ani přidělení DOI takovým dokladem nejsou.", en = "The [[page:machines|guide’s RO-Crate]] connects content, metadata, licences and change records. A program can recognise item types and relationships. It is an example of a machine-readable package.\n\nCalling it an FDO would also require evidence of the supported PID profile and type infrastructure. RO-Crate packaging or assignment of a DOI alone does not provide that evidence." }
details = true

[[page]]
id = "licence-compatibility"
menu = "tools"
group = "guidance"
icon = "scale-balanced"
description = { cs = "Tabulka NRP pro kombinování obsahu pod licencemi Creative Commons.", en = "The NRP table for combining content under Creative Commons licences." }
title = { cs = "Slučitelnost licencí Creative Commons", en = "Creative Commons licence compatibility" }

[[page.section]]
heading = { cs = "Dvě licence a nový odvozený obsah", en = "Two licences and new adapted content" }
body = { cs = "Tabulka přebírá slučitelnost dvou vstupních děl při zpracování do nového odvozeného díla podle [[copyright-licences|příručky NRP Autorská práva a licence]], verze 1.0, s. 14 (CC BY 4.0). Najděte licenci prvního díla v řádku a druhého ve sloupci. Ano znamená, že tabulka kombinaci připouští; výsledná licence musí splnit podmínky obou vstupů. Ne znamená, že ji pro tento způsob zpracování nepřipouští. Na telefonu lze tabulku posunout do stran.\n\n| Licence vstupních děl | CC BY | CC BY-SA | CC BY-NC | CC BY-ND | CC BY-NC-SA | CC BY-NC-ND | CC0 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| CC BY | ano | ano | ano | ne | ano | ne | ano |\n| CC BY-SA | ano | ano | ne | ne | ne | ne | ano |\n| CC BY-NC | ano | ne | ano | ne | ano | ne | ano |\n| CC BY-ND | ne | ne | ne | ne | ne | ne | ne |\n| CC BY-NC-SA | ano | ne | ano | ne | ano | ne | ano |\n| CC BY-NC-ND | ne | ne | ne | ne | ne | ne | ne |\n| CC0 | ano | ano | ano | ne | ano | ne | ano |\n\nTabulka neřeší pouhé šíření nezměněných souborů vedle sebe ani softwarové licence. Ověřte přesné verze licencí, uvedení původu, nekomerční omezení a zachování licence. ND omezuje sdílení upravených děl. Zákonné výjimky, osobní údaje a další práva posuzujte samostatně; CC0 není oprávnění zveřejnit chráněná data. Pro software použijte [[nrp-license-selector|NRP License Selector]].", en = "The table reproduces compatibility of two input works when adapting them into new content from the [[copyright-licences|NRP handbook Copyright and licences]], version 1.0, p. 14 (CC BY 4.0). Find the first work's licence in a row and the second in a column. Yes means the table permits combining them; the output licence must satisfy both inputs' conditions. No means it does not permit this kind of adaptation. On a phone, scroll the table sideways.\n\n| Input works' licences | CC BY | CC BY-SA | CC BY-NC | CC BY-ND | CC BY-NC-SA | CC BY-NC-ND | CC0 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| CC BY | yes | yes | yes | no | yes | no | yes |\n| CC BY-SA | yes | yes | no | no | no | no | yes |\n| CC BY-NC | yes | no | yes | no | yes | no | yes |\n| CC BY-ND | no | no | no | no | no | no | no |\n| CC BY-NC-SA | yes | no | yes | no | yes | no | yes |\n| CC BY-NC-ND | no | no | no | no | no | no | no |\n| CC0 | yes | yes | yes | no | yes | no | yes |\n\nThe table does not cover simply redistributing unchanged files alongside one another or software licences. Check exact licence versions, attribution, non-commercial restrictions and share-alike terms. ND restricts sharing adapted works. Assess statutory exceptions, personal data and other rights separately; CC0 does not authorize disclosure of protected data. For software, use the [[nrp-license-selector|NRP License Selector]]." }
