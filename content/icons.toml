why = "circle-question"
sources = "book"
check = "list-check"
cite = "quote-right"
identifier = "fingerprint"
ai = "robot"
model = "object-group"
lifecycle = "arrows-spin"
collapse = "angles-right"
expand = "angles-left"
copy = "copy"
