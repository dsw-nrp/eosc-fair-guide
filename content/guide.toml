# Guide metadata and shared vocabularies. Field reference: docs/content-model.md.

[guide]
version = "0.1.0-dev"
releaseStatus = "testing"
testingNotice = { cs = "Průvodce je ve fázi testování. Obsah se může měnit a zatím jej neschválila iniciativa EOSC CZ.", en = "This guide is in testing. Its content may change, and the EOSC CZ initiative has not agreed it yet." }
datePublished = 2026-10-08
name = { cs = "Průvodce FAIR daty", en = "FAIR data guide" }
description = { cs = "Interaktivní průvodce, který vede výzkumníky, datové stewardy, správce repozitářů a oborové komunity od plánu projektu k FAIR datům. Vychází z Analýzy a návrhu postupů k naplňování FAIR principů v rámci NRP/NDI (verze 1.2) a odráží současný stav národních služeb.", en = "An interactive guide that leads researchers, data stewards, repository administrators and research communities from the project plan to FAIR data. It builds on the Analysis and proposal of procedures for implementing the FAIR principles in NRP/NDI (version 1.2) and reflects the current state of national services." }
keywords = [
  { cs = "FAIR principy", en = "FAIR principles" },
  { cs = "výzkumná data", en = "research data" },
  { cs = "správa výzkumných dat", en = "research data management" },
  { cs = "repozitáře", en = "repositories" },
  { cs = "EOSC CZ", en = "EOSC CZ" },
]
url = "https://github.com/motyc/eosc-fair-guide"
vocabularyBase = "https://motyc.github.io/eosc-fair-guide/terms#"
profile = "https://motyc.github.io/eosc-fair-guide/profile/0.1"
freshnessDays = 180
authors = ["david-novak"]
contributors = []
publisher = "cesnet"
funder = "nrp"
isBasedOn = ["analyza-fair-1.2"]
acknowledgement = { cs = "Tento výstup byl vytvořen s finanční podporou iniciativy EOSC CZ prostřednictvím projektu Národní repozitářová platforma pro výzkumná data (CZ.02.01.01/00/23_014/0008787), financovaného z Operačního programu Jan Amos Komenský (OP JAK) Ministerstva školství, mládeže a tělovýchovy České republiky (MŠMT).", en = "This output was developed with financial contributions from the EOSC CZ initiative through the National Repository Platform for Research Data project (CZ.02.01.01/00/23_014/0008787), funded by the Programme Johannes Amos Comenius (P JAC) of the Ministry of Education, Youth and Sports of the Czech Republic (MEYS)." }
aiStatement = { cs = "Na přípravě obsahu a kódu se podílel AI asistent (Claude, Anthropic). Každá změna obsahu je zaznamenána v paradatech, včetně použitého nástroje, a texty kontrolují lidé.", en = "An AI assistant (Claude, Anthropic) contributed to the content and code. Every content change is recorded in the paradata, including the tool used, and people review the texts." }

