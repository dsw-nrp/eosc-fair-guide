# Guide metadata and shared vocabularies. Field reference: docs/content-model.md.

[guide]
version = "1.0.0-alpha.5"
testingNotice = { cs = "Průvodce je ve fázi testování. Obsah se může měnit a zatím jej neschválila iniciativa EOSC CZ.", en = "This Guide is in testing. Its content may change, and the EOSC CZ initiative has not approved it yet." }
datePublished = 2026-11-01
# Uses of "průvodce" and "guide" that do not mean this Guide and stay in lower case; the content check reads them.
genericGuideUses = ["průvodce licencemi", "průvodcem licencemi", "praktický průvodce", "interaktivní průvodce", "interaktivního průvodce", "an interactive guide"]
name = { cs = "Průvodce FAIR daty", en = "FAIR Data Guide" }
description = { cs = "Interaktivní průvodce, který vede výzkumníky, data stewardy, správce repozitářů a oborové komunity od plánu projektu k FAIR datům. Vychází z Analýzy a návrhu postupů k naplňování FAIR principů v rámci NRP/NDI (verze 1.2) a odráží současný stav národních služeb.", en = "An interactive guide that leads researchers, data stewards, repository administrators and research communities from the project plan to FAIR data. It builds on the Analysis and proposal of procedures for implementing the FAIR principles in NRP/NDI (version 1.2) and reflects the current state of national services." }
keywords = [
  { cs = "FAIR principy", en = "FAIR principles" },
  { cs = "výzkumná data", en = "research data" },
  { cs = "správa výzkumných dat", en = "research data management" },
  { cs = "repozitáře", en = "repositories" },
  { cs = "EOSC CZ", en = "EOSC CZ" },
]
url = "https://github.com/dsw-nrp/eosc-fair-guide"
# The explicit current publication location for deterministic local/offline builds. Hosted publication resolves
# the actual Pages configuration before validation and sets FAIR_GUIDE_BASE_URL. Runtime HTTP links follow their
# own window.
baseUrl = "https://dsw-nrp.github.io/eosc-fair-guide/"
# The namespace of the Guide's own vocabulary (<namespace>terms#), RO-Crate profile
# (<namespace>profile/<profileVersion>) and records (<namespace>id/<address>), registered with w3id, whose redirect
# leads to wherever the Guide is published. It does not follow the publication location: changing it renames every
# Guide term and record, so it is a reviewed breaking change. Releases up to 1.0.0-alpha.3 used https://fair.eosc.cz/
# and up to 1.0.0-alpha.5 https://dsw-nrp.github.io/eosc-fair-guide/.
namespace = "https://w3id.org/eosc-cz/fair-guide/"
profileVersion = "0.2"
freshnessDays = 180
# The guide is compiled and developed by its editors; the authors of its content basis are credited on the
# sources it is based on (isBasedOn).
editors = ["david-novak"]
reviewers = ["david-novak"]
contributors = ["karel-berka"]
publisher = "eosc-cz"
funder = "nrp"
isBasedOn = ["analyza-fair-1.2"]
acknowledgement = { cs = "Tento výstup byl vytvořen s finanční podporou iniciativy EOSC CZ prostřednictvím projektu Národní repozitářová platforma pro výzkumná data (CZ.02.01.01/00/23_014/0008787), financovaného z Operačního programu Jan Amos Komenský (OP JAK) Ministerstva školství, mládeže a tělovýchovy České republiky (MŠMT).", en = "This output was developed with financial contributions from the EOSC CZ initiative through the National Repository Platform for Research Data project (CZ.02.01.01/00/23_014/0008787), funded by the Programme Johannes Amos Comenius (P JAC) of the Ministry of Education, Youth and Sports of the Czech Republic (MEYS)." }
aiStatement = { cs = "Příspěvky připravené s pomocí umělé inteligence jsou vítány pod lidským dohledem. Za jejich správnost odpovídají lidé; repozitář je pro takovou spolupráci uzpůsoben. Konkrétní nástroje, modely, konzultované zdroje a změny obsahu zaznamenávají paradata znalostní báze.", en = "AI-assisted contributions are welcome under human oversight. People remain responsible for their correctness; the repository supports this way of working. The actual tools, models, consulted sources and content changes are recorded in the knowledge base's paradata." }

