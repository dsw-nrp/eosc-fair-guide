guideRoute = "term"
id = "javascript-object-notation"
label = { cs = "JavaScript Object Notation", en = "JavaScript Object Notation" }
url = "https://heslar.openscience.cz/heslo.php?id=175"
definition = "*nemá český ekvivalent\n\nOtevřený standardní formát používaný pro výměnu dat mezi systémy. Má jednoduchou strukturu, která je snadno čitelná pro člověka a zároveň je efektivně zpracovatelná stroji. Pro svoji jednoduchost je dnes nejrozšířenější formát pro výměnu dat na webu, protože je jednoduchý, univerzální a efektivní. Je používán napříč různými programovacími jazyky a webovými technologiemi.\n\nZákladní vlastnosti:\n\n• Vychází ze syntaxe jazyka JavaScript, ale je na programovacím jazyce nezávislý.\n\n• Data jsou uložena ve formě párů \"klíč\": \"hodnota\".\n\n• Podporuje základní datové typy: čísla, řetězce, pole, objekty, logické hodnoty a null, nehodí se pro binární data.\n\n• Používá se především při přenosu dat mezi klientem a serverem v aplikacích (např. webových API).\n\nPříklad:\n\n{\n\n\"jmeno\": \"Anna\",\n\n\"vek\": 29,\n\n\"aktivni\": true\n\n}"
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "177" }]

guideRoute = "term"
id = "knowledge-research-education"
label = { cs = "Knowledge Research Education Conference", en = "Knowledge Research Education Conference" }
url = "https://heslar.openscience.cz/heslo.php?id=177"
definition = "*nemá český ekvivalent\n\nMezinárodní konference pořádaná každoročně Národní technickou knihovnou (NTK) od roku 2010. Představuje platformu pro diskuzi zahraničních a národních odborníků a dalších relevantních aktérů ze sektoru vysokého školství a VaVaI nad novými, dosud (ne)řešenými tématy v ČR a svými podněty otevírá nové problematiky."
definitionLanguage = "cs"

