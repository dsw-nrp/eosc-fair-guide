alternateIds = [{ "scheme" = "heslar", "value" = "410" }]

guideRoute = "term"
id = "json-ld"
label = { cs = "JavaScript Object Notation for Linked Data", en = "JavaScript Object Notation for Linked Data" }
url = "https://heslar.openscience.cz/heslo.php?id=410"
definition = "*nemá český ekvivalent\n\nJSON-LD je metoda zápisu propojených dat (Linked Data) založená na běžném formátu JSON (JavaScript Object Notation). JSON-LD je založen na konceptu „kontextu“, jímž se vlastnosti objektů JSON mapují na pojmy v RDF ontologii. To umožňuje přiřadit JSON-LD hodnotám určitý typ nebo je označit jazykem. Kontext lze vložit přímo do dokumentu JSON-LD nebo umístit do samostatného souboru a odkazovat na něj z tradičních dokumentů JSON prostřednictvím hlavičky HTTP Link. Tak lze určit jasný význam (sémantiku), která je čitelná jak lidmi, tak stroji.\n\nHlavní vlastnosti:\n\n• Rozšiřuje JSON o kontext (@context), který určuje, jakou ontologií jsou jednotlivé pojmy definovány.\n\n• Umožňuje propojení dat mezi různými zdroji pomocí jednotných identifikátorů (URI).\n\n• Kompatibilní s webovými technologiemi a snadno integrovatelný do HTML stránek.\n\n• Používán např. pro strukturovaná data na webu (schema.org, vyhledávače, znalostní grafy).\n\nVýznam:\n\nJSON-LD podporuje principy otevřených a sémantických dat, zjednodušuje výměnu a integraci informací napříč systémy a je klíčový pro rozvoj sémantického webu a vědecké datové infrastruktury. Je to rovněž výchozí formát popisu Internetu věcí (IoT)."
definitionLanguage = "cs"

[[term]]
