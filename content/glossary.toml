guideRoute = "term"
id = "research-policy"
label = { cs = "výzkumná politika", en = "Research Policy" }
url = "https://heslar.openscience.cz/heslo.php?id=86"
definition = "Strategický přístup k řízení a financování rozvoje vědy a k podpoře výzkumných (a inovačních) aktivit na institucionální, regionální, národní nebo nadnárodní úrovni. Jejím cílem je efektivní rozvoj vědeckých poznatků, technologického pokroku a jejich aplikace v praxi. Na národní úrovni je výzkumná politika často zastřešena strategickými dokumenty, které určují klíčové směry a oblasti rozvoje VaVaI. V ČR je takovým strategickým dokumentem Národní politika výzkumu, vývoje a inovací České republiky 2021+."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "87" }]

guideRoute = "term"
id = "amnesia"
label = { cs = "Amnesia", en = "Amnesia" }
url = "https://heslar.openscience.cz/heslo.php?id=87"
definition = "Anonymizační nástroj pro anonymizaci kvantitativních dat prostřednictvím odstranění přímých identifikátorů (např. jména) a transformace sekundárních identifikátorů (např. datum narození, adresa) tak, aby např. jednotlivci nemohli být v datech identifikováni. Amnesia je zdarma dostupný software napsaný v Javě a JavaScriptu a pro anonymizaci osobních a citlivých dat by měl být používán lokálně. On-line verze je určená jen pro demonstrační účely a nemají do ní být nahrávána citlivá data.\n\nZákladní funkce je, že uživatelé načtou do Amnesie soubor obsahující osobní údaje (originální data) a Amnesia ho převede na anonymní datovou sadu, kterou lokálně uloží pro další zpracování, např. publikaci. Transformace se řídí uživatelskými výběry a poskytuje záruku anonymizace výsledné datové sady. Amnesia v současnosti podporuje záruky k-anonymity a km-anonymity."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "90" }]

guideRoute = "term"
id = "anonymisation-research-data"
label = { cs = "anonymizace výzkumných dat", en = "Anonymisation of Research Data" }
url = "https://heslar.openscience.cz/heslo.php?id=90"
definition = "Proces zajišťující v rámci výzkumných dat utajení identity. Jedná se o úpravu údajů tak, aby jednotlivé osoby původně identifikovatelné během výzkumu, již nemohly být ze souboru dat rozpoznány. Cílem je odstranit nebo pozměnit všechny osobní identifikátory (např. jména, adresy, rodná čísla, IP adresy) a také snížit možnost tzv. nepřímé identifikace (např. instituce, zaměstnavatel), která by mohla být možná na základě kombinace některých údajů (např. věk, pohlaví, lokalita). Anonymizace chrání soukromí účastníků výzkumu a umožňuje sdílení a analýzu dat bez porušení práv na ochranu osobních údajů. Na rozdíl od pseudonymizace, kde jsou data stále teoreticky spojitelná s konkrétními osobami (ale pomocí klíče, který je obvykle chráněn), anonymizace znamená, že spojení s konkrétními jednotlivci je nevratně ztraceno."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "91" }]

guideRoute = "term"
id = "codata"
label = { cs = "Committee on Data for Science and Technology", en = "Committee on Data for Science and Technology" }
url = "https://heslar.openscience.cz/heslo.php?id=91"
definition = "*nemá český ekvivalent\n\nInterdisciplinární výbor při International Science Council (ISC) s cílem podpory globální spolupráce na zlepšení dostupnosti a použitelnosti dat ve všech oblastech výzkumu. Podporuje zásadu, že údaje vytvořené výzkumem a vhodné pro výzkum by měly být otevřené, pokud není závažný důvod k opaku. Pracuje na rozvoji interoperability a použitelnosti výzkumných dat. Podle CODATA by výzkumná data měla být tzv. inteligentně otevřená nebo FAIR. Propagací politik, technologických a kulturních změn, které jsou nezbytné pro podporu otevřené vědy, pomáhá CODATA prosazovat vizi a poslání ISC prosazovat vědu jako globální veřejný zájem.\n\nStrategický plán CODATA identifikuje tři prioritní oblasti:\n\nPodpora zásad, politik a postupů pro otevřená (výzkumná) data a otevřenou vědu.\n\nPosouvání hranic datové vědy.\n\nBudování kapacit pro otevřenou vědu zlepšováním dovedností v oblasti dat a funkcí národních vědeckých systémů potřebných k podpoře otevřených dat.\n\nCODATA dosahuje těchto cílů prostřednictvím řady stálých výborů a strategických iniciativ vedených exekutivou a prostřednictvím svých účelových skupin a pracovních skupin. CODATA podporuje časopis Data Science Journal a spolupracuje na významných datových konferencích, jako jsou SciDataCon a International Data Week."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "92" }]

guideRoute = "term"
id = "dataset"
label = { cs = "datová sada / soubor dat", en = "Dataset / Data set" }
url = "https://heslar.openscience.cz/heslo.php?id=92"
definition = "Množina logicky souvisejících údajů zpřístupněná prostřednictvím jednoho nebo více souborů uspořádaných v konkrétních datových formátech (např. CSV, XML, JSON, RDF aj.). Datová sada může být poskytnuta ke stažení (HTTPS odkazem apod.) nebo skrze API (Application Programming Interface), tj. strojově použitelné přístupové rozhraní. Měla by být identifikovatelná a popsána (metadaty) tak, aby ji bylo možno dále využít. V prostředí otevřené vědy by měla splňovat principy FAIR."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "93" }]

guideRoute = "term"
id = "long-term-preservation"
label = { cs = "dlouhodobé uchovávání dat", en = "Long Term Preservation" }
url = "https://heslar.openscience.cz/heslo.php?id=93"
definition = "Činnost zaručující přístup k digitálním materiálům nebo alespoň k informacím v nich obsažených na dobu neurčitou. Spadá do oblasti ochrany digitálních materiálů, tj. do souboru řízených činností nezbytných k zajištění trvalého přístupu k digitálním materiálům po nezbytně dlouhou dobu. Digitální uchovávání je definováno velmi široce a vztahuje se na všechny činnosti potřebné k zachování přístupu k digitálním materiálům i za hranice selhání média nebo technologických a organizačních změn.\n\nDalšími variantami ochrany digitálních materiálů jsou:\n\nstřednědobé uchovávání – souboru řízených činností nezbytných k zajištění nepřetržitého přístupu k digitálním materiálům i po změnách technologie po definovanou dobu, nikoli však na dobu neurčitou,\n\nkrátkodobé uchování – souboru řízených činností nezbytných k zajištění přístupu k digitálním materiálům buď po určitou dobu, dokud se předpokládá jejich využití, které však nepřesáhne dohlednou budoucnost a/nebo do doby, než se stanou nedostupnými v důsledku technologických změn."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "94" }]

guideRoute = "term"
id = "dmponline"
label = { cs = "DMPonline", en = "DMPonline" }
url = "https://heslar.openscience.cz/heslo.php?id=94"
definition = "*nemá český ekvivalent\n\nWebový nástroj Centra pro digitální kurátorství (Digital Curation Centre, DCC) pomáhající výzkumným pracovníkům při vytváření plánů správy dat (DMP). Obsahuje nejnovější šablony poskytovatelů finanční podpory VaVaI a pokyny pro osvědčené postupy, které uživatelům pomáhají vytvářet kvalitní DMP.\n\nV rámci nástroje jsou uvedeny pokyny a příklady odpovědí, které pomohou při vytváření DMP. Ty nabízí DCC, poskytovatelé a mnoho výzkumných organizací (VO). Pro inspiraci lze využít rostoucí seznam veřejných DMP zveřejněných jinými uživateli nástroje.\n\nNástroj je založen na open source kódu DMPRoadmap spravovaném ve spolupráci s California Digital Library."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "95" }]

guideRoute = "term"
id = "data-stewardship-wizard"
label = { cs = "Data Stewardship Wizard", en = "Data Stewardship Wizard" }
url = "https://heslar.openscience.cz/heslo.php?id=95"
definition = "*nemá český ekvivalent\n\nNástroj v podobě webové aplikace pro plánování správy dat a pro vytvoření plánů správy dat (DMP) pomocí srozumitelných dotazníků. Poskytuje odkazy na externí zdroje, indikátory FAIR metrik a umožňuje online spolupráci. Rovněž umožňuje i sledování odpovědí a změn verzování. Jedná se o jeden z často doporučovaných nástrojů pro tvorbu a aktualizaci DMP.\n\nData Stewardi zachycují informace o práci s daty v rámci svého projektu pomocí webového formuláře, jehož struktura je definována znalostním modelem. Znalostní model může být obecný nebo postavený na míru konkrétnímu vědnímu oboru. Formulář k vyplnění je na základě znalostního modelu tvořen „inteligentně“ v tom smyslu, že působí jako průvodce pro uživatele DSW, který se na jednotlivé aspekty správy dat ptá postupně a dotazy upřesňuje tam, kde to dává smysl dle odpovědí na dříve položené otázky.\n\nZ vyplněného formuláře je možné exportovat DMP dle některé ze šablon DMP. Šablony jsou tvořeny dle požadavků vybraných grantových schémat. Pro jeden znalostní model může existovat více šablon DMP, tj. jeden popis práce s daty v rámci projektu umožňuje generování DMP dle různých grantových schémat.\n\nDSW poskytuje silné API (Application Programming Interface), které pokrývá veškerou jeho funkcionalitu. Umožňuje tedy velmi dobrou integraci s jinými informační systémy a podporuje strojové zpracování dat."
definitionLanguage = "cs"

