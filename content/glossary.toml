id = "cos"
label = { cs = "Center for Open Science", en = "Center for Open Science" }
url = "https://heslar.openscience.cz/heslo.php?id=136"
definition = "*nemá český ekvivalent\n\nNezisková organizace poskytující bezplatné a otevřené služby pro zvýšení otevřenosti, integrity a reprodukovatelnosti vědeckého výzkumu. COS vyvinula řadu softwarových nástrojů a pracovních postupů založených na bezplatném systému Open Science Framework (OSF), které pomáhají výzkumným pracovníkům spravovat a archivovat jejich výzkum."
