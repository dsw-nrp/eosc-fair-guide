guideRoute = "term"
id = "free-libre-open-source"
label = { cs = "svobodný software / software s otevřeným zdrojovým kódem", en = "Free [Libre] Open-Source Software" }
url = "https://heslar.openscience.cz/heslo.php?id=100"
definition = "Viz také software s otevřeným / přístupným zdrojovým kódem.\n\nOznačení pro software, který je distribuován s otevřeným zdrojovým kódem a poskytuje uživatelům svobodu k jeho používání, studování, modifikování a šíření. Tento pojem zahrnuje jak svobodný software (Free Software), který klade důraz na etické a právní svobody uživatelů, tak otevřený software (Open-Source Software), který se soustředí na technické výhody otevřeného kódu. FLOSS podporuje demokratizaci technologie, neboť umožňuje komukoliv přístup k softwaru a jeho vylepšení, což vede k větší flexibilitě, bezpečnosti a transparentnosti.\n\nHlavní charakteristiky FLOSS jsou:\n\notevřený zdrojový kód – zdrojový kód je veřejně dostupný a může být volně prozkoumáván, upravován a vylepšován,\n\nsvobody uživatele:\n\nsvoboda používat software pro jakýkoliv účel,\n\nsvoboda studovat kód a přizpůsobit ho vlastním potřebám,\n\nsvoboda redistribuovat kopie softwaru, ať už původní nebo modifikované,\n\nsvoboda sdílet úpravy a vylepšení s ostatními,\n\nlicenční podmínky – FLOSS je vydáván pod licencemi, které zaručují výše uvedené svobody; mezi nejznámější licence patří GPL (General Public License), MIT licence nebo Apache License,\n\nkomunitní a otevřený vývoj – FLOSS je často vyvíjen komunitou uživatelů a vývojářů, což umožňuje rychlé vylepšení a inovace; tento proces podporuje transparentnost a spolupráci.\n\nPříklady FLOSS:\n\nLinux (operační systém)\n\nMozilla Firefox (webový prohlížeč)\n\nLibreOffice (kancelářský balík)\n\nGIMP (grafický editor)\n\nZ hlediska práva duševního vlastnictví jde o software chráněný autorským právem, jehož užívání je umožněno licenční smlouvou open source typu. Tyto licence poskytují uživatelům rozsáhlá oprávnění (užití, šíření, modifikace) a současně stanovují podmínky, za nichž je tato svoboda vykonávána.\n\nJe důležité rozlišovat mezi:\n\notevřeným zdrojovým kódem (open source) – zahrnuje i oprávnění upravovat, šířit a vytvářet odvozená díla,\n\npřístupným zdrojovým kódem (source-available) – kód je k nahlédnutí, ale bez práv k jeho úpravám a dalšímu šíření (pouze „čitelnost“, nikoliv svoboda užití).\n\nPouhý přístup ke kódu proto ještě nezaručuje open source režim. Rozhodující je licenční smlouva."
definitionLanguage = "cs"

