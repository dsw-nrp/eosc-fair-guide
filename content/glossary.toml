guideRoute = "term"
id = "research-data-management"
label = { cs = "správa / management výzkumných dat", en = "Research Data Management" }
url = "https://heslar.openscience.cz/heslo.php?id=107"
definition = "Systematický přístup k organizaci, získávání, ukládání, dlouhodobému uchovávání a sdílení dat, která vznikají během výzkumného procesu. Zahrnuje celou řadu činností a postupů zajišťující, že data jsou dostupná, konzistentní a bezpečná pro současné i budoucí použití. Efektivní RDM přispívá k lepší reprodukovatelnosti a transparentnosti vědeckého výzkumu a podporuje sdílení zdrojů mezi výzkumníky.\n\nZákladní oblasti správy výzkumných dat zahrnují:\n\nplánování správy dat – vytvoření plánu, jak budou data generována, ukládána a sdílena, obvykle formou dokumentu plánu správy dat (DMP),\n\norganizace a uchovávání dat – používání standardizovaných metod pro strukturování a ukládání dat, aby byla přehledná, konzistentní a snadno přístupná,\n\nzajištění kvality dat – kontrola, že data jsou úplná, přesná a konzistentní, včetně validace a dokumentace změn,\n\nbezpečnost a ochrana dat – zavedení bezpečnostních opatření, která chrání data před neoprávněným přístupem, ztrátou, poškozením, a která zajišťují důvěrnost citlivých informací,\n\nzálohování a obnova dat – pravidelné zálohování dat a zavedení postupů pro obnovu dat v případě ztráty nebo poškození,\n\nsdílení a publikování dat – publikování dat a metadat, které umožňuje jejich sdílení s ostatními výzkumníky a splňuje požadavky na otevřený přístup a reprodukovatelnost výzkumu,\n\narchivace a dlouhodobé uchování dat – zajištění toho, že data budou přístupná i po ukončení projektu, obvykle v datových repozitářích."
definitionLanguage = "cs"

