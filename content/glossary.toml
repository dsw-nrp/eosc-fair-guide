guideRoute = "term"
id = "data"
label = { cs = "vytěžování dat / textů", en = "Data / Text mining" }
url = "https://heslar.openscience.cz/heslo.php?id=383"
definition = "Analytická metoda používaná v mnoha vědeckých oborech k získávání dat z rozsáhlých souborů netextových dat i z textových dokumentů.\n\nData-mining: proces využívající počítačovou analýzu prostřednictvím specializovaného softwaru k rozpoznávání entit, vztahů, vzorců, schémat a činností ve velkých souborech dat a schopný je spojovat novým způsobem a vytvářet nové znalosti.\n\nText-mining: proces získávání informací z textových dat. Techniky text-miningu mohou zahrnovat analýzu sentimentu (sentiment analysis), síťovou analýzu (network analysis), analýzu četnosti slov, extrakci informací a tvorbu taxonomií nebo ontologií a další."
