guideRoute = "term"
id = "research-development-innovation"
label = { cs = "výzkum, vývoj a inovace", en = "Research, Developement and Innovation" }
url = "https://heslar.openscience.cz/heslo.php?id=83"
definition = "Soustavná činnost směřující k získávání nových poznatků a k jejich případné aplikaci při zavádění nových nebo podstatně zdokonalených výrobků, služeb či postupů do praxe. Výzkum a vývoj jsou často považovány za důležité (nikoliv však jediné) pilíře inovací. Výzkum a vývoj definuje OECD Frascati manuál jako činnosti, které „jsou tvořeny kreativní / tvůrčí a systematickou prací, vykonávanou pro zvýšení úrovně vědomostí, včetně znalostí lidstva, kultury a společnosti, a k navržení nových způsobů aplikace dostupných znalostí“. Inovace definuje OECD Oslo manuál jako „nový nebo zdokonalený výrobek nebo proces (nebo jejich kombinace), který se významně liší od předchozích výrobků nebo procesů jednotky, a který byl zpřístupněn potenciálním uživatelům (výrobek) nebo uveden do užívání jednotkou (proces)“."
definitionLanguage = "cs"

