guideRoute = "term"
id = "eu-institutions"
label = { cs = "rozhodovací orgány Evropské Unie", en = "Decision-making Institutions of European Union" }
url = "https://heslar.openscience.cz/heslo.php?id=118"
definition = "Evropskou unii (EU) řídí čtyři hlavní orgány s rozhodovací pravomocí. Jsou to:\n\nEvropská rada (ER),\n\nEvropská komise (EK),\n\nRada Evropské Unie (Rada EU),\n\nEvropský parlament (EP).\n\nEvropská rada (neformálně též summit EU) je nejvyšším politickým orgánem EU. Tvoří ji hlavy a předsedové vlád členských států a dále předseda ER a předseda EK. ER přijímá zásadní politické cíle a strategie, nepředkládá však legislativní návrhy (může o jejich předložení požádat EK) a neschvaluje právní předpisy EU.\n\nEvropská komise je orgánem zastupujícím zájmy EU jako celku. Každá členská země má po jednom evropském komisaři, ti však nesmí svou zemi (ani žádnou jinou) jakkoli favorizovat. EK jako jediný orgán navrhuje právní předpisy, které následně schvalují Rada EU a EP. EK dále řídí politiky EU a přiděluje na ně finanční prostředky, prosazuje právo EU a reprezentuje EU na mezinárodní scéně.\n\nRada Evropské unie je orgánem zastupujícím zájmy jednotlivých členských zemí. Tvoří ji příslušní ministři členských zemí (podle projednávaných témat se schází konkrétní ministři). Rada EU vyjednává a přijímá právní normy EU společně s EP. Dále především koordinuje politiky členských zemí, na základě pokynů ER formuje zahraniční a bezpečnostní politiku EU, uzavírá za EU mezinárodní dohody a spolu s EP přijímá roční rozpočet EU.\n\nEvropský parlament je orgán zastupující zájmy občanů EU, kterými je přímo volen na období pěti let. V lednu 2025 jej tvoří 720 europoslanců/kyň. Společně s Radou EU schvaluje právní předpisy EU. Může zadat EK úkol vypracovat konkrétní legislativní návrh. EP dále mj. rozhoduje v otázkách mezinárodních dohod, volí předsedu EK a schvaluje evropské komisaře, sestavuje spolu s Radou EU rozpočet EU apod."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "119" }]

guideRoute = "term"
id = "eu-legislation"
label = { cs = "právní předpisy EU", en = "Types of EU Legislation" }
url = "https://heslar.openscience.cz/heslo.php?id=119"
definition = "Evropské právní předpisy se rozdělují na primární a sekundární právo. Primárním právem jsou samotné zakládající smlouvy. Veškeré další právní předpisy vycházející z těchto smluv tvoří sekundární právo. Hlavními typy těchto právních předpisů jsou Nařízení, Směrnice, Rozhodnutí, Doporučení a Stanoviska.\n\nNařízení jsou právně závazná v celém rozsahu (ve stejném znění platí pro všechny členy EU, mohou však obsahovat výjimky).\n\nSměrnice jsou právně závazné pro všechny státy, pro které jsou určeny. Stanovují cíl, kterého má být dosaženo, ale ponechávají členským státům volbu formy a prostředků k dosažení tohoto cíle, a to včetně formulování zákonů.\n\nRozhodnutí jsou právně závazná v celém svém rozsahu pro všechny, pro koho jsou určena. Mohou být tedy adresována jednotlivým členským státům, ale třeba také obchodním společnostem.\n\nDoporučení nejsou právně závazná. Vyjadřují názor EU na danou problematiku a návrh příslušných kroků, ale nelze je právně vymáhat.\n\nStanoviska vyjadřují postoj některého z orgánů EU k dané problematice, aniž by byla právně závazná.\n\nZávazné právní předpisy nejčastěji navrhuje Evropská komise a schvaluje společně Evropský parlament a Rada Evropské Unie. Proto jejich oficiální znění v českém jazyce začíná „Nařízení / Směrnice / Rozhodnutí Evropského parlamentu a Rady (EU)“."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "131" }]

guideRoute = "term"
id = "authentication"
label = { cs = "autentizace", en = "Authentication" }
url = "https://heslar.openscience.cz/heslo.php?id=131"
definition = "Proces ověření identity, prokázání pravosti, poskytnutí důkazu pravosti. Lze se setkat s jazykovými zkomoleninami pojmu, které se nedoporučují používat: autentifikace – autentikace.\n\nRozlišují se tři úrovně způsobu autentizace.\n\nJednofaktorová autentizace\n\nPostačuje prokázání identity pouze pomocí jedné věci.\n\nPříklady:\n\n• autentizace pomocí znalosti (např. PIN, heslo) – „co znám“\n\n• autentizace pomocí předmětu (např. klíč, karta, dokument) – „co mám“\n\n• autentizace pomocí uživatele (např. otisk prstu, oko, obličej) – „kdo jsem“\n\nDvoufaktorová autentizace\n\nK prokázání identity je třeba ověření dvou na sobě nezávislých věcí.\n\nPříklady:\n\n• zadání hesla + otisk prstu\n\n• zadání přístupových údajů + vložení autorizačního kódu zaslaného SMS\n\nTřífaktorová autentizace\n\nOvěření pomocí třetí nezávislé věci, která je spojena s člověkem (biometrické prvky)."
definitionLanguage = "cs"

