guideRoute = "term"
id = "handle"
label = { cs = "Handle", en = "Handle" }
url = "https://heslar.openscience.cz/heslo.php?id=165"
definition = "*nemá český ekvivalent\n\nProprietární registrační systém pro přidělování perzistentních identifikátorů (tzv. handle) informačním zdrojům a pro jejich převod („resolution“) na informace potřebné k lokalizaci, přístupu a dalšímu využití těchto zdrojů. Identifikátory systému Handle jsou „neprůhledné“ (opaque) a neobsahují žádnou informaci o samotném zdroji; jsou navázány pouze na metadata popisující daný zdroj. Změny metadat tak nezpůsobují neplatnost samotného identifikátoru.\n\nSystém byl vyvinut v 90. letech 20. století jako součást architektury digitálních objektů (Digital Object Architecture, DOA) s podporou Defense Advanced Research Projects Agency (DARPA) v rámci služeb pro digitální objekty a shodoval se s počátky nasazení World Wide Webu. Spuštěn byl v roce 1994 a do prosince 2015 jej spravovala a provozovala organizace CNRI (Corporation for National Research Initiatives). Globální registr systému Handle od roku 2015 spravuje nadace DONA Foundation se sídlem v Ženevě, která akredituje jednotlivé dílčí administrátory. Handle tvoří základní infrastrukturu pro další systémy, jako jsou například Digital Object Identifiers (DOI) a platforma DSpace.\n\nIdentifikátor Handle má vždy formát prefix / sufix (např. 20.1000/100 je perzistentní odkaz na licenční smlouvu na Hadle software, 10.1000/182 je perzistentní odkaz na DOI Handbook). Prefix má dnes standardně dvě části oddělené tečkou: první část (20, resp. 10) označuje administrátora (20 je Handle, 10 je DOI). Druhá část je identifikace instituce / registrátora objektu, sufix (přípona) jednoznačně identifikuje konkrétní objekt u registrátora. Pro převod („resolution“) na platnou webovou adresu je nutno doplnit URL příslušného serveru: https://hdl.handle.net/20.1000/100, resp. https://doi.org/10.1000/182."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "166" }]

guideRoute = "term"
id = "harvesting"
label = { cs = "harvestování / sklízení", en = "Harvesting" }
url = "https://heslar.openscience.cz/heslo.php?id=166"
definition = "Automatizované sklízení a agregace obsahu (metadatových záznamů, případně i plných textů), v určené frekvenci a na základě definovaných parametrů z různých externích zdrojů do jednoho systému. Mezi repozitáři harvestování funguje standardně prostřednictvím protokolu OAI-PMH, mezi jinými systémy může jít o výměnu dat prostřednictvím jiného druhu API (Application Programming Interface). Cílem harvestování je obvykle vytvořit centrální index metadatových záznamů a umožnit tak vyhledávání z jednoho vyhledavače nad více zdroji, popřípadě vytvoření velké tematické kolekce obsahu z různých zdrojů."
definitionLanguage = "cs"

