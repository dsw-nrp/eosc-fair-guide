definition = "V českém prostředí se poskytovatelem rozumí ústřední orgán státní správy, Akademie věd České republiky, Grantová agentura České republiky, Technologická agentura České republiky nebo organizační složka státu. Pojem legislativně upravuje § 14 (2) zákona č. 218/2000 Sb. o rozpočtových pravidlech a o změně některých souvisejících zákonů (rozpočtová pravidla)(Část první, Hlava III, Díl 2 Poskytování dotací a návratných finančních výpomocí ze státního rozpočtu a řízení o jejich odnětí, § 14 (2))."
