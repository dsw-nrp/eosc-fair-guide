definition = "Soubor předem definovaných pravidel, která určují strukturu a formát metadat a zajišťují konzistenci při popisu a správě dat, obvykle uznávaný určitou komunitou nebo certifikovaný určitou autoritou. Užití standardu zlepšuje interoperabilitu mezi systémy, zajišťuje společné chápání významu nebo sémantiky dat / údajů o popisovaných objektech, tj. má zajistit správné použití a interpretaci dat mezi jejich systémy a jejich uživateli.\n\nSouvisící heslo: centrální metadatový model."
