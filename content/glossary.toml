guideRoute = "term"
id = "igsn"
label = { cs = "International Generic Sample Number", en = "International Generic Sample Number" }
url = "https://heslar.openscience.cz/heslo.php?id=411"
definition = "*nemá český ekvivalent\n\nGlobální persistentní identifikátor hmotných vzorků používaný ve vědě, zejména v geologii, biologii, archeologii a dalších oborech pracujících s hmotnými vzorky. Každému vzorku organizace IGSN e. V. (International Generic Sample Number Organization) přidělí jedinečný a trvalý identifikátor, kterým je zaručeno jeho jednoznačné označení, sdílení a citování v digitálním prostředí. Vyhledání zprostředkuje systém Handle. Organizace IGSN e. V. zajišťuje standardy a koordinaci mezi národními registry.\n\nHlavní charakteristiky:\n\n• Jedinečnost: každý vzorek má unikátní alfanumerický kód.\n\n• Trvalost: IGSN funguje jako perzistentní identifikátor (PID) podobně jako DOI u publikací.\n\n• Interoperabilita: umožňuje propojení vzorků napříč databázemi, institucemi a vědeckými obory.\n\n• Sledovatelnost: umožňuje dohledat původ, umístění, vlastnosti a historii využití vzorku."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "414" }]

guideRoute = "term"
id = "publish-review-curate"
label = { cs = "Publish, Review, Curate", en = "Publish, Review, Curate" }
url = "https://heslar.openscience.cz/heslo.php?id=414"
definition = "*nemá český ekvivalent\n\nModel vědecké komunikace rozdělující proces publikování do tří částí:\n\nPublikování – autoři publikují preprinty na preprintových serverech.\n\nRecenzování – vědci recenzují preprinty a poskytují zpětnou vazbu; recenze jsou sdíleny.\n\nKurátorství – časopis kurátoruje preprinty z již publikovaných a recenzovaných zdrojů, tj. shromažďuje preprinty do sbírek, k nim mohou být připojena souhrnná hodnocení.\n\nModel PRC podporuje decentralizaci publikačního procesu a jeho transparentnost prostřednictvím otevřeného recenzování. Naproti tomu tradiční model publikování je uzavřený proces redaktora a odborníků jako recenzentů.\n\nPRC přidává do dynamiky publikování novou složku: kurátorství.\n\nPlatforma pro vyhledávání a sledování recenzí a PRC aktivit: sciety.\n\nPodrobnější informace o výhodách a nevýhodách tohoto modelu: Richard Sever (2023) a Hyde et al. (2022)."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "415" }]

guideRoute = "term"
id = "overlay-journal"
label = { cs = "Overlay Journal", en = "Overlay Journal" }
url = "https://heslar.openscience.cz/heslo.php?id=415"
definition = "*nemá český ekvivalent\n\nTyp akademického časopisu, který nevytváří vlastní nové články, ale kurátoruje, recenzuje a hodnotí výzkumy zveřejněné v otevřených (preprintových) repozitářích, jako jsou arXiv, bioRxiv, HAL nebo Zenodo.\n\nTypické workflow zahrnuje:\n\n1. uložení preprintu do preprintového repozitáře,\n\n2. informování časopisu (autorem, preprintovým serverem nebo vlastní iniciativou časopisu),\n\n3. recenzní řízení,\n\n4. v případě přijetí článku publikování na webu časopisu (formou sdílení metadat a odkazu do preprintového serveru, může zahrnovat i zveřejnění celého článku).\n\nOvarlay Journal v podstatě vytváří „vrstvu časopisu“ nad již volně přístupným obsahem, odtud pochází termín „overlay“ (vrstva).\n\nSvým přístupem představuje tento druh časopisu jeden z typů modelu Publish-Review-Curate (PRC)."
definitionLanguage = "cs"

