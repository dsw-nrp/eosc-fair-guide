guideRoute = "term"
id = "isbn"
label = { cs = "Mezinárodní standardní číslo knihy", en = "International Standard Book Number" }
url = "https://heslar.openscience.cz/heslo.php?id=170"
definition = "Mezinárodní identifikátor – číselný kód vytvořený pro jednoznačnou identifikaci konkrétního vydání knihy. Přiděluje se tištěným i digitálním knihám a určitým typům souvisících produktů, které jsou zpřístupněny veřejnosti, ať už zdarma nebo v rámci prodeje.\n\nKód pro jednoznačnou identifikaci monografických publikací definuje norma ISO 2108 Information and documentation – International Standard Book Number (ISBN). Systém ISBN na mezinárodní úrovni spravuje mezinárodní agentura International ISBN Agency se sídlem v Londýně. ISBN je na knihách zaznamenán čárovým kódem EAN / IAN (European / International Article Number) sloužícím obchodu. Jeho tři první číslice označují zemi, pro ISBN to jsou trojčíslí 978 a 979, tzv. Bookland. Výjimku tvoří prefix 9790, ten je vyhrazen pro ISMN. ISBN kódy zpravidla vydavatelům přidělují tzv. národní agentury. V České republice to je podle knihovního zákona č. 257/2001 Sb. Česká národní agentura ISBN a ISMN působící při Národní knihovně ČR.\n\nV současnosti Česká národní agentura ISBN a ISMN poskytuje bloky čísel ISBN vydavatelským subjektům registrovaným v systému ISBN. Tito vydavatelé poté označují vydávané knihy kódy ze své sady ISBN. Agentura také přiděluje na vyžádání jednotlivá ISBN knihám, e-knihám a audioknihám vydávaným v systému ISBN neregistrovanými subjekty. Tento systém se má snad ještě v roce 2026 změnit na online systém přidělování po jednotlivých titulech."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "171" }]

guideRoute = "term"
id = "ismn"
label = { cs = "Mezinárodní standardní číslo hudebniny", en = "International Standard Music Number" }
url = "https://heslar.openscience.cz/heslo.php?id=171"
definition = "Mezinárodní identifikátor – číselný kód sloužící k jednoznačné identifikaci konkrétního vydání hudebnin. Přiděluje se tištěným i digitálním hudebninám, které jsou k dispozici koupí, výpůjčkou, zdarma nebo pouze pro účely copyrightu.\n\nKód pro jednoznačnou identifikaci hudebnin definuje norma ISO 10957 Information and documentation — International standard music number (ISMN). Systém ISMN na mezinárodní úrovni spravuje Mezinárodní agentura ISMN se sídlem v Berlíně. ISMN je na hudebninách zaznamenán čárovým kódem EAN / IAN (European / International Article Number). Jeho tři první číslice označují zemi, pro ISMN to je čtyřčíslí 9790. ISMN kódy zpravidla vydavatelům přidělují tzv. národní agentury. V České republice to je podle knihovního zákona č. 257/2001 Sb. Česká národní agentura ISBN a ISMN působící při Národní knihovně ČR.\n\nČeská národní agentura ISBN a ISMN poskytuje bloky čísel ISMN vydavatelským subjektům registrovaným v systému ISMN. Tito vydavatelé poté číslují vydávané hudebniny ze své sady ISMN. Agentura přiděluje na vyžádání jednotlivá ISMN hudebninám a e-hudebninám vydávaným v systému ISMN neregistrovanými subjekty."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "172" }]

guideRoute = "term"
id = "isni"
label = { cs = "Mezinárodní standardní identifikátor jména", en = "International Standard Name Identifier" }
url = "https://heslar.openscience.cz/heslo.php?id=172"
definition = "Trvalý identifikátor sloužící k jednoznačné a globální identifikaci tzv. veřejných identit (jmen fyzických osob a korporací), které jsou v roli tvůrců, producentů, vydavatelů, distributorů nebo správců intelektuálních obsahů / děl). Je používán celosvětově v prostředí knihoven, vydavatelů, databází a organizací zabývajících se správou autorských práv.\n\nIdentifikátor ISNI je kodifikován mezinárodní normou ISO 27729 Information and documentation — International standard name identifier (ISNI). Je to číselný kód 15 dekadických číslic, poslední kontrolní číslice může být 0 až 9 nebo X. Obvykle je zapisován jako skupiny čtyř číslic oddělených pomlčkou nebo mezerou. Systém ISNI na mezinárodní úrovni spravuje mezinárodní agentura ISNI International Agency (ISNI-IA) Ltd. se sídlem v Londýně. Zájemci o přidělení kódu ISNI posílají žádost jedné z tzv. registračních agentur ISNI pověřených agenturou. Jako registrační agentury působí organizace reprezentující určité geografické území nebo konkrétní oblast činnosti, jako je knižní vydavatelský průmysl, hudební průmysl, knihovnictví atd. Na stránce ISNI https://isni.org/page/isni-registration-agencies/ je (20. 1. 2026) uvedeno 44 registračních autorit, Česká republika mezi nimi není.\n\nDatabáze ISNI propojuje data z různých zdrojů, jako např. z autoritních záznamů služby VIAF (Virtual International Authority File). Persistentní identifikátor ORCID je založen na téže normě jako ISNI a využívá vyhrazený blok čísel ISNI."
definitionLanguage = "cs"

[[term]]
