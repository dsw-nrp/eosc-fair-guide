definition = "*nemá český ekvivalent\n\nDatabáze aktuálních informací týkajících se OA politik poskytovatelů VaVaI, časopisů a vydavatelů. Dříve tento online nástroj působil pod označením Sherpa Services, který sdružoval původně oddělené služby Sherpa Romeo, Sherpa Juliet a Sherpa Fact. Databáze má referenční charakter, před zveřejněním díla v repozitáři je vždy nutné ověřit licenční podmínky ve smlouvě, případně na stránkách vydavatele.\n\nDatabázi vyvinula a spravuje britská nezisková organizace Jisc zaměřující se na poskytování digitálních služeb a zdrojů pro vzdělávání a výzkum."
