guideRoute = "term"
id = "open-research-data"
label = { cs = "otevřená výzkumná data", en = "Open Research Data" }
url = "https://heslar.openscience.cz/heslo.php?id=104"
definition = "Výzkumná data, která jsou volně dostupná pro všechny, bez právních, technologických nebo jiných bariér. Mohou být volně používána, sdílena, modifikována a redistribuována. Podporují principy otevřené vědy a přispívají k transparentnosti vědeckého výzkumu, umožňují opakované použití a validaci výsledků a podporují spolupráci mezi výzkumníky. Otevřená výzkumná data jsou v souladu s principy FAIR (Findable, Accessible, Interoperable, Reusable) stanovující zásady k jejich organizaci s cílem snadné dostupnosti, opakované použití a interoperability mezi různými systémy. Tato data jsou klíčová pro posílení transparentnosti a spolupráce ve vědecké komunitě a pro podporu širšího a efektivnějšího využívání výzkumu.\n\nCharakteristiky otevřených výzkumných dat jsou:\n\nvolná dostupnost – data jsou k dispozici on-line pro všechny bez nutnosti registrace nebo omezení přístupu,\n\nreprodukce a validace – data umožňují jiným výzkumníkům ověřit a replikovat výsledky, což zvyšuje důvěryhodnost a transparentnost vědeckého procesu,\n\nsdílení a opětovné použití – data mohou být sdílena a používána k dalším výzkumům, což může urychlovat vědecký pokrok,\n\npodpora inovací – otevřený přístup k datům podporuje inovace a nová zjištění, protože umožňuje širokou komunitu výzkumníků využívat a vylepšovat původní data."
definitionLanguage = "cs"

[[term]]
