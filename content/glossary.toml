guideRoute = "term"
id = "fairification"
label = { cs = "FAIRifikace", en = "FAIRification" }
url = "https://heslar.openscience.cz/heslo.php?id=99"
definition = "Proces, v rámci kterého se výzkumná data popisují, transformují, obohacují nebo jinak mění tak, aby zachovávala původní informaci a zároveň splňovala tzv. FAIR principy lépe než původní podoba dat. Data naplňující FAIR principy jsou označována jako FAIR data.\n\n*Termín FAIRifikace spadá do odborného žargonu používaného v rámci otevřené vědy a správy výzkumných dat; kompletní anglické znění: Improving FAIR maturity of data / Improving FAIRness of data."
definitionLanguage = "cs"
