label = { cs = "Evropský cloud pro otevřenou vědu", en = "European Open Science Cloud" }
url = "https://heslar.openscience.cz/heslo.php?id=158"
definition = "Evropská iniciativa zaměřená na rozvoj infrastruktury podporující postupy otevřené vědy v oblasti správy výzkumných dat s cílem vybudovat jednotnou datovou infrastrukturu pro ukládání, archivaci, správu dat a jejich opakované použití, analýzy a sdílení napříč všemi vědeckými disciplínami.\n\nV roce 2023 byla spuštěna iniciativa EOSC CZ zaměřená na implementaci v ČR."
