guideRoute = "term"
id = "triple-helix"
label = { cs = "Triple Helix", en = "Triple Helix" }
url = "https://heslar.openscience.cz/heslo.php?id=84"
definition = "*nemá český ekvivalent\n\nModel inovací založený na interakci a spolupráci akademického sektoru, podniků a veřejné správy, který přispívá k posilování rozvoje ekonomiky a společnosti založené na znalostech. Interakce mezi výzkumnými organizacemi, podniky a veřejnou správou stimulují vznik a rozvoj zprostředkujících subjektů, jako jsou kanceláře (centra) pro transfer znalostí, podnikatelské inkubátory nebo vědeckotechnické parky."
definitionLanguage = "cs"

