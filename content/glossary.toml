guideRoute = "term"
id = "research-data"
label = { cs = "výzkumná data", en = "Research Data" }
url = "https://heslar.openscience.cz/heslo.php?id=110"
definition = "Údaje, které jsou shromažďovány, vytvářeny, zpracovávány nebo analyzovány během výzkumného procesu, a které slouží jako základ pro dosažení výsledků a závěrů daného výzkumu. Tato data mohou mít různé podoby v závislosti na oboru a typu výzkumu a zahrnují jak kvantitativní, tak kvalitativní údaje. Výzkumná data jsou klíčovým zdrojem informací, na kterých jsou založeny vědecké poznatky a výsledky. Mohou být sdílena v rámci vědecké komunity pro další výzkum. Slouží jako podklad pro ověřitelnost a reprodukovatelnost vědeckých studií.\n\nPříklady výzkumných dat:\n\nkvantitativní data – číselné údaje získané např. z měření, průzkumů, experimentů nebo statistických analýz (např. výsledky z dotazníků, měření teploty, časových intervalů)\n\nkvalitativní data – textové, zvukové, obrazové nebo jiné záznamy, které mohou být získány např. z rozhovorů, pozorování, dokumentů nebo videozáznamů (např. přepisy rozhovorů, fotky, terénní poznámky)\n\nexperimentální a observační data – data získaná při provádění laboratorních experimentů nebo data získaná dlouhodobým pozorováním jevů, chování, prostředí apod.\n\nsimulační a modelová data – výstupy z počítačových simulací nebo modelů, které jsou používány k simulaci různých scénářů nebo podmínek\n\ngenetická, biologická nebo medicínská data – údaje z oblasti biologie a medicíny, které mohou zahrnovat genetické sekvence, výsledky klinických studií nebo lékařské obrazy"
definitionLanguage = "cs"

