alternateIds = [{ "scheme" = "heslar", "value" = "178" }]

guideRoute = "term"
id = "lims"
label = { cs = "laboratorní informační systém", en = "Laboratory Information Management System" }
url = "https://heslar.openscience.cz/heslo.php?id=178"
definition = "Softwarové řešení pro moderní podporu provozu laboratoře. Neexistuje zavedená definice pojmu LIMS, protože se používá k označení řady různých komponent informační technologie pro laboratorní práci. Rozsah a hloubka těchto komponent závisí do značné míry na samotné implementaci LIMS. Všechny systémy LIMS mají složku pracovního postupu (workflow) a funkce pro správu získaných dat, ale vedle toho se jejich funkčnost výrazně liší.\n\nObvyklými funkcemi jsou:\n\n• evidence a sledování vzorků (od příjmu po archivaci),\n\n• správa datových záznamů a výsledků měření,\n\n• řízení pracovních postupů a laboratorních procesů,\n\n• integrace s přístroji a dalšími informačními systémy,\n\n• zajištění kvality a auditní stopa (soulad s normami, např. ISO 17025).\n\nLIMS se používá ve výzkumných, klinických, environmentálních, potravinářských a průmyslových laboratořích, kde usnadňuje správu velkého množství dat a podporuje reprodukovatelnost a sdílení výsledků. Může podpořit koncept otevřené vědy."
definitionLanguage = "cs"

