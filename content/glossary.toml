guideRoute = "term"
id = "predatory-journal"
label = { cs = "predátorský časopis", en = "Predatory Journal" }
url = "https://heslar.openscience.cz/heslo.php?id=202"
definition = "Časopis vydávaný obchodním subjektem / vydavatelem s cílem generovat zisk prostřednictvím publikačních poplatků (APC) bez dodržování zavedených standardů vědecké komunikace (text zpravidla neprochází obvyklým peer review / recenzním procesem). Tímto postupem dochází k zneužívání placeného modelu Zlatého OA.\n\nNeexistuje autoritativní seznam predátorských časopisů. Rozpoznání umožňují znaky predátorských postupů.\n\nNeoficiální a nikým garantovaný seznam pravděpodobně predátorských časopisů poskytují webové stránky komunity dobrovolníků zde: https://www.predatoryjournals.org/the-list."
definitionLanguage = "cs"

