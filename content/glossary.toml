guideRoute = "term"
id = "machine-readable-document-format"
label = { cs = "strojově čitelný dokument [formát]", en = "Machine-readable Document [Format]" }
url = "https://heslar.openscience.cz/heslo.php?id=167"
definition = "Dokument nebo datový formát, který je strukturován tak, aby jej bylo možné automatizovaně zpracovávat počítačem bez nutnosti lidské interpretace. Typicky se jedná o data ve standardizovaných formátech s jasně definovanou syntaxí a strukturou (např. HTML, XML, JSON, CSV). Strojově čitelné formáty usnadňují výměnu, agregaci a další zpracování dat, např. v informačních systémech nebo v prostředí otevřených dat.\n\nPříklady použití:\n\nOtevřená data by měla být publikována ve strojově čitelných formátech jako např. JSON, CSV.\n\nPoznámka:\n\nZ čistě technického hlediska jsou některé strojově čitelné formáty (CSV, JSON, HTML, XML) snadno čitelné i pro člověka – programátora. V legislativních a standardizačních dokumentech se však rozlišuje primárně podle účelu: zda je formát určen pro automatizované zpracování nebo pro lidskou percepci."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "168" }]

guideRoute = "term"
id = "hybrid-open-access"
label = { cs = "hybridní cesta otevřeného přístupu", en = "Hybrid Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=168"
definition = "Model otevřeného přístupu, kdy je publikace zveřejněna v časopise s běžným předplatným, avšak autoři zaplatili za její vydání v režimu otevřeného přístupu dodatečný poplatek v podobě APC, jako je tomu při Zlatém OA. V rámci hybridních časopisů umožňujících hybridní model OA je tak veškerý obsah titulu dostupný pouze předplatitelům a jen jeho určitá část může být volně přístupná veřejně."
definitionLanguage = "cs"

