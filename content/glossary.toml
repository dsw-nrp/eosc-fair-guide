alternateIds = [{ "scheme" = "heslar", "value" = "34" }]

guideRoute = "term"
id = "delayed-open-access"
label = { cs = "zpožděný [odložený] otevřený přístup", en = "Delayed Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=34"
definition = "Opožděné uveřejnění v otevřeném režimu (tj. s licencí Creative Commons), ať už se jedná o Zelený OA či Zlatý OA. V případě striktního výkladu pojmu Open Access se v krátkodobém horizontu jedná o protimluv, neboť nevyhovuje podmínce „okamžitá dostupnost“. Avšak v dlouhodobém horizontu, po uplynutí časového embarga (např. po jednom roce), uveřejnění naplní definici Open Access."
definitionLanguage = "cs"

