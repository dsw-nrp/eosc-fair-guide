guideRoute = "term"
id = "data-steward"
label = { cs = "Data Steward", en = "Data Steward" }
url = "https://heslar.openscience.cz/heslo.php?id=69"
definition = "*nemá český ekvivalent\n\nPodporuje správu výzkumných dat. Je odpovědný za udržování kvality, integrity a přístupových opatření k datům a metadatům v rámci celého výzkumného cyklu způsobem, který je v souladu s platnými právními předpisy, institucionální politikou a individuálními oprávněními. To zahrnuje tvorbu plánu správy dat (DMP), správné a odpovědné nakládání s daty od jejich vytvoření a přípravy, přes používání a ukládání, až po archivaci a sdílení či opakované použití. Data Steward funguje jako prostředník mezi různými odděleními instituce. Úzce spolupracuje s hlavními tvůrci a uživateli dat, včetně výzkumných pracovníků a studentů, a poskytuje jim odborné poradenství.\n\nAgenda Data Stewarda zahrnuje:\n\nsprávu výzkumných dat v souladu s FAIR principy,\n\ntvorbu DMP a jeho pravidelnou aktualizaci,\n\nvýběr vhodných datových a metadatových schémat,\n\nzajištění kvality dat a metadat,\n\ndodržování politik institucí a oborových standardů,\n\nzaručení ochrany dat,\n\nvýběr vhodného datového repozitáře či úložiště,\n\npodporu během sdílení dat."
definitionLanguage = "cs"

