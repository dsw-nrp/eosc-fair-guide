guideRoute = "term"
id = "datacite"
label = { cs = "DataCite", en = "DataCite" }
url = "https://heslar.openscience.cz/heslo.php?id=148"
definition = "*nemá český ekvivalent\n\nMezinárodní nezisková organizace, registrační agentura poskytující organizační a technickou infrastrukturu pro registraci a využití digitálního identifikátoru objektu (DOI) v oblasti vědeckého výzkumu. DataCite je po organizaci Crossref druhou nejvýznamnější registrační agenturou pro DOI. DataCite se zaměřuje primárně na oblast výzkumných dat s cílem zlepšit jejich citaci, usnadnit k nim přístup, zvýšit přijetí výzkumných dat jako legitimního, citovatelného příspěvku k vědeckému záznamu a podpořit archivaci dat umožňující následné ověření výsledků výzkumu a jejich opakované použití."
