guideRoute = "term"
id = "ecsa"
label = { cs = "Evropská asociace občanské vědy", en = "European Citizen Science Association" }
url = "https://heslar.openscience.cz/heslo.php?id=157"
definition = "Členská asociace sdružující širokou síť jednotlivců a organizací, které se zajímají o občanskou vědu. Hraje zásadní roli v integraci občanské vědy v Evropě. Poskytuje platformu pro sdílení znalostí, osvědčených postupů a budování kapacit mezi výzkumníky a občany. Umožňuje veřejnost aktivně zapojit do výzkumných projektů zaměřených na řešení klíčových globálních výzev, jako jsou změna klimatu, znečištění, ochrana biodiverzity, veřejné zdraví a další. Zároveň slouží jako komunikační centrum pro občanskou vědu v Evropě a prosazuje její význam na politické úrovni. V roce 2015 vydala tzv. Deset principů občanské vědy (Ten Principles of Citizen Science), které vymezují základní pravidla a etické principy pro projekty občanské vědy."
definitionLanguage = "cs"

