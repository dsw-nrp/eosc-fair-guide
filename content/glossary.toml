guideRoute = "term"
id = "standalone-research-datasets"
label = { cs = "samostatné [výzkumné] datové sady", en = "Standalone [Research] Datasets" }
url = "https://heslar.openscience.cz/heslo.php?id=109"
definition = "Takové sady dat, které jsou z hlediska obsahu, struktury a dokumentace kompletní a použitelné nezávisle na jiných datech. Informace o samostatných výzkumných datových sadách je žádoucí uvádět v DMP. Obvykle mají následující charakteristiky:\n\njednoznačný obsah – obsahují přesně definované údaje nebo informace, které slouží ke specifickým výzkumným účelům; mohou pokrývat jedno konkrétní téma, experiment nebo výzkumnou otázku,\n\nplná dokumentace – zahrnují dokumentaci popisující kontext sběru dat, použité metody, zpracování a strukturu dat, což zajišťuje její srozumitelnost a reprodukovatelnost; dokumentace obvykle obsahuje i metadata k usnadnění interpretace dat,\n\nnezávislost na jiných zdrojích dat – jsou navrženy tak, aby mohly být používány bez nutnosti přístupu k jiným datovým souborům nebo bez závislostí na externích informacích.\n\nK pochopení a analýze dat postačuje uživateli pouze tato datová sada a její dokumentace.\n\nPříklady samostatných výzkumných datových sad:\n\nsoubor měření z jednoho experimentu s přiloženými vysvětlujícími poznámkami\n\ndatová sada z dotazníkového šetření se specifickým zaměřením\n\nvýstupy z počítačové simulace spolu s podmínkami a parametry simulace\n\nSamostatné výzkumné datové sady se používají při sdílení a publikování výzkumných dat. Jsou snadno dostupné pro další výzkumníky, kteří mohou data analyzovat, replikovat studii nebo je využít v souvisejícím výzkumu."
definitionLanguage = "cs"

