guideRoute = "term"
id = "sensitive-data"
label = { cs = "citlivá data / údaje", en = "Sensitive Data" }
url = "https://heslar.openscience.cz/heslo.php?id=421"
definition = "Informace, jejichž šíření je z právních, etických, bezpečnostních, soukromoprávních nebo majetkových důvodů omezeno. Jejich neoprávněné zpřístupnění, zneužití nebo ztráta mohou způsobit újmu / škodu jednotlivci, skupině, organizaci nebo společnosti, proto podléhají ochraně a zvláštním režimům nakládání.\n\nBlíže viz Národní platforma Open Science, Citlivá data."
definitionLanguage = "cs"

