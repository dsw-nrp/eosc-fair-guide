id = "data-curator"
label = { cs = "datový kurátor", en = "Data Curator" }
url = "https://heslar.openscience.cz/heslo.php?id=433"
definition = "Podílí se na formulaci obecných pravidel a pracovních postupů (workflow) pro data ukládaná v repozitáři a rozhoduje o konkrétních datových sadách (např. řeší požadavky na výmaz), stará se o harmonizaci metadat v rámci daného repozitáře v souladu se stanovenými oborovými metadatovými (aplikačními) profily a o interoperabilitu metadat s dalšími systémy. Podílí se na stanovení oborového metadatového (aplikačního) profilu.\n\nOznačení datový kurátor se používá rovněž pro kurátora repozitáře.\n\nSouvisící heslo: kurátorství"
