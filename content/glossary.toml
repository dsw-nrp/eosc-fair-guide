guideRoute = "term"
id = "open-infrastructures"
label = { cs = "otevřené infrastruktury", en = "Open Infrastructures / Open Science Infrastructures" }
url = "https://heslar.openscience.cz/heslo.php?id=430"
definition = "Technologické nástroje, služby, formy spolupráce a zabezpečení odborných znalostí na podporu otevřené vědy. Jsou nezbytné pro její efektivní fungování, umožňují její implementaci a následný rozvoj. Jejich hlavním cílem je podpora vědecké komunity při sdílení publikací, dat a softwaru na principu otevřeného přístup. Založeny jsou na softwaru s otevřeným zdrojovým kódem a otevřených standardech (rozhraní, protokoly, formáty). Přednostně by měly umožňovat strojově čitelné formáty a služby podporující opakované použití a reprodukovatelnost, kvalitní FAIR data, interoperabilitu, dlouhodobé uchovávání, udržitelnost vědeckého výzkumu a udržitelné financování.\n\nPříklady otevřených infrastruktur:\n\nZdroje založené na znalostech (sbírky, časopisy, vědecké a publikační platformy s otevřeným přístupem), institucionální, (mezi)oborové a jiné repozitáře publikací, výzkumných dat, softwary a otevřené kódy.\n\nSlužby pro vyhledávání, vytěžování, publikování, recenzní řízení, uchovávání (ukládání) a archivace, nástroje sociálních sítí, školení, vysoce výkonné výpočty a nástroje pro zpracování analýz.\n\nInformační výzkumné systémy, otevřené bibliometrie a scientometrické systémy pro hodnocení vědeckého výzkumu a analýzu vědeckých oblastí.\n\nOtevřené výpočetní infrastruktury a infrastruktury služeb pro manipulaci s daty umožňující spolupráci a multidisciplinární analýzu dat a digitální infrastruktury.\n\nInternational Science Council rozlišuje dva typy infrastruktur (2020):\n\ntvrdé infrastruktury: výpočetní a komunikační zařízení a sítě k zajištění propojení,\n\nměkké infrastruktury: politiky, procesy, dovednosti a vztahy.\n\nUNESCO v dokumentu Doporučení pro otevřenou vědu (Recommendation on Open Science, 2021) definuje otevřené infrastruktury jako jedny ze čtyř klíčových složek otevřené vědy. Zároveň vyzívá k trvalým investicím a financování. V roce 2022 UNESCO s cílem vybudovat infrastruktury pro otevřenou vědu vydalo dokument Posílení otevřených vědeckých infrastruktur pro všechny (Bolstering open science infrastructures for all).\n\nPřehled velkých výzkumných infrastruktur ČR, které jsou zpřístupňovány všem potenciálním uživatelům na principu otevřeného přístupu, je k dispozici na webu Velké výzkumné infrastruktury.\n\nVýběrový přehled infrastruktur pro otevřenou vědu v ČR a zahraničí je k dispozici na webu Národní platforma Open Science v sekci Podpora."
definitionLanguage = "cs"

