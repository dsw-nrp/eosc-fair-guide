definition = "*nemá český ekvivalent\n\nJeden z několika nových přístupů k převodu publikací na otevřený přístup, který se pragmaticky snaží stavět na zachování existujících předplatných. S2O umožňuje vydavatelům převést časopisy z předplatného na otevřený přístup, a to po jednom roce. Pomocí S2O nabízí vydavatel stávajícím předplatitelům časopisu trvalý přístup. Pokud se všichni stávající předplatitelé zúčastní nabídky S2O (jednoduše tím, že se neodhlásí), vydavatel zpřístupní obsah, na který se vztahuje předplatné na daný rok. Pokud účast není dostatečná, například pokud někteří předplatitelé odkládají obnovení v očekávání, že získají přístup bez účasti, zůstává obsah daného ročníku uzavřen, tj. je přístupný pouze pro předplatitele."
