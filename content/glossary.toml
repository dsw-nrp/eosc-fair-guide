guideRoute = "term"
id = "proprietary-software"
label = { cs = "proprietární software / software s uzavřeným kódem", en = "Proprietary-Software / Closed-Source Software" }
url = "https://heslar.openscience.cz/heslo.php?id=106"
definition = "Typ softwaru, jehož zdrojový kód není veřejně dostupný ani volně přístupný k úpravám. Tento software je vlastněn a kontrolován konkrétní společností nebo autorem, který uživatelům poskytuje pouze binární formu programu a omezená práva na jeho používání. Licenční podmínky proprietárního softwaru obvykle zakazují úpravy, kopírování a redistribuci kódu.\n\nCharakteristiky proprietárního softwaru jsou:\n\nuzavřený zdrojový kód – zdrojový kód je neveřejný, což znamená, že jej uživatelé nemohou zobrazit, analyzovat ani upravit,\n\nlicenční omezení – licenční smlouva omezuje, jak může být software používán, sdílen nebo instalován; typicky je zakázáno jeho kopírování nebo redistribuce bez povolení vlastníka,\n\nzávislost na výrobci – aktualizace, opravy chyb a technická podpora jsou plně závislé na výrobci softwaru; uživatelé jsou odkázáni na podporu a aktualizace poskytované vlastníkem,\n\nplatby a licenční poplatky – proprietární software je často distribuován za úplatu, což může zahrnovat jednorázový poplatek, předplatné nebo jiné formy licenčních poplatků.\n\nPříklady proprietárního softwaru zahrnují operační systémy jako Microsoft Windows nebo Apple MacOS, a mnoho komerčních programů, jako jsou Adobe Photoshop nebo Microsoft Office. Proprietární software poskytuje uživatelům standardizované funkce, avšak za cenu omezené flexibility a absence přístupu k samotnému zdrojovému kódu."
definitionLanguage = "cs"

