guideRoute = "term"
id = "copyleft"
label = { cs = "copyleft", en = "Copyleft" }
url = "https://heslar.openscience.cz/heslo.php?id=143"
definition = "*nemá český ekvivalent\n\nPrávní koncept, který umožňuje svobodné užívání autorského díla (např. softwaru, textu, obrázku), ale zároveň stanovuje podmínku, že jakékoliv odvozené dílo musí být dále sdíleno pod stejnými nebo pod kompatibilními podmínkami. Cílem copyleftu je zajistit, aby jednou poskytnutá svoboda užití byla zachována i v budoucích úpravách, rozšířeních a derivacích daného díla.\n\nNa rozdíl od tradičního modelu ochrany autorským právem, jehož primární funkcí je omezit užívání díla třetími osobami, využívá copyleft právě nástroje autorského práva k zajištění otevřenosti. Autor si zachovává svá práva, ale výslovně uděluje oprávnění k užití, modifikaci a dalšímu šíření díla – ovšem pod podmínkou reciprocity. Tato reciproční povinnost je jádrem copyleftu a odlišuje jej od permisivních licencí, které umožňují volné užití bez zpětné otevřenosti.\n\nCopyleft může být silný (např. GNU General Public License – GPL), kdy požadavek sdílení za stejných podmínek platí i pro kombinaci s jiným softwarem nebo slabý (např. LGPL), kdy se podmínka vztahuje pouze na modifikace původního kódu, nikoli na celé propojené dílo. V kontextu nesoftwarových autorských děl je nejvýznamnějším příkladem licence Creative Commons Uveďte původ – Zachovejte licenci (CC BY-SA), s prvkem ShareAlike, v češtině známým jako „Zachovejte licenci“. Tato licence stanovuje, že uživatel smí dílo volně používat a upravovat, pokud výslovně uvede původ díla a nově vzniklé dílo bude distribuovat pod totožnou licencí. Typickým příkladem využití je Wikipedie.\n\nCopyleft je nejen právní nástroj, ale i kulturně politický koncept. Vyjadřuje důraz na spolupráci, udržitelnost sdílení a obranu proti uzavírání původně otevřených děl. V oblasti softwaru podnítil rozvoj robustních komunit a projektů (Linux, LibreOffice, WordPress), zatímco ve vědě a vzdělávání přispívá k rozšiřování otevřených vzdělávacích zdrojů (OER) a open access publikací. Copyleft je klíčovým nástrojem pro zachování svobody v digitálním prostředí. Umožňuje sdílet, učit se, tvořit a stavět na práci ostatních – ale vyžaduje odpovědnost: stejné svobody musíte poskytnout i vy. Jde o živý příklad toho, jak lze autorské právo uchopit ne jako překážku, ale jako prostředek pro podporu otevřeného a spolupracujícího ekosystému."
definitionLanguage = "cs"

