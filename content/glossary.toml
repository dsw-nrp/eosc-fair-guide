guideRoute = "term"
id = "erac"
label = { cs = "Výbor pro Evropský výzkumný prostor a inovace", en = "European Research Area and Innovation Committee" }
url = "https://heslar.openscience.cz/heslo.php?id=160"
definition = "Poradní orgán Evropské komise (EK) a členských států, který se podílí na formování a rozvoji ERA. Skládá se ze zástupců EK a členských států a podporuje koordinaci výzkumných a inovačních politik v Evropě. ERAC hraje důležitou roli při stanovování priorit a strategického směru ERA včetně podpory otevřené vědy a výzkumných infrastruktur."
definitionLanguage = "cs"

