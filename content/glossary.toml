definition = "Informační systém, databáze nebo úložiště určené k dlouhodobému uchovávání a zpřístupňování digitálních objektů zajišťující jejich ochranu, integritu, autenticitu, dohledatelnost, opakovanou použitelnost a současně podporující používání perzistentních identifikátorů a standardizovaných metadat.\n\nPoskytuje spolehlivý a dlouhodobý přístup k organizovaným datovým sadám v dlouhodobém horizontu uživatelům na FAIR principech. Důvěryhodnost takového repozitáře musí být kdykoli možné objektivně testovat a vyhodnotit na základě předem stanovených kritérií, mezi která patří například schopnost zajistit kontinuitu financování veškerého provozu. Testování a vyhodnocení může vykonávat externí subjekt."
