guideRoute = "term"
id = "postprint"
label = { cs = "postprint / akceptovaná verze / akceptovaný rukopis po recenzním řízení", en = "Postprint / Accepted Version / Author Accepted Manuscript" }
url = "https://heslar.openscience.cz/heslo.php?id=201"
definition = "Označení pro finální verzi vědeckého článku, kterou vydavatel přijal k publikování po zapracovaní připomínek recenzentů autorem, ale ještě neprošla grafickými úpravami a formátováním vydavatele. V angličtině je postprint často označován jako Author Accepted Manuscript.\n\nSouvisící heslo: preprint."
definitionLanguage = "cs"

