guideRoute = "term"
id = "underlying-data"
label = { cs = "podkladová [podpůrná, doprovodná] data", en = "Underlying Data" }
url = "https://heslar.openscience.cz/heslo.php?id=105"
definition = "Data včetně metadat potřebná k interpretaci a validaci výsledků prezentovaných ve vědeckých publikacích a v dalších výstupech výzkumu, pokud je toto vzhledem k charakteru výzkumu možné. Doplňují a podporují tak hlavní výzkumná data nebo výsledky studie. Poskytují kontext, metodologické informace nebo další detaily, které jsou nezbytné pro správné porozumění hlavním výzkumným datům a jejich interpretaci. Jsou důležitá pro podporu transparentnosti a otevřenosti ve vědeckém výzkumu, zejména v kontextu otevřené vědy, kde se klade důraz na sdílení všech relevantních informací pro zajištění replikovatelnosti a ověřitelnosti výzkumu.\n\nPodkladová data mohou zahrnovat např. výpočty, skripty, experimentální protokoly nebo výsledky předběžných analýz, které nejsou součástí finálních výzkumných závěrů, ale jsou klíčová pro jejich reprodukovatelnost a validaci.\n\nCharakteristiky podkladových dat jsou:\n\ndoplňují hlavní výzkumná data – poskytují potřebný kontext nebo dodatečné informace k hlavním datům, čímž zvyšují jejich hodnotu pro výzkumníky a umožňují lepší interpretaci,\n\nzajišťují reprodukovatelnost výzkumu – bez podkladových dat je obtížnější replikovat nebo ověřit výzkumné výsledky, protože poskytují podrobnosti o použitých metodách, nástrojích a výpočtech,\n\nformáty – mohou mít různé formy, např.:\n\nmetodologické dokumenty – popis výzkumných metod a přístupů,\n\nkódy a skripty – programovací kódy použité pro analýzu dat,\n\nprotokoly – záznamy o postupech a experimentálních podmínkách,\n\npředběžné analýzy – mezivýsledky nebo analýzy, které nebyly součástí finálního výstupu.\n\nPoznámka: Označení Underlying Data a jeho české varianty mohou být různými aktéry používány různě, např. někteří vydavatelé takto označují všechna data, o která se studie opírá, tj. bez rozlišování mezi hlavními a podpůrnými daty. Nutno ověřovat u vydavatelů jejich interpretaci pojmu."
definitionLanguage = "cs"

