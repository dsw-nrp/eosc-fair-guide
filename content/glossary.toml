url = "https://heslar.openscience.cz/heslo.php?id=422"
definition = "Volně dostupná a použitelná data pro široké spektrum uživatelů s možností jejich volného použití, úprav a sdílení bez zásadních omezení za jakýmkoli účelem.\n\nBlíže viz Národní platforma Open Science, sekce Open Data."
definitionLanguage = "cs"

