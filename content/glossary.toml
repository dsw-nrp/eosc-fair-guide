guideRoute = "term"
id = "linked-open-data"
label = { cs = "propojená [otevřená] data", en = "Linked [Open] Data" }
url = "https://heslar.openscience.cz/heslo.php?id=180"
definition = "Sada principů umožňující publikovat data na webu tak, že se mohou odkazovat na jiná data publikovaná tímto způsobem bez ohledu na zdroj, ze kterého data pochází. Principy odpovídají tomu, jak funguje současný web dokumentů – webových stránek.\n\nPrincipy propojených dat:\n\nVšechny entity se pojmenovávají pomocí identifikátoru IRI (Internationalized Resource Identifier).\n\nPro přístup k informacím se používá HTTP(S).\n\nPři přístupu na IRI jsou poskytnuta data o dané entitě v modelu RDF (Resource Description Framework).\n\nSoučástí dat jsou reference na jiná souvisící data."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "181" }]

guideRoute = "term"
id = "human-readable-document"
label = { cs = "člověkem čitelný dokument / formát", en = "human-readable document / format" }
url = "https://heslar.openscience.cz/heslo.php?id=181"
definition = "Dokument nebo datový formát, který je navržen především pro snadné čtení a porozumění člověkem. Obsahuje informace uspořádané do podoby vhodné pro vizuální vnímání, ale není optimalizován pro automatizované zpracování. Typické příklady jsou textové soubory, dokumenty ve formátu PDF nebo webové stránky v HTML bez dodatečných strukturálních dat. Člověkem čitelné formáty se často používají pro publikaci informací, jejichž hlavním účelem je informovat nebo komunikovat s lidmi.\n\nPříklady použití:\n\nZpráva je dostupná pouze v podobě PDF, tedy v člověkem čitelném formátu.\n\nPoznámka:\n\nTechnicky vzato jsou i „strojově čitelné“ formáty (CSV, JSON) snadno čitelné člověkem, zatímco některé „lidsky čitelné“ formáty (PDF, DOCX) jsou bez příslušného softwaru člověkem prakticky neinterpretovatelné. Standardizační praxe však rozlišuje podle zamýšleného účelu: zda formát primárně komunikuje s člověkem nebo slouží pro automatizované zpracování."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "182" }]

guideRoute = "term"
id = "metadata"
label = { cs = "metadata / metadatový záznam", en = "Metadata / Metadata record" }
url = "https://heslar.openscience.cz/heslo.php?id=182"
definition = "Strukturované údaje (data o datech) popisující primární (digitální) objekt (výzkumná data, publikace, obrazové informace aj.) za účelem identifikace a dohledatelnosti. Stěžejně popisují autorství, původ, místo vydání, datum vydání, typ objektu, jakým způsobem data vznikala. Obvykle se rozlišují metadata popisná (popis objektu pro potřeby vyhledávání a identifikace), technická (uvádějí, jak se systém nebo jeho obsah chová nebo co požaduje, aby mohl být provozován/zobrazen), strukturální (definující vnitřní organizaci digitálního objektu) a administrativní (pro potřeby správy objektu a řízení přístupu k němu). Existují různé standardy, určující rozsah a formu metadat, např. Dublin Core, DataCite, MARC21 aj. Metadatové záznamy mohou být zobrazovány v různých reprezentacích (XML, JSON, YAML aj.).\n\nSouvisící heslo: centrální metadatový model."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "183" }]

guideRoute = "term"
id = "ontology"
label = { cs = "ontologie", en = "Ontology" }
url = "https://heslar.openscience.cz/heslo.php?id=183"
definition = "(z řec. ὄντος – ontos = jsoucí, bytí; λόγος – logos = nauka, rozum)\n\n1. Ve filozofických směrech nauka o bytí a vztahu mezi bytím a pozná[vá]ním.\n\n2. V informatice, zejména v oblasti sémantického webu – definice pojmů a vztahů mezi nimi.\n\nDalší se týká pojmu ontologie v informatice.\n\nPřesněji řečeno, jde o formální a explicitní sdílenou specifikaci konceptualizace obvykle určité věcné oblasti.\n\nCílem ontologie je definovat společné, jednotné chápání určité třídy pojmů. Ontologie by ve výsledku měla podporovat porozumění mezi lidmi (výzkumní pracovníci), komunikaci mezi počítačovými systémy či usnadnění návrhu znalostně-orientovaných aplikací. Ontologií dokážeme znázornit komplexnost vztahů mezi znalostmi. Na rozdíl od taxonomie, která využívá jednoduchou hierarchii, představuje ontologie síť hierarchií, v níž informace jsou nebo mohou být vzájemně propojeny logickými vztahy. Tyto vztahy jsou založeny na vlastnostech, které musejí být informacím specificky přiřazeny. Prvky, které spolu takto souvisejí, jsou pak vytvořeny sémanticky. Ontologie se skládají z velkého počtu složek, např. pojem (koncepce), instance a relace."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "185" }]

guideRoute = "term"
id = "open-access-scholarly-publishers"
label = { cs = "Open Access Scholarly Publishers Association", en = "Open Access Scholarly Publishers Association" }
url = "https://heslar.openscience.cz/heslo.php?id=185"
definition = "*nemá český ekvivalent\n\nMezinárodní společenství zastupující různorodou komunitu organizací zabývající se publikováním v oblasti otevřené vědy a usilující o podporu a umožnění otevřeného přístupu jako převládajícího modelu vědecké komunikace. Mezi členy patří vědci, vydavatelé knih a časopisů, publikační / vydavatelské infrastruktury a další poskytovatelé služeb. Členství je podmíněno splněním přísných kritérií. Stránky společenství zveřejňují přehled OA vydavatelů."
definitionLanguage = "cs"

