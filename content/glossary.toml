guideRoute = "term"
id = "bronze-open-access"
label = { cs = "Bronzová cesta otevřeného přístupu", en = "Bronze Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=39"
definition = "Označení pro volně dostupné články, které však nemají připojenou žádnou explicitní volnou licenci. Bez licence je možné články volně číst, ale nelze je dále šířit nebo používat. Bez výslovného povolení je také nelze vytěžovat pomocí počítačového softwaru. V případě striktního výkladu pojmu Open Access se jedná o protimluv, neboť není naplněna podmínka dostatečných práv pro šíření článků v digitálním prostředí a naplněna není ani po libovolně dlouhé době. Bronzový OA není otevřený přístup, nýbrž tzv. veřejný přístup (Public Access). Někdy je Bronzový OA označován jako Free Access nebo Gratis Access."
definitionLanguage = "cs"

