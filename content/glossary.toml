guideRoute = "term"
id = "green-open-access"
label = { cs = "Zelená cesta otevřeného přístupu", en = "Green Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=36"
definition = "Model otevřeného přístupu založený na autoarchivaci, kdy typicky autor (nebo jeho zaměstnavatel) publikuje článek v časopisu přístupném na základě předplatného a v otevřeném repozitáři (institucionální, oborový, univerzální aj.) nebo na preprintových serverech zpřístupní verzi, kterou vydavatel nebo zákonná opatření umožňují zveřejnit. Tato verze může být autorský rukopis před recenzním řízením (preprint) nebo akceptovaný rukopis po recenzním řízení (postprint), avšak obvykle není možné zveřejnit vydavatelskou verzi (published version)."
definitionLanguage = "cs"

