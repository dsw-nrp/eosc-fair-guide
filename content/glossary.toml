alternateIds = [{ "scheme" = "heslar", "value" = "186" }]

guideRoute = "term"
id = "oai-pmh"
label = { cs = "Open Archives Initiative Protocol for Metadata Harvesting", en = "Open Archives Initiative Protocol for Metadata Harvesting" }
url = "https://heslar.openscience.cz/heslo.php?id=186"
definition = "*nemá český ekvivalent\n\nProtokol vyvinutý pro harvestování (automatické sklízení) metadatových záznamů z repozitářů, archivů a jiných systémů. Protokol je založen na běžných standardech používaných na webu – HTTP a XML, umožňuje interoperabilitu systémů založenou na získávání metadat bez závislosti na jejich softwarovém řešení. Protokol vytvořila a rozvíjí organizace Open Archives Initiative (OAI). Na základě dotazů poskytovatele služby (service provider, harvester) odpovídá poskytovatel dat (data provider, typicky repozitář) a poskytuje odpovědi v XML formátu (informace o repozitáři a jeho obsahu identifikátory záznamů nebo samotné požadované záznamy).\n\nOAI-PMH obsahuje sadu šesti požadavků:\n\nIdentify – zašle identifikační údaje repozitáře,\n\nListMetadataFormats – zašle seznam podporovaných formátů v repozitáři,\n\nListRecords – zašle seznam záznamů vystavených prostřednictvím OAI-PMH,\n\nListIdentifiers – zašle seznam identifikátorů záznamů,\n\nListSets – zašle seznam setů záznamů,\n\nGetRecord – zašle konkrétní záznam dle specifikace."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "187" }]

guideRoute = "term"
id = "open-code"
label = { cs = "otevřený [zdrojový] kód", en = "Open Code / Open Source" }
url = "https://heslar.openscience.cz/heslo.php?id=187"
definition = "Software, který lze volně podle potřeby upravit pro vlastní použití (a s některými licencemi i pro další šíření, případně i komerční), a to proto, že je dán volně k dispozici včetně zdrojového kódu. Tento přístup podporuje transparentnost, spolupráci a inovace v rámci komunity vývojářů i uživatelů.\n\nHlavní principy otevřeného kódu:\n\n• Dostupnost zdrojového kódu – každý má přístup k původnímu textu programu.\n\n• Možnost úprav a sdílení – licence (např. GNU GPL, MIT, Apache) umožňují legálně měnit, užívat a distribuovat software.\n\n• Spolupráce komunity – vývoj probíhá otevřeně, s přispěním mnoha autorů.\n\nOtevřený kód zajišťuje nezávislost na komerčních dodavatelích, rychlejší inovaci a vyšší bezpečnost díky kontrole kódu veřejností. Na druhé straně nezávislý rozvoj může znamenat vývoj slepých uliček, opuštěných řešení a podobně.\n\nPříklady úspěšných projektů: Linux, Python, Firefox, Thunderbird, LibreOffice."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "188" }]

guideRoute = "term"
id = "open-data-commons"
label = { cs = "Open Data Commons", en = "Open Data Commons" }
url = "https://heslar.openscience.cz/heslo.php?id=188"
definition = "Soubor otevřených licencí určených pro právní ochranu a sdílení databází a datových souborů / sad, vyvinutý organizací Open Knowledge Foundation (OKF). Tyto licence umožňují legální sdílení, užívání, upravování a šíření otevřených dat, a to za předem stanovených podmínek, podobně jako open source licence v oblasti softwaru.\n\nOpen Data Commons představuje specializované licenční nástroje pro otevřené sdílení dat a databází. Poskytuje právní jistotu pro uživatele i poskytovatele dat a umožňuje flexibilní nakládání s daty v souladu s evropským i mezinárodním právem. Klíčovým prvkem je důraz na transparentnost podmínek užití a podporu opakovaného používání datových zdrojů."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "190" }]

guideRoute = "term"
id = "open-licence"
label = { cs = "otevřená licence / otevřené licencování", en = "Open Licence / Open Licencing" }
url = "https://heslar.openscience.cz/heslo.php?id=190"
definition = "Otevřené licencování je způsob, jak autor nebo jiný nositel práv zpřístupňuje své dílo širšímu okruhu uživatelů bez nutnosti individuálně sjednané smlouvy. Licenční podmínky jsou předem určeny, veřejně dostupné a stejné pro všechny, kdo je přijmou – zpravidla jednáním v souladu s nimi (např. stažením, šířením nebo úpravou díla).\n\nTím se otevřená licence liší od tradičních licencí uzavíraných individuálně. Licenční vztah vzniká na základě přijetí veřejného návrhu smlouvy podle § 2358 občanského zákoníku – otevřená licence je tedy vždy i licencí veřejnou, ale její specifikem je rozsah poskytnutých oprávnění, nikoli pouze právní forma. Podmínky otevřených licencí mohou být různě nastavené – mohou vyžadovat uvedení autora (atribuci), ukládat povinnost šířit úpravy pod stejnou licencí (ShareAlike) nebo naopak omezovat komerční využití (NonCommercial) či úpravy (NoDerivatives). Společným rysem je však důraz na možnost dílo dále používat, sdílet a rozvíjet.\n\nPojem otevřená licence označuje užší skupinu licencí, která spadá pod širší pojem veřejná licence. Ne každá veřejná licence je otevřená – rozhodující je, zda licence umožňuje alespoň některé formy aktivního nakládání s dílem (šíření, úpravy, kombinování apod.). Otevřené licence jsou klíčovým právním nástrojem v řadě oblastí, kde je důležité umožnit opakované použití děl: v otevřeném přístupu k vědeckým publikacím, u otevřených dat, ve svobodném softwaru, otevřeném vzdělávání (otevřené vzdělávací zdroje) a digitální kultuře."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "192" }]

guideRoute = "term"
id = "orcid"
label = { cs = "Open Researcher and Contributor Identifier", en = "Open Researcher and Contributor Identifier" }
url = "https://heslar.openscience.cz/heslo.php?id=192"
definition = "*nemá český ekvivalent\n\nPerzistentní / trvalý identifikátor osob v podobě šestnáctimístného alfanumerického kódu, který je mezinárodně uznáván jako standard pro jedinečnou a trvalou identifikaci osob zapojených do výzkumných a publikačních procesů ve vědě. ORCID iD umožňuje od sebe odlišit autory stejného nebo podobného jména, stejně jako vyřešit problémy spojené s uvedením jména v různých formách. Jednoznačně identifikuje výzkumníky v průběhu celé jejich kariéry bez ohledu na aktuální afiliaci či zemi působení. ORCID iD je kompatibilní s mezinárodním standardem pro identifikaci jmen ISO 27729 Information and documentation – International standard name identifier (ISNI).\n\nORCID iD si zakládají výzkumníci sami a zadarmo. Poté jej výzkumníci uvádějí v souvislosti se svou výzkumnou činností, např. v metadatech článků nebo datových sad, na nichž se podíleli, při vykazování výsledků výzkumu nebo v příspěvcích na konferencích. Jeho použití podporuje Evropská komise, je vyžadován např. v programu Horizon Europe. V ČR pro vykazování v databázi Rejstřík informací o výsledcích (RIV) v českém IS VaVaI je uvádění ORCID iD podmíněně povinné.\n\nORCID iD je propojen s profilem ORCID (např. https://orcid.org/0000-0003-1395-0841). Profil ORCID může výzkumníkům sloužit jako profesionální curriculum vitae (CV) s informacemi o jejich vzdělání, afiliaci, publikační činnosti, oceněních, získaných grantech a o dalších odborných činnostech. Nad obsahem profilu má plnou kontrolu jeho vlastník. Ten případně může umožnit, aby jeho profil aktualizovaly důvěryhodné organizace nebo osoby, čímž omezí potřebu zadávat na svůj profil informace manuálně.\n\nPři publikování nyní časopisy často vyžadují ORCID iD a čerpají informace z profilu ORCID např. afiliaci, související granty, které používají k vyplnění formuláře pro podání příspěvku. Jakmile je článek přijat, časopis uvede ORCID iD v publikovaném článku. ORCID iD je indexován v hlavních vyhledávacích platformách (např. Google, Scopus, Web of Science, WorldCat) a ORCID profil je doplněn o informace o článku (DOI, název a údaje o časopisu), pokud k tomu dá vlastník profilu svolení.\n\nORCID iD spravuje nezávislá nezisková organizace ORCID a na rozdíl od proprietárních identifikátorů ResearcherID a Scopus Author ID tento identifikátor není spjat s komerčními platformami."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "193" }]

guideRoute = "term"
id = "open-science"
label = { cs = "otevřená věda", en = "Open Science" }
url = "https://heslar.openscience.cz/heslo.php?id=193"
definition = "Open Science – otevřená věda představuje přístup k vědeckému poznání, jehož cílem je zvýšit transparentnost a reprodukovatelnost výzkumu prostřednictvím zpřístupnění jeho výsledků a postupů. Jedná se o kulturně a společensky transformativní proces podporující sdílení a opakované využívání výzkumných dat a informací s pomocí moderních digitálních technologií a komunikačních nástrojů.\n\nPředpokládá se, že postupy otevřené vědy by mohly přispět k urychlení a zvýšení efektivity výzkumu a zlepšení jeho kvality a postupně přinášet hospodářský, sociální a kulturní prospěch nejen veřejnému sektoru, ale také podnikové sféře (zejména malým a středním podnikům), a obecně celé společnosti.\n\nV České republice je účinná legislativní úprava podle zákona č. 328/2025 Sb. o výzkumu, vývoji, inovacích a transferu znalostí (Část první, Úvodní ustanovení, § 2 Vymezení pojmů (3) b))."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "197" }]

guideRoute = "term"
id = "open-source-software"
label = { cs = "software s otevřeným [přístupným] zdrojovým kódem", en = "Open Source Software" }
url = "https://heslar.openscience.cz/heslo.php?id=197"
definition = "Takový software, jehož zdrojový kód je zpřístupněn veřejnosti a může být volně používán, studován, upravován a dále šířen, a to za podmínek stanovených příslušnou licencí. Na rozdíl od proprietárního softwaru není přístup ke zdrojovému kódu omezen jen na původní tvůrce či výrobce.\n\nKaždý počítačový program (software) je napsán v tzv. zdrojovém kódu – textu, kterému rozumějí programátoři, ale i počítač. U běžného (komerčního) softwaru k tomuto kódu uživatelé přístup nemají. U softwaru s otevřeným zdrojovým kódem je ale tento kód veřejný. To znamená, že kdokoli si jej může prohlédnout, upravit podle svých potřeb, opravit chyby nebo přidat nové funkce – pokud přitom dodrží podmínky stanovené licencí.\n\nPříkladem takového softwaru je například operační systém Linux, kancelářský balík LibreOffice nebo internetový prohlížeč Mozilla Firefox.\n\nZ hlediska práva duševního vlastnictví jde o software chráněný autorským právem, jehož užívání je umožněno licenční smlouvou open source typu. Tyto licence poskytují uživatelům rozsáhlá oprávnění (užití, šíření, modifikace, i komerční využití) a současně stanovují podmínky, za nichž je tato svoboda vykonávána.\n\nJe důležité rozlišit mezi:\n\notevřeným zdrojovým kódem (open source) – zahrnuje i oprávnění upravovat, šířit a vytvářet odvozená díla,\n\npřístupným zdrojovým kódem (source-available) – kód je k nahlédnutí, ale bez práv k jeho úpravám a dalšímu šíření (pouze „čitelnost“, nikoliv svoboda užití).\n\nPouhý přístup ke kódu proto ještě nezaručuje open source režim. Rozhodující je licenční smlouva."
definitionLanguage = "cs"

