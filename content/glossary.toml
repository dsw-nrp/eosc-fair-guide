alternateIds = [{ "scheme" = "heslar", "value" = "203" }]

guideRoute = "term"
id = "preprint"
label = { cs = "preprint / originální verze autora / autorský rukopis před recenzním řízením", en = "Preprint / Author’s Original Manuscript" }
url = "https://heslar.openscience.cz/heslo.php?id=203"
definition = "Označení verze vědeckého článku, která ještě neprošla recenzním řízením. Preprinty jsou typicky odesílány do tradičních akademických časopisů k recenznímu řízení a je možné je sdílet například prostřednictvím preprintových serverů nebo repozitářů.\n\nSouvisící heslo: postprint."
definitionLanguage = "cs"

