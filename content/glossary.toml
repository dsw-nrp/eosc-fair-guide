guideRoute = "term"
id = "publishing-platform"
label = { cs = "publikační platforma", en = "Publishing Platform" }
url = "https://heslar.openscience.cz/heslo.php?id=377"
definition = "Digitální služba umožňující ve webovém prostředí autorům publikovat, zveřejňovat, sledovat a distribuovat digitální obsah. Tyto platformy poskytují nástroje a funkce, které usnadňují sdílení různých typů obsahu, včetně článků, blogů, elektronických knih, časopisů a dalších. Pro zveřejňování výsledků projektů financovaných EU (Horizon 2020, Horizon Europe 2021–2027) ve všech vědních oborech Evropská komise financuje a spravuje publikační platformu Open Research Europe (ORE). Platforma je indexovaná v databázi Scopus."
definitionLanguage = "cs"

