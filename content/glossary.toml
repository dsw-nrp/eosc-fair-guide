guideRoute = "term"
id = "fair-principles"
label = { cs = "FAIR principy", en = "FAIR principles" }
url = "https://heslar.openscience.cz/heslo.php?id=77"
definition = "FAIR je zkratka ze čtyř anglických přídavných jmen označující tyto principy pro (meta)data: nalezitelná (Findable), dostupná (Accessible), interoperabilní (Interoperable) a opakovaně použitelná (Reusable). Tyto principy se detailně dají popsat 15 body:\n\n1. Findable – dohledatelná / nalezitelná. Data mají být nalezitelná jak pro lidi (např. skrze webové vyhledávače), tak i pro stroje (např. pro tvorbu indexů těchto vyhledávačů). V praxi je tento cíl podporován kvalitním, veřejně dostupným a strojově čitelným metadatovým popisem dat a používáním jednoznačných perzistentních / trvalých identifikátorů (PID), která na data ukazují.\n\nF1. (meta)datům je přiřazen jedinečný a perzistentní identifikátor (např. DOI).\n\nF2. data jsou popsána dostatečnými metadaty.\n\nF3. (meta)data jsou registrována nebo indexována v prohledávatelných zdrojích.\n\nF4. metadata zahrnují identifikátor datové sady.\n\nNalezitelnost znamená, že lze data i metadata spolehlivě najít – lidmi i stroji. Zajišťují ji jednoznačné identifikátory, kvalitní a strojově čitelný popis a zařazení do zdrojů, které lze prohledávat. Bez nalezitelnosti nemají ostatní vlastnosti smysl.\n\n2. Accessible – přístupná / dostupná. Technické řešení přístupu k datům a metadatům musí používat standardní otevřené protokoly (např. https://) obvyklé v daném oboru. FAIR data nemusí být přístupná volně – pak i autentizační mechanismy mají být běžné a standardní (např. OpenID Connect) v daném oboru. Pokud jsou sama data nepřístupná (neveřejná, anebo byla smazána), alespoň metadata by měla být stále volně dostupná pro podporu principu dohledatelnosti / nalezitelnosti a trvalý historický záznam o již neexistujících datech.\n\nA1. (meta)data lze získat pomocí jejich identifikátorů při využití standardních komunikačních protokolů.\n\nA1.1 protokol je otevřený, zdarma k dispozici a univerzálně použitelný.\n\nA1.2 protokol umožňuje v případě potřeby autentizaci a autorizaci.\n\nA2. metadata jsou dostupná i v případě, že data samotná již nejsou k dispozici.\n\nPřístupnost vyjadřuje, že se k (meta)datům lze technicky dostat pomocí běžných a otevřených komunikačních postupů používaných v daném oboru. Pokud to povaha dat vyžaduje, lze využít mechanismů autentizace a autorizace. Přístupnost neznamená, že data musí být otevřená — pouze, že cesta k nim je jasně definovaná.\n\n3. Interoperable – interoperabilní / standardizovaná. Obdoba Accessible, ale ne o přístupových protokolech, ale o datech samotných. Data i metadata mají být ve strojově čitelných a pokud možno otevřených formátech obvyklých v daném vědním oboru. Na jiná data / metadata se má odkazovat pomocí standardních perzistentních identifikátorů.\n\nI1. (meta)data používají pro reprezentaci znalostí formální, dostupný, sdílený a široce aplikovatelný jazyk.\n\nI2. (meta)data používají slovníky, které se řídí zásadami FAIR.\n\nI3. (meta)data obsahují reference na další (meta)data.\n\nPropojitelnost (interoperabilita) znamená schopnost dat a metadat být kombinována, sdílena a zpracovávána napříč různými systémy a nástroji bez nutnosti individuálních úprav. To umožňují sdílené formáty, standardy, řízené slovníky a jednoznačné identifikátory. Díky tomu mohou data „spolupracovat“, tj. být využívána i mimo prostředí, kde vznikla.\n\n4. Reusable – opakovaně použitelná. Spíše cíl, ke kterému se směřuje předchozími body, než samostatný princip. Má být podporován jasnou deklarací licence pro daná data s preferovaným užitím otevřených licencí (např. CC0, CC-BY).\n\nR1. meta(data) mají množství přesných a relevantních atributů.\n\nR1.1 (meta)data jsou zveřejněna s jasnou a dostupnou licencí.\n\nR1.2 (meta)data jsou spojena se svým původem.\n\nR1.3 (meta)data splňují standardy vědecké komunity pro daný obor.\n\nZnovupoužitelnost / opakované použití (reusability) znamená, že data lze smysluplně využít i v jiném kontextu, než pro který vznikla. Umožňuje to dostatečný popis, jasné licenční podmínky, doložený původ a respektování oborových standardů. Právě tato vlastnost je hlavním cílem principů FAIR."
definitionLanguage = "cs"

