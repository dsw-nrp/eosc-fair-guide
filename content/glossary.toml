definition = "Softwarový nástroj digitálně nahrazující papírové laboratorní zápisníky ve vědě běžně používané k zaznamenávání experimentálních výsledků. Umožňuje výzkumníkům přístup k výsledkům experimentů, jejich vyhledávání a sdílení. V ELN mohou výzkumníci dokumentovat protokoly, laboratorní činnost, pozorování, poznámky a další data v elektronickém formátu a z různých zařízení.\n\nVýhody ELN oproti papírovým zápisníkům:\n\n· podpora efektivních postupů správy výzkumných dat\n\n· bezpečnost dat a transparentnost\n\n· (vzdálená) vědecká spolupráce\n\n· snížení rizika potenciální ztráty (meta)dat a problémů s nečitelnými / poškozenými papírovými záznamy\n\n· možnost přizpůsobení a integrace s dalšími softwary\n\n· provoz ELN představuje uznatelný náklad výzkumu"
definitionLanguage = "cs"

