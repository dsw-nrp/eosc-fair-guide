guideRoute = "term"
id = "registered-reports"
label = { cs = "registrované reporty [zprávy]", en = "Registered Reports" }
url = "https://heslar.openscience.cz/heslo.php?id=209"
definition = "Publikační formát, resp. forma článku v časopise integrující osvědčené postupy výzkumu založeného na hypotézách s odborným hodnocením v recenzním řízení, které probíhá ve dvou fázích.\n\nPrvní fáze probíhá před provedením výzkumu; report zahrnuje teoretickou a metodologickou část studie, které jsou předběžně registrovány a recenzovány. Pokud jsou výsledky recenze schváleny, vydavatel udělí \"in principle acceptance\", tj. zavazuje se, že při dodržení postupu bude článek následně zveřejněn bez ohledu na dosažený výsledek.\n\nVe druhé fázi po uskutečnění výzkumu je finální článek obsahující výsledky zaslán zpět vydavateli časopisu k recenzi. Recenzenti v této části recenzního řízení posuzují, zda se autoři drželi schválené metodologie a zda interpretace výsledků dávají smysl. Pokud editoři a recenzenti neshledají zásadní nedostatky, článek je po druhé fázi recenzního řízení přijat k publikování.\n\nTento způsob publikování, kdy dochází k hodnocení před realizací samotného výzkumu, zdůrazňuje význam jednoznačného formulování výzkumných otázek, stanovení hypotéz a kvality zvolené metodologie a návrhu analýzy.\n\nPřehled časopisů s možností publikace registrovaných reportů poskytuje Center for Open Science (COS) v sekci Participating Journals. Pro podání registrovaných reportů lze využít připravený kontrolní seznam. Protokoly schválené v rámci první fáze recenzního řízení mohou autoři nebo editoři registrovat výběrem možnosti “Registered Report Protocol Preregistration” v registru OSF (Open Science Framework).\n\nPraktické informace pro české akademické prostředí obsahuje článek Registered Reports (Centrum pro podporu open science, UK)."
definitionLanguage = "cs"

