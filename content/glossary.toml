guideRoute = "term"
id = "mirror-journal"
label = { cs = "zrcadlový časopis", en = "Mirror Journal" }
url = "https://heslar.openscience.cz/heslo.php?id=256"
definition = "Ve vědeckém publikování se jedná o nově vydávaný časopis v režimu otevřeného přístupu vedle svého protějšku s předplatným, tj. nový OA časopis zrcadlí časopisecký titul s předplatným. Představuje legitimní titul vydávaný stejným vydavatelem, zpravidla má redakční radu, jejíž alespoň 50 % členů je stejných a řídí se podle stejných standardů (cíl, zaměření, rozsah, zásady recenzního řízení). Časopis může mít podobný název jako titul s předplatným, ale musí mít samostatné ISSN.\n\nDOAJ v současné době přijímá zrcadlové časopisy, pokud splňují obvyklá základní kritéria pro zařazení.\n\nZrcadlové časopisy byly založeny v reakci na kritiku hybridní cesty otevřeného přístupu.\n\nVydavatelé těchto časopisů uvádějí, že cílem je dosáhnout plného otevřeného přístupu. Předpokládají, že pokud časem převáží podíl otevřeného obsahu nad obsahem s předplatným, mohou se oba časopisy sloučit do jednoho titulu s otevřeným přístupem.\n\nPříklady zrcadlových časopisů:\n\nArthroscopy Techniques\n\nFood Chemistry X\n\nJournal of Clinical Virology Plus\n\nPlant Methods X\n\nWater Research X\n\nSeznam zrcadlových časopisů aktualizovaný k 21. 9. 2023: Mirror Journals 2023, Jülich Data."
definitionLanguage = "cs"

