url = "https://heslar.openscience.cz/heslo.php?id=384"
definition = "Objekt zaznamenaný nebo přenášený v digitálním formátu (řetězce bitů), který byl v této formě vytvořen nebo do ní konvertován; umožňuje kompresi dat a přidání dodatečné informace určené buď k opravě chyb nebo k popisu obsažených údajů (metadata). Digitální objekt obsahuje informační obsah a metadata, která podporují správu, přístup a uchovávání. Rozlišuje se mezi jednoduchým digitálním objektem (objekt tvořen jedním souborem, např. PDF nebo obrázek) a složitým digitálním objektem (objekt tvořen více soubory, např. webová stránka, digitalizovaná kniha)."
