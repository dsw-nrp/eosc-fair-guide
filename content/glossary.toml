guideRoute = "term"
id = "citizen-science"
label = { cs = "občanská věda", en = "Citizen Science" }
url = "https://heslar.openscience.cz/heslo.php?id=70"
definition = "Zapojení širší veřejnosti do vědeckého procesu v podobě spolupráce s vědci na řešení komplexních problémů a objevování nových poznatků. Široká veřejnost může přispívat svým pozorováním, měřením nebo analýzou dat. Tento přístup nejenže zvyšuje kapacitu vědeckého výzkumu, ale také podporuje veřejné povědomí a vzdělávání v oblasti vědy. Občanská věda se může lišit mezi vědními obory, z hlediska návrhu procesů, úrovně účasti a způsobů zapojení veřejnosti. Základní pravidla a etické principy, které by měly projekty občanské vědy splňovat a které přispívají k základnímu pochopení jejich cílů a obsahu, definuje European Citizen Science Association (ECSA).\n\nObčanská věda v ČR:\n\nCitizen Science – Občanská věda v České republice\n\nObčanská věda – Akademie věd ČR"
definitionLanguage = "cs"

