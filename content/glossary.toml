guideRoute = "term"
id = "article-processing-charge"
label = { cs = "poplatek za zpracování článku", en = "Article Processing Charge" }
url = "https://heslar.openscience.cz/heslo.php?id=30"
definition = "V češtině nejasně formulovaný termín zahrnující více možných publikačních poplatků spojených s publikováním odborného článku.\n\nAnglický termín APC je významově přesněji vymezený a ustálený a představuje poplatek za publikaci formou otevřeného přístupu ve Zlatém OA nebo hybridním časopise. Další poplatky spojené s publikací, např. za podání (submission fee), stránky (page charges), titulní stránku (cover charge), barvy (color charges) nebo za urychlené zpracování (Rapid charges fee), nejsou považovány za součást APC. APC se účtuje za publikování vědeckých článků v režimu otevřeného přístupu, proto jiné typy dokumentů definici APC nevyhovují, např. příspěvky do sborníku, kapitoly v knize (poplatek za zpracování knihy / BPC)."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "31" }]

guideRoute = "term"
id = "open-access"
label = { cs = "otevřený přístup", en = "Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=31"
definition = "Otevřený přístup – v oblasti vědeckých výstupů – označuje bezplatnou a okamžitou online dostupnost výsledků výzkumu (publikací, dat aj.) spojenou s právy plně využívat tyto výsledky v digitálním prostředí. Oprávnění k dalšímu použití obsahu se uplatňuje prostřednictvím tzv. veřejných licencí (v současné době prakticky výhradně licencemi Creative Commons). V užším a nejběžněji vnímaném významu se týká zejména publikací, kde otevřeného přístupu je možné dosáhnout různými cestami – hlavními modely jsou Zelený OA, Zlatý OA a Diamantový OA."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "32" }]

guideRoute = "term"
id = "immediate-open-access"
label = { cs = "okamžitý otevřený přístup", en = "Immediate Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=32"
definition = "Okamžitý (tj. bez časového embarga) přístup k publikaci (stádium publikace v rámci vydavatelského procesu se může lišit podle typu, resp. barvy Open Access / OA: Zlatý OA vs. Zelený OA) za splnění ostatních podmínek otevřeného přístupu – Open Access. Lze kombinovat s typem (barvou) OA, tj. např. Immediate Gold OA. V případě striktního výkladu pojmu Open Access je podmínka okamžitého zveřejnění již automaticky obsažena a v principu by nemělo být potřeba ji zdůrazňovat."
definitionLanguage = "cs"

