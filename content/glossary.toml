guideRoute = "term"
id = "openaire"
label = { cs = "Open Access Infrastructure for Research in Europe", en = "Open Access Infrastructure for Research in Europe" }
url = "https://heslar.openscience.cz/heslo.php?id=103"
definition = "*nemá český ekvivalent\n\nNezisková organizace s cílem podporovat otevřenou vědu a zlepšovat nalezitelnost, dostupnost, sdílení, opakované použití, reprodukovatelnost a monitorování výzkumných výsledků založených na datech na globální úrovni. Organizace provozuje evropskou e-infrastrukturu nabízející širokou škálu veřejných služeb pro urychlení implementace otevřené vědy. Je podporována sítí expertů působících v klíčových národních organizacích napříč evropskými zeměmi, Národními kancelářemi pro otevřený přístup (National Open Access Desks, NOADs).\n\nNejdůležitější služby OpenAIRE jsou:\n\nOpenAIRE Graph – poskytuje přehled o výzkumných výsledcích a jejich propojení s otevřenými výzkumnými daty, publikacemi a výzkumnými projekty,\n\nOpenAIRE API – umožňuje přístup k datům OpenAIRE pro vývojáře, kteří potřebují integrovat informace o otevřených výzkumných datech do svých aplikací,\n\nOpenAIRE e-infrastructure services – evropská e-infrastruktura poskytující veřejné služby zaměřené na podporu otevřené vědy, zahrnující šíření a správu dat, publikací a výzkumných projektů,\n\nOpenAIRE Guidelines and Policies – poskytuje návod a doporučení pro správu otevřených dat a publikací, včetně informací o politických a legislativních rámcích.\n\nUživateli služeb OpenAIRE jsou výzkumníci, výzkumné komunity, tvůrci politik, výzkumné organizace, malé a střední podniky, univerzity, knihovny a občanští vědci. OpenAIRE je klíčovým implementátorem Evropského cloudu otevřené vědy (European Open Science Cloud, EOSC)."
definitionLanguage = "cs"

