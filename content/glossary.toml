guideRoute = "term"
id = "publication-charge"
label = { cs = "publikační poplatek", en = "Publication charge(s)" }
url = "https://heslar.openscience.cz/heslo.php?id=401"
definition = "Různé typy možných poplatků spojených s publikováním odborného článku, nemusí se vůbec týkat otevřeného přístupu – Open Access, toho se týká poplatek uvedený pod heslem Article Processing Charge (APC). Např.:\n\nColour charges – poplatek účtovaný za barevné grafy nebo obrázky, měl by být účtován obvykle pouze u časopisů vycházející stále ještě i v tištěné podobě.\n\n(Excess-)page charges – poplatek účtovaný za každou (nadlimitní) stránku.\n\nReprint charge – poplatek za objednání určitého počtu reprintů článku.\n\nSubmission fee – poplatek za zaslání manuskriptu do redakce.\n\nRapid Service fee – (někdy povinný) poplatek za urychlené zpracování manuskriptu; značně kontroverzní.\n\nCover charge – poplatek za uvedení obrázku na obálce časopisu.\n\nPoplatky za multimediální soubory aj."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "403" }]

guideRoute = "term"
id = "secondary-publishing-rights"
label = { cs = "sekundární publikační práva", en = "Secondary Publishing Rights" }
url = "https://heslar.openscience.cz/heslo.php?id=403"
definition = "Sekundární publikační práva jsou vytvářena na podporu publikování cestou otevřeného přístupu – Open Access. Autorům je tak dána legální možnost zveřejnit dílo – často i poté, co svá majetková práva postoupili vydavateli – vložením do repozitáře. Právo se týká děl obvykle menšího rozsahu (článek v časopisu, stať ve sborníku apod.) a výlučně vzniklých jako výstup výzkumu hrazeného (převážně či alespoň zčásti) z veřejných prostředků.\n\nŘešení je v zásadě dvojí: buď je do Autorského zákona dané země vložena nová výjimka, která dává autorovi právo dílo zveřejnit v repozitáři (to je případ Německa, Itálie, Nizozemí, Rakouska i Bulharska), anebo je takové právo (a někdy i povinnost) definováno v jiném zákoně týkajícím se nakládání s prostředky na výzkum: ve Francii a Španělsku to je zákon o výzkumu, v Belgii Hospodářský kodex a v Itálii „Naléhavá opatření na ochranu, zhodnocení a oživení kulturního dědictví a cestovního ruchu“. Ve většině případů je autorovi dáno právo; ve Španělsku je povinností autora, v Itálii povinností mateřské instituce dále s dílem nakládat. Výslovně, i přesto, že autor postoupil majetkové právo vydavateli, toto sekundární právo dávají autorovi zákony rakouský, německý, bulharský, belgický i francouzský, holandský zákon to nezmiňuje.\n\nV některých zemích je zákonem stanoven časový odstup zveřejnění v repozitáři od okamžiku vydání díla vydavatelem (tzv. embargo): ve Španělsku a Bulharsku je nulový, v Nizozemí je to „přiměřená doba“, ve Francii a Belgii 6 měsíců pro STM a 12 pro SSH, v Itálii 18 měsíců pro STM a 24 pro SSH a v Německu a Rakousku 12 měsíců bez rozdílu oborů. Trvání odkladu od data zveřejnění vydavatelem je věcí domluvy při uzavírání vydavatelské smlouvy, zákony pro to stanovují horní hranici."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "404" }]

guideRoute = "term"
id = "replicability"
label = { cs = "replikovatelnost", en = "Replicability" }
url = "https://heslar.openscience.cz/heslo.php?id=404"
definition = "Replikovatelnost označuje schopnost dosáhnout identického výsledku, jaký byl uveden v publikované studii, avšak s použitím i jiných dat, metod nebo analytických technik. Jinými slovy, pokud se někdo pokusí zopakovat konkrétní výstup s použitím i jiných dat nebo metod, měl by dosáhnout stejného výsledku. Replikovatelnost je důležitá pro posouzení obecné platnosti a robustnosti vědeckých poznatků.\n\nViz také poznámku u hesla reprodukovatelnost."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "406" }]

guideRoute = "term"
id = "sister-companion-journal"
label = { cs = "sesterský [doprovodný] časopis", en = "Sister [Companion] Journal" }
url = "https://heslar.openscience.cz/heslo.php?id=406"
definition = "Ve vědeckém publikování se jedná o novější časopis spojený se zavedeným renomovaným časopisem. Sdílí společného vydavatele a často i část redakční rady. Jeho tematické zaměření je podobné nebo doplňující. Umožňuje tak pokrýt širší spektrum témat, která by se do hlavního časopisu nevešla nebo by nebyla zcela v jeho záběru. Nový titul těží z prestiže hlavního časopisu, což mu usnadňuje jeho etablování.\n\nNěkteré z těchto časopisů umožňují tzv. kaskádové recenzní řízení (cascading peer review) či přenosový model (transfer model). V praxi to znamená, že článek odmítnutý v hlavním časopise může být se souhlasem autora přesměrován do sesterského časopisu i s posudky, což urychluje celý redakční proces. Tento model umožňuje vydavatelům kompenzovat redakční náklady vynaložené na proces recenzování v původním časopise, který nakonec vedl k odmítnutí a eventuálně zpeněžit práci autora prostřednictvím poplatku za zpracování článku (APC). Autoři z toho mají rovněž prospěch, neboť musí projít pouze jedním recenzním řízením, anebo sice novým řízením, ale znatelně kratším.\n\nPříklady sesterských časopisů:\n\n· JAAD Case Reports s hlavním titulem Journal of the American Academy of Dermatology, vydavatel Elsevier\n\n· Nature Genetics, Nature Communications s hlavním titulem Nature, vydavatel Springer Nature\n\n· Stem Cells Translational Medicine s hlavním titulem Stem Cells, vydavatel Wiley-Blackwell\n\n· The Lancet Psychiatry, The Lancet Global Health s hlavním titulem The Lancet, vydavatel Elsevier"
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "407" }]

guideRoute = "term"
id = "free-libre-licence"
label = { cs = "svobodná licence / svobodné licencování", en = "Free [Libre] Licence / Free [Libre] Licencing" }
url = "https://heslar.openscience.cz/heslo.php?id=407"
definition = "Svobodná licence je typ otevřené licence, která poskytuje uživatelům plný rozsah práv k volnému nakládání s chráněným dílem. Aby mohla být licence považována za svobodnou (free / libre), musí podle definic Free Software Foundation a Open Source Initiative zajišťovat čtyři základní svobody:\n\nsvobodu dílo používat k jakémukoli účelu,\n\nsvobodu jej studovat a analyzovat (včetně přístupu ke zdrojovému kódu u softwaru),\n\nsvobodu upravovat a vytvářet odvozená díla,\n\nsvobodu šířit jak původní, tak upravené verze díla.\n\nZásadním rysem svobodné licence je absence restrikcí, které by omezovaly uvedené svobody. Licence, které například zakazují komerční užití (např. CC BY-NC) nebo úpravy díla (např. CC BY-ND), nesplňují podmínky svobodné licence, i když mohou být považovány za otevřené. Svobodné licence tak představují nejliberálnější formu veřejného licencování, která podporuje sdílení, spolupráci a inovace bez zásadních právních překážek.\n\nTypickými příklady svobodných licencí jsou GNU General Public License (GPL), Apache License 2.0, MIT License, Mozilla Public License nebo Creative Commons BY a BY-SA. Svobodné licence se uplatňují především v oblasti svobodného softwaru, otevřeného vzdělávání (otevřených vzdělávacích zdrojů), otevřené vědy a otevřené kultury."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "408" }]

guideRoute = "term"
id = "czech-core-metadata-model"
label = { cs = "[základní metadatový model pro popis výzkumných dat]", en = "Czech Core Metadata Model for Research Data" }
url = "https://heslar.openscience.cz/heslo.php?id=408"
definition = "Představuje základní metadatový model pro popis výzkumných dat v prostředí ČR, stanovená zkratka CCMM. Cílem modelu je definovat minimální popisné prvky pro datové sady (dostatečně obecné, aby byl model jako základ použitelný pro různé oborové repozitáře), zajistit interoperabilitu základních metadat napříč obory a sloužit pro jednotné vyhledávání nad metadaty výzkumných dat v Národním metadatovém adresáři (NMA). Model je vystavěn na existujících metadatových schématech, především DCAT-AP a DataCite, a je publikován pod licencí CC BY. Jedná se o výstup projektu Czech Academic and Research Discovery Services (CARDS).\n\n*V českém prostředí se běžně používá anglický termín, resp. zkratka CCMM."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "409" }]

guideRoute = "term"
id = "controlled-vocabulary"
label = { cs = "řízený slovník", en = "Controlled Vocabulary" }
url = "https://heslar.openscience.cz/heslo.php?id=409"
definition = "Pevně definovaný a spravovaný soubor termínů, jejichž význam je jednoznačně určen a standardizován pro použití v určité oblasti nebo informačním systému. Slouží ke sjednocení terminologie při popisu, ukládání, sdílení a vyhledávání dat. Zajišťuje, aby stejné pojmy byly používány konzistentně napříč databázemi, repozitáři a institucemi. V kontextu otevřené vědy a FAIR dat má řízený slovník zásadní význam pro standardizovaný popis dat a jejich opakované použití.\n\nVedle samotného seznamu termínů může řízený slovník definovat vztahy mezi pojmy, například hierarchické vztahy (nadřazený – podřazený pojem) a pravidla jejich uspořádání. V digitálním prostředí bývá často reprezentován pomocí standardů jako SKOS (Simple Knowledge Organization System) nebo RDF (Resource Description Framework).\n\nPříklady řízených slovníků:\n\nCOAR Controlled Vocabularies for Repositories\n\nMedical Subject Headings (MeSH)\n\nGeneral Multilingual Environmental Thesaurus (GEMET)\n\nAGROVOC Multilingual Thesaurus"
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "41" }]

guideRoute = "term"
id = "transformative-agreement"
label = { cs = "transformační smlouva", en = "Transformative Agreement" }
url = "https://heslar.openscience.cz/heslo.php?id=41"
definition = "Též transformativní smlouva je smlouva s vydavatelem odborných časopisů zahrnující převedení části poplatku za předplatné na poplatek za publikování (APC) v podobě tokenů, které mohou autoři využít pro OA publikování bez nutnosti dalších poplatků. Měla by postupně vést ke změně obchodního modelu, který by zajistil plně otevřený přístup (např. SCOAP3)."
definitionLanguage = "cs"

