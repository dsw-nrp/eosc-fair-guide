guideRoute = "term"
id = "european-research-area"
label = { cs = "Evropský výzkumný prostor", en = "European Research Area" }
url = "https://heslar.openscience.cz/heslo.php?id=159"
definition = "Společný a jednotný prostor pro výzkum a inovace v Evropě založený Evropskou komisí (EK) v roce 2000 s cílem vytvořit bezhraniční trh pro výzkum, technologie a inovace napříč EU. Podporuje volný pohyb výzkumných pracovníků, sdílení znalostí a inovací, a usiluje o synergie mezi politikami EU a členských států.\n\nPriority EVP se opírají o Pakt pro výzkum a inovace v Evropě a zahrnují následující oblasti:\n\notevřená věda,\n\nvýzkumné infrastruktury,\n\ngenderová rovnost,\n\nudržitelnost kariéry v oblasti výzkumu a inovací,\n\nmobilita výzkumných pracovníků,\n\nreforma hodnocení výzkumu,\n\nmezinárodní spolupráce.\n\nV květnu 2025 stanovila EK politický program EVP na období 2025–2027 (ERA Policy Agenda 2025–2027). Mezi klíčové aktivity na vymezené tříleté období patří:\n\npodpora rovnosti v otevřené vědě,\n\nusnadnění a urychlení zodpovědného využívání umělé inteligence ve vědeckém výzkumu,\n\nposílení bezpečnosti výzkumu."
definitionLanguage = "cs"

