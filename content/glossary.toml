guideRoute = "term"
id = "metadata-application-profile"
label = { cs = "metadatový aplikační profil", en = "Metadata Application Profile" }
url = "https://heslar.openscience.cz/heslo.php?id=134"
definition = "Soubor pravidel a specifikací určující, jak mají být existující metadatové standardy a schémata používány v konkrétním kontextu, komunitě nebo repozitáři. Aplikační profil zpravidla obsahuje prvky z jednoho či více existujících standardů a přizpůsobuje je specifickým potřebám dané domény, instituce nebo repozitáře. Nejde tedy o nový metadatový standard, ale o kombinaci a úpravu již existujících prvků tak, aby vyhovovaly specifickým potřebám."
