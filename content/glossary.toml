guideRoute = "term"
id = "persistent-identifier"
label = { cs = "perzistentní [trvalý] identifikátor", en = "Persistent Identifier" }
url = "https://heslar.openscience.cz/heslo.php?id=200"
definition = "Nástroj k jednoznačné identifikaci osob, organizací a dalších objektů (např. knih, článků, datových sad) v systému vědecké komunikace (např. ISBN pro knihy, ISSN pro periodika, DOI pro řadu objektů různého typu, ISBN, ISSN a DOI mohou označovat jak digitální tak fyzické, ORCID pro autory / výzkumníky, ROR pro výzkumné organizace).\n\nIdentifikátor představuje jedinečný odkaz spojený s entitou a/nebo jejími metadaty, který se v průběhu času nemění a umožňuje trvalé vyhledávání, přístup, citování, propojování a opakované použití takto označených objektů (např. výsledků výzkumu a dalších). Je jedním z předpokladů pro naplnění principů otevřené vědy a FAIR principů při správě výzkumných dat."
definitionLanguage = "cs"

