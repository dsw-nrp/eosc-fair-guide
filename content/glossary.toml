guideRoute = "term"
id = "diamond-open-access"
label = { cs = "Diamantová cesta otevřeného přístupu / Platinová cesta otevřeného přístupu", en = "Diamond Open Access / Platinum Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=37"
definition = "Model otevřeného přístupu eliminující finanční bariéry jak pro autory, tak pro čtenáře. V tomto modelu nejsou vyžadovány žádné poplatky za zpracování článků (APC) od autorů, ani nejsou publikace zpoplatněny čtenářům. Publikace jsou pro čtenáře i autory zdarma.\n\nPostupně došlo k upřesnění a zúžení významu pro Diamantový OA, a to následovně: diamantový otevřený přístup označuje model vědeckého publikování, kdy časopisy a platformy nevybírají poplatky ani od autorů, ani od čtenářů a zároveň jsou řízené, vlastněné a vedené vědeckými komunitami."
definitionLanguage = "cs"

