alternateIds = [{ "scheme" = "heslar", "value" = "35" }]

guideRoute = "term"
id = "gold-open-access"
label = { cs = "Zlatá cesta otevřeného přístupu", en = "Gold Open Access" }
url = "https://heslar.openscience.cz/heslo.php?id=35"
definition = "Model otevřeného přístupu, kdy je obsah publikace od okamžiku zveřejnění kompletně volně přístupný komukoliv přímo u vydavatele, který otevřený přístup zajišťuje. Tato cesta umožňuje okamžité, neomezené a trvale přístupné vydání díla, často za podmínek licencí jako jsou Creative Commons. Náklady na publikování cestou Zlatého OA nenesou čtenáři. Vydavatelé od autora či jeho instituce požadují poplatek v podobě APC."
definitionLanguage = "cs"

