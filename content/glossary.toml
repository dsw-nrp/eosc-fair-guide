guideRoute = "term"
id = "crossref"
label = { cs = "Crossref", en = "Crossref" }
url = "https://heslar.openscience.cz/heslo.php?id=146"
definition = "*nemá český ekvivalent\n\nMezinárodní nezisková organizace, registrační agentura poskytující organizační a technickou infrastrukturu pro registraci a využití digitálního identifikátoru objektu (DOI) v oblasti vědeckého výzkumu. Crossref, následován obdobnou organizací DataCite, je nejvýznamnější registrační agenturou pro DOI. Crossref se zaměřuje primárně na vydavatelskou oblast, usnadňuje vyhledávání, citování, propojování, hodnocení a opakované použití výsledků výzkumu. Členy Crossref jsou zejména organizace, které publikují obsah nebo registrují výzkumné granty."
