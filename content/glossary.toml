definition = "Mezinárodní propagační událost s cílem zviditelnit myšlenku otevřeného přístupu napříč akademickou komunitou. V ČR jsou pořádány obdobné akce, např. Open Science Week (OSW), pořadatel Asociace knihoven vysokých škol ČR (AKVŠ) a její Pracovní skupina Open Science AKVŠ."
