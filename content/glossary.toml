guideRoute = "term"
id = "re3data"
label = { cs = "re3data", en = "re3data" }
url = "https://heslar.openscience.cz/heslo.php?id=108"
definition = "Nejznámější mezinárodní registr repozitářů výzkumných dat je re3data, provozován od roku 2012 za finanční podpory Deutsche Forschungsgemeinschaft (DFG). Někteří vydavatelé a časopisy odkazují na registr ve svých redakčních zásadách jako na nástroj pro snadnou identifikaci vhodných datových repozitářů k uložení výzkumných dat. Použití re3data bylo rovněž doporučeno Evropskou komisí pro program Horizon 2020 (Guidelines on Open Access to Scientific Publications and Research Data in Horizon 2020).\n\nS cílem vytvoření jednotného a udržitelného registru výzkumných datových repozitářů oznámily v březnu 2013 re3data a Databib spojení svých adresářů do jediné služby, od konce roku 2015 spravována DataCite. DFG od ledna 2020 financovala projekt re3data – Community Driven Open Reference for Research Data Repositories (COREF). Cílem projektu bylo propojit re3data jako referenční zdroj pro výzkumné datové repozitáře s dalšími službami a infrastrukturami. Re3data díky tomu nabídl přizpůsobitelné a rozšiřitelné popisy repozitářů, které jsou trvale identifikovatelné a je na ně možné správně odkazovat a citovat je. To zahrnuje také jedinečnou identifikaci pro komunikaci mezi systémy (machine-to-machine). Rozšířená technická platforma usnadňuje opakované využití spolehlivých a důvěryhodných informací o výzkumných datech."
definitionLanguage = "cs"

