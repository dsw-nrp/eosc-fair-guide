url = "https://heslar.openscience.cz/heslo.php?id=221"
definition = "Uložení a zpřístupnění elektronické (digitální) verze vědecké nebo akademické práce (digitálního objektu) oprávněnou osobou (nejčastěji autorem samotným) v institucionálním, oborovém nebo generickém repozitáři. Autoarchivace slouží k naplnění cílů tzv. Zelené cesty OA, tudíž předmětem autoarchivace je zpravidla uložení a zpřístupnění preprintů nebo postprintů."
