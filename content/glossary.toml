guideRoute = "term"
id = "data-transfer-agreement"
label = { cs = "smlouva / dohoda o předávání dat", en = "Data Transfer Agreement" }
url = "https://heslar.openscience.cz/heslo.php?id=147"
definition = "Smlouva upravující podmínky předávání dat mezi dvěma nebo více subjekty – typicky mezi výzkumnými institucemi, univerzitami a jinými organizacemi. Cílem je zajistit, aby přenos a správa dat probíhaly v souladu s právními, etickými a bezpečnostními standardy (např. GDPR).\n\nHlavní účel:\n\n• Stanovit práva a povinnosti poskytovatele a příjemce dat.\n\n• Zajistit ochranu osobních, citlivých informací či práv duševního vlastnictví.\n\n• Vymezit účel využití dat, dobu uchování a omezení jejich dalšího sdílení.\n\n• Specifikovat způsob přenosu, formát a odpovědnost za bezpečnost dat.\n\nTypické oblasti použití:\n\n• mezinárodní vědecká spolupráce\n\n• přenos a správa výzkumných dat mezi institucemi\n\n• sdílení dat obsahujících osobní či zdravotní informace"
definitionLanguage = "cs"

