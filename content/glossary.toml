guideRoute = "term"
id = "crowdfunding"
label = { cs = "crowdfunding", en = "Crowdfunding" }
url = "https://heslar.openscience.cz/heslo.php?id=423"
definition = "*nemá český ekvivalent\n\nZpůsob skupinového financování výzkumu, kdy větší počet jednotlivců z řad veřejnosti přispívá menším obnosem k cílové částce požadované pro realizaci předmětu financování (např. zahajování průzkumů, analytické studie s regionálním nebo globálním dopadem, vydání kritických edic, pořádání výstav aj.).\n\nPříklady crowdfunding platforem:\n\nExperiment: největší světová otevřená online crowdfunding platforma pro financování vědeckého výzkumu a jeho sdílení.\n\nConsano: platforma se zaměřením na lékařský výzkum.\n\nwemakeit: významná crowdfunding platforma v Evropě dílem zahrnující i výzkum."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "424" }]

guideRoute = "term"
id = "crowdsourcing"
label = { cs = "crowdsourcing", en = "Crowdsourcing" }
url = "https://heslar.openscience.cz/heslo.php?id=424"
definition = "*nemá český ekvivalent\n\nOnline proces spolupráce, při kterém vědci zapojují skupinu vybraných jednotlivců s různými znalostmi a dovednostmi prostřednictvím otevřené výzvy na internetu a/nebo online platformách, aby se ujali určitého výzkumného úkolu nebo souboru úkolů. Zpravidla se jedná o podporu při shromažďování dat, kdy vědci získávají jedinečné a bohaté soubory dat a kdy je zároveň veřejnost zapojena do procesu vědeckého objevování.\n\nPříklad nástroje pro nalezení vhodné crowdsourcing platformy: Find a crowdsourcing platform, poskytovatel Laboratory for Innovation Science at Harvard (LISH).\n\nBlíže viz Národní platforma Open Science, Crowdsourcing."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "425" }]

guideRoute = "term"
id = "open-evaluation"
label = { cs = "otevřené hodnocení", en = "Open Evaluation" }
url = "https://heslar.openscience.cz/heslo.php?id=425"
definition = "Přístup k hodnocení ve vědě a výzkumu založený na:\n\ntransparentnosti (informace o procesu i výsledcích jsou veřejně dostupné),\n\notevřenosti (otevřené recenzní řízení),\n\nparticipaci (zapojení širší komunity, nejen anonymních recenzentů, do procesu posuzování kvality výstupů, např. článků, projektů, dat),\n\nprůběžnosti (hodnocení může probíhat i po publikování),\n\nrozšířených kritériích kvality (vedle standardního posouzení vědeckého přínosu a společenské relevance se hodnotí další aspekty, např. otevřenost dat aj.).\n\nV kontextu výzkumných organizací odkazuje na hodnocení na základě dostupných otevřených dat a transparentních kritérií. Tento přístup podporuje Barcelona Declaration on Open Research Information (ze dne 16. 4. 2024)."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "426" }]

guideRoute = "term"
id = "open-hardware"
label = { cs = "otevřený hardware", en = "Open Hardware / Open Source Hardware" }
url = "https://heslar.openscience.cz/heslo.php?id=426"
definition = "Inženýrské produkty a výzkumné experimentální vybavení a sestavy, jejichž návrhy jsou uvolněny pro veřejnost. Kdokoli je tak může legálně studovat, upravovat, distribuovat, vyrábět a prodávat. Koncept je založený na stejných principech jako Open Source Software – software s otevřeným / přístupovým zdrojovým kódem, ale aplikuje se na fyzické objekty.\n\nDalší používané termíny: Open Science Hardware – otevřený vědecký hardware, Open Instrumentation – otevřené přístrojové vybavení."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "427" }]

guideRoute = "term"
id = "open-innovations"
label = { cs = "otevřené inovace", en = "Open Innovations" }
url = "https://heslar.openscience.cz/heslo.php?id=427"
definition = "Koncept pro sdílení nápadů, zdrojů, znalostí a technologií mezi různými organizacemi a jednotlivci s cílem urychlit inovační procesy a zlepšit výsledky výzkumu. Věnuje se především otevření rozhraní mezi vědeckým výzkumem a průmyslem. Na obou stranách jsou možné otevřené formáty transferu otevřených inovací, jako jsou podpora spin-offů, zakládání společných podniků, crowdsourcing, otevřené zdrojové kódy, sdílené licencování patentů a další práva duševního vlastnictví (např. průmyslové vlastnictví zahrnující patenty, ochranné známky, průmyslové vzory a modely, zeměpisná označení, autorské právo zahrnující umělecká a literární díla).\n\nKoncept otevřených inovací překračuje tradiční hranice organizace a využívá vnější zdroje, znalosti a technologie spolu s interními zdroji k vyvíjení nových technologií, produktů nebo služeb. Tento přístup je založen na myšlence, že společnosti nebo výzkumné organizace mohou zvýšit svou inovační kapacitu tím, že otevřeně spolupracují s externími subjekty, jako jsou jiné firmy, výzkumníci, veřejnost nebo dokonce konkurenti.\n\nOtevřené inovace představují jednu z nejkomplexnějších oblastí otevřené vědy – pokud mohou pod otevřenou vědu být vůbec podřazeny. Někdy jsou otevřené inovace stavěny vedle otevřené vědy."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "428" }]

guideRoute = "term"
id = "open-methods"
label = { cs = "otevřené metody / metodika", en = "Open Methods / Methodology" }
url = "https://heslar.openscience.cz/heslo.php?id=428"
definition = "Transparentní, volně přístupné otevřené popisy a dokumentace vědeckých postupů s cílem zvyšovat kvalitu výzkumu tím, že potenciálně zlepšují jeho spolehlivost prostřednictvím reprodukovatelnosti. Podrobně odkazují na dokumentaci výzkumu, aby bylo možné jej ověřit, zopakovat a použít jinde. Zahrnují přesný popis provedených pracovních postupů a analýz dat, včetně kroků čištění dat, eliminace dat, úvah o návrhu výzkumu, popisu použitých materiálů, uspořádání a provedení experimentu, specifikace kódování, pozorování, standardizovaných protokolů, otevřených laboratorních deníků, softwaru nebo vybavení použitého pro sběr / záznam dat, analýz, postupů indexování různých proměnných a zacházení s chybějícími hodnotami. Kromě toho zahrnují i činnosti, které umožňují rychlý a otevřený přístup k výsledkům výzkumu, jako je předběžná registrace nebo zveřejnění zdrojového kódu.\n\nVelmi důležitá může být i dokumentace systémového prostředí počítače používaného pro analýzu dat, protože např. odlišný hardware, verze překladače nebo použití systémových proměnných může vést k odlišným výsledkům softwarově podporované analýzy, a to i když samotný software byl poskytnut jako open source.\n\nPříklady platforem otevřených metod / metodik:\n\nProtocols.io: platforma pro správu dat, vývoj, sdílení a diskuzi o metodách a protokolech.\n\nProtocol Exchange: otevřené úložiště od Nature Portfolio pro sdílení protokolů vědeckého výzkumu; protokoly zveřejňují autoři přímo na tzv. burze protokolů a jsou volně k dispozici vědecké komunitě k použití a připomínkování.\n\nLab Protocols and Study Protocols: spolupráce mezi PLOS ONE a protocols.io, která nabízí autorům možnost sdílet své laboratorní a studijní protokoly; studijní protokoly popisují podrobné plány a návrhy výzkumných projektů, které ještě nepřinesly výsledky; skládají se z jednoho článku v PLOS ONE a protokolu zveřejněného na webu protocols.io\n\nSTAR Protocols: otevřený recenzovaný protokolový časopis vydavatelství Cell Press, který zveřejňuje popsané experimentální a výpočetní protokoly ze všech oblastí věd o životě, zdraví, zemi a fyziky."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "429" }]

guideRoute = "term"
id = "open-services"
label = { cs = "otevřené služby", en = "Open Services" }
url = "https://heslar.openscience.cz/heslo.php?id=429"
definition = "Služby podporující vědecký výzkum, které jsou otevřeně dostupné, využívají otevřené standardy a umožňují sdílení, opakované použití a propojení vědeckých výstupů (např. repozitáře, publikační platformy, nástroje pro správu dat, výzkumné infrastruktury).\n\nPodle politik a dokumentů Evropské komise (Open Science policy) jsou otevřené služby součástí infrastruktur otevřené vědy (Open Science Infrastructures) poskytující otevřený, spolehlivý a udržitelný přístup k výzkumným datům, nástrojům a službám v celém výzkumném cyklu.\n\nNa základě aktuálních evropských rámců Open Science (např. European Commission a European Open Science Cloud / EOSC) mají otevřené služby tyto atributy:\n\notevřený přístup: dostupnost služeb bez zbytečných bariér (technických, finančních, právních),\n\ninteroperabilita: využití standardů umožňující propojení mezi systémy (např. metadata, API),\n\nFAIR principy: data a služby designována podle FAIR principů,\n\ntransparentnost: jasná pravidla fungování, často open-source řešení,\n\nkomunitní správa: služby řízeny často akademickou nebo veřejnou komunitou, ne čistě komerčně.\n\nPříklady otevřených služeb ve vědeckém výzkumu:\n\nrepozitáře dat a publikací (např. Zenodo, OpenAIRE)\n\npublikační platformy s otevřeným přístupem (např. Open Research Europe)\n\nnástroje pro správu výzkumných dat\n\nVelké výzkumné infrastruktury podporované MŠMT\n\nEuropean Commission – Open Science policy (Open Science infrastructures and skills)\n\nEOSC – principy a architektura služeb, infrastruktura propojující služby napříč Evropou\n\nBlíže pro české prostředí viz Národní platforma Open Science, sekce Služby."
definitionLanguage = "cs"

