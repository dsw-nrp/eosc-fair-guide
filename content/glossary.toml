definition = "Plánování správy dat zahrnuje popis životního cyklu dat, tedy základní informace o projektu, popis datových sad, metadata, ontologie a dokumentaci dat, řešení pro ukládání, zabezpečení a uchování dat, strategie sdílení a publikování dat, rozpočet a zdroje pro správu dat a řešení etických a právních otázek včetně ochrany soukromí, duševního vlastnictví a licencí.\n\nPlánování správy dat úzce souvisí s tzv. FAIR principy, které stanovují, jak by měla být (výzkumná) data připravena, spravována, publikována nebo archivována s cílem co nejvyšší hodnoty pro současné i budoucí využití."
