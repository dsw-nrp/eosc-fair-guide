guideRoute = "term"
id = "research-infrastructure"
label = { cs = "velká výzkumná infrastruktura", en = "Research Infrastructure" }
url = "https://heslar.openscience.cz/heslo.php?id=79"
definition = "Zařízení, zdroje a související služby, které vědecká obec využívá k provádění výzkumu v příslušných oborech, zahrnující vědecké vybavení a výzkumný materiál, zdroje založené na znalostech (např. sbírky, archivy a strukturované vědecké informace), infrastruktury informačních a komunikačních technologií (např. sítě GRID, počítačové a programové vybavení, komunikační prostředky), jakož i veškeré další prvky jedinečné povahy nezbytné k provádění výzkumu. Tyto infrastruktury se mohou nacházet na jednom místě nebo mohou být „rozmístěny“ v rámci sítě (organizovaná síť zdrojů). Tato infrastruktura současně musí naplňovat kritérium tzv. otevřeného přístupu k jejím kapacitám.\n\nO velkých výzkumných infrastrukturách v českém prostředí blíže na stránkách Velké výzkumné infrastruktury podporované MŠMT.\n\nStruktura Cestovní mapy velkých výzkumných infrastruktur ČR je členěna do šesti oblastí:\n\nFyzikální vědy a inženýrství,\n\nEnergetika,\n\nEnvironmentální vědy,\n\nZdraví a potraviny / biologické a lékařské vědy,\n\nSociální a humanitní vědy / sociální a kulturní inovace,\n\ne-Infrastruktury.\n\nSouvisící hesla: výzkumná infrastruktura a Evropské strategické fórum pro výzkumné infrastruktury (ESFRI)."
definitionLanguage = "cs"

