guideRoute = "term"
id = "international-network-open"
label = { cs = "International Network of Open Science &amp; Scholarship Communities", en = "International Network of Open Science &amp; Scholarship Communities" }
url = "https://heslar.openscience.cz/heslo.php?id=169"
definition = "*nemá český ekvivalent\n\nÚstřední platforma mezinárodní sítě místních komunit pro otevřenou vědu umožňující spolupráci akademiků a dalších zájemců při implementaci postupů a principů otevřené vědy do praxe.\n\nZ ČR je mezi členy registrována Open Science Community Olomouc (OSC Olomouc, OSCO) na Univerzitě Palackého v Olomouci, která byla oficiálně spuštěna dne 26. 4. 2023. Podporuje všechny zájemce v orientaci, v porozumění a v praxi otevřené vědy. Jejím úsilím překlenout propast mezi studenty, výzkumníky a podporou výzkumu přispívá ke kultivaci akademického prostředí. Prostřednictvím tematických kurzů a sdílení zkušeností v rámci různých akcí rozšiřuje znalosti a dovednosti v oblasti otevřené vědy a vytváří spolupracující síť jejích zájemců."
definitionLanguage = "cs"

