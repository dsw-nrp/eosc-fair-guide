guideRoute = "term"
id = "zenodo"
label = { cs = "Zenodo", en = "Zenodo" }
url = "https://heslar.openscience.cz/heslo.php?id=391"
definition = "Multioborový otevřený digitální repozitář, který umožňuje výzkumníkům a institucím ukládat, sdílet a zveřejňovat různé druhy výzkumných dat (datových sad) i publikací (např. i disertační práce, zprávy, prezentace), multimediální soubory a další digitální výstupy. Všechna data v repozitáři jsou dostupná online a lze je snadno citovat díky přidělenému trvalému identifikátoru DOI (Digital Object Identifier). Repozitář podporuje otevřený přístup – Open Access a licencování pomocí Creative Commons (CC) licencí.\n\nRepozitář Zenodo je spravován organizací CERN a byl zřízen Evropskou komisí v rámci projektu OpenAIRE. Je provozován v softwaru Invenio. Je uznáván za důvěryhodný repozitář."
definitionLanguage = "cs"

