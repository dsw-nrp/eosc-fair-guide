guideRoute = "term"
id = "sparc-europe"
label = { cs = "Scholarly Publishing and Academic Resources Coalition Europe", en = "Scholarly Publishing and Academic Resources Coalition Europe" }
url = "https://heslar.openscience.cz/heslo.php?id=379"
definition = "*nemá český ekvivalent\n\nNizozemská nadace zasazující se o otevřený přístup, otevřená data a otevřené vzdělávání v Evropě (neomezeno jen na EU). Její vizí je docílit standardní otevřenosti evropského vzdělávání a výzkumu pro akademickou sféru, výzkum, vzdělávání, průmysl a pro celou společnost. Členem za ČR je Asociace knihoven vysokých škol ČR (AKVŠ).\n\nSPARC Europe je přidruženou aliancí SPARC (Scholarly Publishing and Academic Resources Coalition), která je neziskovou organizací zřízenou v roce 1998 k podpoře otevřených systémů pro výzkum a vzdělávání umožňující přístup ke znalostem. Zaměřuje se na prosazování politických změn, podporu činnosti členů a rozvoj komunit sdílejících stejnou vizi, že znalosti představují veřejný statek. Členy je více než 200 knihoven a akademických organizací v Severní Americe. Toto členství doplňují přidružené koalice v Evropě, Japonsku, Africe a jednotlivé členské organizace v Austrálii, Hongkongu a Saúdské Arábii."
definitionLanguage = "cs"

