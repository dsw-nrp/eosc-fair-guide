definition = "Souhrnné označení pro veškerý obsah existující v digitální / elektronické podobě. Podle způsobu vzniku se rozlišují tři základní kategorie:\n\nborn-digital materiály – digitální artefakty, které vznikly v digitální podobě,\n\ndigitální záznamy (records),\n\ndigitalizované materiály / digitální kopie (surrogates) – digitální kopie vzniklé převodem analogových materiálů do digitální podoby, tj. digitalizací."
