guideRoute = "term"
id = "research-data-alliance"
label = { cs = "Research Data Alliance", en = "Research Data Alliance" }
url = "https://heslar.openscience.cz/heslo.php?id=213"
definition = "*nemá český ekvivalent\n\nMezinárodní iniciativa založená v roce 2013 s cílem podporovat sdílení a opakované použití výzkumných dat napříč obory, zeměmi a technologiemi. Komunita vědců a datových expertů vytváří sociální a technické rámce pro interoperabilitu dat a odstraňování bariér v jejich sdílení. Pořádá webináře a workshopy jak na téma výzkumných dat, tak na další související témata otevřené vědy. Funguje prostřednictvím pracovních a zájmových skupin.\n\nOficiálním a právním zástupcem celé komunity RDA je The Research Data Alliance Foundation, nezisková charitativní organizace registrovaná jako právnická osoba ve Velké Británii. Partnery RDA jsou Evropská komise, U.S. National Science Foundation, National Institute of Standards and Technology U.S. Department of Commerce a Australian Government Department of Education and Training."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "215" }]

guideRoute = "term"
id = "research-integrity"
label = { cs = "integrita výzkumu, vědecká / výzkumná integrita", en = "Research Integrity" }
url = "https://heslar.openscience.cz/heslo.php?id=215"
definition = "Termín označuje etický postoj a zastřešující kulturu poctivosti a odpovědnosti v kvalitní vědecké práci. Výzkumná integrita představuje základní soubor etických pravidel a principů, kterými by se měla řídit správná praxe ve vědeckém výzkumu. Je nezbytná pro zajištění důvěryhodnosti, platnosti a pro přijetí vědeckého výzkumu a jeho výsledků veřejností i odbornou komunitou.\n\nHlavní zásady integrity výzkumu jsou:\n\n• spolehlivost při provádění výzkumu, tedy jeho důkladné, přesné a pečlivé zaznamenávání a interpretace s důrazem na kvalitu,\n\n• poctivost, otevřenost, transparentnost a opravdovost ve všech aspektech vědecké práce bez zatajování výzkumných výsledků nebo úpravy dat,\n\n• respekt ke kolegům a etické zacházení s výzkumnými subjekty, včetně lidských účastníků, zvířat a životního prostředí,\n\n• odpovědnost vůči společnosti za etické provedení výzkumu a jeho následky, zvážení všech důsledků prováděného výzkumu, dodržování právních a etických norem a odpovědné sdílení a aplikaci vědeckých poznatků.\n\nUplatňování integrity výzkumu podporuje Evropský kodex integrity výzkumu vydaný Evropským sdružením akademií věd (ALLEA). Dokument popisuje správnou praxi při provádění výzkumu."
definitionLanguage = "cs"

