guideRoute = "term"
id = "coalition-s"
label = { cs = "cOAlition S", en = "cOAlition S" }
url = "https://heslar.openscience.cz/heslo.php?id=137"
definition = "*nemá český ekvivalent\n\nMezinárodní sdružení veřejných a soukromých poskytovatelů výzkumného financování. Vzniklo v roce 2018 z iniciativy Science Europe s podporou Evropské komise a Evropské rady pro výzkum (European Research Council, ERC). Jeho cílem je zajistit okamžitý a plný otevřený přístup ke všem výsledkům výzkumu financovaného z veřejných prostředků.\n\nPlán S (Plan S)\n\nHlavním nástrojem cOAlition S je Plan S, který stanoví, že od 1. ledna 2021 musí být vědecké články vzniklé z financí členských organizací publikovány:\n\nv plně otevřeném časopise,\n\nnebo uloženy bez embarga v otevřeném institucionálním či oborovém repozitáři,\n\nnebo prostřednictvím schválené publikační platformy, která funguje na principu otevřeného přístupu (např. platformy provozované grantovými agenturami nebo vědeckými institucemi).\n\nZásady Plánu S zahrnují:\n\nokamžitý otevřený přístup bez embarga,\n\npoužití otevřených licencí (např. CC BY),\n\ntransparentnost publikačních nákladů,\n\npostupné ukončení podpory hybridního publikování (kombinace OA a předplatného) do konce roku 2024.\n\nDopad na Českou republiku\n\nČR není přímým členem cOAlition S, jeho principy se však významně promítají do vývoje národní politiky otevřené vědy:\n\nNárodní strategie otevřeného přístupu ČR k vědeckým informacím na léta 2017–2020 a navazující Akční plán pro implementaci Národní strategie otevřeného přístupu ČR k vědeckým informacím 2017–2020 reflektují základní principy Plánu S.\n\nČeská grantová schémata již zavedla, popř. jsou v procesu zavádění požadavků na otevřený přístup k publikacím i datům.\n\nVzniká infrastruktura institucionálních a oborových repozitářů, uzavírají se transformační smlouvy s vydavateli.\n\nČR se účastní evropské iniciativy EOSC a buduje národní síť pro FAIR data v rámci EOSC CZ."
definitionLanguage = "cs"

