definition = "*nemá český ekvivalent\n\nJedinečný a trvalý identifikátor, registr a systém pro sdílený management metadat dlouhodobých výzkumných aktivit a témat. Ve svých metadatech RAiD zachycuje a propojuje související identifikátory jako ORCID pro zúčastněné osoby, DOI pro data, publikace a další výsledky aktivit včetně DOI pro udělené granty / projekty i ROR pro zúčastněné instituce. Jeden konkrétní RAiD odkazuje na landing page dané aktivity. Systém RAiD je upraven normou ISO 23527 a je založen na systému DOI registrační agentury DataCite."
