guideRoute = "term"
id = "resource-description-framework"
label = { cs = "Resource Description Framework", en = "Resource Description Framework" }
url = "https://heslar.openscience.cz/heslo.php?id=220"
definition = "*nemá český ekvivalent\n\nStandardizovaný model pro reprezentaci dat. Byl vytvořen organizací World Wide Web Consortium (W3C). RDF se často používá k propojování dat z různých zdrojů a tvoří základ sémantického webu. Základním principem RDF je vyjadřování informací pomocí tzv. trojic (triples) ve tvaru: subjekt – predikát – objekt.\n\nKaždá trojice představuje jedno tvrzení o určitém zdroji:\n\nsubjekt označuje popisovaný zdroj,\n\npredikát vyjadřuje vlastnost nebo vztah,\n\nobjekt představuje hodnotu vlastnosti nebo jiný zdroj.\n\nPrvky RDF jsou typicky identifikovány pomocí URI/IRI, což umožňuje jednoznačné a globálně sdílené označení entit a vztahů. Pro zápis grafů RDF existuje řada různých formátů: Turtle (TTL), RDF/XML, JSON-LD, N-Triples. V praxi je velmi rozšířený zejména formát Turtle (TTL) díky své čitelnosti.\n\nPříklad zápisu faktu, že Jan Novák je analytik:\n\nex:JanNovak schema:jobTitle \"analytik\""
definitionLanguage = "cs"

