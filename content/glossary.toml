definition = "V akademickém publikování se jako embargo označuje období, během kterého autorské dílo (obvykle článek v časopisu, stať ve sborníku apod.) není veřejně dostupné, kromě předplatitelů daného titulu. Týká se to především děl zveřejňovaných v časopisech za předplatné, která autor se souhlasem vydavatele uložil do repozitáře (Zelená cesta OA), kde dílo smí být dostupné až po uplynutí stanoveného embarga. Existují (možná už jen existovaly) i časopisy s tzv. odloženým otevřeným přístupem, kdy dílo je na vydavatelském serveru ihned dostupné pouze předplatitelům, ale po uplynutí embarga je otevřené komukoliv (tzv. časopis s odloženým otevřeným přístupem).\n\nObvyklá trvání embarga jsou 6 měsíců pro tituly STM a 12 měsíců po tituly z oblasti SSH."
definitionLanguage = "cs"

