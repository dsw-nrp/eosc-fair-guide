guideRoute = "term"
id = "open-peer-review"
label = { cs = "otevřené recenzní řízení", en = "Open Peer Review" }
url = "https://heslar.openscience.cz/heslo.php?id=66"
definition = "Obecný termín označující jakýkoliv model recenzního řízení, v němž jsou aspekty recenzního řízení zpřístupněny veřejnosti, a to buď před publikováním nebo po něm. Např. recenze u publikační platformy Open Research Europe (ORE) probíhá formou otevřeného recenzního řízení.\n\nPřevládající postupy otevřeného recenzního řízení:\n\nAutor a recenzent znají navzájem svou identitu.\n\nRecenzní hodnocení (zprávy recenzentů) je zveřejněno.\n\nŠirší vědecká komunita je vyzvána k zapojení do recenzního řízení online zveřejněného rukopisu.\n\nOtevřené recenzní řízení se neomezuje pouze na časopisecké publikace, ale může se vztahovat i na preprintové recenze a postpublikační komentáře."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "67" }]

guideRoute = "term"
id = "reproducibility"
label = { cs = "reprodukovatelnost", en = "Reproducibility" }
url = "https://heslar.openscience.cz/heslo.php?id=67"
definition = "Reprodukovatelnost označuje schopnost reprodukovat nebo znovu vytvořit výsledky experimentu, analýzy nebo studie pomocí stejných metod, dat a postupů, které byly použity původně. Jinými slovy, pokud by někdo jiný zopakoval stejný experiment nebo analýzu, měl by být schopen dosáhnout identických výsledků jako původní výzkumník.\n\nDosažení reprodukovatelnosti výzkumu je nezbytné pro budování důvěry ve výsledky a další pokrok ve vědeckém poznání. Tomu napomohou např. postupy:\n\nvedení podrobných záznamů o návrhu experimentu, metodologii a technikách analýzy dat, včetně všech průběžných změn nebo úprav,\n\nsdílení kódu a dat umožní ostatním zopakovat výsledky, ověřit zjištění a navázat na ně; data je třeba ukládat v repozitářích nebo na platformách s dlouhodobou dostupností,\n\npoužívání open-source software zvyšuje transparentnost analýzy,\n\npoužívání ověřených statistických metod zajistí výsledky robustní a nezávislé na specifických předpokladech nebo okrajových datových bodech,\n\nvyhodnocení robustnosti zjištění analýzami citlivosti a testováním účinků různých předpokladů a potenciálních zdrojů zkreslení.\n\nZískání připomínek a zpětné vazby od kolegů a recenzentů umožní včas identifikovat potenciální zdroje chyb, posoudit platnost výsledků a zajistí transparentnost a srozumitelnost sdělení.\n\nPozn.: Reprodukovatelnost a replikovatelnost jsou příbuzné a někdy zaměňované či nerozlišované pojmy. Reprodukovatelnost předpokládá, že stejnými metodami se stejnými daty, programy, atd. dosáhneme stejného výsledku jako původní studie. Replikovatelnost naproti tomu očekává, že ke stejnému výsledku můžeme od stejných východisek dojít i jinými postupy. Podle obsáhlé analýzy autorky Lorena A. Barba z ledna 2018 na https://arxiv.org/pdf/1802.03311 je zde uvedený význam těchto dvou termínů naprosto dominantní. Výjimkou jsou tituly vydávané společností Association for Computing Machinery a společnostmi z Federation of American Societies for Experimental Biology, které termíny užívají v opačném významu."
definitionLanguage = "cs"

