url = "https://heslar.openscience.cz/heslo.php?id=72"
definition = "Nástroj pro formální zachycení způsobu získávání, zpracování, skladování, archivace dat, jejich přenos a případně i anonymizaci a likvidaci. Pokud se jedná o data, která nemohou být zpřístupněna, musí být v DMP uvedeno zdůvodnění. DMP se zpravidla vyplňuje do vhodné standardní šablony (např. Horizon Europe, MŠMT), která reflektuje různé požadavky na jeho obsah. DMP se většinou připravuje v souladu s FAIR principy. Pro zjednodušení vypracování DMP existuje řada nástrojů, které umějí pracovat se šablonami, umí skrýt části DMP podle fáze projektu a umí generovat různé typy výsledného dokumentu."
