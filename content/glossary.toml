guideRoute = "term"
id = "issn"
label = { cs = "Mezinárodní standardní číslo seriálových publikací", en = "International Standard Serial Number" }
url = "https://heslar.openscience.cz/heslo.php?id=173"
definition = "Mezinárodní standardní číslo vytvořené pro jednoznačnou identifikaci pokračujících zdrojů, tj. seriálových publikací (odborné časopisy, noviny, ročenky, edice, sborníky ad.). Kód pro jednoznačnou identifikaci tohoto typu publikací definuje norma ISO 3297 Information and documentation – International serial number (ISSN). Systém spravuje Mezinárodní centrum ISSN se sídlem v Paříži.\n\nSamotná ISSN přidělují národní centra ISSN. Pro seriálové publikace vydávané v ČR tuto funkci plní Národní centrum ISSN, které působí v rámci Národní technické knihovny (NTK).\n\nISSN lze přidělit tištěným i elektronickým seriálovým publikacím a lze jej přidělit bez ohledu na to, v jaké době byly, jsou či budou vydávány."
definitionLanguage = "cs"

