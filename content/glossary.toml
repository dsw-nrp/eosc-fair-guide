label = { cs = "veřejná licence / veřejné licencování", en = "Public Licence / Public Licencing" }
url = "https://heslar.openscience.cz/heslo.php?id=250"
definition = "Veřejná licence je forma licenční smlouvy, která se uzavírá prostřednictvím veřejného návrhu (§ 2358 občanského zákoníku). Na jejím základě poskytuje nositel práv oprávnění k užití chráněného díla neurčitému okruhu osob, bez nutnosti individuálního vyjednávání. Uživatel smlouvu akceptuje prostým jednáním v souladu s licenčními podmínkami – například stažením, dalším šířením nebo úpravou díla. Veřejná licence umožňuje, aby nositel práv zpřístupnil dílo standardizovaným, přístupným a právně závazným způsobem, který je srozumitelný a prakticky použitelný zejména v online prostředí. Uživatelé tak mohou dílo užívat, pokud dodrží podmínky stanovené licencí, aniž je nutné získat předchozí svolení. Typickými příklady veřejných licencí jsou standardizované právní nástroje, jako jsou:\n\nCreative Commons licence (např. CC BY, CC BY-NC, CC BY-SA),\n\nOpen source licence (např. GNU GPL, MIT, Apache),\n\nlicence pro otevřená data (např. Open Data Commons ODbL).\n\nVeřejné licence mohou být otevřené (umožňující širší užití, např. šíření a úpravy), ale také restriktivnější (např. zakazující komerční využití). To, co je definuje, není rozsah práv, ale způsob jejich nabídky – veřejným návrhem komukoli, kdo splní podmínky.\n\nCharakteristiky veřejných licencí:\n\nNeurčitý okruh uživatelů: licence není adresována konkrétním osobám, ale každému, kdo se s ní seznámí a akceptuje její podmínky.\n\nBezúplatnost: veřejné licence jsou poskytovány zdarma.\n\nDlouhodobá platnost: zpravidla po celou dobu trvání autorskoprávní ochrany.\n\nNevýhradní charakter: licenci může přijmout více osob současně.\n\nPodmíněnost: užití díla je možné pouze při dodržení konkrétních licenčních podmínek.\n\nVeřejná licence vytváří právně závazný rámec pro sdílení, opakované použití a šíření duševního vlastnictví v digitálním prostředí, a je základem právní infrastruktury otevřeného přístupu, svobodného softwaru i otevřených dat. Veřejná licence není zřeknutím se práv – autor si nadále ponechává svá autorská (zejména osobnostní) práva, ale vymezeným způsobem práva majetková veřejně sdílí, čímž vytváří právní rámec pro otevřené a kolaborativní užití díla."
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "255" }]

guideRoute = "term"
id = "rights-retention"
label = { cs = "zachování práv duševního vlastnictví", en = "Retention of Intellectual Property Rights" }
url = "https://heslar.openscience.cz/heslo.php?id=255"
definition = "Označení souboru právních a praktických opatření, která zajišťují, že autorům (nositelům autorských práv majetkových) zůstává kontrola nad jejich výsledky duševní činnosti (např. literární, umělecká, vědecká díla, software). Zachování těchto práv znamená respekt k jejich právnímu postavení a ochranu před neoprávněným užíváním, zcizením či zneužitím.\n\nKdyž někdo vytvoří originální dílo – ať už je to kniha, písnička nebo software – automaticky k němu získává určitá práva. Tato práva mu umožňují rozhodovat o tom, kdo a jak může jeho dílo používat. Zachování práv duševního vlastnictví znamená, že autor si tato práva udrží, nebude o ně připraven nedobrovolně a bude mít možnost chránit své zájmy proti neoprávněnému zásahu. Práva však poskytnout, a to buď pomocí standardní licenční smlouvy nebo s využitím nástrojů otevřeného přístupu – Open Access. Důležité ale je, že kontrola nad tímto procesem zůstává v rukou autora (nositele práv).\n\nZachování práv duševního vlastnictví není v rozporu s využíváním otevřených licencí (např. Creative Commons, GPL). Právě naopak – otevřené licence jsou nástrojem, jak zachovat práva autora a současně umožnit široké využívání díla. Autor si svá práva ponechává a určuje podmínky jejich výkonu – např. vyžaduje uvedení autorství nebo sdílení odvozených děl za stejných podmínek. Jedná se o základní princip, který chrání výsledky tvůrčí činnosti, umožňuje autorům a tvůrcům kontrolovat způsob užití jejich děl a poskytuje jim právní jistotu v digitálním i analogovém prostředí. Jde o rovnováhu mezi ochranou individuálních práv a možnostmi jejich flexibilního výkonu prostřednictvím licencí či jiných právních nástrojů.\n\nV reálné praxi komerční vydavatelé při uzavírání vydavatelské smlouvy požadují zpravidla předání majetkových práv. Souhlas s udělením otevřené licence podmiňují úhradou APC.\n\nSouvisící heslo: transformační smlouva."
definitionLanguage = "cs"

