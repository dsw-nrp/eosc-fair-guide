id = "published-version"
label = { cs = "vydavatelská verze článku / publikovaná verze", en = "Published Version / Publisher´s Final Version / [Final] Published Version / Version of Record" }
url = "https://heslar.openscience.cz/heslo.php?id=207"
definition = "Recenzovaná verze článku distribuovaná vydavatelem časopisu po finálních grafických úpravách vydavatele, obsahově totožná s tzv. postprintem. Označení různých verzí článku během redakčního procesu se může u různých vydavatelů lišit, proto se doporučuje ověření jejich významu na webových stránkách konkrétního vydavatele."
