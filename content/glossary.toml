guideRoute = "term"
id = "digital-object-identifier"
label = { cs = "digitální identifikátor objektu", en = "Digital Object Identifier" }
url = "https://heslar.openscience.cz/heslo.php?id=149"
definition = "Perzistentní identifikátor v podobě trvalého odkazu na objekt nebo na informace o objektu – digitálním, hmotném či abstraktním – sloužící k jeho jednoznačné a trvalé identifikaci. Objektem mohou být například články, datové sady a další typy obsahu. Identifikátor usnadňuje přístup k objektu a odkazování na něj. Díky němu jsou objekty jednoznačně identifikovatelné, dohledatelné, jednoduše citovatelné a opakovaně použitelné. Je nadstavbou systému Handle."
