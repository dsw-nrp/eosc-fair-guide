url = "https://heslar.openscience.cz/heslo.php?id=50"
definition = "Standardizované otevřené licence, které umožňují autorům a jiným držitelům práv předem určit, za jakých podmínek mohou ostatní jejich díla (např. publikace) volně používat. Uživatelé tak mohou díla legálně sdílet, upravovat nebo dále využívat, aniž by museli žádat o individuální svolení, pokud dodrží podmínky dané licence. Licence Creative Commons (CC) vznikly za účelem podpory otevřeného sdílení znalostí, vědy, kultury a vzdělávacího obsahu. Každá licence má tři vrstvy – srozumitelný souhrn (Commons Deed), právně závazný licenční text a strojově čitelný kód pro digitální prostředí. Každá licence je tvořena kombinací těchto základních podmínek: Uveďte původ (BY – Attribution): povinnost uvést jméno autora a zdroj. Zachovejte licenci (SA – ShareAlike): odvozená díla musí být licencována pod stejnou licencí. Neužívejte komerčně (NC – NonCommercial): zákaz komerčního využití díla. Nezasahujte do díla (ND – NoDerivatives): zákaz vytváření upravených či odvozených verzí. Těchto podmínek lze kombinovat, čímž vzniká šest základních licencí CC – od nejotevřenější CC BY po nejvíce restriktivní CC BY-NC-ND. Všechny licence CC 4.0 jsou mezinárodní (CC 4.0 International) a navrženy tak, aby byly použitelné napříč právními systémy. Licence CC neznamenají vzdání se autorských práv, ale představují právní rámec, kterým autor dobrovolně poskytuje veřejnosti určitá oprávnění. Při porušení podmínek může dojít ke ztrátě licence a k porušení autorského práva."
definitionLanguage = "cs"

