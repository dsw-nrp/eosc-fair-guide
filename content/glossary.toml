guideRoute = "term"
id = "pre-registration"
label = { cs = "předregistrace / předběžná registrace", en = "Pre-registration" }
url = "https://heslar.openscience.cz/heslo.php?id=204"
definition = "Proces zveřejnění definování výzkumné otázky (hypotézy) a vytvoření plánu analýzy ještě před zahájením výzkumu. Veřejná předběžná registrace hypotézy a plánu analýzy dat před provedením studie může pomoci předejít nekalým praktikám ve výzkumu a vymezuje apriorní testování hypotéz od tzv. HARKingu (vytváření hypotéz poté, co jsou známy výsledky) nebo p-hackingu (zahrnutí pouze vybraných dat pro získání statisticky významného výsledku). Současně zvyšuje transparentnost výzkumu, redukuje duplicitu výzkumu a snižuje riziko zkreslení zpráv tím, že umožní porovnání dokončené studie s tím, co bylo plánováno v předregistraci.\n\nRegistrace výzkumného návrhu (cíl návrhu, hypotéza, návrh studie, plánovaná analýza) je možná prostřednictvím k tomu určených platforem, např.:\n\n• AsPredicted,\n\n• OSF Preregistration (Center for Open Science),\n\n• PreclinicalTrials.eu.\n\nŠablona pro předběžnou registraci:\n\nAsPredicted pre-registration template https://doi.org/10.17605/OSF.IO/M3SPX"
definitionLanguage = "cs"

[[term]]
alternateIds = [{ "scheme" = "heslar", "value" = "205" }]

guideRoute = "term"
id = "public-domain-work"
label = { cs = "volné dílo", en = "Public Domain Work" }
url = "https://heslar.openscience.cz/heslo.php?id=205"
definition = "Volné dílo je takové autorské dílo, na které se již nevztahuje ochrana autorského práva, protože ochranná lhůta uplynula. Takové dílo může kdokoli volně užívat, šířit, upravovat či jinak nakládat bez nutnosti žádat o souhlas autora nebo jeho právních nástupců. Volné dílo tedy není chráněno výlučnými autorskými právy majetkovými.\n\nKaždé dílo – kniha, obraz, skladba – je po určitou dobu chráněno autorským právem. Během této doby může o jeho užití rozhodovat jen autor nebo držitel práv. Po uplynutí této ochranné lhůty se dílo stává volným a může ho využívat kdokoli bez omezení – například jej vydat, digitalizovat nebo volně šířit.\n\nPříkladem volného díla jsou např. texty Karla Hynka Máchy nebo hudba Bedřicha Smetany, protože od smrti těchto autorů uplynula dostatečně dlouhá doba, kterou zákon stanoví pro ochranu (70 let po smrti autora).\n\nV českém právu je režim volného díla upraven v § 28 autorského zákona (zákon č. 121/2000 Sb.).\n\nOchranná lhůta trvá obecně 70 let od smrti autora (post mortem auctoris). U děl spoluautorských se tato lhůta počítá od smrti posledního žijícího spoluautora. V některých případech (např. anonymní díla, audiovizuální díla) se lhůta počítá od zveřejnění díla.\n\nZaniknutím majetkových práv však v českém právu nezanikají osobnostní práva autora. Dílo, i když je volné, musí být užíváno se zachováním autorství a s respektem k integritě díla. Uživatelé tedy nesmí uvádět autora nepravdivě, vynechat jeho jméno tam, kde je obvyklé jej uvádět nebo upravovat dílo způsobem, který by snižoval jeho hodnotu nebo poškozoval pověst autora (§ 11 autorského zákona).\n\nV angloamerickém právu, zejména v USA a ve Velké Británii, je režim public domain (veřejného vlastnictví) v mnohém volnější. Jakmile se dílo stane public domain work, může být zcela svobodně užíváno, adaptováno i komerčně využíváno, bez právní povinnosti uvádět autora nebo zachovávat integritu díla. Angloamerický systém obecně nechrání osobnostní (morální) práva po smrti autora stejnou mírou jako kontinentální právo.\n\nZatímco tedy v ČR může být nevhodné užít volné dílo způsobem, který znevažuje jeho hodnotu nebo jméno autora, v USA může být stejné dílo bez právních následků upraveno, zparodováno nebo přepsáno do nové podoby, bez uvedení původního autora.\n\nTento rozdíl pramení ze samotné koncepce autorského práva: zatímco kontinentální právo vychází z dualistického pojetí (osobnostní a majetková práva), angloamerické právo se primárně soustředí na majetkovou složku a osobnostní práva chápe omezeně nebo vůbec.\n\nDůsledkem toho je, že český autor se nemůže svých osobnostních práv vzdát, tj. udělení licence CC0 není možné."
definitionLanguage = "cs"

