guideRoute = "term"
id = "data-2"
label = { cs = "data", en = "Data" }
url = "https://heslar.openscience.cz/heslo.php?id=393"
definition = "Data jsou soubory diskrétních nebo spojitých hodnot, které vyjadřují informace, popisují množství, kvalitu, fakta, statistiku, jiné základní významové jednotky nebo prostě posloupnosti symbolů, které lze dále formálně interpretovat. Data jsou obvykle uspořádána do struktur, které jim poskytují další kontext a význam, a mohou být použity jako data ve větších strukturách. Data mohou být použita jako proměnné ve výpočetním zpracování [dat].\n\nSouvisící hesla: datová sada / soubor dat, výzkumná data, otevřená výzkumná data, FAIR data"
definitionLanguage = "cs"

