url = "https://heslar.openscience.cz/heslo.php?id=135"
definition = "Iniciativa vznikla na setkání v Budapešti ve dnech 1.–2. 12. 2001 organizovaném Open Society Institute (nyní Open Society Foundations, OSF), na kterém poprvé veřejně zazněl pojem Open Access – otevřený přístup. Deklarace BOAI byla zveřejněna dne 14. 2. 2002. Při příležitosti 20. výročí v roce 2022 Iniciativa vydala tzv. Hlavní doporučení pro příštích 10 let (Major recommendations for the next 10 years, 15. 3. 2022)."
