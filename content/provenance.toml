[[action]]
id = "2026-10-29-statute-public-domain"
type = "update"
name = "Record that the official works the Guide quotes are outside copyright"
description = "Act No. 328/2025 Coll. and the Open Science III call rules are official works, which § 3(a) of the Copyright Act excludes from copyright; the maintainer confirmed the call rules as an administrative document. Their sources now record the Public Domain Mark instead of no licence, so the right-of-quotation bound for sources without a licence does not apply to their passages. Act No. 527/1990 Coll., which #161 added for the novelty of an invention, is a law too and records the same mark."
agent = "david-novak"
instruments = ["claude-code", "claude-opus-5-5", "kilo-code"]
objects = ["resources/law-328-2025", "resources/os3-rules", "resources/law-527-1990"]
