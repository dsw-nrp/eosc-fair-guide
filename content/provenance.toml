description = "Implemented local identifier extraction and the ORCID MOD 11-2 and ROR Crockford/MOD 97-10 checksums from their published technical documentation. Public lookup requires an explicit action, checks DOI identity before using DataCite or Crossref titles, and distinguishes invalid checksums, unknown identifiers, unavailable services and records without public titles. Handle extraction requires a resolver link or explicit prefix to avoid false matches; a textarea control clears input and results. Search carries the selected identifier to the helper. The dataset-check page links to the existing two-stage self-check, and the tool pages use distinct icons. Implemented and verified with OpenAI Codex using GPT-6.1 Sol, as identified by the maintainer; the runtime does not expose the exact backend model ID."
