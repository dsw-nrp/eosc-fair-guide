[[action]]
id = "2026-11-06-identity-migration"
type = "update"
name = "Move record identity to the kind vocabulary"
description = "A structural migration of every record's identity: frozen routes name a plural kind word without a classification segment, and prose references, provenance results and objects, model association targets and the worked example's steps name records by their address; the identifier register lists each identifier under the kind of its record, and the Guide's profile is referenced through the section of the machines page that presents it. The texts, sources and classifications are unchanged, and reviewed link decisions follow their fields. The KNAV record of the CESNET ownCloud service is joined to the curated entry for that service. Reviewed handles join the FIP Dashboard's organisation records, and eLTER RI's KNAV record, to the things they describe, and three pairs of things that share a name are recorded as distinct with their reasons. Every page section carries an identifier that names its subject and is its fragment, so a page can be reordered without moving an address; the page for machines now leads from what it offers to what a reader is looking for, a worked example, the Guide's own practice and the endpoints. The statuses of requirements, FIPs and their declarations, tests, the model manuscript, releases and the EOSC CZ Node, the kinds of advice item and the coverage of pre-fill mappings are recorded as reviewed term vocabularies. Fifty-five check questions that copied a cited clause word for word take that clause's text instead: gate.01, gate.08, gate.10 and maturity.14 name the clause they copied as their requirement, and NRP.M8 and A.I3.R2 take the references to NMA, CCMM, ORCID and ROR that those questions' copies carried, with their wording unchanged. The API's lists are reachable under its versioned kind paths, with shared term-set references, typed OpenAPI templates and a separate health snapshot. N-Triples and tested query recipes expose the same graph, and the machines page documents their addresses and typed record links in both languages. Follow-up hardening covers every issued identity in API lists, records and static pages, generated-HTML guards, recursive fragment anchors, reusable mixed-version release artifacts, atomic and mixed-state-safe migration retries, required declaration statuses, and local-test and saved-result documentation links aligned with OpenAPI. The migration adds no content author. Continuing hardening makes every text-search part mandatory before confirming results, retries on the current form after navigation without replacing newer input, distinguishes the EOSC CZ Node's operational-state date from its verification date, shares one release-status parse with image preparation, removes unused API and UI configuration inputs, supplies bilingual collection-seams labels, and proves these repairs with planted FIP/retry, layout, localization and visual regressions."
agent = "david-novak"
instruments = ["claude-code", "kilo-code", "claude-opus-5-5", "einfra-kimi-k3-1-pro"]
objects = ["resources/knav-dm-tools-catalogue", "resources/fip-dashboard", "resources/nrp-conditions", "resources/analyza-fair-1.2", "resources/eosc-federation-handbook", "resources/ro-crate", "resources/fair-signposting", "repositories/datarepo"]
results = ["*"]
endTime = 2026-11-12T00:40:30+00:00

[[action]]
id = "2026-11-02-nkr-integration"
type = "update"
name = "Join the first NKR records to the repository catalogue"
description = "Reviewed the NKR Repository schema and CzBIRD record at https://repo.cz/objects/20.500.14818/srhtp4ek. Added the reviewed NKR handle to the Czech-BioImaging entry and bilingual interface text for repository address availability and contact presence; the contact address is never copied. Implemented schema-derived harvesting, repository joins and NKR fact precedence with regression fixtures."
agent = "david-novak"
instruments = ["openai-codex", "openai-gpt-6-runtime"]
objects = ["resources/nkr-schema"]
results = ["repositories/czech-bioimaging"]
endTime = 2026-11-02T01:20:26+01:00

