# Provenance actions (Process Run Crate). Every change to an advice item, check, resource or clause is covered by an
# action that names the person, the tools and the sources. Field reference: docs/content-model.md.

[[action]]
id = "2026-10-08-content-model-sample"
type = "create"
name = "Content model sample"
description = "First content entries written to test the content model and the generator: guide metadata, principles, live services, sample clauses, part of the repository station, two gate items and two resources."
agent = "david-novak"
instruments = ["claude-opus-5-5", "claude-code"]
objects = ["analyza-fair-1.2", "nrp-conditions-3.4", "nkr-schema"]
results = ["repozitar.*", "G05", "G07", "nkr", "re3data"]
endTime = 2026-10-08T03:11:16+02:00

