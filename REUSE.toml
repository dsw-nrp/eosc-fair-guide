version = 1
SPDX-PackageName = "eosc-cz-fair-guide"
SPDX-PackageSupplier = "David Novák <https://orcid.org/0000-0001-6592-6291>"
SPDX-PackageDownloadLocation = "https://github.com/dsw-nrp/eosc-fair-guide"

# When several annotations match a path, the last one wins.

# Default: code and configuration are MIT.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "MIT"

# Content: texts, data, documentation and diagrams are CC BY 4.0.
[[annotations]]
path = [
  "content/**",
  "docs/**",
  "diagrams/**",
  "assets/diagrams/**",
  "assets/js/tests/index.html",
  "**/*.md",
  "CITATION.cff",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The page carries code and its title and description. Generated files (the crate, its preview, the data scripts, the
# linkset and the API) are built into _site/ and not committed; the content they come from is licensed above.
[[annotations]]
path = "index.html"
precedence = "override"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "MIT AND CC-BY-4.0"

# Snapshots and the glossary are data, not scanned for copyright notices, because their content contains arbitrary text.
[[annotations]]
path = ["content/snapshots/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "content/glossary.toml"
precedence = "override"
SPDX-FileCopyrightText = "Národní technická knihovna and the Heslář Open Science contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The KNAV Data Management Tools Catalogue's steps and its snapshot keep that repository's licence (GPL-3.0; the
# guide does not assume "or later").
[[annotations]]
path = ["content/lifecycle/3-knav-tools.toml", "content/snapshots/knav-tools.toml"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Open Science Department, Library of the Czech Academy of Sciences",
  "2026 The EOSC CZ FAIR guide contributors",
]
SPDX-License-Identifier = "GPL-3.0-only"

# Font Awesome Free icons, vendored unchanged by scripts/vendor_icons.py; each file carries its own notice.
[[annotations]]
path = "assets/icons/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Fonticons, Inc. <https://fontawesome.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# Plus Jakarta Sans, vendored unchanged by scripts/vendor_fonts.py from the @fontsource package.
[[annotations]]
path = "assets/fonts/*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Plus Jakarta Sans Project Authors <https://github.com/tokotype/PlusJakartaSans>"
SPDX-License-Identifier = "OFL-1.1"

# Official logos and the EOSC CZ symbol as the page icon, used unchanged; not covered by the guide's licences.
[[annotations]]
path = ["assets/img/*.svg", "assets/img/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "EOSC CZ initiative; European Union; Ministry of Education, Youth and Sports of the Czech Republic"
SPDX-License-Identifier = "LicenseRef-EOSC-CZ-Logo"

# The favicons of the tools and services the guide names, reduced to one small square image each; not covered by
# the guide's licences. Their record of sources is data of the guide.
[[annotations]]
path = "assets/favicons/*.png"
precedence = "override"
SPDX-FileCopyrightText = "The operators of the services the favicons identify"
SPDX-License-Identifier = "LicenseRef-Service-Favicons"

[[annotations]]
path = "assets/favicons/sources.toml"
precedence = "override"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "CC-BY-4.0"

