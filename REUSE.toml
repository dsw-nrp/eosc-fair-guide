version = 1
SPDX-PackageName = "eosc-cz-fair-guide"
SPDX-PackageSupplier = "David Novák <https://orcid.org/0000-0001-6592-6291>"
SPDX-PackageDownloadLocation = "https://github.com/motyc/eosc-fair-guide"

# When several annotations match a path, the last one wins.

# Default: code and configuration are MIT.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "MIT"

# Content: texts, data, documentation and diagrams are CC BY 4.0.
[[annotations]]
path = [
  "content/**",
  "docs/**",
  "diagrams/**",
  "assets/diagrams/**",
  "**/*.md",
  "CITATION.cff",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The page and its preview copy carry code and the inlined content. Generated files are not scanned for
# copyright notices, because their content contains arbitrary text.
[[annotations]]
path = ["index.html", "ro-crate-preview.html"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "MIT AND CC-BY-4.0"

[[annotations]]
path = ["ro-crate-metadata.json", "content/snapshots/**", "content/glossary.toml"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The EOSC CZ FAIR guide contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Font Awesome Free icons, vendored unchanged by scripts/vendor_icons.py; each file carries its own notice.
[[annotations]]
path = "assets/icons/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 Fonticons, Inc. <https://fontawesome.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# Official logos, used unchanged; not covered by the guide's licences.
[[annotations]]
path = "assets/img/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "EOSC CZ initiative; European Union; Ministry of Education, Youth and Sports of the Czech Republic"
SPDX-License-Identifier = "LicenseRef-EOSC-CZ-Logo"

