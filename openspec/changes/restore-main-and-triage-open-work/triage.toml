# Triage ledger of task 6.1 (design D6): one entry for every issue open on 28 October 2026 except the digest (#140).
# A draft for the maintainer's review in task 6.2; nothing is applied before approval, and each write it leads to
# still shows its exact content first. No tool reads this file.
#
# decision  keep | rescope | merge | close; `into` names the issue a merged one joins; `reason` explains every
#           decision other than keep.
# priority  High: the next release's correctness or identity depends on it. Medium: it changes what readers are told
#           or a capability planned for its milestone. Low: a wait on an outside party with honest interim behaviour,
#           or work for a later milestone.
# effort    The Guide's own work to finish it. Low: a request and a recorded answer, or a bounded edit. Medium: a
#           bounded implementation with tests. High: a design and an implementation across several surfaces.
# milestone The issue's current milestone unless the entry says why it moves; "" means none.
# shape     full: shape the whole body with /aiscr-plan-issue. light: only the reporter region is missing.
#           none: the issue closes without shaping.
# parent    Omitted: the parent stays as it is.
#
# Evidence: every body was read on 28 October 2026; no issue except the digest has a comment. Cross-references and
# files are named per entry. Bodies link the repository's former address `motyc/eosc-fair-guide` in #16, #20, #24
# and #27; shaping replaces those links (task 6.4).

